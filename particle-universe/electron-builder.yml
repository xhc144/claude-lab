# electron-builder produces the unpacked Windows app and the NSIS installer; scripts/after-pack.cjs
# stamps icon/version info into the executable first, and scripts/dist-win.mjs also packs a
# portable zip. Installed copies update themselves from the particle-universe-latest release.
appId: com.particleuniverse.app
productName: ParticleUniverse
executableName: ParticleUniverse
copyright: MIT License
directories:
  output: release
  buildResources: build
files:
  - dist/renderer/**/*
  - src/main/**/*
  - build/icon.ico
  - build/icon.png
  - package.json
  - "!**/*.map"
asar: true
electronLanguages:
  - zh-CN
  - en-US
npmRebuild: false
afterPack: scripts/after-pack.cjs
publish:
  - provider: generic
    url: https://github.com/xhc144/claude-lab/releases/download/particle-universe-latest
nodeGypRebuild: false
win:
  target:
    - target: dir
      arch: [x64]
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 音乐粒子宇宙
  uninstallDisplayName: 音乐粒子宇宙 ${version}
  artifactName: ParticleUniverse-Setup-${version}-x64.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  language: '2052'
  unicode: true
  deleteAppDataOnUninstall: false
