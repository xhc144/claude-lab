<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>题记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141C2E'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif' font-weight='900'%3E%E9%A2%98%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">题</span>
    <span class="brand-text"><b>题记</b><small>PROBLEM NOTEBOOK</small></span>
  </div>
  <label class="search">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
    <input id="q" type="search" placeholder="搜索题目、想法、出处、关键词" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <div class="top-actions">
    <button class="btn primary" id="btnNew" title="Ctrl+N"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>新题</button>
    <button class="btn" id="btnExport"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9M6 8l4 4 4-4M4 15h12"/></svg>导出</button>
    <button class="btn icon" id="btnSettings" aria-label="设置" title="设置"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg></button>
  </div>
</header>

<div class="shell">
  <nav class="kwnav" id="kwnav" aria-label="按关键词浏览"></nav>

  <section class="list" aria-label="题目列表">
    <div class="list-head">
      <h2 id="listTitle">全部</h2>
      <span class="list-count" id="listCount"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <main class="editor" id="editor">
    <div class="welcome" id="welcome" hidden></div>

    <div class="sheet" id="sheet" hidden>
      <div class="ed-head">
        <div class="ed-no"><span>No.</span><b id="edNo">—</b></div>
        <input id="fSource" class="ed-source" placeholder="出处（可不填），如：习题 5.8 · 2023 数一" autocomplete="off">
        <span class="ed-meta" id="edMeta"></span>
      </div>

      <section class="block problem">
        <span class="tag">原题</span>
        <div class="imgbox" id="imgBox"></div>
        <div class="field-head">
          <span class="field-label">题目文字</span>
          <div class="field-tools">
            <button class="link-btn" id="btnRecog" title="把原图发给 DeepSeek 识别">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V4h3M14 4h3v3M17 13v3h-3M6 16H3v-3M6 10h8"/></svg>AI 识别原图</button>
            <button class="link-btn" id="btnPolish" title="修正错字、整理公式格式">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l8.5-8.5M11 4l.8 1.7L13.5 6.5l-1.7.8L11 9l-.8-1.7L8.5 6.5l1.7-.8zM15.5 10l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z"/></svg>AI 整理格式</button>
          </div>
        </div>
        <textarea id="fProblem" class="src" rows="3" spellcheck="false"
          placeholder="直接打字，或者贴上截图让 AI 识别。&#10;公式写成 $x^2$（行内）或 $$\sum_k a_k$$（单独一行）。"></textarea>
        <div class="preview" id="pvProblem" aria-live="polite"></div>
        <div class="proposal-slot" id="prProblem"></div>
      </section>

      <section class="block keywords">
        <div class="field-head">
          <span class="field-label">关键词 <em class="hint">第一个决定它在 PDF 里归哪一章，点一下标签可以设为第一个</em></span>
          <button class="link-btn" id="btnSuggest"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l1.6 3.4L15 8l-3.4 1.6L10 13l-1.6-3.4L5 8l3.4-1.6zM15 13l.7 1.3L17 15l-1.3.7L15 17l-.7-1.3L13 15l1.3-.7z"/></svg>AI 推荐</button>
        </div>
        <div class="kw-selected" id="kwSel"></div>
        <label class="kw-find">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
          <input id="kwFind" placeholder="搜关键词，没有就直接打新词，回车新建" autocomplete="off">
        </label>
        <div class="kw-presets" id="kwPresets"></div>
      </section>

      <section class="block idea">
        <div class="field-head">
          <span class="field-label idea-label">我的想法 <em class="hint">可以记好几条；口语写也行，让 AI 转成 LaTeX</em></span>
          <div class="field-tools">
            <button class="link-btn" id="btnTidyAll" title="每一条想法里的公式都写成 LaTeX，改完先给你看，确认了才替换">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16l8.5-8.5M11 4l.8 1.7L13.5 6.5l-1.7.8L11 9l-.8-1.7L8.5 6.5l1.7-.8z"/></svg>AI 全部转 LaTeX</button>
            <button class="link-btn" id="btnHint" title="AI 根据题目给一条思路，单独成一条，标成「AI 思路」">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a5 5 0 0 0-3 9v2h6v-2a5 5 0 0 0-3-9zM8 17h4"/></svg>AI 给个思路</button>
          </div>
        </div>
        <div class="pending-bar" id="pendingBar" hidden>
          AI 改了 <b id="pendingCount">0</b> 条想法，每条下面都能单独选，也可以
          <button type="button" class="btn primary sm" data-all="accept">全部用新的</button>
          <button type="button" class="btn ghost sm" data-all="reject">全部不要</button>
        </div>
        <div id="ideaList"></div>
        <button type="button" class="add-idea" id="btnAddIdea">+ 再记一条想法</button>
      </section>
    </div>

    <footer class="ed-foot" id="edFoot" hidden>
      <button class="btn ghost danger" id="btnDelete">删除</button>
      <span class="save-state" id="saveState"></span>
      <button class="btn primary" id="btnSave">保存<kbd>Ctrl S</kbd></button>
    </footer>
  </main>
</div>

<!-- 设置 -->
<dialog id="dlgSettings" class="dlg">
  <form method="dialog" class="dlg-body" id="formSettings">
    <h3>设置</h3>
    <fieldset>
      <legend>DeepSeek</legend>
      <label class="fld">API Key
        <input id="sKey" type="password" autocomplete="off" placeholder="sk-...">
        <span class="fld-note" id="sKeyNote"></span>
      </label>
      <label class="fld">接口地址<input id="sBase" autocomplete="off"></label>
      <div class="fld-row">
        <label class="fld">识图模型<input id="sVision" autocomplete="off"></label>
        <label class="fld">文字模型<input id="sText" autocomplete="off"></label>
      </div>
      <div class="test-row">
        <button type="button" class="btn" id="btnTest">测试连接</button>
        <span id="testResult" class="fld-note"></span>
      </div>
    </fieldset>
    <fieldset>
      <legend>预设关键词</legend>
      <textarea id="sKeywords" rows="4" class="src" placeholder="用顿号、逗号或换行分隔"></textarea>
      <span class="fld-note">录入时可以直接点选；顺序也是 PDF 里各章的顺序。</span>
    </fieldset>
    <fieldset>
      <legend>PDF</legend>
      <label class="fld">默认标题<input id="sTitle" autocomplete="off"></label>
      <label class="fld">副标题<input id="sSubtitle" autocomplete="off"></label>
      <label class="fld">署名（可不填）<input id="sAuthor" autocomplete="off"></label>
    </fieldset>
    <p class="fld-note">Key 只存在这台电脑的 data/settings.json 里。</p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="submit" class="btn primary" id="btnSaveSettings">保存设置</button>
    </div>
  </form>
</dialog>

<!-- 导出 -->
<dialog id="dlgExport" class="dlg wide">
  <div class="dlg-body">
    <h3>导出</h3>
    <div class="exp-grid">
      <div class="exp-form">
        <label class="fld">标题<input id="eTitle" autocomplete="off"></label>
        <label class="fld">副标题<input id="eSubtitle" autocomplete="off"></label>
        <div class="fld">范围
          <div class="seg" id="eScope"></div>
        </div>
        <div class="fld">组织方式
          <div class="seg" id="eGroup">
            <button type="button" data-v="1" class="on">按关键词分章</button>
            <button type="button" data-v="0">按录入顺序</button>
          </div>
        </div>
        <div class="fld">版式
          <div class="seg" id="eLayout">
            <button type="button" data-v="compact" class="on">紧凑</button>
            <button type="button" data-v="chapter">每章另起一页</button>
            <button type="button" data-v="single">每题一页</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="eImages" checked> 附上原图（题目下方，虚线隔开）</label>
      </div>
      <div class="exp-preview" aria-hidden="true">
        <div class="mini-page cover">
          <span class="mp-eyebrow">PROBLEM NOTEBOOK</span>
          <span class="mp-title" id="mpTitle">题记</span>
          <span class="mp-sub" id="mpSub"></span>
          <span class="mp-rule"></span>
          <span class="mp-stats" id="mpStats"></span>
          <svg class="mp-fig" viewBox="-3.75 -2.05 7.5 4.1" preserveAspectRatio="xMidYMid meet">
            <rect x="-3.75" y="-2.05" width="7.5" height="4.1" rx=".18" class="mp-panel"/>
            <g class="mp-lvl"><ellipse rx="3.6" ry="1.8"/><ellipse rx="2.83" ry="1.414"/><ellipse rx="1.455" ry=".728"/><ellipse rx=".749" ry=".374"/><ellipse rx=".385" ry=".193"/></g>
            <polyline class="mp-a" points="2,-1 1.41,.18"/><polyline class="mp-b" points="1.41,.18 .53,-.26"/><polyline class="mp-a" points=".53,-.26 .37,.05"/><polyline class="mp-b" points=".37,.05 .14,-.07"/>
            <circle cx="2" cy="-1" r=".09" class="mp-dot"/>
          </svg>
        </div>
        <div class="mini-page inner">
          <span class="mp-kw" id="mpKw">特征值</span>
          <span class="mp-rule2"></span>
          <span class="mp-no">No.<b>01</b></span>
          <span class="mp-box"><i>原题</i></span>
          <span class="mp-idea"></span>
          <span class="mp-no">No.<b>02</b></span>
          <span class="mp-box short"><i>原题</i></span>
        </div>
      </div>
    </div>
    <div class="exp-status" id="expStatus" hidden></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>关闭</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="btnExportTex">导出 LaTeX 源文件</button>
      <button type="button" class="btn primary" id="btnExportPdf">生成 PDF</button>
    </div>
  </div>
</dialog>

<div class="lightbox" id="lightbox" hidden><img alt="原图"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
