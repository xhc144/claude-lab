/* 薪火纪 EMBERSTACK — lantern-lit woodcut interface. Lacquer, parchment and gold leaf. */

:root {
  --ink: #21160f;
  --ink2: #3a2818;
  --paper: #efe3c8;
  --paper2: #dcc89c;
  --paper3: #c9b07e;
  --lacquer: #6e1f16;
  --lacquer2: #4a140e;
  --gold: #d9a84a;
  --gold2: #f3d58a;
  --ember: #f08a2a;
  --night: #120c08;
  --panel: rgba(28, 18, 11, 0.86);
  --panel2: rgba(44, 29, 18, 0.92);
  --line: rgba(217, 168, 74, 0.45);
  --text: #f1e4c6;
  --muted: #b8a37e;
  --good: #8fd06a;
  --bad: #ff7a5c;
  --warn: #f2c14e;
  --blue: #8ab8f0;
  --title: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "楷体", serif;
  --body: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --num: Georgia, "Times New Roman", serif;
  --r: 10px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font-family: var(--body); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; }
.noscript { padding: 40px; text-align: center; }
.app { position: fixed; inset: 0; }
.board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.board.dragging { cursor: grabbing; }
.board.over-card { cursor: pointer; }
.ui { position: absolute; inset: 0; pointer-events: none; }
.ui > * { pointer-events: auto; }
.hidden { display: none !important; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.screen.passthrough { pointer-events: none; }
.screen.passthrough > * { pointer-events: auto; }
.scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--gold) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(217, 168, 74, 0.5); border-radius: 4px; }
.title-font { font-family: var(--title); font-weight: 400; letter-spacing: 0.04em; }
.num { font-family: var(--num); font-weight: 700; }
.muted { color: var(--muted); }
.good { color: var(--good); }
.bad { color: var(--bad); }
.warn { color: var(--warn); }
.icon { width: 18px; height: 18px; vertical-align: -4px; display: inline-block; }
.icon.s { width: 14px; height: 14px; vertical-align: -2px; }
.icon.l { width: 26px; height: 26px; vertical-align: -7px; }

/* ------------------------------------------------------------------ buttons */
.btn {
  appearance: none; border: 1.5px solid var(--gold); color: var(--paper); cursor: pointer;
  background: linear-gradient(180deg, #8a2a1c, var(--lacquer) 55%, var(--lacquer2));
  border-radius: 8px; padding: 9px 18px; font-size: 15px; letter-spacing: 0.08em;
  box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.35), 0 3px 0 #2a0c08, 0 6px 14px rgba(0, 0, 0, 0.4);
  transition: transform 0.08s, filter 0.15s, box-shadow 0.15s; position: relative; white-space: nowrap;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.3), 0 1px 0 #2a0c08; }
.btn:disabled { filter: grayscale(0.8) brightness(0.7); cursor: not-allowed; }
.btn.big { font-size: 20px; padding: 13px 34px; font-family: var(--title); letter-spacing: 0.12em; }
.btn.small { font-size: 13px; padding: 5px 11px; }
.btn.ghost { background: rgba(30, 20, 12, 0.6); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--gold); background: rgba(70, 44, 24, 0.75); }
.btn.gold { background: linear-gradient(180deg, #f7dc8e, #d9a84a 55%, #a87a28); color: var(--ink); border-color: #fff0c0; box-shadow: inset 0 1px 0 #fff7d8, 0 3px 0 #5a3a10, 0 6px 14px rgba(0, 0, 0, 0.4); }
.btn.on { background: linear-gradient(180deg, #f7dc8e, #d9a84a); color: var(--ink); }
.btn .key { font-size: 11px; opacity: 0.6; margin-left: 6px; font-family: var(--num); }
.iconbtn { appearance: none; border: 1px solid var(--line); background: rgba(30, 20, 12, 0.7); color: var(--paper); border-radius: 8px; width: 36px; height: 34px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.iconbtn:hover { border-color: var(--gold); background: rgba(80, 50, 28, 0.85); }
.iconbtn.on { background: linear-gradient(180deg, #f7dc8e, #c9983a); border-color: #fff0c0; }
.iconbtn img { width: 22px; height: 22px; }

/* ------------------------------------------------------------------ parchment panels */
.parch {
  background:
    radial-gradient(ellipse at 30% 20%, rgba(255, 250, 235, 0.55), transparent 60%),
    linear-gradient(180deg, #f3e8cf, #e2cfa6);
  color: var(--ink); border: 2px solid var(--ink); border-radius: var(--r);
  box-shadow: inset 0 0 0 3px rgba(217, 168, 74, 0.55), inset 0 0 40px rgba(120, 80, 30, 0.25), var(--shadow);
}
.parch h2, .parch h3 { font-family: var(--title); font-weight: 400; margin: 0 0 8px; color: var(--lacquer); }
.parch .muted { color: #7a6448; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(3px); }
.panel h3 { font-family: var(--title); font-weight: 400; color: var(--gold2); margin: 0; font-size: 19px; letter-spacing: 0.06em; }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent); margin: 10px 0; }
.seal { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid var(--ink); background: radial-gradient(circle at 35% 30%, #c8482f, #7a1f12); color: #ffe8c0; font-family: var(--title); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }

/* ------------------------------------------------------------------ title screen */
.title-screen { align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 46%, rgba(14, 8, 5, 0.62), rgba(14, 8, 5, 0.38) 38%, rgba(8, 5, 3, 0.88) 78%); }
.title-wrap { text-align: center; margin-top: -4vh; }
.logo { font-family: var(--title); font-size: clamp(64px, 12vw, 148px); line-height: 1; color: #ffe3a6; letter-spacing: 0.08em; text-shadow: 0 0 30px rgba(255, 150, 60, 0.75), 0 0 80px rgba(255, 110, 40, 0.45), 0 4px 0 #3a1408; position: relative; }
.logo-en { font-family: var(--num); letter-spacing: 0.7em; font-size: clamp(12px, 1.6vw, 18px); color: var(--gold); margin: 10px 0 6px 0.7em; }
.tagline { color: var(--paper2); font-size: clamp(14px, 1.7vw, 18px); margin: 14px auto 32px; max-width: 640px; opacity: 0.92; line-height: 1.7; text-shadow: 0 2px 6px #000; }
.menu-col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.menu-col > .btn { min-width: 240px; }
.menu-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.title-foot { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--muted); opacity: 0.8; }
.flame-orb { width: 74px; height: 74px; margin: 0 auto 6px; filter: drop-shadow(0 0 22px rgba(255, 150, 50, 0.9)); animation: flick 2.4s ease-in-out infinite; }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-1deg); } 40% { transform: scale(1.06) rotate(1.5deg); } 70% { transform: scale(0.97) rotate(-0.5deg); } }

/* ------------------------------------------------------------------ campaign */
.topnav { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: linear-gradient(180deg, rgba(10, 6, 4, 0.92), rgba(10, 6, 4, 0)); }
.topnav h1 { font-family: var(--title); font-weight: 400; font-size: 32px; margin: 0; color: var(--gold2); letter-spacing: 0.08em; flex: 1; text-shadow: 0 0 18px rgba(255, 140, 50, 0.5); }
.campaign { background: radial-gradient(ellipse at 50% 30%, #2a1a10, #0c0806 80%); }
.chapters { display: flex; gap: 18px; padding: 10px 24px 30px; overflow-x: auto; flex: 1; align-items: stretch; scroll-snap-type: x proximity; }
.chapter { flex: 0 0 300px; scroll-snap-align: start; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--line), var(--shadow); background: #1c130c; position: relative; }
.chapter.locked { filter: grayscale(0.85) brightness(0.55); }
.chapter-art { height: 170px; position: relative; background-size: cover; background-position: center; }
.chapter-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(20, 12, 8, 0.95)); }
.chapter-name { position: absolute; left: 16px; bottom: 10px; z-index: 1; font-family: var(--title); font-size: 34px; color: #ffe8b8; text-shadow: 0 2px 8px #000; }
.chapter-name small { font-family: var(--num); font-size: 11px; letter-spacing: 0.3em; display: block; color: var(--gold); }
.chapter-no { position: absolute; right: 12px; top: 10px; z-index: 1; width: 40px; height: 40px; font-size: 20px; }
.chapter-desc { padding: 10px 16px 6px; font-size: 13px; color: var(--paper2); line-height: 1.6; min-height: 54px; }
.levels { display: flex; flex-direction: column; gap: 8px; padding: 6px 12px 14px; }
.lvl { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; background: rgba(60, 40, 24, 0.55); border: 1px solid rgba(217, 168, 74, 0.25); cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; color: var(--text); text-align: left; width: 100%; }
.lvl:hover:not(:disabled) { background: rgba(110, 60, 30, 0.7); border-color: var(--gold); transform: translateX(2px); }
.lvl:disabled { opacity: 0.45; cursor: not-allowed; }
.lvl .lid { font-family: var(--num); font-size: 13px; color: var(--gold); width: 30px; }
.lvl .lname { flex: 1; font-size: 15px; }
.lvl .lname small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 1px; }
.stars { color: #5a4a36; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.stars .on { color: #ffcf4a; text-shadow: 0 0 6px rgba(255, 190, 60, 0.8); }
.mode-cards { display: flex; gap: 14px; padding: 0 24px 20px; flex-wrap: wrap; }
.mode-card { flex: 1 1 240px; padding: 14px 16px; cursor: pointer; border-radius: 12px; background: linear-gradient(135deg, rgba(90, 50, 24, 0.85), rgba(40, 24, 14, 0.9)); border: 1px solid var(--line); color: var(--text); text-align: left; }
.mode-card:hover { border-color: var(--gold); }
.mode-card b { font-family: var(--title); font-weight: 400; font-size: 22px; color: var(--gold2); }
.mode-card p { margin: 4px 0 0; font-size: 13px; color: var(--paper2); line-height: 1.5; }

/* ------------------------------------------------------------------ briefing / results / modal */
.veil { position: absolute; inset: 0; background: rgba(8, 5, 3, 0.66); display: flex; align-items: center; justify-content: center; padding: 18px; backdrop-filter: blur(2px); }
.sheet { width: min(760px, 100%); max-height: 92vh; display: flex; flex-direction: column; padding: 24px 28px; position: relative; }
.sheet.wide { width: min(1100px, 100%); }
.sheet .close { position: absolute; top: 10px; right: 12px; background: none; border: none; font-size: 26px; color: var(--lacquer); cursor: pointer; }
.sheet h2 { font-size: 34px; }
.brief-sub { font-size: 14px; color: #7a5a38; margin-top: -6px; margin-bottom: 10px; letter-spacing: 0.1em; }
.story { font-size: 16px; line-height: 1.9; margin: 6px 0 12px; }
.story p { margin: 0 0 6px; opacity: 0; animation: fadein 0.8s forwards; }
@keyframes fadein { to { opacity: 1; } }
.goal-list { list-style: none; padding: 0; margin: 6px 0; }
.goal-list li { padding: 5px 0 5px 26px; position: relative; font-size: 15px; }
.goal-list li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 12px; height: 12px; transform: rotate(45deg); background: var(--lacquer); border: 1px solid var(--ink); }
.goal-list li.star::before { background: #e8b83a; }
.goal-list li.lose::before { background: #3a3a3a; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.row.center { justify-content: center; }
.spacer { flex: 1; }
.strategy-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 8px 0 4px; }
.strat { border: 1.5px solid #8a6a42; border-radius: 9px; padding: 8px 10px; background: rgba(255, 250, 235, 0.55); cursor: pointer; text-align: left; color: var(--ink); }
.strat b { font-family: var(--title); font-weight: 400; font-size: 19px; color: var(--lacquer); }
.strat small { display: block; font-size: 11.5px; line-height: 1.45; color: #6a5236; margin-top: 2px; }
.strat.on { border-color: var(--lacquer); background: rgba(255, 220, 160, 0.75); box-shadow: 0 0 0 2px rgba(110, 31, 22, 0.35); }
.result-title { font-family: var(--title); font-size: 56px; text-align: center; margin: 0; color: var(--lacquer); }
.result-title.lose { color: #4a4a4a; }
.result-stars { text-align: center; font-size: 46px; letter-spacing: 8px; margin: 4px 0 6px; }
.result-stars span { display: inline-block; color: #b8a888; animation: starpop 0.5s backwards; }
.result-stars span.on { color: #f0b830; text-shadow: 0 0 12px rgba(255, 180, 40, 0.9); }
@keyframes starpop { from { transform: scale(0) rotate(-90deg); } }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 10px 0; font-size: 14px; }
.stat-grid div { display: flex; justify-content: space-between; border-bottom: 1px dotted rgba(60, 40, 20, 0.3); padding: 3px 0; }

/* ------------------------------------------------------------------ in-game HUD */
.hud { pointer-events: none; }
.hud > * { pointer-events: auto; }
.topbar { position: absolute; top: 8px; left: 8px; right: 8px; height: 58px; display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
.daydial { width: 50px; height: 50px; flex: none; }
.lvl-title { display: flex; flex-direction: column; min-width: 120px; }
.lvl-title b { font-family: var(--title); font-weight: 400; font-size: 21px; color: var(--gold2); line-height: 1.05; white-space: nowrap; }
.lvl-title span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.res { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: nowrap; overflow: hidden; }
.chipx { display: flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 16px; background: rgba(255, 240, 210, 0.07); border: 1px solid rgba(217, 168, 74, 0.2); font-size: 14px; white-space: nowrap; position: relative; }
.chipx .num { font-size: 15px; }
.chipx small { color: var(--muted); font-size: 11px; }
.chipx.alert { border-color: var(--bad); background: rgba(255, 80, 50, 0.16); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 12px rgba(255, 90, 60, 0.7); } }
.fogbar { width: 92px; height: 9px; border-radius: 5px; background: rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.15); }
.fogbar i { display: block; height: 100%; background: linear-gradient(90deg, #8a8aa0, #c0b8d8); transition: width 0.4s; }
.fogbar.high i { background: linear-gradient(90deg, #a06a8a, #ff7a8a); }
.speed { display: flex; gap: 3px; align-items: center; }
.speed button { min-width: 34px; }
.speed .iconbtn { width: auto; padding: 0 7px; font-family: var(--num); font-size: 13px; font-weight: 700; }
.tools { display: flex; gap: 4px; }
.leftcol { position: absolute; top: 76px; left: 8px; width: 270px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100% - 90px); }
.objectives { padding: 10px 12px; }
.obj { margin: 6px 0 2px; font-size: 13.5px; }
.obj .t { display: flex; justify-content: space-between; gap: 8px; }
.obj.done .t { color: var(--good); }
.pbar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); margin-top: 3px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ember), var(--gold2)); transition: width 0.3s; }
.obj.done .pbar i { background: var(--good); }
.starline { font-size: 12px; color: var(--muted); margin-top: 6px; }
.starline .met { color: #ffcf4a; }
.warnings { padding: 8px 12px; font-size: 13px; }
.warnings div { padding: 3px 0; display: flex; gap: 6px; align-items: flex-start; }
.warnings .w-bad { color: var(--bad); }
.warnings .w-warn { color: var(--warn); }
.warnings .w-info { color: var(--blue); }

.aipanel { position: absolute; top: 76px; right: 8px; width: 340px; bottom: 8px; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.3s; }
.aipanel.collapsed { transform: translateX(calc(100% - 46px)); }
.ai-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ai-head h3 { flex: 1; }
.toggle { position: relative; width: 58px; height: 28px; border-radius: 14px; background: #3a2a1e; border: 1.5px solid var(--line); cursor: pointer; flex: none; transition: background 0.2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #b8a37e; transition: left 0.2s, background 0.2s; }
.toggle.on { background: linear-gradient(90deg, #a8401c, #f08a2a); border-color: var(--gold2); }
.toggle.on::after { left: 31px; background: #fff2c8; box-shadow: 0 0 10px #ffb050; }
.ai-status { padding: 8px 12px; font-size: 13px; color: var(--paper2); border-bottom: 1px solid rgba(217, 168, 74, 0.2); }
.ai-status .focus { color: var(--gold2); font-size: 14.5px; }
.ai-strats { display: flex; gap: 4px; padding: 8px 12px 4px; flex-wrap: wrap; }
.ai-strats button { flex: 1; font-size: 12.5px; padding: 4px 4px; }
.ai-goals { padding: 4px 12px 8px; font-size: 12.5px; }
.goalrow { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.goalrow .gb { width: 46px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.1); overflow: hidden; flex: none; }
.goalrow .gb i { display: block; height: 100%; background: var(--ember); }
.goalrow .gt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat { font-size: 11px; padding: 0 5px; border-radius: 4px; flex: none; border: 1px solid currentColor; opacity: 0.9; }
.ai-log { flex: 1; padding: 6px 12px 10px; font-size: 13px; line-height: 1.55; min-height: 80px; }
.logline { padding: 3px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.04); animation: slidein 0.3s; }
.logline .when { color: var(--muted); font-family: var(--num); font-size: 11px; margin-right: 5px; }
.logline.imp { color: #ffe2a0; }
@keyframes slidein { from { opacity: 0; transform: translateX(12px); } }
.ai-foot { padding: 8px 12px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; align-items: center; }
.ai-foot label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--paper2); }
.ai-tab { position: absolute; left: 0; top: 0; bottom: 0; width: 46px; display: none; }
.aipanel.collapsed .ai-tab { display: block; cursor: pointer; }
.takeover { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 20px; background: rgba(110, 31, 22, 0.92); border: 1px solid var(--gold); font-size: 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); }

.inspector { position: absolute; left: 8px; bottom: 8px; width: 330px; padding: 10px; display: flex; gap: 10px; }
.inspector img.face { width: 110px; height: 150px; flex: none; border-radius: 7px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); }
.inspector .info { flex: 1; font-size: 13px; line-height: 1.55; min-width: 0; }
.inspector .info b { font-family: var(--title); font-weight: 400; font-size: 21px; color: var(--gold2); }
.inspector .info .kind { color: var(--muted); font-size: 12px; margin-left: 4px; }

__m["src/sim/constants.js"] = (() => {
"use strict";
// Shared numbers for the simulation (world units; the renderer maps these to pixels).

const CARD_W = 110;
const CARD_H = 150;
const STACK_DY = 27; // vertical offset of each card in a mixed stack
const PILE_DY = 9; // offset between identical consecutive cards (piles)
const MAX_STACK = 24;
const MAX_PILE = 30;

const DT = 0.1; // fixed simulation step (seconds)
const DAY_LEN = 72; // seconds of sim time per day at 1×
const DUSK = 0.7; // phase where light starts to fade
const NIGHT = 0.78; // phase where full night begins
const DAWN_END = 0.06; // phase where morning is fully bright

const SEASONS = ['春', '夏', '秋', '冬'];
const SEASON_NAMES = ['春季', '夏季', '秋季', '冬季'];

const ACTION_INTERVAL = 0.38; // AI: sim seconds between two physical actions (≈ 160 APM)

/** y offsets of each card in a stack, given its def ids (identical neighbours are compressed) */
function stackOffsets(defs) {
  const out = [0];
  let y = 0;
  for (let i = 1; i < defs.length; i++) {
    y += defs[i] === defs[i - 1] ? PILE_DY : STACK_DY;
    out.push(y);
  }
  return out;
}

function stackHeight(defs) {
  const o = stackOffsets(defs);
  return o[o.length - 1] + CARD_H;
}

return { CARD_W, CARD_H, STACK_DY, PILE_DY, MAX_STACK, MAX_PILE, DT, DAY_LEN, DUSK, NIGHT, DAWN_END, SEASONS, SEASON_NAMES, ACTION_INTERVAL, stackOffsets, stackHeight };
})();

    });
  }
  cached(key, fn) {
    const c = this._cache[key];
    if (c && c.v === this._ver && c.t === this.s.t) return c.val;
    const val = fn();
    this._cache[key] = { v: this._ver, t: this.s.t, val };
    return val;
  }
  everSeen(id) { return (this.seen && this.seen.has(id)) || !!this.s.stats.made[id]; }

  // ------------------------------------------------------------ cards & stacks
  newCard(d, props = {}) {
    const def = CARDS[d];
    if (!def) throw new Error('unknown card ' + d);
    const id = this.s.nextId++;
    const c = { id, d, s: 0 };
    if (def.kind === 'folk') {
      c.name = personName(this.rng);
      c.gear = {};
      c.st = {};
      c.kills = 0;
    }
    if (def.hp) c.hp = def.hp;
    if (def.fuelMax) c.fuel = def.fuelStart ?? def.fuelMax;
    if (def.node) c.ch = def.node.charges;
    if (def.region) c.ch = def.region.charges;
    if (def.spoil) c.sp = Math.max(1, Math.round(def.spoil * (this.rules.spoilMult || 1) * (this.techSet && this.techSet.has('storage') ? 1.5 : 1)));
    if (def.grows) c.age = 0;
    if (def.store) c.store = 0;
    if (def.stages) { c.stage = 0; c.prog = {}; }
    if (def.kind === 'structure' && def.hp) c.hp = maxHp(this, c);
    Object.assign(c, props);
    this.s.cards[id] = c;
    this._ver++;
    return c;
  }

  makeStack(cardIds, x, y) {
    const id = this.s.nextId++;
    const st = { id, cards: cardIds.slice(), x, y, task: null, battle: null, held: false, dirty: true, mob: false, z: ++this.s.z };
    for (const cid of cardIds) this.s.cards[cid].s = id;
    this.s.stacks[id] = st;
    this.clampStack(st);
    return st;
  }

  clampStack(st) {
    const h = this.stackH(st);
    st.x = Math.max(10, Math.min(this.board.w - CARD_W - 10, st.x));
    st.y = Math.max(10, Math.min(this.board.h - Math.min(h, 400) - 10, st.y));
  }

  /** split a stack so that `cardId` and everything above it form a new stack */
  detach(cardId) {
    const c = this.s.cards[cardId];
    const st = this.s.stacks[c.s];
    const i = st.cards.indexOf(cardId);
    if (i <= 0) {
      st.dirty = true;
      return st;
    }
    const o = stackOffsets(st.cards.map((id) => this.s.cards[id].d));
    const moved = st.cards.slice(i);
    st.cards = st.cards.slice(0, i);
    st.dirty = true;
    const ns = this.makeStack(moved, st.x, st.y + o[i]);
    return ns;
  }

  /** pull a single card out of its stack (closing the gap) into its own stack */
  extract(cardId) {
    const c = this.s.cards[cardId];
    const st = this.s.stacks[c.s];
    if (st.cards.length === 1) return st;
    const i = st.cards.indexOf(cardId);
    const o = stackOffsets(st.cards.map((id) => this.s.cards[id].d));
    st.cards.splice(i, 1);
    st.dirty = true;
    if (i === 0 && st.cards.length) {
      // the stack keeps its position; the root moved out
    }
    return this.makeStack([cardId], st.x, st.y + (o[i] || 0));
  }

  removeCard(id, why = 'remove') {
    const c = this.s.cards[id];
    if (!c) return;
    const st = this.s.stacks[c.s];
    const pos = this.cardPos(c);
    if (st) {
      st.cards = st.cards.filter((x) => x !== id);
      st.dirty = true;
      if (!st.cards.length) {
        if (st.battle) {
          const b = this.s.battles[st.battle];
          if (b) { b.a = b.a.filter((x) => x !== id); b.b = b.b.filter((x) => x !== id); }
        }
        delete this.s.stacks[st.id];
      }
    }
    delete this.s.cards[id];
    this._ver++;
    this.emit({ type: 'remove', id, d: c.d, why, x: pos.x, y: pos.y });
  }

  transform(c, to) {
    const from = c.d;
    const def = CARDS[to];
    const ratio = c.hp && CARDS[from].hp ? c.hp / maxHp(this, c) : 1;
    c.d = to;
    if (def.kind === 'folk') {
      c.gear = c.gear || {};
      c.st = c.st || {};
      c.name = c.name || personName(this.rng);
      c.kills = c.kills || 0;
    }
    if (def.hp) c.hp = Math.max(1, Math.round(maxHp(this, c) * Math.min(1, ratio || 1)));
    if (def.fuelMax && c.fuel === undefined) c.fuel = def.fuelStart ?? def.fuelMax;
    if (def.store && c.store === undefined) c.store = 0;
    if (def.node && CARDS[from].node !== def.node) c.ch = def.node.charges;
    else if (!def.node && !def.region) delete c.ch;
    if (def.spoil) c.sp = Math.round(def.spoil * (this.hasTech('storage') ? 1.5 : 1));
    else delete c.sp;
    const st = this.s.stacks[c.s];
    if (st) st.dirty = true;
    this._ver++;
    this.emit({ type: 'transform', id: c.id, from, to });
  }

  spawn(d, from, opts = {}) {
    const def = CARDS[d];
    const src = from && from.cards ? { x: from.x + CARD_W / 2, y: from.y + CARD_H / 2 } : from || this.colonyCenter();
    const c = this.newCard(d, opts.props || {});
    if (opts.carry) {
      const o = opts.carry;
      for (const k of ['name', 'kills', 'bonusHp', 'xp']) if (o[k] !== undefined) c[k] = o[k];
      c.gear = { ...(o.gear || {}) };
      c.st = { ...(o.st || {}) };
      const ratio = o.hp / maxHp(this, o);
      c.hp = Math.max(1, Math.round(maxHp(this, c) * Math.min(1, ratio)));
    }
    if (def.kind === 'folk') this.s.stats.born += d === 'child' ? 1 : 0;
    // drop onto a matching pile nearby
    if (!opts.at && opts.pile !== false && PILEABLE.has(def.kind)) {
      let best = null, bd = 340;
      for (const st of Object.values(this.s.stacks)) {
        if (st.held || st.battle || st.mob || st.task || st.cards.length >= MAX_PILE) continue;
        if (!st.cards.every((id) => this.s.cards[id].d === d)) continue;
        const dd = Math.hypot(st.x + CARD_W / 2 - src.x, st.y + CARD_H / 2 - src.y);
        if (dd < bd) { bd = dd; best = st; }
      }
      if (best) {
        best.cards.push(c.id);
        c.s = best.id;
        best.dirty = true;
        this.emit({ type: 'spawn', id: c.id, d, fx: src.x, fy: src.y });
        return c;
      }
    }
    let x, y;
    if (opts.at) { x = opts.at.x; y = opts.at.y; }
    else {
      let bx = src.x - CARD_W / 2 + 128, by = src.y - CARD_H / 2;
      if (opts.near) {
        const ns = this.s.stacks[opts.near.s];
        if (ns) { bx = ns.x; by = ns.y + CARD_H + 30; }
      }
      const spot = this.freeSpot(bx, by, CARD_H);
      x = spot.x; y = spot.y;
    }
    const st = this.makeStack([c.id], x, y);
    if (def.mob) initMob(this, c);
    if (def.mob && def.kind === 'enemy') this.scaleEnemy(c);
    void st;
    this.emit({ type: 'spawn', id: c.id, d, fx: src.x, fy: src.y });
    return c;
  }

  scaleEnemy(c) {
    const def = CARDS[c.d];
    let mult = this.rules.enemyHp || 1;
    if (def.tags.includes('shade') && !def.traits.includes('boss')) mult *= 1 + this.s.fog / 150;
    c.mhp = Math.max(1, Math.round(def.hp * mult));
    c.hp = c.mhp;
  }

  spawnMob(d, x, y) {
    const c = this.newCard(d);
    this.makeStack([c.id], x, y);
    initMob(this, c);
    if (CARDS[d].kind === 'enemy') this.scaleEnemy(c);
    this.emit({ type: 'spawn', id: c.id, d, fx: x + CARD_W / 2, fy: y + CARD_H / 2, mob: true });
    return c;
  }
  initMob(c) { initMob(this, c); }

  freeSpot(x, y, h = CARD_H, opts = {}) {
    const ex = opts.exclude;
    const stacks = Object.values(this.s.stacks).filter((st) => st.id !== ex && !st.held && !st.mob);
    const hs = stacks.map((st) => this.stackH(st));
    const W = this.board.w, H = this.board.h;
    const free = (px, py) => {
      if (px < 10 || py < 10 || px > W - CARD_W - 10 || py > H - h - 10) return false;
      for (let i = 0; i < stacks.length; i++) {
        const st = stacks[i];
        if (px < st.x + CARD_W + 12 && px + CARD_W + 12 > st.x && py < st.y + hs[i] + 12 && py + h + 12 > st.y) return false;
      }
      return true;
    };
    if (free(x, y)) return { x, y };
    for (let ring = 1; ring <= 14; ring++) {
      const r = ring * 64;
      const n = ring * 8;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2;
        const px = x + Math.cos(a) * r * 1.25, py = y + Math.sin(a) * r;
        if (free(px, py)) return { x: px, y: py };
      }
    }
    return { x: Math.max(10, Math.min(W - CARD_W - 10, x)), y: Math.max(10, Math.min(H - h - 10, y)) };
  }

  /** keep stacks from piling up on each other (gentle pushes unless forced) */
  separate(force = false) {
    const list = Object.values(this.s.stacks).filter((st) => !st.held && !st.battle && !st.mob);
    const hs = new Map(list.map((st) => [st.id, this.stackH(st)]));
    const fixed = (st) => CARDS[this.s.cards[st.cards[0]].d].fixed;
    const cell = 240;
    const grid = new Map();
    for (const st of list) {
      const k = Math.floor(st.x / cell) + ',' + Math.floor(st.y / cell);
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(st);
    }
    const push = force ? 0.55 : 0.18;
    for (const a of list) {
      const gx = Math.floor(a.x / cell), gy = Math.floor(a.y / cell);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 2; dy++) {
        for (const b of grid.get(gx + dx + ',' + (gy + dy)) || []) {
          if (b.id <= a.id) continue;
          const ah = hs.get(a.id), bh = hs.get(b.id);
          const ox = Math.min(a.x + CARD_W, b.x + CARD_W) - Math.max(a.x, b.x) + 6;
          const oy = Math.min(a.y + ah, b.y + bh) - Math.max(a.y, b.y) + 6;
          if (ox <= 0 || oy <= 0) continue;
          const fa = fixed(a), fb = fixed(b);
          if (fa && fb) continue;
          const wa = fa ? 0 : fb ? 1 : 0.5, wb = fb ? 0 : fa ? 1 : 0.5;
          if (ox < oy) {
            const s = a.x + CARD_W / 2 < b.x + CARD_W / 2 ? -1 : 1;
            const m = Math.min(ox, 40) * push;
            a.x += s * m * wa * 2;
            b.x -= s * m * wb * 2;
          } else {
            const s = a.y + ah / 2 < b.y + bh / 2 ? -1 : 1;
            const m = Math.min(oy, 40) * push;
            a.y += s * m * wa * 2;
            b.y -= s * m * wb * 2;
          }
        }
      }
    }
    for (const st of list) this.clampStack(st);
  }

  // ------------------------------------------------------------ people & health
  people() {
    return this.cached('people', () => Object.values(this.s.cards).filter((c) => CARDS[c.d].tags.includes('person')));
  }
  population() { return this.people().filter((c) => !CARDS[c.d].tags.includes('construct')).length; }
  housing() {
    return this.cached('housing', () => {
      let h = 0;
      for (const c of Object.values(this.s.cards)) h += CARDS[c.d].housing || 0;
      return h;
    });
  }
  isActive(c) {
    const d = CARDS[c.d];
    if (d.tags.includes('construct')) return (c.fuel || 0) > 0;
    return true;
  }
  maxHp(c) { return maxHp(this, c); }
  stats(c) { return combatStats(this, c); }
  dmgMult(as, ts) { return damageMult(as, ts); }
  heal(c, n) {
    const m = maxHp(this, c);
    if (c.hp >= m) return;
    c.hp = Math.min(m, c.hp + n);
    this.emit({ type: 'heal', id: c.id, n });
  }
  hurt(c, dmg, why = '', attacker = null) {
    if (!c || !this.s.cards[c.id]) return;
    c.hp = (c.hp ?? 1) - dmg;
    this.emit({ type: 'dmg', id: c.id, dmg });
    if (c.hp <= 0) this.die(c, why, attacker);
  }
  die(c, why, attacker) {
    const def = CARDS[c.d];
    const pos = this.cardPos(c);
    if (def.kind === 'folk') return this.killPerson(c, why || '倒下了');
    if (attacker && this.s.cards[attacker.id] && CARDS[attacker.d].kind === 'folk') {
      attacker.kills = (attacker.kills || 0) + 1;
      if (attacker.kills % 3 === 0 && attacker.kills <= 6) this.msg(`${attacker.name}身经百战，攻击力提升了。`, 'good');
    }
    if (def.kind === 'enemy' || def.kind === 'lair' || def.kind === 'beast') {
      this.s.stats.kills++;
      this.s.stats.killsBy[c.d] = (this.s.stats.killsBy[c.d] || 0) + 1;
      if (def.tags.includes('shade')) this.s.stats.shades++;
      if ((def.traits || []).includes('boss')) { this.s.stats.bosses.push(c.d); this.msg(`${def.name}被击败了！`, 'boss'); }
      if (def.kind === 'lair') this.msg(`${def.name}被摧毁了！`, 'good');
      const at = this.s.stacks[c.s];
      const from = at ? { x: at.x + CARD_W / 2, y: at.y + CARD_H / 2 } : pos;
      this.removeCard(c.id, 'death');
      for (const [id, n, p] of (def.mob && def.mob.loot) || []) {
        if (p !== undefined && !this.rng.chance(p)) continue;
        for (let i = 0; i < n; i++) this.spawn(id, from, {});
      }
      if (c.ai && c.ai.bag) for (const d of c.ai.bag) this.spawn(d, from, {});
      this.emit({ type: 'kill', d: c.d, x: from.x, y: from.y });
      return;
    }
    // structures (walls)
    this.removeCard(c.id, 'destroyed');
    this.msg(`${def.name}被摧毁了。`, 'danger');
  }
  killPerson(c, why) {
    const def = CARDS[c.d];
    const pos = this.cardPos(c);
    const st = this.s.stacks[c.s];
    const at = st ? { x: st.x, y: st.y } : { x: pos.x - CARD_W / 2, y: pos.y - CARD_H / 2 };
    const inBattle = st && st.battle;
    this.removeCard(c.id, 'death');
    this.s.stats.deaths++;
    this.msg(`${c.name || def.name}（${def.name}）${why}。`, 'death');
    this.emit({ type: 'death', d: c.d, name: c.name, x: pos.x, y: pos.y });
    if (!def.tags.includes('construct')) {
      const spot = inBattle ? this.freeSpot(at.x, at.y + 160, CARD_H) : this.freeSpot(at.x, at.y, CARD_H);
      this.spawn('grave', pos, { at: spot });
    }
  }
  isWarm(p) {
    if (p.gear) for (const gid of Object.values(p.gear)) if (gid && CARDS[gid].gear.warm) return true;
    const pos = this.cardPos(p);
    for (const L of this.lights) {
      if (!L.warm) continue;
      if (Math.hypot(L.x - pos.x, L.y - pos.y) <= L.r) return true;
    }
    const st = this.s.stacks[p.s];
    if (st && st.cards.some((id) => CARDS[this.s.cards[id].d].warmth)) return true;
    return false;
  }

  // ------------------------------------------------------------ time & light
  dayLen() { return this.rules.dayLen || DAY_LEN; }
  phase() { return (this.s.t % this.dayLen()) / this.dayLen(); }
  season() {
    if (!this.rules.seasons) return this.rules.season ?? 1;
    return ((this.rules.startSeason || 0) + Math.floor((this.s.day - 1) / (this.rules.seasonDays || 3))) % 4;
  }
  ambient() {
    if (this.rules.dark) return 0.06;
    if (this.s.flags.eclipse === this.s.day) return 0.04;
    if (this.rules.polarNight) return 0.1;
    const p = this.phase();
    if (p < DAWN_END) return 0.25 + 0.75 * (p / DAWN_END);
    if (p < DUSK) return 1;
    if (p < NIGHT) return 1 - (p - DUSK) / (NIGHT - DUSK);
    return 0;
  }
  isNight() { return this.ambient() < 0.5; }
  cardLight(c) {
    const def = CARDS[c.d];
    if (def.kind === 'enemy' || def.kind === 'lair') return 0;
    let L = def.light || 0;
    if (L && def.fuelMax && !(c.fuel > 0)) L = 0;
    if (L && def.tags.includes('construct') && !(c.fuel > 0)) L = 0;
    if (c.gear) for (const gid of Object.values(c.gear)) if (gid && CARDS[gid].gear.light) L = Math.max(L, CARDS[gid].gear.light);
    return L;
  }
  refreshLights() {
    const lights = [];
    for (const st of Object.values(this.s.stacks)) {
      if (st.held) continue;
      let best = 0, burn = 1, warm = false, struct = false;
      for (const id of st.cards) {
        const c = this.s.cards[id];
        const L = this.cardLight(c);
        if (L > best) best = L;
        const d = CARDS[c.d];
        if (L > 0 && d.burnShade) burn = Math.max(burn, d.burnShade);
        if (L > 0 && (d.tags.includes('fire') || d.warmth)) warm = true;
        if (L > 0 && (d.kind === 'structure' || d.kind === 'wonder')) struct = true;
      }
      for (const id of st.cards) if (CARDS[this.s.cards[id].d].warmth) warm = true;
      if (best > 0) lights.push({ x: st.x + CARD_W / 2, y: st.y + CARD_H / 2, r: best, sid: st.id, burn, warm, struct });
    }
    this.lights = lights;
  }
  lightAt(x, y) {
    let best = 0;
    for (const L of this.lights) {
      const d = Math.hypot(L.x - x, L.y - y);
      if (d < L.r) best = Math.max(best, 1 - d / L.r);
    }
    return best;
  }
  lightBurnAt(x, y) {
    let b = 1;
    for (const L of this.lights) if (Math.hypot(L.x - x, L.y - y) < L.r) b = Math.max(b, L.burn);
    return b;
  }
  nearestLight(x, y) {
    let best = null, bd = Infinity;
    for (const L of this.lights) {
      const d = Math.hypot(L.x - x, L.y - y) - L.r;
      if (d < bd) { bd = d; best = L; }
    }
    return best;
  }
  stackLit(st) {
    if (this.ambient() >= 0.5) return true;
    return this.lightAt(st.x + CARD_W / 2, st.y + CARD_H / 2) > 0;
  }
  steamBoost(st) {
    for (const c of Object.values(this.s.cards)) {
      if (c.d !== 'steam_engine' || !(c.fuel > 0)) continue;
      const p = this.cardPos(c);
      if (Math.hypot(p.x - st.x - CARD_W / 2, p.y - st.y - CARD_H / 2) < CARDS.steam_engine.aura.radius) return true;
    }
    return false;
  }
  darkPulse(pos, r) {
    let best = null, bd = r;
    for (const c of Object.values(this.s.cards)) {
      const d = CARDS[c.d];
      if (!d.fuelMax || !(c.fuel > 0) || d.kind !== 'structure') continue;
      const p = this.cardPos(c);
      const dd = Math.hypot(p.x - pos.x, p.y - pos.y);
      if (dd < bd) { bd = dd; best = c; }
    }
    if (best) {
      best.fuel = 0;
      this.msg(`黑暗的脉冲扑灭了${CARDS[best.d].name}！`, 'danger');
      this.emit({ type: 'snuff', id: best.id, big: true });
    }
  }
  colonyCenter() {
    return this.cached('cc', () => {
      let x = 0, y = 0, n = 0;
      for (const c of this.people()) {
        const st = this.s.stacks[c.s];
        if (!st || st.battle) continue;
        x += st.x + CARD_W / 2;
        y += st.y + CARD_H / 2;
        n++;
      }
      if (!n) {
        for (const L of this.lights) { x += L.x; y += L.y; n++; }
      }
      return n ? { x: x / n, y: y / n } : { x: this.board.w / 2, y: this.board.h / 2 };
    });
  }
  addFog(dv, why) {
    this.s.fog = Math.max(0, Math.min(100, this.s.fog + dv));
    this.s.stats.maxFog = Math.max(this.s.stats.maxFog, this.s.fog);
    if (why && dv) this.emit({ type: 'fog', dv, why });
  }

  // ------------------------------------------------------------ tech
  hasTech(id) { return this.techSet.has(id); }
  techAllowed(id) {
    const a = this.level.techAllowed;
    if (!a) return true;
    if (Array.isArray(a)) return a.includes(id) || this.level.techs?.includes(id);
    if (a.maxEra) return TECHS[id].era <= a.maxEra && !(a.not || []).includes(id);
    return true;
  }
  addTech(id) {
    if (this.techSet.has(id)) return;
    this.techSet.add(id);
    this.s.tech.push(id);
    this.s.techV++;
    for (const st of Object.values(this.s.stacks)) st.dirty = true;
  }
  techStatus(id) { return techStatus(this, id); }
  hasMerchant() { return this.countDef('merchant') > 0; }

  // ------------------------------------------------------------ inventory helpers (free = idle cards)
  isFree(c) {
    const st = this.s.stacks[c.s];
    if (!st || st.held || st.battle || st.mob) return false;
    if (st.task) {
      const m = st.task.m;
      if (m.consume.includes(c.id) || m.keep.includes(c.id) || m.workers.includes(c.id) || m.extra.includes(c.id) || m.aids.includes(c.id)) return false;
    }
    return true;
  }
  freeCards(k) {
    const out = [];
    const tag = k[0] === '#' ? k.slice(1) : null;
    for (const c of Object.values(this.s.cards)) {
