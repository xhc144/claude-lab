      const house = this.bestHouse();
      produce(P, house, 1, prio, `需要更多房屋（${W.housing} 床位，${W.pop} 人）`, '建设');
      return;
    }
    if (!foodOk && !objPop) return;
    const adults = W.idle.filter((w) => CARDS[w.d].tags.includes('adult'));
    const houses = W.structs.filter((c) => CARDS[c.d].tags.includes('house') && !this.locked.has(c.id) && !g.s.stacks[c.s].task);
    if (houses.length && adults.length + W.busy.length >= 2) {
      addJob(P, { key: 'c:birth', kind: 'craft', r: 'birth', site: houses[0].id, item: 'child', n: 1, prio, why: `人口 ${W.pop}，房屋有空位，生个孩子`, cat: '建设' });
    }
  }

  /** measured food production per day (null until two dawns have passed) */
  foodProduction(W) {
    const g = this.g;
    if (this.lastDay !== W.day) {
      this.lastDay = W.day;
      (this.dawnFood ||= []).push(W.food);
      (this.dawnEaten ||= []).push(g.s.stats.eaten);
      if (this.dawnFood.length > 4) { this.dawnFood.shift(); this.dawnEaten.shift(); }
      const n = this.dawnFood.length;
      if (n >= 2) {
        const p = this.dawnFood[n - 1] - this.dawnFood[n - 2] + (this.dawnEaten[n - 1] - this.dawnEaten[n - 2]);
        this.prodAvg = this.prodAvg === undefined ? p : this.prodAvg * 0.5 + p * 0.5;
      }
    }
    return this.prodAvg === undefined ? null : this.prodAvg;
  }

  bestHouse() {
    const g = this.g;
    if (g.hasTech('masonry') && this.W.freeN('brick') >= 4) return 'stone_house';
    if (g.hasTech('carpentry')) return 'cabin';
    return 'lean_to';
  }

  fogNeeds(W, P) {
    const g = this.g, R = g.rules;
    if (!R.fogRate && !R.shades && P.fogTarget === undefined) return;
    const fog = g.s.fog;
    const loseRisk = (g.level.lose || []).some((l) => l.type === 'fog');
    const tgt = P.fogTarget ?? (loseRisk ? 55 : 70);
    // project fog in 3 days
    let rate = R.fogRate || 0;
    for (const c of W.cards) {
      const d = CARDS[c.d];
      if (d.fog && !(d.fog < 0 && d.fuelMax && !(c.fuel > 0))) rate += d.fog;
    }
    const proj = fog + rate * 3;
    if (proj < tgt - 5 && fog < tgt - 10) return;
    let prio = (P.fogPrio || 30) + Math.max(0, proj - tgt) * 0.8 + (loseRisk && fog > 70 ? 40 : 0);
    goal(P, '驱散灰雾', prio, '生存', `${Math.round(fog)}% → ${Math.round(proj)}%`);
    // graves: burying lowers fog
    for (const gr of W.graves) addJob(P, { key: 'c:bury:' + gr.id, kind: 'craft', r: 'bury', item: 'none', prio: prio + 4, why: '安葬逝者（灰雾 -2）', cat: '生存', siteCard: gr.id });
    const reducers = ['shrine', 'memorial', 'lighthouse', 'beacon', 'eternal_lamp'].filter((id) => {
      const ms = P.W && itemCost(W, id, P.memo);
      return ms < Infinity;
    });
    if (reducers.length) {
      reducers.sort((a, b) => itemCost(W, a, P.memo) / -CARDS[a].fog - itemCost(W, b, P.memo) / -CARDS[b].fog);
      produce(P, reducers[0], 1, prio, `灰雾 ${Math.round(fog)}%，正在上升（${rate >= 0 ? '+' : ''}${rate}/天）`, '生存');
    } else if (g.techAllowed('lore') && !g.hasTech('lore')) {
      P.techNeed.set('lore', Math.max(P.techNeed.get('lore') || 0, prio));
    }
    if (W.count('festival_ground') && W.freeN('feast')) addJob(P, { key: 'festival', kind: 'deliver', target: W.cards.find((c) => c.d === 'festival_ground').id, item: 'feast', n: 1, prio: prio + 2, why: '举办庆典驱散灰雾', cat: '生存' });
    // relight beacons
  }

  lightNeeds(W, P) {
    const g = this.g;
    if (!g.rules.shades && !g.rules.dark) return;
    // count working stacks that would sit in the dark at night
    const unlit = W.taskStacks.filter((st) => !W.nightLit(st.x + CARD_W / 2, st.y + CARD_H / 2) && !CARDS[g.s.cards[st.cards[0]].d].fixed && !RECIPES[st.task.r].dark);
    const crowd = W.stacks.filter((st) => !st.mob && W.nightLit(st.x + CARD_W / 2, st.y + CARD_H / 2)).length;
    const lightsBuilt = W.nightLights.length;
    const spots = W.litSpots();
    if (g.rules.dark && spots < 4) {
      produce(P, cheapestLight(P), 1, 92 - spots * 6, `火光里只剩 ${spots} 个空位，地下太黑了，立更多光源`, '生存');
    } else if ((unlit.length >= 2 && crowd > 7 && lightsBuilt < 2 + Math.floor(W.pop / 3)) || (g.rules.dark && lightsBuilt < 2) || (g.rules.shades && spots < 2)) {
      produce(P, cheapestLight(P), 1, 42 + (g.rules.dark ? 20 : 0), '营地太挤了，需要更多光照', '建设');
    }
    // portable light for the dark
    if (g.rules.dark && g.hasTech('torches') && availFree(P, 'torch') < 1) need(P, 'torch', 1, 40, '黑暗中需要火把', '生存');
  }

  trainingJobs(W, P) {
    const g = this.g;
    for (const [item, spec] of Object.entries(TRAINERS)) {
      const free = W.free(item);
      if (!free.length) continue;
      const r = RECIPES[spec.train];
      if (r.tech && !g.hasTech(r.tech)) continue;
      const out = r.out[0][0];
      if (W.count(out) >= spec.max) continue;
      if (spec.needs && !W.count(spec.needs)) continue;
      const traineeId = Object.keys(r.in).find((k) => CARDS[k] && CARDS[k].kind === 'folk');
      const trainees = W.people.filter((c) => c.d === traineeId && !this.locked.has(c.id) && !g.s.stacks[c.s]?.battle);
      if (!trainees.length) continue;
      if (item === 'mace' && !W.freeN('shield')) continue;
      const soldier = CARDS[out].tags.includes('soldier');
      addJob(P, { key: 'c:' + spec.train, kind: 'craft', r: spec.train, item: out, n: 1, prio: soldier ? 70 : 38, why: `训练一名${nm(out)}`, cat: soldier ? '战斗' : '建设' });
    }
    // knights
    if (g.hasTech('horsemanship') && W.freeN('saddle_horse') && W.freeN('iron_armor') && W.freeN('spearman'))
      addJob(P, { key: 'c:train_knight', kind: 'craft', r: 'train_knight', item: 'knight', n: 1, prio: 72, why: '训练骑卫', cat: '战斗' });
  }

  researchNeeds(W, P, fresh) {
    const g = this.g, S = this.strat;
    let target = this.techTarget;
    if (target && (g.hasTech(target) || !g.techAllowed(target))) target = null;
    const best = chooseTech(P);
    // switch only if the new choice is needed more urgently
    if (!target || (best && best !== target && (P.techNeed.get(best) || 0) > (P.techNeed.get(target) || 0) + 10)) target = best;
    this.techTarget = target;
    if (!target) return;
    const st = techStatus(g, target);
    const t = TECHS[target];
    const prio = Math.max(P.techNeed.get(target) || 0, 28 * S.research + (P.researchCount || 0) * 0.5);
    if (st.ok) {
      fresh.push(new Exec({ key: 'research:' + target, kind: 'research', prio: 155, why: `研究「${t.name}」：${t.desc}`, cat: '科技' }, [{ op: 'research', tech: target }]));
      return;
    }
    if (st.short) {
      goal(P, '研究「' + t.name + '」', prio, '科技', `${t.cost - st.short}/${t.cost}`);
      need(P, 'insight', t.cost, prio, `为研究「${t.name}」积累灵感`, '科技');
    }
  }

  tradeNeeds(W, P, fresh) {
    const g = this.g;
    // caravans: buy what we lack, sell what we have too much of
    for (const cv of W.caravans) {
      cv.offers.forEach((o, i) => {
        if (o.left <= 0 || !canPay(g, o.give)) return;
        const [gid, gn] = o.get[0];
        let value = 0;
        if (gid === 'coin') {
          // selling: only surplus
          const [sid, sn] = o.give[0];
          const surplus = availFree(P, sid) - sn;
          if (surplus >= 1 && (P.coinTarget || P.tradeWanted || CARDS[sid].kind === 'knowledge')) value = gn * 2;
        } else {
          const wanted = P.unmet.some((u) => u.item === gid) || (gid === 'survivor' && W.pop < (P.popTarget || 0)) || (gid === 'food_crate' && W.food < W.dailyNeed * 1.5);
          const coinCost = o.give.reduce((a, [id, n]) => a + (id === 'coin' ? n : 0), 0);
          const spare = g.coinValue() - (P.coinTarget || 0);
          if (wanted && spare >= coinCost) value = 30;
          if (P.tradeWanted && spare >= coinCost) value = Math.max(value, 20);
        }
        if (value > 0) fresh.push(new Exec({ key: 'trade:' + cv.id + ':' + i, kind: 'trade', prio: 80, why: `与商队交易：${o.give.map(([id, n]) => nm(id) + '×' + n).join('+')} → ${o.get.map(([id, n]) => nm(id) + '×' + n).join('+')}`, cat: '经济' },
          [{ op: 'trade', id: cv.id, idx: i }]));
      });
    }
    // coins needed: sell surplus at a market
    const market = W.structs.find((c) => CARDS[c.d].market);
    const coinTarget = P.coinTarget || 0;
    if (coinTarget && g.coinValue() < coinTarget) {
      if (!market) produce(P, 'market', 1, P.coinPrio || 60, '需要集市来换取铜贝', '经济');
      else {
        // the most valuable surplus item
        const cands = [];
        for (const [id, list] of this.freeGroups(W)) {
          const d = CARDS[id];
          const v = sellValue(g, d);
          if (v <= 0) continue;
          const keep = (P.claimed.get(id) || 0) + (['wood', 'stone', 'food'].includes(id) ? 2 : 0);
          const surplus = list.length - keep;
          if (surplus <= 0 || d.kind === 'folk') continue;
          if (d.tags.some((t) => ['boat', 'trainer', 'portable_light', 'pot', 'axe', 'pick', 'rod', 'hoe', 'livestock'].includes(t))) continue;
          if (P.unmet.some((u) => CARDS[u.item] && CARDS[u.item].name.includes(d.name))) continue; // keep what a wanted thing is probably made of
          if (d.food > 0 && W.food < W.dailyNeed * 2) continue;
          cands.push([id, v, surplus]);
        }
        cands.sort((a, b) => b[1] - a[1]);
        if (cands.length) {
          const [id, v, n] = cands[0];
          fresh.push(new Exec({ key: 'sell:' + id, kind: 'sell', prio: (P.coinPrio || 60) + 5, why: `在集市卖掉多余的${nm(id)}（${v} 铜贝/个）`, cat: '经济' },
            [{ op: 'dropRef', ref: id, n: Math.min(n, 6), target: market.id }], { lock: [market.id] }));
        }
        // and produce something sellable: cheap goods with good value per worker-second
        const goods = ['brick', 'cloth', 'leather', 'rope', 'plank', 'jerky', 'salt', 'honey', 'pottery'].filter((id) => CARDS[id] && sellValue(g, CARDS[id]) > 0 && itemCost(W, id, P.memo) < 80);
        goods.sort((a, b) => sellValue(g, CARDS[b]) / itemCost(W, b, P.memo) - sellValue(g, CARDS[a]) / itemCost(W, a, P.memo));
        if (goods.length) produce(P, goods[0], 2, (P.coinPrio || 60) - 5, '生产可出售的' + nm(goods[0]), '经济');
        else need(P, 'wood', 6, (P.coinPrio || 60) - 8, '砍木头去卖', '经济');
      }
    }
    if (P.tradeWanted && market && g.coinValue() >= 3) {
      const offers = g.marketOffers().filter((o) => canPay(g, o.give));
      if (offers.length) fresh.push(new Exec({ key: 'buy:' + offers[0].id, kind: 'trade', prio: P.tradeWanted, why: '在集市采购补给', cat: '经济' }, [{ op: 'buy', id: market.id, offer: offers[0].id }]));
    }
  }

  freeGroups(W) {
    const m = new Map();
    for (const c of W.cards) {
      if (!this.g.isFree(c) || this.locked.has(c.id)) continue;
      if (!m.has(c.d)) m.set(c.d, []);
      m.get(c.d).push(c);
    }
    return m;
  }

  stockNeeds(W, P) {
    const g = this.g, S = this.strat;
    const k = S.stock;
    need(P, 'wood', Math.round(4 * k + W.fires.length * 2), 14, '备些木材', '建设');
    need(P, 'stone', Math.round(3 * k), 11, '备些石块', '建设');
    if (g.techAllowed('shelter') || g.hasTech('weaving')) need(P, 'fiber', Math.round(2 * k), 9, '备些纤维', '建设');
    if (!W.freeN('flint') && !W.count('campfire') && !W.count('hearth')) need(P, 'flint', 1, 40, '生火需要燃石', '生存');
    // forests regrow only if someone plants them
    const trees = W.nodes.filter((c) => CARDS[c.d].tags.includes('tree')).length + W.count('young_tree');
    if (availFree(P, 'sapling') > 0 && trees < 4) addJob(P, { key: 'c:plant_sapling', kind: 'craft', r: 'plant_sapling', item: 'young_tree', n: 1, prio: 20 + (4 - trees) * 5, why: `树快砍光了（剩 ${trees} 棵），种下树苗`, cat: '建设' });
    // always have something to research toward
    if (this.techTarget) need(P, 'insight', 1, 10 * S.research, '积累灵感', '科技');
  }

  exploreNeeds(W, P) {
    const g = this.g, S = this.strat;
    for (const r of W.regions) {
      if (!(r.ch > 0)) continue;
      const rd = CARDS[r.d].region;
      const loot = r.loot || rd.loot;
      let score = 14 * S.explore + (P.exploreBoost || 0);
      if (P.unmet.some((u) => loot.some(([id]) => id === u.item))) score += 28;
      // running low on nodes? exploring brings new ones
      const nodesLeft = W.nodes.filter((c) => c.ch > 0 || c.ch < 0).length;
      if (nodesLeft < 4) score += 18;
      if (W.night && !rd.need) score *= 0.5;
      const danger = r.danger ?? rd.danger;
      if (danger > 0.3 && W.soldiers.length === 0) score *= 0.5;
      if (score < 10) continue;
      addJob(P, { key: 'e:' + r.id, kind: 'explore', r: 'explore_' + r.d, site: r.id, prio: score, why: `探索${nm(r.d)}`, cat: '探索', want: P.exploreBoost ? 2 : 1 });
      // if the best team we could send would lose an ambush there, train an escort first
      const foes = r.foes || rd.foes || [];
      if (foes.length && (r.danger ?? rd.danger) >= 0.05) {
        let foePow = 0;
        for (const [f] of foes) foePow = Math.max(foePow, defsPower([[f, 1]]));
        const ft = [...new Set(foes.flatMap(([f]) => CARDS[f].traits || []))];
        const best = availableFighters(this, W, ft).slice(0, 3).map((f) => f.p);
        if (groupPower(g, best, ft).power < foePow * 1.4 && score >= 30) {
          goal(P, '组建护卫队', score * 0.8, '战斗', nm(r.d));
          P.escort = { traits: ft, prio: score * 0.8 };
        }
      }
      if (rd.need === 'light' || rd.needLight) {
        if (!W.free('#portable_light').length && !W.people.some((p) => g.cardLight(p) > 0)) {
          if (g.hasTech('torches') || g.techAllowed('torches')) need(P, 'torch', 1, score, `探索${nm(r.d)}需要火把`, '探索');
        }
      }
      if (rd.need === 'boat' && !W.free('#boat').length) need(P, 'boat', 1, score, `前往${nm(r.d)}需要舟`, '探索');
    }
  }

  housekeeping(W, P, fresh) {
    const g = this.g;
    // open bundles, scrolls and tomes right away
    for (const c of W.openables) {
      if (this.locked.has(c.id)) continue;
      fresh.push(new Exec({ key: 'open:' + c.id, kind: 'open', prio: 100, why: `打开${nm(c.d)}`, cat: '整理' }, [{ op: 'open', id: c.id }], { lock: [c.id] }));
      break;
    }
    // automaton oil
    for (const a of W.people) {
      if (a.d !== 'automaton' || (a.fuel || 0) > 1) continue;
      if (availFree(P, 'oil') > 0) fresh.push(new Exec({ key: 'oil:' + a.id, kind: 'fuel', prio: 90, why: '给机关傀儡加油', cat: '生存' }, [{ op: 'dropRef', ref: 'oil', n: 1, target: a.id }]));
      else need(P, 'oil', 1, 50, '机关傀儡需要灯油', '生存');
    }
    // lit space is precious: piles and huts don't need light, work does
    if ((g.rules.dark || g.rules.shades) && W.nightLights.length && W.litSpots() < 3) {
      for (const st of W.stacks) {
        if (st.mob || st.battle || st.held || st.task) continue;
        const root = g.s.cards[st.cards[0]];
        const d = CARDS[root.d];
        if (d.fixed || this.locked.has(root.id) || st.cards.some((id) => this.locked.has(id))) continue;
        const idleThing = ['resource', 'food', 'knowledge', 'coin', 'tool', 'gear', 'misc', 'region'].includes(d.kind) || (d.kind === 'structure' && d.tags.includes('house'));
        if (!idleThing || st.cards.some((id) => CARDS[g.s.cards[id].d].tags.includes('person'))) continue;
        const cx = st.x + CARD_W / 2, cy = st.y + CARD_H / 2;
        const L = W.nightLights.find((l) => Math.hypot(l.x - cx, l.y - cy) < l.r - 20);
        if (!L) continue;
        // just outside the ring of light, away from the centre
        const a = Math.atan2(cy - L.y, cx - L.x) || 0;
        const spot = g.freeSpot(L.x + Math.cos(a) * (L.r + 90) - CARD_W / 2, L.y + Math.sin(a) * (L.r + 90) - CARD_H / 2, g.stackH(st), { exclude: st.id });
        if (W.nightLit(spot.x + CARD_W / 2, spot.y + CARD_H / 2)) continue;
        fresh.push(new Exec({ key: 'clear-light:' + root.id, kind: 'tidy', prio: 72, why: `把${d.name}挪出火光，给干活的人腾地方`, cat: '整理' },
          [{ op: 'move', id: root.id, x: spot.x, y: spot.y }], { lock: [root.id] }));
        break;
      }
    }
    // keep important structures and nodes inside the light (nights stop work in the dark)
    if ((g.rules.shades || W.phase < 0.6) && W.nightLights.length) {
      for (const st of W.stacks) {
        if (st.mob || st.battle || st.held || st.task) continue;
        const root = g.s.cards[st.cards[0]];
        const d = CARDS[root.d];
        if (d.fixed || this.locked.has(root.id)) continue;
        if (!(d.kind === 'node' || (d.kind === 'structure' && !d.light && !d.guard))) continue;
        if (d.node && d.node.charges > 0 && root.ch <= 0 && !d.node.perennial) continue;
        const cx = st.x + CARD_W / 2, cy = st.y + CARD_H / 2;
        if (W.nightLit(cx, cy, 10)) continue;
        if (Math.hypot(cx - W.anchor.x, cy - W.anchor.y) > 1500) continue;
        const spot = workSpot(this, g, W, g.stackH(st) + 20, st.id);
        if (!W.nightLights.some((L) => Math.hypot(L.x - spot.x - CARD_W / 2, L.y - spot.y - CARD_H / 2) < L.r - 25)) break;
        fresh.push(new Exec({ key: 'bring-in:' + root.id, kind: 'tidy', prio: 26, why: `把${d.name}搬进火光范围`, cat: '整理' },
          [{ op: 'move', id: root.id, x: spot.x, y: spot.y }], { lock: [root.id] }));
        break;
      }
    }
  }

  decideEvents(W, P, fresh) {
    const g = this.g;
    for (const ev of W.events) {
      const e = EVENTS[ev.ev];
      if (!e) continue;
      let best = -1, bv = -Infinity;
      e.choices.forEach((ch, i) => {
        if (!canPay(g, ch.give)) return;
        let v = 0;
        for (const [id, n] of ch.get) v += this.valueOf(W, id) * n;
        for (const [id, n] of ch.give) v -= (id === '#food' ? (W.food - n < W.dailyNeed ? 6 : 1.2) : this.valueOf(W, id)) * n;
        if (ch.fog) v -= ch.fog * (g.rules.fogRate || g.rules.shades ? 3 : 1);
        if (ch.effect === 'raid') v -= 30 * (1.2 - this.strat.caution) + 20;
        if (v > bv) { bv = v; best = i; }
      });
      if (best >= 0) {
        fresh.push(new Exec({ key: 'choose:' + ev.id, kind: 'choose', prio: 95, why: `【${e.name}】选择「${e.choices[best].label}」`, cat: '经济' }, [{ op: 'choose', id: ev.id, idx: best }], { lock: [ev.id] }));
      }
    }
  }

  valueOf(W, id) {
    const fed = W.food >= W.dailyNeed * 1.5 && (this.prodAvg === undefined || this.prodAvg >= W.appetite + 2);
    if (id === 'survivor') return W.pop < (this.P?.popTarget || 0) ? 30 : fed ? 14 : 3;
    if (id === 'child') return fed ? 6 : 1;
    if (id === 'child') return 8;
    if (id === 'scout') return 18;
    if (id === 'insight') return 8;
    if (id === 'coin') return 2;
    const d = CARDS[id];
    if (!d) return 1;
    return Math.max(1, (d.value || 1) * 2 + (d.food || 0));
  }

  // ----------------------------------------------------------------------------------- assignment
  assign(W, P) {
    const g = this.g;
    const jobs = [...P.jobs.values()].sort((a, b) => b.prio - a.prio);
    const idle = W.idle.filter((w) => !this.locked.has(w.id));
    const taken = new Set();
    // value of what each busy worker is doing now (for preemption)
    const busyVal = new Map();
    for (const b of W.busy) {
      const r = RECIPES[b.r];
      let key = null;
      if (r.kind === 'harvest') key = 'h:' + b.st.cards[0];
      else if (r.kind === 'explore') key = 'e:' + b.st.cards[0];
      else key = 'c:' + r.id;
      const j = P.jobs.get(key);
      let v = j ? j.prio : 6;
      // a task whose output is already counted on by some need keeps that need's priority
      for (const [id] of r.out) v = Math.max(v, (P.incPrio.get(id) || 0) - 4);
      if (r.kind === 'harvest' && CARDS[b.st.cards[0]] === undefined) void 0;
      if (r.kind === 'harvest' && RECIPES[r.id].out.some(([id]) => CARDS[id].food > 0)) v = Math.max(v, P.foodPrio || 0);
      busyVal.set(b.w.id, { v, b });
    }
    let started = 0;
    const reserved = new Map(P.execClaims || []);
    for (const job of jobs) {
      if (started >= 4) break;
      if ((this.fail.get(job.key) || 0) > g.s.t) continue;
      if (this.execs.some((e) => e.job.key === job.key && e.state === 'run')) continue;
      const plan = this.buildExec(W, P, job, idle, taken, reserved, busyVal);
      if (!plan) continue;
      if (this.start(plan)) started++;
    }
  }

  pickWorker(W, job, idle, taken, busyVal, skill, opts = {}) {
    const g = this.g;
    let best = null, bs = -Infinity;
    const site = job.site ? g.cardPos(g.s.cards[job.site] || { s: 0 }) : W.anchor;
    for (const w of idle) {
      if (taken.has(w.id) || this.locked.has(w.id)) continue;
      if (opts.adult && !CARDS[w.d].tags.includes('adult')) continue;
      const d = CARDS[w.d];
      let s = ((d.skills && d.skills[skill]) || 1) * 3;
      const p = g.cardPos(w);
      s -= Math.hypot(p.x - site.x, p.y - site.y) / 600;
      if (d.tags.includes('soldier') && job.cat !== '战斗') s -= 0.4;
      if (opts.light && g.cardLight(w) > 0) s += 4;
      if (w.st && w.st.hungry) s -= 0.5;
      if (s > bs) { bs = s; best = w; }
    }
    if (best) return best;
    // preempt someone doing something much less important
    let pre = null, pv = Infinity;
    for (const [id, { v, b }] of busyVal) {
      if (taken.has(id) || this.locked.has(id)) continue;
      if (opts.adult && !CARDS[b.w.d].tags.includes('adult')) continue;
      if (v + 22 > job.prio) continue;
      if (b.st.task && b.st.task.p > 0.75) continue;
      if (b.st.task && RECIPES[b.st.task.r].t >= 20 && b.st.task.p > 0.25 && job.prio < 128) continue;
      if (v < pv) { pv = v; pre = b.w; }
    }
    return pre;
  }

  buildExec(W, P, job, idle, taken, reserved, busyVal) {
    const g = this.g;
    if (this.curfew && (job.kind === 'harvest' || job.kind === 'explore' || job.kind === 'hunt' || job.kind === 'craft')) {
      // before a freezing dawn nobody leaves the warmth
      const site = job.site ? g.s.cards[job.site] : null;
      if (job.kind === 'explore' || job.kind === 'hunt') return null;
      if (site) {
        const p = g.cardPos(site);
        if (!g.lights.some((L) => L.warm && Math.hypot(L.x - p.x, L.y - p.y) < L.r - 20)) return null;
      }
    }
    const take = (w) => { taken.add(w.id); busyVal.delete(w.id); };
    const freeCount = (ref) => W.free(ref).filter((c) => !this.locked.has(c.id)).length - (reserved.get(ref) || 0);
    const reserve = (ref, n) => reserved.set(ref, (reserved.get(ref) || 0) + n);
    switch (job.kind) {
      case 'harvest': {
        const node = g.s.cards[job.site];
        if (!node) return null;
        const st = g.s.stacks[node.s];
        if (!st || st.battle || st.held) return null;
        const nd = CARDS[node.d].node;
        if (nd.charges > 0 && node.ch <= 0) return null;
        if (seasonMult(g, nd) <= 0) return null;
        const r = RECIPES[job.r];
        const cur = st.task && st.task.r === job.r ? st.task.m.workers.length + st.task.m.extra.length : 0;
        if (st.task && st.task.r !== job.r) return null;
        if (!st.task && st.cards.length > 1) {
          // something else lies on the node: clear it first
          const extra = st.cards.slice(1).map((id) => g.s.cards[id]);
          if (extra.some((c) => CARDS[c.d].tags.includes('person'))) return null;
        }
        const maxW = 1 + (nd.multi ?? r.multi ?? 1);
        const want = Math.min(job.want || 1, maxW) - cur;
        if (want <= 0) return null;
        const night = W.night || W.phase > 0.62;
        const lit = W.nightLit(st.x + CARD_W / 2, st.y + CARD_H / 2);
        const steps = [];
        if (!st.task) steps.push({ op: 'clearSite', keep: [] });
        const np = { x: st.x + CARD_W / 2, y: st.y + CARD_H / 2 };
        const nearBoss = W.threats.some((t) => t.d.mob?.beh === 'boss' && !(t.c.ai && t.c.ai.act) && Math.hypot(t.p.x - np.x, t.p.y - np.y) < 420);
        if (nearBoss) {
          if (CARDS[node.d].fixed || st.task) return null;
          steps.push({ op: 'relocate', force: true });
        } else if (night && !lit && !r.dark && !CARDS[node.d].fixed) steps.push({ op: 'relocate' });
        const w0 = this.pickWorker(W, job, idle, taken, busyVal, r.skill, { light: night && !lit });
        if (!w0) return null;
        take(w0);
        const lock = [node.id, w0.id];
        // tool
        if (r.aids.length && !st.cards.some((id) => r.aids.some((a) => CARDS[g.s.cards[id].d].tags.includes(a)))) {
          const tool = W.free('#' + r.aids[0]).find((c) => !this.locked.has(c.id) && !taken.has(c.id));
          if (tool) { steps.push({ op: 'bringCard', id: tool.id, optional: true }); lock.push(tool.id); taken.add(tool.id); }
          else if (nd.needTool && !(CARDS[w0.d].skills?.[nd.skill] >= 1.5)) return null;
        }
        // light for fixed nodes at night
        if (night && !lit && !r.dark && CARDS[node.d].fixed && g.cardLight(w0) <= 0) {
          const torch = W.free('#portable_light').find((c) => !this.locked.has(c.id) && !taken.has(c.id));
          if (torch) { steps.push({ op: 'bringCard', id: torch.id, optional: true }); lock.push(torch.id); taken.add(torch.id); }
          else if (g.rules.shades) return null;
        }
        steps.push({ op: 'bringCard', id: w0.id });
        const ws = [w0];
        for (let i = 1; i < want; i++) {
          const w = this.pickWorker(W, job, idle, taken, new Map(), r.skill);
          if (!w) break;
          take(w);
          ws.push(w);
          lock.push(w.id);
          steps.push({ op: 'bringCard', id: w.id, optional: true });
        }
        const ex = new Exec(job, steps, { site: node.id, lock, verify: job.r });
        ex.desc = `${ws.map((w) => w.name).join('、')}去${r.name}`;
        return ex;
      }
      case 'craft': {
        const r = RECIPES[job.r];
        if (!r || (r.tech && !g.hasTech(r.tech))) return null;
        const L = recipeLayout(r);
        // inputs available?
        const personInputs = [];
        for (const [ref, n] of L.inputs) {
          if (ref[0] !== '#' && CARDS[ref].kind === 'folk') { personInputs.push([ref, n]); continue; }
          if (ref === '#fuel' || ref === '#smeltfuel') {
            const opts = W.free(ref).filter((c) => !this.locked.has(c.id));
            if (opts.length < n) return null;
            continue;
          }
          if (freeCount(ref) < n) return null;
        }
        for (const [ref, n] of L.extraKeep) if (freeCount(ref) < n) return null;
        // site
        let siteCard = null;
        if (job.siteCard) siteCard = g.s.cards[job.siteCard];
        else if (L.siteRef) {
          const cands = W.cards.filter((c) => (L.siteRef[0] === '#' ? CARDS[c.d].tags.includes(L.siteRef.slice(1)) : c.d === L.siteRef) && !this.locked.has(c.id));
          for (const c of cands) {
            const st = g.s.stacks[c.s];
            if (!st || st.battle || st.held || st.cards[0] !== c.id) continue;
            if (st.task) {
              if (st.task.r === r.id) return null; // already running
              continue;
            }
            if (st.cards.slice(1).some((id) => CARDS[g.s.cards[id].d].tags.includes('person'))) continue;
            siteCard = c;
            break;
          }
          if (!siteCard) return null;
        }
        // people consumed by the recipe (training)
        const trainees = [];
        for (const [ref, n] of personInputs) {
          let cands = W.free(ref).filter((c) => !this.locked.has(c.id) && !taken.has(c.id));
          if (cands.length < n) {
            // pull someone off less important work
            const busy = W.people.filter((p) => p.d === ref && !this.locked.has(p.id) && !taken.has(p.id) && !cands.includes(p))
              .filter((p) => { const b = busyVal.get(p.id); const st = g.s.stacks[p.s]; return st && !st.battle && (!b || b.v + 15 < job.prio); });
            cands = cands.concat(busy);
          }
          if (cands.length < n) return null;
          for (let i = 0; i < n; i++) { trainees.push(cands[i]); taken.add(cands[i].id); busyVal.delete(cands[i].id); }
        }
        // workers (and adults for births)
        const ws = [];
        const adults = r.keep['#adult'] || 0;
        for (let i = 0; i < adults; i++) {
          const w = this.pickWorker(W, job, idle, taken, busyVal, 'none', { adult: true });
          if (!w) { for (const t of [...trainees, ...ws]) taken.delete(t.id); return null; }
          take(w);
          ws.push(w);
        }
        for (let i = 0; i < r.w; i++) {
          const w = this.pickWorker(W, job, idle, taken, busyVal, r.skill);
          if (!w) { for (const t of [...trainees, ...ws]) taken.delete(t.id); return null; }
          take(w);
          ws.push(w);
        }
        // urgent research gets a second pair of hands
        if (r.skill === 'research' && r.multi > 0 && job.prio >= 45) {
          const w = this.pickWorker(W, job, idle, taken, new Map(), r.skill);
          if (w) { take(w); ws.push(w); }
        }
        const steps = [];
        const lock = [...trainees.map((c) => c.id), ...ws.map((c) => c.id)];
        let total = 0;
        for (const [, n] of L.inputs) total += n;
        if (siteCard) {
          lock.push(siteCard.id);
          steps.push({ op: 'clearSite', keep: [] });
          const sst = g.s.stacks[siteCard.s];
          if ((W.night || W.phase > 0.62) && !r.dark && !W.nightLit(sst.x + CARD_W / 2, sst.y + CARD_H / 2)) steps.push({ op: 'relocate' });
          for (const [ref, n] of L.extraKeep) steps.push({ op: 'bring', ref, n });
          for (const [ref, n] of L.inputs) {
            if (personInputs.some(([p]) => p === ref)) continue;
            const k = siteCard.d === ref ? n - 1 : n;
            if (k > 0) steps.push({ op: 'bring', ref: ref, n: k });
          }
        } else {
          const items = L.inputs.filter(([ref]) => !personInputs.some(([p]) => p === ref));
          if (items.length) {
            const [first, n0] = items[0];
            steps.push({ op: 'makeSite', ref: first, n: n0, total });
            for (const [ref, n] of items.slice(1)) steps.push({ op: 'bring', ref, n });
          } else if (trainees.length) {
            // only people: lay the first one down as the site
            const spot = workSpot(this, g, W);
            steps.push({ op: 'move', id: trainees[0].id, x: spot.x, y: spot.y });
          }
          for (const [ref, n] of L.extraKeep) steps.push({ op: 'bring', ref, n });
        }
        for (const t of trainees) steps.push({ op: 'bringCard', id: t.id });
        for (const w of ws) steps.push({ op: 'bringCard', id: w.id });
        for (const [ref, n] of L.inputs) reserve(ref, n);
        const ex = new Exec(job, steps, { site: siteCard ? siteCard.id : trainees.length && !L.inputs.some(([ref]) => !personInputs.some(([p]) => p === ref)) ? trainees[0].id : null, lock, verify: r.id });
        if (r.id === 'birth') ex.desc = `${ws.map((w) => w.name).join('与')}在${nm(siteCard.d)}里生儿育女`;
        else ex.desc = ws.length ? `${ws.map((w) => w.name).join('、')}${r.name}` : r.name;
        return ex;
      }
      case 'explore': {
        const region = g.s.cards[job.site];
        if (!region) return null;
        const st = g.s.stacks[region.s];
        if (!st || st.battle) return null;
        const rd = CARDS[region.d].region;
        const cur = st.task ? st.task.m.workers.length + st.task.m.extra.length : 0;
        if (st.task && st.task.r !== job.r) return null;
        const want = Math.min(job.want || 1, 3) - cur;
        if (want <= 0) return null;
        const steps = [];
        const lock = [region.id];
        const needLight = rd.need === 'light' || rd.needLight || (g.rules.dark);
        const hasLight = st.cards.some((id) => g.cardLight(g.s.cards[id]) > 0);
        const w0 = this.pickWorker(W, job, idle, taken, busyVal, rd.need === 'boat' ? 'sail' : 'explore', { light: needLight });
        if (!w0) return null;
        if (!st.task) steps.push({ op: 'clearSite', keep: [] });
        if (needLight && !hasLight && g.cardLight(w0) <= 0) {
          const torch = W.free('#portable_light').find((c) => !this.locked.has(c.id) && !taken.has(c.id));
          if (!torch) return null;
          steps.push({ op: 'bringCard', id: torch.id });
          lock.push(torch.id);
          taken.add(torch.id);
        }
        if (rd.need === 'boat' && !st.cards.some((id) => CARDS[g.s.cards[id].d].tags.includes('boat'))) {
          const boat = W.free('#boat').find((c) => !this.locked.has(c.id) && !taken.has(c.id));
          if (!boat) return null;
          steps.push({ op: 'bringCard', id: boat.id });
          lock.push(boat.id);
          taken.add(boat.id);
        }
        const aid = W.free('#explore_aid').find((c) => !this.locked.has(c.id) && !taken.has(c.id));
        if (aid && !st.task) { steps.push({ op: 'bringCard', id: aid.id, optional: true }); lock.push(aid.id); taken.add(aid.id); }
        take(w0);
        lock.push(w0.id);
        steps.push({ op: 'bringCard', id: w0.id });
        const ws = [w0];
        // the region's known dangers: bring enough company to survive an ambush
        const foes = region.foes || rd.foes || [];
        const danger = region.danger ?? rd.danger;
        let foePow = 0;
        for (const [f] of foes) foePow = Math.max(foePow, defsPower([[f, 1]]));
        const teamPow = () => groupPower(g, ws, [...new Set(foes.flatMap(([f]) => CARDS[f].traits || []))]).power;
        const safe = () => danger < 0.05 || teamPow() >= foePow * (1.2 + this.strat.caution) * (job.prio >= 60 ? 0.75 : 1);
        for (let i = 1; i < 3 && (i < want || !safe()); i++) {
          const w = this.pickWorker(W, { ...job, cat: '战斗' }, idle, taken, new Map(), 'explore');
          if (!w) break;
          take(w);
          lock.push(w.id);
          ws.push(w);
          steps.push({ op: 'bringCard', id: w.id, optional: true });
        }
        if (!safe() && (danger * foePow > 8 || (danger >= 0.05 && teamPow() < foePow * 1.1 && job.prio < 100))) {
          for (const w of ws) { taken.delete(w.id); }
          return null;
        }
        const ex = new Exec(job, steps, { site: region.id, lock, verify: job.r });
        ex.desc = `${ws.map((w) => w.name).join('、')}出发探索${nm(region.d)}`;
        return ex;
      }
      case 'hunt': {
        const beast = g.s.cards[job.target];
        if (!beast) return null;
        const bst = g.s.stacks[beast.s];
        if (!bst || bst.battle) return null;
        const d = CARDS[beast.d];
        const team = [];
        let pw = 0;
        const foe = enemyPower(g, [beast]).power;
        const margin = (d.atk || 0) >= 2 ? 2.4 + this.strat.caution : 1.6;
        for (const f of availableFighters(this, W, d.traits || [])) {
          if (taken.has(f.p.id)) continue;
          const st = g.s.stacks[f.p.s];
          if (st.task && (busyVal.get(f.p.id)?.v || 0) + 10 > job.prio) continue;
          team.push(f.p);
          pw = groupPower(g, team, d.traits || [], d.def || 0).power;
          if (pw > foe * (margin + 0.4)) break;
        }
        if (!team.length || pw < foe * margin) return null;
        for (const p of team) take(p);
        const ex = new Exec(job, team.map((p) => ({ op: 'drop', id: p.id, target: beast.id, optional: true })), { lock: team.map((p) => p.id) });
        ex.desc = `${team.map((p) => p.name).join('、')}去捕猎${d.name}`;
        return ex;
      }
      case 'deliver': {
        if (!job.target || !g.s.cards[job.target]) return null;
        if (freeCount(job.item) <= 0) return null;
        const n = Math.min(job.n || 1, freeCount(job.item));
        reserve(job.item, n);
        return new Exec(job, [{ op: 'dropRef', ref: job.item, n, target: job.target }], { lock: [job.target] });
      }
      case 'trade': {
        return new Exec(job, [{ op: 'trade', id: job.caravan, idx: job.idx }]);
      }
      default:
        return null;
    }
  }

  // ----------------------------------------------------------------------------------- curiosity
  /** recipes read about in scrolls: try them for real once the ingredients are at hand */
  hintJobs(W, P) {
    const g = this.g;
    const boost = P.experimentBoost || 0;
    const objUnmet = P.unmet.some((u) => u.prio >= 55 && CARDS[u.item] && !PRODUCERS_KNOWN(g, this.mem, u.item));
    if (objUnmet || boost > 30) {
      // things to bind, wrap and mount with — most hidden crafts need one of them
      for (const id of ['rope', 'fiber', 'wood', 'leather']) if (!W.freeN(id) && itemCost(W, id, P.memo) < 60) { need(P, id, 1, 34, '备些材料做实验', '实验'); break; }
    }
    for (const rid of Object.keys(g.s.hints)) {
      if (g.s.disc.includes(rid)) continue;
      const r = RECIPES[rid];
      if (r.tech && !g.hasTech(r.tech)) continue;
      addJob(P, { key: 'c:' + rid, kind: 'craft', r: rid, item: r.out[0]?.[0], n: 1, prio: 24 + boost + this.strat.curiosity * 20, why: `按残卷的线索尝试「${r.name}」`, cat: '实验' });
    }
  }

  /** in cold lands, everyone must sleep by a fire (or wear fur) when dawn comes */
  coldPrep(W, P, fresh) {
    const g = this.g;
    const winter = g.rules.seasons && W.season === 3;
    const cold = g.rules.cold === 'always' || (g.rules.cold && (winter || (g.rules.seasons && W.daysToWinter <= 1)));
    if (!cold) return;
    const unwarm = W.people.filter((p) => !CARDS[p.d].tags.includes('construct') && !g.isWarm(p));
    if (unwarm.length) {
      goal(P, '御寒', 70 + unwarm.length * 4, '生存', `${W.people.length - unwarm.length}/${W.people.length} 人暖和`);
      if (g.techAllowed('husbandry')) need(P, 'fur_cloak', Math.min(2, unwarm.length), 58, '缝毛皮斗篷御寒', '生存');
      if (g.techAllowed('masonry') && !W.count('hearth') && W.mainFire && W.mainFire.d === 'campfire') produce(P, 'hearth', 1, 52, '把篝火砌成火塘（暖和又省柴）', '生存');
    }
    if (W.phase < 0.8) return;
    this.curfew = true;
    // nightfall before a freezing dawn: bring everyone into the warmth of a fire
    const warmLights = g.lights.filter((L) => L.warm);
    if (!warmLights.length) return;
    let n = 0;
    for (const p of unwarm) {
      if (n >= 3) break;
      const st = g.s.stacks[p.s];
      if (!st || st.battle || this.locked.has(p.id)) continue;
      // huddle with someone already warm (or at the fire itself if nothing is cooking there)
      const host = W.people.find((q) => q !== p && g.isWarm(q) && !this.locked.has(q.id) && (() => {
        const qs = g.s.stacks[q.s];
        return qs && !qs.battle && qs.cards.length < 5 && qs.cards[qs.cards.length - 1] === q.id && qs.cards.every((id) => CARDS[g.s.cards[id].d].tags.includes('person') || CARDS[g.s.cards[id].d].tags.includes('fire') || CARDS[g.s.cards[id].d].tags.includes('house'));
      })());
      if (host && st.cards[st.cards.length - 1] === p.id) {
        fresh.push(new Exec({ key: 'warm:' + p.id, kind: 'shelter', prio: 160, why: `${p.name}会在黎明冻伤，去和${host.name}挤在火边过夜`, cat: '生存' },
          [{ op: 'drop', id: p.id, target: host.id }], { lock: [p.id, host.id] }));
        n++;
        continue;
      }
      const root = g.s.cards[st.cards[0]];
      const movable = !CARDS[root.d].fixed && st.cards.every((id) => !this.locked.has(id));
      const L = warmLights.sort((a, b) => Math.hypot(a.x - st.x, a.y - st.y) - Math.hypot(b.x - st.x, b.y - st.y))[0];
      const a = (p.id * 2.399 + W.day) % (Math.PI * 2);
      const spot = g.freeSpot(L.x + Math.cos(a) * L.r * 0.55 - CARD_W / 2, L.y + Math.sin(a) * L.r * 0.55 - CARD_H / 2, g.stackH(st), { exclude: st.id });
      if (Math.hypot(spot.x + CARD_W / 2 - L.x, spot.y + CARD_H / 2 - L.y) > L.r - 10) continue;
      const id = movable ? root.id : p.id;
      fresh.push(new Exec({ key: 'warm:' + p.id, kind: 'shelter', prio: 160, why: `${p.name}会在黎明冻伤，${movable && root.id !== p.id ? '把活计搬到' : '回到'}火边过夜`, cat: '生存' },
        [{ op: 'move', id, x: spot.x, y: spot.y }], { lock: [id] }));
      n++;
    }
  }

  /** stacks that stopped because it got dark: carry them into the light (or bring a torch) */
  darkFix(W, fresh) {
    const g = this.g;
    if (!W.night && W.phase < 0.66) return;
    for (const st of W.taskStacks) {
      if (st.task.block !== '太暗了' && !(W.phase > 0.66 && !W.nightLit(st.x + CARD_W / 2, st.y + CARD_H / 2) && !RECIPES[st.task.r].dark)) continue;
      const root = g.s.cards[st.cards[0]];
      if (this.locked.has(root.id)) continue;
      const d = CARDS[root.d];
      if (!d.fixed) {
        const spot = workSpot(this, g, W, g.stackH(st) + 20, st.id);

    case 'pick': P.at(hx, hy, 1, -0.3, () => { P.rect(-1, -16, 2.2, 22, 1).fill('#8a5a32').ink(0.8); P.path((c) => { c.moveTo(-9, -12); c.quadraticCurveTo(0, -20, 9, -12); c.quadraticCurveTo(0, -16, -9, -12); }).fill('#8f99a3').ink(0.9); }); break;
    case 'spear': P.at(hx, hy, 1, 0.12, () => { P.rect(-1, -36, 2, 46, 1).fill('#8a5a32').ink(0.8); P.poly([0, -44, 3, -35, 0, -33, -3, -35]).lfill('#b9c2c9', -3, -44, 3, -33).ink(0.8); }); break;
    case 'bow': P.at(hx + 2, hy, 1, 0, () => { P.path((c) => { c.moveTo(0, -20); c.quadraticCurveTo(10, 0, 0, 20); }).ink(2.2, '#7a4a22'); P.line(0, -20, 0, 20, 0.6, '#e8dcc0'); }); break;
    case 'sword': P.at(hx, hy, 1, -0.2, () => { P.poly([-1.4, -26, 0, -30, 1.4, -26, 1.2, -4, -1.2, -4]).lfill('#c8d0d6', -2, -30, 2, -4).ink(0.8); P.rect(-5, -4, 10, 2, 0.8).fill('#b98f3a').ink(0.7); P.rect(-1, -2, 2, 6).fill('#5a3a22'); }); break;
    case 'mace': P.at(hx, hy, 1, -0.25, () => { P.rect(-1, -16, 2.2, 22, 1).fill('#6a4a2a').ink(0.8); P.circle(0, -19, 5).lfill('#8a929a', -5, -24, 5, -14).ink(0.9); for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; P.line(Math.cos(a) * 5, -19 + Math.sin(a) * 5, Math.cos(a) * 7, -19 + Math.sin(a) * 7, 1.2); } }); break;
    case 'shield': P.at(-16, -20, 1, 0, () => { P.path((c) => { c.moveTo(-8, -10); c.lineTo(8, -10); c.lineTo(7, 4); c.quadraticCurveTo(0, 12, -7, 4); c.closePath(); }).lfill('#8a5a32', -8, -10, 8, 10).ink(1.1); P.circle(0, -1, 2.4).fill('#c9a45a').ink(0.6); }); break;
    case 'lantern': P.at(hx, hy + 6, 1, 0, () => { P.line(0, -12, 0, -6, 0.9); P.halo(0, 0, 16, 'rgba(255,190,90,1)', 0.6); P.rect(-4, -6, 8, 11, 1.5).fill('rgba(255,210,120,0.95)').ink(1); P.rect(-5, -7, 10, 2, 0.8).fill('#5a3a1a'); P.rect(-5, 4, 10, 2, 0.8).fill('#5a3a1a'); }); break;
    case 'torch': P.at(hx, hy, 1, 0.15, () => { P.rect(-1.2, -14, 2.4, 20, 1).fill('#6a4222').ink(0.8); flame(P, 0, -14, 0.8); }); break;
    case 'book': P.at(hx - 2, hy + 2, 1, 0.1, () => { P.rect(-6, -5, 12, 9, 1).lfill('#7a2e2a', -6, -5, 6, 4).ink(0.9); P.line(-4, -3, 4, -3, 0.5, '#e8d8a8'); }); break;
    case 'herbs': P.at(hx, hy + 3, 1, 0, () => { P.ellipse(0, 0, 5, 6).lfill('#7a6a3a', -5, -6, 5, 6).ink(0.9); P.path((c) => { c.moveTo(-2, -5); c.quadraticCurveTo(-6, -12, -1, -11); c.moveTo(1, -5); c.quadraticCurveTo(5, -13, 3, -9); }).ink(1.4, '#4f8a3a'); }); break;
    case 'map': P.at(hx - 2, hy + 1, 1, -0.1, () => { P.rect(-7, -6, 14, 10, 1).fill('#e2d2a6').ink(0.9); P.curve(-5, -3, 0, 2, 5, -2, 0.6, '#a33'); P.line(-7, -6, -7, 4, 1.2, '#8a6a3a'); }); break;
    case 'scale': P.at(hx, hy, 1, 0, () => { P.line(0, -14, 0, 4, 1.2); P.line(-8, -12, 8, -12, 1.2); P.path((c) => c.arc(-8, -8, 4, 0, Math.PI)).fill('#c9a45a').ink(0.8); P.path((c) => c.arc(8, -8, 4, 0, Math.PI)).fill('#c9a45a').ink(0.8); }); break;
    case 'compass': P.at(hx, hy, 1, 0, () => { P.circle(0, 0, 5).fill('#c9a45a').ink(0.9); P.circle(0, 0, 3.6).fill('#f0e6c8'); P.poly([0, -3, 1, 0, 0, 3, -1, 0]).fill('#a33'); }); break;
    case 'musket': P.at(hx, hy, 1, -0.6, () => { P.rect(-1.4, -30, 2.8, 30, 1).fill('#4a4f55').ink(0.8); P.rect(-2.2, -4, 4.4, 12, 1.5).fill('#6a4222').ink(0.8); }); break;
    case 'staff': P.at(hx, hy, 1, 0.05, () => { P.rect(-1.2, -34, 2.4, 44, 1).fill('#6a4a2a').ink(0.8); P.halo(0, -36, 10, 'rgba(255,230,160,1)', 0.7); P.circle(0, -36, 3).fill('#fff2c0'); }); break;
    case 'flame': P.at(hx + 2, hy - 8, 1.1, 0, () => { P.halo(0, 0, 16, 'rgba(255,170,70,1)', 0.7); flame(P, 0, 4, 1.2); }); break;
    case 'hoe': P.at(hx, hy, 1, -0.2, () => { P.rect(-1, -18, 2.2, 26, 1).fill('#8a5a32').ink(0.8); P.poly([1, -18, 8, -16, 8, -12, 1, -14]).fill('#8f99a3').ink(0.8); }); break;
    case 'wrench': P.at(hx, hy, 1, -0.4, () => { P.rect(-1.2, -14, 2.4, 18, 1).fill('#8a929a').ink(0.8); P.circle(0, -16, 4).fill('#8a929a').ink(0.8); P.circle(0, -17, 1.6).fill('#3a2a1a'); }); break;
    case 'rod': P.at(hx, hy, 1, 0.5, () => { P.line(0, 6, 0, -30, 1.4, '#8a5a32'); P.curve(0, -30, 10, -20, 8, 4, 0.5, '#e8e0d0'); }); break;
    default: break;
  }
}

function flame(P, x, y, s = 1, hot = false) {
  P.at(x, y, s, 0, () => {
    P.halo(0, -6, 14, 'rgba(255,150,50,1)', 0.45);
    P.path((c) => { c.moveTo(-6, 0); c.quadraticCurveTo(-8, -9, -2, -15); c.quadraticCurveTo(-1, -9, 1, -8); c.quadraticCurveTo(1, -16, 4, -19); c.quadraticCurveTo(9, -9, 6, 0); c.closePath(); })
      .vfill(hot ? '#fff6d0' : '#ffd36a', '#e8541c', -19, 0).ink(0.8, 'rgba(120,40,10,0.8)');
    P.path((c) => { c.moveTo(-3, 0); c.quadraticCurveTo(-3, -6, 0, -10); c.quadraticCurveTo(3, -6, 3, 0); c.closePath(); }).fill('rgba(255,250,215,0.85)');
  });
}

// ---------------------------------------------------------------- beasts --------------------------
/** quadruped side view facing left, feet at y.
 * o: { body, len, h, head, neck, headUp, legs, tail, horns, ears, snout, mane, tusks, fangs, eye, eyeGlow, slim } */
function quadruped(P, x, y, s, o) {
  const body = o.body || '#8a6a4a';
  const dark = darken(body, 0.32);
  P.at(x, y, s, 0, () => {
    const L = o.len || 30, H = o.h || 14, legH = o.legs || 12, r = o.head || 6;
    P.shadow(0, 0, L * 0.75, 4, 0.4);
    const by = -legH - H / 2;
    const top = by - H / 2, bot = by + H / 2;
    const fx = -L / 2, bx = L / 2;
    const canine = !!o.fangs;
    const legW = Math.max(3.4, Math.min(8, H * 0.3)) * (o.slim || legH > H * 1.1 ? 0.78 : 1);
    const leg = (lx, hind, col, w) => {
      const t = legW / 2, kneeY = bot + (0 - bot) * 0.5, sh = hind ? 2 : -0.5;
      P.path((c) => {
        c.moveTo(lx - t * 1.4, bot - H * 0.4);
        c.quadraticCurveTo(lx - t * 1.5, kneeY - 3, lx - t * 0.75 + sh, kneeY);
        c.lineTo(lx - t * 0.6, -2.2);
        c.lineTo(lx - t * 1.1, 0);
        c.lineTo(lx + t * 0.85, 0);
        c.lineTo(lx + t * 0.6, -2.2);
        c.lineTo(lx + t * 0.75 + sh, kneeY);
        c.quadraticCurveTo(lx + t * (hind ? 1.9 : 1.5), kneeY - 4, lx + t * 1.5, bot - H * 0.4);
        c.closePath();
      }).lfill(col, lx - t * 1.5, bot - H * 0.4, lx + t * 1.5, 0, 0.25).ink(w);
      P.rect(lx - t * 1.1, -2.2, t * 1.95, 2.2, 0.7).fill(darken(col, 0.6));
    };
    // far legs
    leg(bx - L * 0.12, true, dark, 0.9);
    leg(fx + L * 0.24, false, dark, 0.9);
    // tail
    if (o.tail !== undefined) {
      const tx = bx - L * 0.04, ty = top + H * 0.22, tw = canine ? 3.2 : 1.6;
      P.path((c) => {
        c.moveTo(tx, ty - tw * 0.6);
        c.quadraticCurveTo(tx + 10, ty - 4 + o.tail, tx + 9, ty + 12 + o.tail * 0.4);
        c.quadraticCurveTo(tx + 6, ty + 4 + o.tail * 0.5, tx, ty + tw);
        c.closePath();
      }).lfill(canine ? lighten(body, 0.05) : darken(body, 0.15), tx, ty, tx + 10, ty + 12).ink(0.9);
    }
    // body silhouette: chest, withers, back, rump, belly
    const hump = o.mane ? H * 0.22 : H * 0.08;
    const bodyPath = (c) => {
      c.moveTo(fx - 1, by + H * 0.12);
      c.bezierCurveTo(fx - 2.5, top + H * 0.1, fx + L * 0.08, top - hump, fx + L * 0.3, top - hump * 0.6);
      c.bezierCurveTo(fx + L * 0.55, top + H * 0.1, bx - L * 0.22, top - H * 0.06, bx - L * 0.08, top + H * 0.04);
      c.bezierCurveTo(bx + 1.5, top + H * 0.2, bx + 2, by + H * 0.32, bx - L * 0.05, bot - H * 0.02);
      c.bezierCurveTo(bx - L * 0.3, bot + H * (canine ? 0.02 : 0.14), fx + L * 0.38, bot + H * (canine ? -0.02 : 0.16), fx + L * 0.12, bot - H * 0.04);
      c.quadraticCurveTo(fx - 0.5, bot - H * 0.12, fx - 1, by + H * 0.12);
      c.closePath();
    };
    P.path(bodyPath).lfill(body, fx, top, bx, bot, 0.32).ink(1.2);
    P.path(bodyPath).shadeHatch(fx, top, bx, bot + 2, 0.28);
    // shoulder and haunch muscle lines
    P.curve(fx + L * 0.16, top + H * 0.3, fx + L * 0.28, by + H * 0.1, fx + L * 0.2, bot - 1, 0.7, 'rgba(20,10,5,0.4)');
    P.curve(bx - L * 0.26, top + H * 0.25, bx - L * 0.06, by, bx - L * 0.2, bot - 1, 0.7, 'rgba(20,10,5,0.4)');
    // fur tufts along the back
    for (let i = 0; i < 6; i++) {
      const tx = fx + L * (0.25 + i * 0.1), ty = top + 1.2 + Math.sin(i * 1.7) * 0.6;
      P.line(tx, ty, tx + 1.8, ty + 2.4, 0.6, 'rgba(255,240,210,0.35)');
    }
    // near legs
    leg(bx - L * 0.2, true, body, 1);
    leg(fx + L * 0.13, false, body, 1);
    // neck
    const hx = fx - (o.neck ?? 6), hy = top - (o.headUp ?? 4);
    P.path((c) => {
      c.moveTo(fx + L * 0.3, top - hump * 0.5 + 1);
      c.quadraticCurveTo(fx + L * 0.05, top - hump - 2, hx + r * 0.55, hy - r * 0.55);
      c.lineTo(hx + r * 0.35, hy + r * 0.7);
      c.quadraticCurveTo(fx - 2, by - H * 0.05, fx + 1, by + H * 0.3);
      c.closePath();
    }).lfill(body, hx, hy, fx + L * 0.3, by, 0.3).ink(1.1);
    if (o.mane) {
      P.path((c) => {
        c.moveTo(fx + L * 0.34, top - hump * 0.4);
        c.quadraticCurveTo(fx + L * 0.06, top - hump - 5, hx + r * 0.6, hy - r * 0.8);
        c.lineTo(hx + r * 0.9, hy - r * 0.1);
        c.quadraticCurveTo(fx + L * 0.06, top - hump + 1, fx + L * 0.3, top + 2);
        c.closePath();
      }).fill(darken(body, 0.3)).ink(0.8);
      for (let i = 0; i < 5; i++) {
        const t = i / 4, mx = fx + L * 0.3 + (hx + r * 0.6 - fx - L * 0.3) * t, my = top - hump * 0.4 + (hy - r * 0.8 - top + hump * 0.4) * t - 2;
        P.line(mx, my, mx + 1.5, my - 2.6, 1, darken(body, 0.45));
      }
    }
    // head: skull and muzzle
    const mlen = o.snout === false ? 0 : r * (canine ? 1.55 : o.tusks ? 1.35 : 1.25);
    P.ellipse(hx, hy, r, r * 0.8).lfill(body, hx - r, hy - r, hx + r, hy + r, 0.3).ink(1.1);
    if (mlen) {
      P.path((c) => {
        c.moveTo(hx - r * 0.2, hy - r * 0.62);
        c.quadraticCurveTo(hx - r * 0.9, hy - r * 0.55, hx - mlen, hy - r * 0.05);
        c.quadraticCurveTo(hx - mlen - r * 0.18, hy + r * 0.3, hx - mlen + r * 0.1, hy + r * 0.45);
        c.quadraticCurveTo(hx - r * 0.6, hy + r * (canine ? 0.55 : 0.75), hx + r * 0.2, hy + r * 0.6);
        c.closePath();
      }).lfill(lighten(body, 0.08), hx - mlen, hy - r, hx, hy + r, 0.25).ink(1);
      P.ellipse(hx - mlen + r * 0.05, hy + r * 0.02, r * 0.2, r * 0.16).fill('#1a120c');
      if (canine) P.curve(hx - mlen + r * 0.2, hy + r * 0.32, hx - r * 0.5, hy + r * 0.42, hx - r * 0.1, hy + r * 0.3, 0.7, INK);
    }
    // eye
    P.ellipse(hx - r * 0.28, hy - r * 0.2, r * 0.17, r * 0.13).fill(o.eye || INK);
    if (o.eyeGlow) P.halo(hx - r * 0.28, hy - r * 0.2, 4.5, o.eyeGlow, 0.95);
    else P.circle(hx - r * 0.24, hy - r * 0.25, r * 0.05).fill('rgba(255,250,235,0.9)');
    // ears
    if (o.ears) {
      if (canine) P.poly([hx + r * 0.05, hy - r * 0.6, hx + r * 0.25, hy - r * 1.75, hx + r * 0.8, hy - r * 0.45]).lfill(darken(body, 0.1), hx, hy - r * 1.7, hx + r, hy, 0.2).ink(0.9);
      else P.path((c) => { c.moveTo(hx + r * 0.3, hy - r * 0.55); c.quadraticCurveTo(hx + r * 1.3, hy - r * 1.4, hx + r * 1.15, hy - r * 0.3); c.closePath(); }).fill(darken(body, 0.15)).ink(0.9);
    }
    if (o.horns === 'antler') {
      const ant = (c) => { c.moveTo(hx + r * 0.2, hy - r * 0.7); c.lineTo(hx + r * 0.5, hy - r * 2.2); c.lineTo(hx + r * 0.1, hy - r * 3.1); c.moveTo(hx + r * 0.5, hy - r * 2.2); c.lineTo(hx + r * 1.4, hy - r * 2.9); c.moveTo(hx + r * 0.4, hy - r * 1.6); c.lineTo(hx - r * 0.4, hy - r * 2.2); };
      P.path(ant).ink(2.2, INK);
      P.path(ant).ink(1.2, '#e2d2b0');
    }
    if (o.horns === 'curl') {
      P.path((c) => { c.moveTo(hx + r * 0.2, hy - r * 0.6); c.quadraticCurveTo(hx + r * 1.7, hy - r * 1.6, hx + r * 1.1, hy + r * 0.3); }).ink(3.4, INK);
      P.path((c) => { c.moveTo(hx + r * 0.2, hy - r * 0.6); c.quadraticCurveTo(hx + r * 1.7, hy - r * 1.6, hx + r * 1.1, hy + r * 0.3); }).ink(2.2, '#d9c8a0');
    }
    if (o.tusks) {
      const tx0 = hx - Math.max(mlen, r * 0.6) * 0.75;
      const tusk = (c) => { c.moveTo(tx0, hy + r * 0.4); c.quadraticCurveTo(tx0 - r * 1.1, hy + r * 1.4, tx0 - r * 1.5, hy - r * 0.2); };
      P.path(tusk).ink(o.tusks + 1, INK);
      P.path(tusk).ink(o.tusks, '#efe6d0');
    }
    if (o.fangs) P.poly([hx - mlen + r * 0.35, hy + r * 0.38, hx - mlen + r * 0.45, hy + r * 0.75, hx - mlen + r * 0.6, hy + r * 0.4]).fill('#fff').ink(0.4);
  });
}

function bird(P, x, y, s, o = {}) {
  const body = o.body || '#8a6a4a';
  P.at(x, y, s, 0, () => {
    if (!o.fly) P.shadow(0, 0, 12, 3);
    if (o.fly) {
      P.path((c) => { c.moveTo(0, -14); c.quadraticCurveTo(-16, -30, -28, -22); c.quadraticCurveTo(-16, -20, -4, -10); c.closePath(); }).lfill(darken(body, 0.1), -28, -30, 0, -10).ink(1);
      P.path((c) => { c.moveTo(0, -14); c.quadraticCurveTo(16, -30, 28, -22); c.quadraticCurveTo(16, -20, 4, -10); c.closePath(); }).lfill(darken(body, 0.1), 0, -30, 28, -10).ink(1);
    }
    P.ellipse(0, -10, 9, 7).lfill(body, -9, -17, 9, -3).ink(1.1);
    P.circle(-7, -17, 4.4).lfill(lighten(body, 0.05), -11, -21, -3, -13).ink(1);
    P.poly([-11, -17, -15, -15.5, -11, -15]).fill(o.beak || '#d9a03a').ink(0.7);
    P.circle(-8, -18, 0.8).fill(o.eye || INK);
    if (o.eyeGlow) P.halo(-8, -18, 4, o.eyeGlow, 0.9);
    if (!o.fly) {
      P.path((c) => { c.moveTo(3, -12); c.quadraticCurveTo(12, -12, 14, -6); c.quadraticCurveTo(8, -8, 3, -6); c.closePath(); }).fill(darken(body, 0.2)).ink(0.8);
      P.line(-2, -3, -3, 0, 1, '#b07a2a');
      P.line(2, -3, 3, 0, 1, '#b07a2a');
    }
    if (o.crest) P.path((c) => { c.moveTo(-7, -21); c.lineTo(-5, -26); c.lineTo(-4, -21); }).fill(o.crest).ink(0.6);
  });
}

function fish(P, x, y, s, o = {}) {
  const c1 = o.color || '#7aa6b8';
  P.at(x, y, s, o.rot || 0, () => {
    P.path((c) => { c.moveTo(-16, 0); c.quadraticCurveTo(-4, -9, 10, -2); c.lineTo(17, -7); c.lineTo(15, 0); c.lineTo(17, 7); c.lineTo(10, 2); c.quadraticCurveTo(-4, 9, -16, 0); c.closePath(); })
      .lfill(o.cooked ? '#c07a3a' : c1, -16, -9, 16, 9, 0.35).ink(1.1);
    P.circle(-10, -1.4, 1.3).fill(o.cooked ? '#3a1a0a' : '#f4f0e0').ink(0.5);
    P.curve(-6, -5, -3, 0, -6, 5, 0.6, 'rgba(30,15,5,0.5)');
    if (!o.cooked) for (let i = 0; i < 3; i++) P.curve(-1 + i * 3.4, -3, 1 + i * 3.4, 0, -1 + i * 3.4, 3, 0.4, 'rgba(255,255,255,0.4)');
    if (o.cooked) { P.line(-2, -4, 2, 4, 1.4, 'rgba(60,20,5,0.6)'); P.line(4, -3, 7, 3, 1.4, 'rgba(60,20,5,0.6)'); }
  });
}

// ---------------------------------------------------------------- monsters ------------------------
function shade(P, x, y, s, o = {}) {
  const c = o.color || '#3b2b52';
  P.at(x, y, s, 0, () => {
    P.halo(0, -26, 34, o.aura || 'rgba(120,80,170,1)', 0.35);
    P.path((cx) => {
      cx.moveTo(-14, 0);
      cx.quadraticCurveTo(-18, -20, -10, -36);
      cx.quadraticCurveTo(-8, -50, 0, -52);
      cx.quadraticCurveTo(8, -50, 10, -36);
      cx.quadraticCurveTo(18, -20, 14, 0);
      for (let i = 0; i < 5; i++) cx.quadraticCurveTo(10 - i * 6, -6 + (i % 2) * 7, 8 - (i + 1) * 5.6, 0);
      cx.closePath();
    }).vfill(lighten(c, 0.15), 'rgba(20,10,30,0.15)', -52, 0);
    P.path((cx) => { cx.moveTo(-14, -2); cx.quadraticCurveTo(-18, -20, -10, -36); cx.quadraticCurveTo(-8, -50, 0, -52); cx.quadraticCurveTo(8, -50, 10, -36); cx.quadraticCurveTo(18, -20, 14, -2); }).ink(1.2, 'rgba(15,8,25,0.9)');
    if (o.horns) { P.path((cx) => { cx.moveTo(-6, -48); cx.quadraticCurveTo(-14, -56, -12, -64); cx.moveTo(6, -48); cx.quadraticCurveTo(14, -56, 12, -64); }).ink(2.4, '#1a0f22'); }
    for (const ex of [-3.6, 3.6]) {
      P.halo(ex, -40, 5, o.eye || 'rgba(255,120,200,1)', 0.95);
      P.ellipse(ex, -40, 1.6, 1.1).fill('#fff2fa');

function drawFolk(P, id) {
  const o = FOLK[id];
  if (id === 'automaton') {
    P.at(50, 74, 1, 0, () => {
      P.shadow(0, 0, 18, 4);
      P.rect(-12, -40, 24, 30, 3).lfill('#8a7a5a', -12, -40, 12, -10, 0.4).ink(1.2);
      gearShape(P, 0, -26, 0.55, '#c9a45a');
      P.rect(-8, -56, 16, 14, 3).lfill('#9a8a6a', -8, -56, 8, -42, 0.4).ink(1.2);
      P.halo(-3, -50, 4, 'rgba(120,220,255,1)', 1);
      P.halo(3, -50, 4, 'rgba(120,220,255,1)', 1);
      P.rect(-10, -10, 7, 10, 1).fill('#5a5040').ink(1);
      P.rect(3, -10, 7, 10, 1).fill('#5a5040').ink(1);
      P.line(-12, -36, -20, -20, 4, '#6a5a42');
      P.line(12, -36, 20, -20, 4, '#6a5a42');
      P.line(0, -56, 0, -62, 1);
      P.circle(0, -63, 1.6).fill('#ff7a3a');
    });
    return;
  }
  if (id === 'child') {
    figure(P, 40, 72, 0.7, { robe: '#a8703a', hair: '#3a2414' });
    figure(P, 64, 72, 0.62, { robe: '#5a7a9a', hair: '#5a3a24' });
    return;
  }
  const s = 1.02;
  figure(P, 48, 74, s, { ...o, skin: undefined });
  if (o.shield) P.at(48, 74, s, 0, () => item(P, 'shield', 'hold'));
}

// ---------------------------------------------------------------- entry ---------------------------
function hasArt(id) { return !!A[id] || !!FOLK[id] || id === 'automaton'; }

/** paint a card's illustration into the art window (0..100 × 0..76) */
function paintArt(P, id) {
  const def = CARDS[id];
  const bgName = KIND_BG[def.kind] || 'dusk';
  if (def.kind === 'folk') {
    BG[def.id === 'automaton' ? 'interior' : 'dusk'](P);
    drawFolk(P, id);
  } else if (A[id]) {
    // structures, nodes, regions, enemies paint their own scene; objects get the kind backdrop
    const selfScene = ['node', 'structure', 'region', 'enemy', 'lair', 'beast', 'wonder', 'event', 'misc'].includes(def.kind) || ['star_chart', 'boat', 'raft', 'saddle_horse', 'domestic_goat', 'hen', 'fishing_rod'].includes(id);
    if (!selfScene) BG[bgName](P);
    A[id](P);
  } else {
    BG[bgName](P);
    P.circle(50, 40, 16).fill('rgba(255,255,255,0.2)').ink(1);
  }
  P.grain(0.08);
  P.vignette(0.35);
}

const ART_IDS = Object.keys(A);

return { hasArt, paintArt, ART_IDS };

  beast: { frame: '#5e6a36', accent: '#d8d08a', label: '野兽', icon: 'eye' },
  enemy: { frame: '#6e1e1e', accent: '#ff8a5a', label: '敌人', icon: 'skull' },
  lair: { frame: '#4a1418', accent: '#e86a4a', label: '巢穴', icon: 'skull' },
  region: { frame: '#2e5e66', accent: '#9ad8d8', label: '地域', icon: 'boot' },
  knowledge: { frame: '#32407a', accent: '#a8c0ff', label: '知识', icon: 'spark' },
  coin: { frame: '#9a7a22', accent: '#ffe08a', label: '货币', icon: 'coin' },
  bundle: { frame: '#7a5a3a', accent: '#e8c88a', label: '包裹', icon: 'box' },
  event: { frame: '#5e3a72', accent: '#e0a8ff', label: '事件', icon: 'scroll' },
  wonder: { frame: '#a0461a', accent: '#ffd070', label: '奇观', icon: 'flame' },
  misc: { frame: '#5a5048', accent: '#d0c4b0', label: '杂项', icon: 'fog' },
};

const RARITY = {
  common: { name: '普通', gem: null },
  uncommon: { name: '精良', gem: '#5ac86a' },
  rare: { name: '稀有', gem: '#4a9ae8' },
  epic: { name: '史诗', gem: '#b05ae8' },
  legendary: { name: '传说', gem: '#ffb22a' },
};

const SKILL_NAMES = {
  wood: '伐木', stone: '采石', mine: '采矿', farm: '耕作', forage: '采集', fish: '捕鱼', craft: '制作', build: '建造', smith: '锻造',
  research: '研究', heal: '医疗', explore: '探索', trade: '交易', hunt: '狩猎', sail: '航海',
};
const DMG_ICON = { pierce: 'arrow', blunt: 'hammer', light: 'ray' };
const DMG_NAMES = { pierce: '穿刺', blunt: '钝击', light: '光芒' };
const TRAIT_NAMES = { armored: '有甲', shade: '暗影', flying: '飞行', beast: '兽', boss: '首领', burning: '灼烧', regen: '再生', swarm: '成群', structure: '工事' };

// ---------------------------------------------------------------- stats & role ------------------
/** the stat chips shown in a card's footer: [icon, text] */
function cardStats(def) {
  const s = [];
  const k = def.kind;
  if (k === 'beast' && !def.hp) {
    if (def.value) s.push(['coin', def.value]);
  } else if (k === 'folk' || k === 'beast' || k === 'enemy' || k === 'lair') {
    if (def.hp) s.push(['heart', def.hp]);
    if (def.atk || k !== 'lair') s.push([DMG_ICON[def.dmg] || 'sword', def.atk || 0]);
    if (def.def) s.push(['shield', def.def]);
    if (k === 'folk' && def.appetite) s.push(['bowl', def.appetite]);
    if (def.light) s.push(['sun', def.light]);
  } else if (k === 'food') {
    s.push(['bowl', def.food]);
    s.push(['hourglass', def.spoil ? def.spoil + '天' : '∞']);
    if (def.heal) s.push(['plus', def.heal]);
  } else if (k === 'node' || (def.node && k === 'structure')) {
    const n = def.node;
    s.push(['cycle', n.charges < 0 ? '∞' : n.charges]);
    if (n.perennial) s.push(['leaf', '+' + (n.regen || 1)]);
    if (n.needTool === 'pick' || n.tool === 'pick') s.push(['pick', n.needTool ? '必需' : '助']);
    else if (n.tool === 'axe') s.push(['axe', '助']);
    if (def.light) s.push(['sun', def.light]);
  } else if (k === 'structure' || k === 'wonder') {
    if (def.light) s.push(['sun', def.light]);
    if (def.housing) s.push(['house', def.housing]);
    if (def.fuelMax) s.push(['flame', def.fuelMax]);
    if (def.fog) s.push(['fog', def.fog]);
    if (def.hp) s.push(['heart', def.hp]);
    if (def.store) s.push(['bowl', def.store.cap]);
    if (!s.length) s.push(def.tags.includes('research') ? ['spark', '灵感'] : ['gear', '工坊']);
  } else if (k === 'tool') {
    if (def.toolMult) s.push(['spark', '×' + def.toolMult]);
    if (def.light) s.push(['sun', def.light]);
    if (def.fuelMax) s.push(['flame', def.fuelMax]);
    if (def.heal) s.push(['plus', def.heal >= 99 ? '满' : def.heal]);
    if (def.value) s.push(['coin', def.value]);
  } else if (k === 'gear') {
    const gg = def.gear;
    if (gg.atk) s.push([DMG_ICON[gg.dmg] || 'sword', '+' + gg.atk]);
    if (gg.hp) s.push(['heart', '+' + gg.hp]);
    if (gg.def) s.push(['shield', '+' + gg.def]);
    if (gg.light) s.push(['sun', gg.light]);
    if (gg.warm) s.push(['snow', '御寒']);
  } else if (k === 'region') {
    const r = def.region;
    s.push(['clock', r.t + 's']);
    s.push(['skull', Math.max(1, Math.round(r.danger * 10))]);
    s.push(['cycle', r.charges]);
    if (r.need === 'light' || r.needLight) s.push(['sun', '需']);
    if (r.need === 'boat') s.push(['boat', '需']);
  } else if (k === 'bundle') {
    s.push(['box', '×' + def.open.n]);
  } else if (k === 'coin' || k === 'knowledge' || k === 'resource' || k === 'misc') {
    if (def.fuel) s.push(['flame', def.fuel]);
    if (def.food) s.push(['bowl', def.food]);
    if (def.fog) s.push(['fog', def.fog]);
    if (def.value) s.push(['coin', def.value]);
    if (def.id === 'insight') s.push(['spark', '研究']);
  } else if (k === 'event') {
    s.push(['eye', '点击']);
  }
  return s.slice(0, 4);
}

function firstClause(desc, n = 12) {
  const parts = (desc || '').split(/[。：；！？，（]/).filter(Boolean);
  let c = parts[0] || '';
  if (c.length < 4 && parts[1] && c.length + parts[1].length < n) c += '，' + parts[1];
  return c.length > n ? c.slice(0, n - 1) + '…' : c;
}

/** a short role line under the stats */
function cardRole(def) {
  const k = def.kind;
  if (k === 'folk') {
    const sk = Object.entries(def.skills || {}).sort((a, b) => b[1] - a[1]);
    if (sk.length) return sk.slice(0, 2).map(([s, m]) => `${SKILL_NAMES[s] || s}×${m}`).join(' ');
    if (def.tags.includes('soldier')) return [DMG_NAMES[def.dmg], def.ranged ? '远程' : '', def.taunt ? '嘲讽' : ''].filter(Boolean).join(' · ');
    if (def.grows) return `${def.grows.days} 天后长大`;
    return '可训练成专才';
  }
  if (k === 'beast' && !def.mob) return firstClause(def.desc);
  if (k === 'enemy' || k === 'beast' || k === 'lair') {
    const t = (def.traits || []).filter((x) => TRAIT_NAMES[x] && x !== 'beast').map((x) => TRAIT_NAMES[x]);
    if (def.ranged) t.unshift('远程');
    if (def.mob && def.mob.beh === 'flee') t.unshift('会逃跑');
    if (def.mob && def.mob.beh === 'neutral') t.unshift('中立');
    if (def.mob && def.mob.beh === 'raider') t.unshift('掠夺');
    return t.slice(0, 3).join(' · ') || DMG_NAMES[def.dmg];
  }
  if (k === 'node' || (k === 'structure' && def.node)) {
    const outs = def.node.out.map(([id]) => CARDS[id].name);
    return outs.length ? '产出 ' + outs.join('、') : firstClause(def.desc);
  }
  if (k === 'food') return def.tags.includes('preserved') ? '耐储存' : def.tags.includes('raw') ? '生食 · 可烹饪' : def.tags.includes('cooked') ? '熟食' : '食物';
  if (k === 'region') {
    const needs = [];
    if (def.region.need === 'light' || def.region.needLight) needs.push('需光源');
    if (def.region.need === 'boat') needs.push('需舟');
    return ['探索', ...needs].join(' · ');
  }
  return firstClause(def.desc);
}

// ---------------------------------------------------------------- painting ----------------------
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function corner(g, x, y, sx, sy, accent) {
  g.save();
  g.translate(x, y);
  g.scale(sx, sy);
  g.beginPath();
  g.moveTo(0, 9);
  g.quadraticCurveTo(0, 0, 9, 0);
  g.moveTo(2.5, 7);
  g.quadraticCurveTo(3, 3, 7, 2.5);
  g.lineWidth = 0.9;
  g.strokeStyle = accent;
  g.globalAlpha = 0.85;
  g.stroke();
  g.beginPath();
  g.arc(3.4, 3.4, 1.3, 0, Math.PI * 2);
  g.fillStyle = accent;
  g.fill();
  g.restore();
}

function fitText(g, text, maxW, size, font) {
  let s = size;
  g.font = `${s}px ${font}`;
  while (g.measureText(text).width > maxW && s > 6) {
    s -= 0.5;
    g.font = `${s}px ${font}`;
  }
  return s;
}

/** paint a full card face into g, whose transform maps 1 unit to 1 world unit, card at (0, 0) */
function paintFace(g, id) {
  const def = CARDS[id];
  const st = KIND_STYLE[def.kind] || KIND_STYLE.misc;
  const W = CARD_W, H = CARD_H;
  const frame = st.frame;

  // frame body
  rr(g, 0.5, 0.5, W - 1, H - 1, 7);
  const fg = g.createLinearGradient(0, 0, W, H);
  fg.addColorStop(0, lighten(frame, 0.22));
  fg.addColorStop(0.5, frame);
  fg.addColorStop(1, darken(frame, 0.38));
  g.fillStyle = fg;
  g.fill();
  g.save();
  g.clip();
  g.globalAlpha = 0.16;
  g.globalCompositeOperation = 'overlay';
  g.fillStyle = noisePattern(g);
  g.fillRect(0, 0, W, H);
  g.restore();
  // wood/leather grain streaks
  g.save();
  rr(g, 0.5, 0.5, W - 1, H - 1, 7);
  g.clip();
  g.globalAlpha = 0.12;
  g.strokeStyle = darken(frame, 0.6);
  g.lineWidth = 0.5;
  for (let i = 0; i < 14; i++) {
    const y = 3 + i * 11 + ((i * 37) % 7);
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(30, y - 3, 70, y + 4, W, y - 1);
    g.stroke();
  }
  g.restore();
  rr(g, 0.5, 0.5, W - 1, H - 1, 7);
  g.lineWidth = 1.6;
  g.strokeStyle = INK;
  g.stroke();
  // inner bevel
  rr(g, 2.6, 2.6, W - 5.2, H - 5.2, 5);
  g.lineWidth = 0.7;
  g.strokeStyle = lighten(st.accent, 0.2);
  g.globalAlpha = 0.55;
  g.stroke();
  g.globalAlpha = 1;

  // art window
  const A = FACE.art;
  g.save();
  rr(g, A.x, A.y, A.w, A.h, 3);
  g.clip();
  g.translate(A.x, A.y);
  const P = new Painter(g, hashId(id));
  try {
    paintArt(P, id);
  } catch (e) {
    g.fillStyle = '#3a2a22';
    g.fillRect(0, 0, A.w, A.h);
  }
  g.restore();
  // inner shadow + ink border on the art window
  g.save();
  rr(g, A.x, A.y, A.w, A.h, 3);
  g.clip();
  g.shadowColor = 'rgba(0,0,0,0.55)';
  g.shadowBlur = 5;
  g.lineWidth = 3;
  g.strokeStyle = 'rgba(0,0,0,0.35)';
  rr(g, A.x - 1.5, A.y - 1.5, A.w + 3, A.h + 3, 4);
  g.stroke();
  g.restore();
  rr(g, A.x, A.y, A.w, A.h, 3);
  g.lineWidth = 1.2;
  g.strokeStyle = INK;
  g.stroke();

  // footer panel
  const F = FACE.footer;
  rr(g, F.x, F.y, F.w, F.h, 3);
  const pg = g.createLinearGradient(0, F.y, 0, F.y + F.h);
  pg.addColorStop(0, '#f2e6c8');
  pg.addColorStop(1, '#d8c49a');
  g.fillStyle = pg;
  g.fill();
  g.save();
  g.clip();
  g.globalAlpha = 0.1;
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = noisePattern(g);
  g.fillRect(F.x, F.y, F.w, F.h);
  g.restore();
  rr(g, F.x, F.y, F.w, F.h, 3);
  g.lineWidth = 1;
  g.strokeStyle = INK;
  g.stroke();
  // divider
  g.beginPath();
  g.moveTo(F.x + 10, FACE.roleY - 8);
  g.lineTo(F.x + F.w - 10, FACE.roleY - 8);
  g.lineWidth = 0.5;
  g.strokeStyle = 'rgba(60,36,18,0.35)';
  g.stroke();

  // stats
  const stats = cardStats(def);
  if (stats.length) {
    g.font = `bold 10px ${FONT_NUM}`;
    const widths = stats.map(([, t]) => 11 + measure(g, String(t), t));
    const gap = 5;
    let x = 55 - (widths.reduce((a, b) => a + b, 0) + gap * (widths.length - 1)) / 2;
    stats.forEach(([ic, t], i) => {
      drawIcon(g, ic, x + 4.5, FACE.statsY, 10);
      setStatFont(g, t);
      g.fillStyle = '#2a1a10';
      g.textBaseline = 'middle';
      g.textAlign = 'left';
      g.fillText(String(t), x + 10.5, FACE.statsY + 0.5);
      x += widths[i] + gap;
    });
  }
  // role line
  const role = cardRole(def);
  g.fillStyle = '#5a3c22';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  fitText(g, role, 92, 7.5, FONT_BODY);
  g.fillText(role, 55, FACE.roleY);

  // header ribbon
  const Hd = FACE.header;
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.4)';
  g.shadowBlur = 2;
  g.shadowOffsetY = 1;
  rr(g, Hd.x + 6, Hd.y, Hd.w - 6, Hd.h, 4);
  const hg = g.createLinearGradient(0, Hd.y, 0, Hd.y + Hd.h);
  hg.addColorStop(0, '#f6ead0');
  hg.addColorStop(1, '#dcc89c');
  g.fillStyle = hg;
  g.fill();
  g.restore();
  rr(g, Hd.x + 6, Hd.y, Hd.w - 6, Hd.h, 4);
  g.lineWidth = 1;
  g.strokeStyle = INK;
  g.stroke();
  // name
  g.fillStyle = '#22140a';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  fitText(g, def.name, Hd.w - 30, 13, FONT_TITLE);
  g.fillText(def.name, 62, Hd.y + Hd.h / 2 + 0.8);
  // kind medallion
  const mx = 14.5, my = Hd.y + Hd.h / 2;
  g.beginPath();
  g.arc(mx, my, 10, 0, Math.PI * 2);
  const mg = g.createRadialGradient(mx - 3, my - 3, 1, mx, my, 10);
  mg.addColorStop(0, lighten(frame, 0.45));
  mg.addColorStop(1, darken(frame, 0.2));
  g.fillStyle = mg;
  g.fill();
  g.lineWidth = 1.2;
  g.strokeStyle = INK;
  g.stroke();
  g.beginPath();
  g.arc(mx, my, 8, 0, Math.PI * 2);
  g.lineWidth = 0.6;
  g.strokeStyle = st.accent;
  g.stroke();
  drawIcon(g, st.icon, mx, my, 11);

  // corners
  corner(g, 4.5, H - 4.5, 1, -1, st.accent);
  corner(g, W - 4.5, H - 4.5, -1, -1, st.accent);

  // rarity gem on the bottom edge
  const rar = RARITY[def.rarity] || RARITY.common;
  if (rar.gem) {
    const gx = W / 2, gy = H - 2.5;
    g.save();
    g.shadowColor = rar.gem;
    g.shadowBlur = 6;
    g.beginPath();
    g.moveTo(gx, gy - 5);
    g.lineTo(gx + 6, gy);
    g.lineTo(gx, gy + 5 - 2.5);
    g.lineTo(gx - 6, gy);
    g.closePath();
    const gg = g.createLinearGradient(gx - 6, gy - 5, gx + 6, gy + 3);
    gg.addColorStop(0, lighten(rar.gem, 0.6));
    gg.addColorStop(0.5, rar.gem);
    gg.addColorStop(1, darken(rar.gem, 0.4));
    g.fillStyle = gg;
    g.fill();
    g.restore();
    g.lineWidth = 0.9;
    g.strokeStyle = INK;
    g.stroke();
  }
}

function setStatFont(g, t) {
  g.font = typeof t === 'number' || /^[\d+×∞.s-]+$/.test(String(t)) ? `bold 10px ${FONT_NUM}` : `bold 8px ${FONT_BODY}`;
}
function measure(g, s, t) {
  setStatFont(g, t);
  return g.measureText(s).width;
}

function hashId(id) {
  let h = 2166136261;
  for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
  return h >>> 0;
}

/** the back of a card: a woodcut flame emblem on deep red lacquer */
function paintBack(g) {
  const W = CARD_W, H = CARD_H;
  rr(g, 0.5, 0.5, W - 1, H - 1, 7);
  const bg = g.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 95);
  bg.addColorStop(0, '#7a2a1c');
  bg.addColorStop(1, '#2a0e0a');
  g.fillStyle = bg;
  g.fill();
  g.save();
  g.clip();
  g.globalAlpha = 0.18;
  g.strokeStyle = '#e8a04a';
  g.lineWidth = 0.5;
  for (let d = -H; d < W + H; d += 7) {
    g.beginPath(); g.moveTo(d, 0); g.lineTo(d - H, H); g.stroke();
    g.beginPath(); g.moveTo(d - H, 0); g.lineTo(d, H); g.stroke();
  }
  g.restore();
  rr(g, 0.5, 0.5, W - 1, H - 1, 7);
  g.lineWidth = 1.6;
  g.strokeStyle = INK;
  g.stroke();
  rr(g, 6, 6, W - 12, H - 12, 4);
  g.lineWidth = 1;
  g.strokeStyle = '#d9a84a';
  g.stroke();
  rr(g, 9, 9, W - 18, H - 18, 3);
  g.lineWidth = 0.5;
  g.stroke();
  g.save();
  g.translate(W / 2, H / 2);
  const halo = g.createRadialGradient(0, 0, 2, 0, 0, 40);
  halo.addColorStop(0, 'rgba(255,190,90,0.55)');
  halo.addColorStop(1, 'rgba(255,190,90,0)');
  g.fillStyle = halo;
  g.fillRect(-45, -45, 90, 90);
  g.beginPath();
  g.arc(0, 0, 26, 0, Math.PI * 2);
  g.lineWidth = 1.4;
  g.strokeStyle = '#d9a84a';
  g.stroke();
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    g.beginPath();
    g.moveTo(Math.cos(a) * 28, Math.sin(a) * 28);
    g.lineTo(Math.cos(a) * 34, Math.sin(a) * 34);
    g.stroke();
  }
  drawIcon(g, 'flame', 0, 0, 36, '#f6a032');
  g.restore();
  g.fillStyle = '#d9a84a';
  g.font = `11px ${FONT_TITLE}`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('薪 火 纪', W / 2, H - 20);
}

// ---------------------------------------------------------------- sprite cache ------------------
const BUCKETS = [0.5, 1, 1.5, 2, 3, 4];
const cache = new Map();
const MAX_SPRITES = 260;
let generation = 0;

function bucketFor(scale) {
  for (const b of BUCKETS) if (b >= scale * 0.95) return b;
  return BUCKETS[BUCKETS.length - 1];
}

/** a cached canvas with the face of card `id` (or '#back') rendered at `scale` pixels per unit */
function cardSprite(id, scale) {
  const b = bucketFor(scale);
  const key = id + '|' + b;
  let s = cache.get(key);
  if (s) {
    cache.delete(key);
    cache.set(key, s); // LRU touch
    return s;
  }
  s = makeCanvas(Math.ceil(CARD_W * b), Math.ceil(CARD_H * b));
  const g = s.getContext('2d');
  g.scale(b, b);
  if (id === '#back') paintBack(g);
  else paintFace(g, id);
  cache.set(key, s);
  if (cache.size > MAX_SPRITES) cache.delete(cache.keys().next().value);
  return s;
}

/** drop every cached sprite (e.g. after web fonts finish loading) */
function flushSprites() {
  cache.clear();
  generation++;
}
function spriteGeneration() { return generation; }

/** a card face as a data URL for HTML (codex, tooltips, dialogs) */
const urls = new Map();
function cardURL(id, scale = 1) {
  const key = id + '|' + scale + '|' + generation;
  let u = urls.get(key);
  if (u) return u;
  const c = makeCanvas(Math.ceil(CARD_W * scale), Math.ceil(CARD_H * scale));
  const g = c.getContext('2d');
  g.scale(scale, scale);
  if (id === '#back') paintBack(g);
  else paintFace(g, id);
  u = c.toDataURL('image/png');
  urls.set(key, u);
  return u;
}

/** just the illustration (art window) as a data URL, for small icons in the HTML interface */
function artURL(id, px = 64) {
  const key = 'art|' + id + '|' + px + '|' + generation;
  let u = urls.get(key);
  if (u) return u;
  const h = Math.round((px * 76) / 100);
  const c = makeCanvas(px, h);
  const g = c.getContext('2d');
  g.scale(px / 100, px / 100);
  paintArt(new Painter(g, hashId(id)), id);
  u = c.toDataURL('image/png');
  urls.set(key, u);
