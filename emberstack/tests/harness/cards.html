<!doctype html>
<html><head><meta charset="utf-8"><title>card sheet</title>
<style>body{margin:0;background:#1a120c;} canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { CARDS, ALL_CARD_IDS } from '../../src/data/cards.js';
import { paintFace, paintBack } from '../../src/render/cardface.js';
const q = new URLSearchParams(location.search);
const from = +(q.get('from') || 0), n = +(q.get('n') || 48), cols = +(q.get('cols') || 8), sc = +(q.get('s') || 2);
let ids = q.get('ids') ? q.get('ids').split(',') : ALL_CARD_IDS.slice(from, from + n);
const c = document.getElementById('c');
const rows = Math.ceil(ids.length / cols);
c.width = cols * 120 * sc; c.height = rows * 160 * sc;
const g = c.getContext('2d');
g.scale(sc, sc);
const errs = [];
ids.forEach((id, i) => {
  g.save();
  g.translate((i % cols) * 120 + 5, Math.floor(i / cols) * 160 + 5);
  try { id === '#back' ? paintBack(g) : paintFace(g, id); } catch (e) { errs.push(id + ': ' + e.message); }
  g.restore();
});
window.__errs = errs; window.__done = true;
</script></body></html>
