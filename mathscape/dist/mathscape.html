      ctx.beginPath();
      ctx.moveTo(sx(0), sy(0));
      ctx.lineTo(sx(ax), sy(ay));
      ctx.lineTo(sx(ax + bx), sy(ay + by));
      ctx.lineTo(sx(bx), sy(by));
      ctx.closePath();
      const col = D >= 0 ? C.v : C.orange;
      ctx.fillStyle = alpha(col, 0.16);
      ctx.fill();
      ctx.strokeStyle = alpha(col, 0.75);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      const cx = sx((ax + bx) / 2), cy = sy((ay + by) / 2);
      if (Math.abs(D) * vp.scale ** 2 > 2600) {
        label(ctx, `det = ${fmt(D, 3)}`, cx, cy, { align: 'center', color: col, font: `600 12.5px ${FONT}` });
      }
    }

    // unit circle → ellipse with singular axes
    if (st.show.circle) {
      ctx.save();
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = 'rgba(203, 213, 225, 0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(sx(0), sy(0), vp.scale, 0, 2 * Math.PI);
      ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      for (let k = 0; k <= 160; k++) {
        const th = (k / 160) * 2 * Math.PI;
        const [x, y] = apply(m, Math.cos(th), Math.sin(th));
        if (k === 0) ctx.moveTo(sx(x), sy(y)); else ctx.lineTo(sx(x), sy(y));
      }
      ctx.closePath();
      ctx.fillStyle = 'rgba(34, 211, 238, 0.05)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.65)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      const s = svd(m);
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.lineWidth = 1.3;
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.55)';
      for (let k = 0; k < 2; k++) {
        const ux = k === 0 ? s.U.a : s.U.b, uy = k === 0 ? s.U.c : s.U.d;
        const r = s.sigma[k];
        ctx.beginPath();
        ctx.moveTo(sx(-r * ux), sy(-r * uy));
        ctx.lineTo(sx(r * ux), sy(r * uy));
        ctx.stroke();
        if (r * vp.scale > 30) {
          ctx.save();
          ctx.setLineDash([]);
          label(ctx, `σ${sub(k + 1)}`, sx(r * ux) + 6, sy(r * uy) - 10, { color: C.cyan, font: `italic 13px ${MATH}`, bg: null });
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // eigen-directions: invariant lines through the origin
    if (st.show.eigen) {
      const e = eigen(m);
      if (e.kind !== 'complex' && !(e.kind === 'repeated' && e.scalar)) {
        e.vectors.forEach((v, k) => {
          const seg = clipLine(0, 0, v[0], v[1], b);
          if (!seg) return;
          ctx.save();
          ctx.setLineDash([8, 6]);
          ctx.strokeStyle = alpha(C.eig, 0.7);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(sx(seg[0]), sy(seg[1]));
          ctx.lineTo(sx(seg[2]), sy(seg[3]));
          ctx.stroke();
          ctx.restore();
          // place the label near the edge in the direction of v
          const reach = Math.min(Math.abs(seg[2]) > 1e-9 || Math.abs(seg[3]) > 1e-9 ? Math.hypot(seg[2], seg[3]) : 1, 1e9);
          const r = Math.max(0.6, reach * 0.82);
          const lx = sx(v[0] * r), ly = sy(v[1] * r);
          label(ctx, `λ${e.vectors.length > 1 ? sub(k + 1) : ''} = ${fmt(e.values[k], 3)}`, lx, ly, { align: 'center', color: C.eig, border: alpha(C.eig, 0.35) });
        });
      }
    }

    // test vector v and its image
    if (st.show.vector) {
      const [vx, vy] = st.v;
      const [wx, wy] = apply(m, vx, vy);
      if (st.show.orbit) drawOrbit(ctx);
      ctx.save();
      ctx.setLineDash([2, 4]);
      ctx.strokeStyle = 'rgba(203, 213, 225, 0.3)';
      ctx.beginPath();
      ctx.moveTo(sx(vx), sy(vy));
      ctx.lineTo(sx(wx), sy(wy));
      ctx.stroke();
      ctx.restore();
      arrow(ctx, sx(0), sy(0), sx(vx), sy(vy), { color: alpha(C.cyan, 0.45), width: 2 });
      arrow(ctx, sx(0), sy(0), sx(wx), sy(wy), { color: C.cyan, width: 2.6, halo: 5 });
      handle(ctx, sx(vx), sy(vy), C.cyan, { active: st.drag === 'v' || st.hover === 'v', r: 5.5 });
      label(ctx, 'v', sx(vx) + 9, sy(vy) - 11, { color: C.cyan, font: `italic 15px ${MATH}`, bg: null });
      label(ctx, `${matName()}v`, sx(wx) + 9, sy(wy) - 11, { color: C.cyan, font: `italic 15px ${MATH}`, bg: null });
    }

    // basis vectors (columns of M)
    const [ix, iy] = apply(m, 1, 0), [jx, jy] = apply(m, 0, 1);
    arrow(ctx, sx(0), sy(0), sx(ix), sy(iy), { color: C.i, width: 3, head: 13, halo: 6 });
    arrow(ctx, sx(0), sy(0), sx(jx), sy(jy), { color: C.j, width: 3, head: 13, halo: 6 });
    handle(ctx, sx(ix), sy(iy), C.i, { active: st.drag === 'i' || st.hover === 'i' });
    handle(ctx, sx(jx), sy(jy), C.j, { active: st.drag === 'j' || st.hover === 'j' });
    const lab = (txt, x, y, col, dx, dy) => label(ctx, txt, sx(x) + dx, sy(y) + dy, { color: col, font: `600 12px ${FONT}`, border: alpha(col, 0.3) });
    const off = (x, y) => {
      const n = Math.hypot(x, y) || 1;
      return [(x / n) * 16 + 4, (-y / n) * 16 - 4];
    };
    const [oix, oiy] = off(ix, iy), [ojx, ojy] = off(jx, jy);
    const nm = matName();
    lab(`${nm}î ${fmtVec(ix, iy)}`, ix, iy, C.i, oix, oiy);
    lab(`${nm}ĵ ${fmtVec(jx, jy)}`, jx, jy, C.j, ojx, ojy);

    // origin
    ctx.beginPath();
    ctx.arc(sx(0), sy(0), 3, 0, 2 * Math.PI);
    ctx.fillStyle = C.text;
    ctx.fill();

    updateOverlay(m);
  }

  const hasLog = () => logm(st.A) != null;
  const matName = () => (st.t >= 1 ? 'A' : st.mode === 'exp' && hasLog() ? 'Aᵗ' : 'A(t)');

  function drawTransformedGrid(ctx, m, b) {
    const D = det(m);
    const c1 = apply(m, 1, 0), c2 = apply(m, 0, 1);
    const n1 = Math.hypot(...c1), n2 = Math.hypot(...c2);
    let step = niceStep(vp.scale).step;
    // spacing (px) between neighbouring image lines of each family; widen the step if too dense
    const spacing = () => Math.min(n2 > 1e-12 ? (Math.abs(D) / n2) * step : 0, n1 > 1e-12 ? (Math.abs(D) / n1) * step : 0) * vp.scale;
    for (let guard = 0; guard < 8 && Math.abs(D) > 1e-9 && spacing() < 9; guard++) step *= 2;
    const inv = inverse(m);
    const corners = [[b.xmin, b.ymin], [b.xmax, b.ymin], [b.xmin, b.ymax], [b.xmax, b.ymax]];
    const range = (comp) => {
      if (!inv) return [-40, 40];
      const vals = corners.map(([x, y]) => apply(inv, x, y)[comp] / step);
      const lo = Math.floor(Math.min(...vals)), hi = Math.ceil(Math.max(...vals));
      return [Math.max(lo, -400), Math.min(hi, 400)];
    };
    const pad = { xmin: b.xmin - 1 / vp.scale, xmax: b.xmax + 1 / vp.scale, ymin: b.ymin - 1 / vp.scale, ymax: b.ymax + 1 / vp.scale };
    const families = [
      { k: range(0), base: c1, dir: c2 }, // images of vertical lines x = k·step
      { k: range(1), base: c2, dir: c1 }, // images of horizontal lines y = k·step
    ];
    const lines = [[], []]; // regular, axis
    for (const f of families) {
      if (Math.hypot(...f.dir) < 1e-12) continue;
      for (let k = f.k[0]; k <= f.k[1]; k++) {
        const seg = clipLine(k * step * f.base[0], k * step * f.base[1], f.dir[0], f.dir[1], pad);
        if (seg) lines[k === 0 ? 1 : 0].push(seg);
      }
    }
    ctx.save();
    ctx.lineWidth = 1.15;
    ctx.strokeStyle = 'rgba(122, 162, 255, 0.36)';
    ctx.beginPath();
    for (const s of lines[0]) { ctx.moveTo(vp.sx(s[0]), vp.sy(s[1])); ctx.lineTo(vp.sx(s[2]), vp.sy(s[3])); }
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(160, 190, 255, 0.85)';
    ctx.beginPath();
    for (const s of lines[1]) { ctx.moveTo(vp.sx(s[0]), vp.sy(s[1])); ctx.lineTo(vp.sx(s[2]), vp.sy(s[3])); }
    ctx.stroke();
    ctx.restore();
  }

  function drawOrbit(ctx) {
    const pts = [];
    let [x, y] = st.v;
    for (let k = 0; k <= st.orbitN; k++) {
      pts.push([x, y]);
      [x, y] = apply(st.A, x, y);
      if (!Number.isFinite(x) || Math.hypot(x, y) > 1e7) break;
    }
    ctx.save();
    const L = logm(st.A);
    if (L) {
      // continuous orbit Aᵗv through the iterates (one-parameter group exp(tL))
      ctx.strokeStyle = 'rgba(103, 232, 249, 0.55)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      const n = pts.length - 1;
      const per = 32;
      for (let k = 0; k <= n * per; k++) {
        const [px, py] = apply(expm(scale(L, k / per)), st.v[0], st.v[1]);
        if (!Number.isFinite(px) || Math.hypot(px, py) > 1e7) break;
        if (k) ctx.lineTo(vp.sx(px), vp.sy(py)); else ctx.moveTo(vp.sx(px), vp.sy(py));
      }
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      pts.forEach(([px, py], k) => (k ? ctx.lineTo(vp.sx(px), vp.sy(py)) : ctx.moveTo(vp.sx(px), vp.sy(py))));
      ctx.stroke();
      ctx.setLineDash([]);
    }
    pts.forEach(([px, py], k) => {
      ctx.beginPath();
      ctx.arc(vp.sx(px), vp.sy(py), k === 0 ? 3 : 3.2, 0, 2 * Math.PI);
      ctx.fillStyle = alpha(C.cyan, 0.9 - (0.6 * k) / Math.max(1, pts.length));
      ctx.fill();
      if (k > 0 && k <= 6) label(ctx, `A${k === 1 ? '' : ['²', '³', '⁴', '⁵', '⁶'][k - 2]}v`, vp.sx(px) + 6, vp.sy(py) + 10, { color: alpha(C.cyan, 0.8), font: `italic 12px ${MATH}`, bg: null });
    });
    ctx.restore();
  }

  // ------------------------------------------------------------------ overlay & readouts
  function svdPhase() {
    const s = svd(st.A);
    const k = Math.min(2, Math.floor(st.t * 3));
    if (k === 0) return `① 旋转 Vᵀ：转 ${deg(s.theta)}`;
    if (k === 1) return `② 伸缩 Σ：σ₁ = ${fmt(s.sigma[0], 3)}，σ₂ = ${s.flip ? '−' : ''}${fmt(s.sigma[1], 3)}`;
    return `③ 旋转 U：转 ${deg(s.phi)}`;
  }

  function updateOverlay(m) {
    const D = det(m);
    const animating = st.t < 1;
    overlay.textContent = '';
    overlay.append(...[
      h('div', { class: 'title' }, animating ? `${MODES[st.mode].label}  t = ${fmt(st.t, 2)}` : '当前矩阵 A'),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
        h('span', { style: { fontFamily: MATH, fontStyle: 'italic', fontSize: '16px' } }, `${matName()} =`),
        h('div', { class: 'mini-matrix' },
          h('span', { style: { color: C.i } }, fmt(m.a, 2)), h('span', { style: { color: C.j } }, fmt(m.b, 2)),
          h('span', { style: { color: C.i } }, fmt(m.c, 2)), h('span', { style: { color: C.j } }, fmt(m.d, 2)))),
      h('div', { class: 'big', style: { marginTop: '8px', color: D >= 0 ? C.v : C.orange } }, `det = ${fmt(D, 3)}`),
      animating && st.mode === 'svd' ? h('div', { class: 'phase', id: 'svd-phase' }, svdPhase()) : null,
      highPrecision() ? h('div', { class: 'hp-badge' }, `高精度 · ${settings.digits} 位`) : null,
    ].filter(Boolean));
  }

  // ------------------------------------------------------------------ interaction
  const hitTest = (px, py) => {
    const m = M();
    const cand = [];
    if (st.show.vector) cand.push(['v', st.v[0], st.v[1]]);
    cand.push(['i', ...apply(m, 1, 0)], ['j', ...apply(m, 0, 1)]);
    let best = null, bd = 14;
    for (const [id, x, y] of cand) {
      const d = Math.hypot(vp.sx(x) - px, vp.sy(y) - py);
      if (d < bd) { bd = d; best = id; }
    }
    return best;
  };
  // Dragged entries are rounded to sub-pixel decimals, so the value shown, the URL and the exact
  // (high-precision) value all agree; Shift snaps to the minor grid.
  const clean = (x, step) => Number(x.toFixed(Math.min(20, Math.max(0, 1 - Math.floor(Math.log10(step))))));
  const snap = (x, e) => {
    const s = e.shiftKey ? niceStep(vp.scale).minor : 10 ** Math.floor(Math.log10(0.25 / vp.scale));
    return clean(Math.round(x / s) * s, s) + 0;
  };
  const detach = attachPointer(layer.canvas, vp, {
    hitTest,
    onDragStart(hd) {
      st.drag = hd;
      hint.style.opacity = 0;
      if (hd !== 'v' && st.t < 1) { stopAnim(); st.t = 1; tSlider.set(1); }
    },
    onDrag(hd, x, y, e) {
      x = snap(x, e); y = snap(y, e);
      if (hd === 'v') st.v = [x, y];
      else if (hd === 'i') { st.A = mat(x, st.A.b, y, st.A.d); st.src.a = numSrc(x); st.src.c = numSrc(y); }
      else if (hd === 'j') { st.A = mat(st.A.a, x, st.A.c, y); st.src.b = numSrc(x); st.src.d = numSrc(y); }
      if (hd !== 'v') matrixChanged();
      requestRender();
    },
    onDragEnd() { st.drag = null; requestRender(); syncQuery(); },
    onHover(px, py, x, y, hit) {
      if (st.hover !== hit) { st.hover = hit; requestRender(); }
    },
    onLeave() { if (st.hover) { st.hover = null; requestRender(); } },
    onView: () => { hint.style.opacity = 0; requestRender(); },
  });

  const stopResize = observeSize(stage, (w, hh) => {
    const first = vp.w <= 1;
    layer.resize(w, hh);
    vp.setSize(w, hh);
    if (first) vp.fit(-4.2, 4.2, -3, 3, 0);
    render();
  });

  // ------------------------------------------------------------------ animation
  const anim = { from: 0, to: 1, t0: 0, dur: 1.6 };
  const loop = animationLoop((dt, now) => {
    const s = Math.min(1, (now - anim.t0) / (anim.dur * 1000));
    st.t = anim.from + (anim.to - anim.from) * (st.mode === 'svd' ? s : easeInOut(s));
    tSlider.set(st.t);
    render();
    if (s >= 1) { loop.stop(); playBtn.querySelector('span').textContent = '播放变换'; }
  });
  function play() {
    if (loop.running) { stopAnim(); return; }
    anim.from = st.t >= 0.999 ? 0 : st.t;
    anim.to = 1;
    // the three SVD steps get more time
    anim.dur = (st.mode === 'svd' ? 3.6 : 1.8) * (1 - anim.from) + 0.2;
    anim.t0 = performance.now();
    st.t = anim.from;
    playBtn.querySelector('span').textContent = '暂停';
    loop.start();
  }
  function stopAnim() {
    loop.stop();
    playBtn.querySelector('span').textContent = '播放变换';
  }

  // ------------------------------------------------------------------ panel
  const paintCell = (k) => {
    const inp = cells[KEYS.indexOf(k)];
    if (document.activeElement !== inp) inp.value = fmt(st.A[k], 4);
    const expr = !PLAIN.test(st.src[k].replace(/\s+/g, ''));
    inp.classList.toggle('expr', expr);
    inp.title = expr ? `${st.src[k]} = ${st.A[k]}` : st.src[k];
  };
  const cells = KEYS.map((k) => {
    const inp = h('input', { class: `num-input ${k === 'a' || k === 'c' ? 'col-i' : 'col-j'}`, type: 'text', id: `m-${k}`, 'aria-label': `矩阵元素 ${k}`, spellcheck: 'false', autocomplete: 'off' });
    // editing shows the entry's source (e.g. sqrt(3)/2); otherwise the value is shown
    inp.addEventListener('focus', () => { inp.value = st.src[k]; inp.select(); });
    inp.addEventListener('input', () => {
      try {
        const v = evalConstant(inp.value);
        if (!Number.isFinite(v)) throw new Error('not finite');
        inp.classList.remove('invalid');
        st.A = { ...st.A, [k]: v };
        st.src[k] = inp.value.trim();
        stopAnim();
        st.t = 1;
        tSlider.set(1);
        matrixChanged();
        requestRender();
      } catch {
        inp.classList.add('invalid');
      }
    });
    inp.addEventListener('blur', () => { inp.classList.remove('invalid'); inp.value = fmt(st.A[k], 4); paintCell(k); syncQuery(); });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        const d = (e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 1 : 0.1);
        inp.value = fmt(st.A[k] + d, 4);
        inp.dispatchEvent(new Event('input'));
      }
      if (e.key === 'Enter') inp.blur();
    });
    return inp;
  });

  const presetChips = chips({
    id: 'matrix-presets',
    items: PRESETS.map((p) => ({ id: p.id, label: p.hp ? `${p.label} <span class="chip-badge">高精度</span>` : p.label, title: p.title })),
    onPick: (id) => {
      const p = PRESETS.find((q) => q.id === id);
      setMatrix(p.m, true, p.src);
      if (p.hp && !highPrecision()) toast('这个例子要在高精度下看：按 P 或在面板底部开启高精度');
    },
  });

  const playBtn = button({ label: '播放变换', iconName: 'play', variant: 'primary', onClick: play, id: 'play-transform' });
  const tSlider = slider({ label: '变换进度 <span class="math">t</span>', min: 0, max: 1, step: 0.001, value: st.t, format: (v) => fmt(v, 2), id: 't-slider', onInput: (v) => { stopAnim(); st.t = v; requestRender(); } });
  const modeNote = h('div', { class: 'hint', id: 'mode-note' });
  const paintModeNote = () => {
    modeNote.textContent = MODES[st.mode].note;
    if (st.mode === 'exp' && !hasLog()) modeNote.append(h('span', { class: 'warn-text' }, ' 当前 A 没有实对数（det ≤ 0 或有负特征值），暂用极分解插值。'));
  };
  const modeSeg = segmented({
    id: 'anim-mode',
    options: Object.entries(MODES).map(([value, m]) => ({ value, label: m.label, title: m.title })),
    value: st.mode,
    onChange: (v) => { st.mode = v; paintModeNote(); requestRender(); syncQuery(); },
  });

  const tg = (key, labelText, swatch) => toggle({ label: labelText, value: st.show[key], swatch, id: `show-${key}`, onChange: (v) => { st.show[key] = v; orbitSlider.el.style.display = st.show.orbit ? '' : 'none'; requestRender(); } });
  const orbitSlider = slider({ label: '迭代次数 <span class="math">n</span>', min: 1, max: 60, step: 1, value: st.orbitN, format: (v) => String(v), onInput: (v) => { st.orbitN = v; requestRender(); } });
  orbitSlider.el.style.display = 'none';

  const props = readout([
    ['det', 'det <span class="math">A</span>'],
    ['tr', 'tr <span class="math">A</span>'],
    ['rank', '秩'],
    ['char', '特征多项式'],
    ['eig', '特征值'],
    ['vec', '特征向量'],
    ['sv', '奇异值 σ₁, σ₂'],
    ['cond', '条件数 κ'],
    ['inv', '逆矩阵'],
  ], { id: 'matrix-props' });
  const tagsEl = h('div', { class: 'tags', id: 'matrix-tags' });

  // ---- high precision
  const hpCtl = precisionControls({ idPrefix: 'mx-prec', compact: true });
  const hpStatus = h('span', { class: 'aside', id: 'hp-status' });
  const hpBody = h('div', { class: 'hp-body', id: 'hp-body' });
  const hpPowN = h('input', { class: 'num-input', type: 'text', id: 'hp-pow-n', value: '10', inputmode: 'numeric', 'aria-label': '幂次 n', spellcheck: 'false' });
  const hpPowOut = h('div', { class: 'hp-pow-out', id: 'hp-pow-out' });
  const hpPow = h('div', { class: 'hp-pow' },
    h('div', { class: 'field-row' }, h('span', { class: 'label', html: '精确幂 <span class="math">A<sup>n</sup></span>，<span class="math">n</span> =' }), hpPowN),
    hpPowOut);
  hpPowN.addEventListener('input', () => scheduleHP(250));
  hpPowN.addEventListener('keydown', (e) => e.stopPropagation());
  const hpSection = section('高精度计算', [hpCtl.el, hpBody, hpPow], { aside: hpStatus, id: 'hp-section' });

  panel.append(
    section('矩阵', [
      h('div', { class: 'matrix-editor' },
        h('span', { class: 'name' }, 'A ='),
        h('div', { class: 'matrix-bracket' }, cells)),
      h('div', { class: 'hint', html: '第一列（绿）是 î 的像，第二列（红）是 ĵ 的像。可输入表达式，如 <code>cos(pi/6)</code>、<code>1/3</code>（点开单元格可看到原式）；<kbd>↑</kbd><kbd>↓</kbd> 微调，按住 <kbd>Shift</kbd> 拖动吸附网格。' }),
      h('div', { class: 'btn-row' },
        button({ label: '转置', small: true, onClick: () => setMatrix(transpose(st.A), false, [st.src.a, st.src.c, st.src.b, st.src.d]), title: 'Aᵀ' }),
        button({ label: '求逆', small: true, id: 'btn-inverse', onClick: doInverse, title: 'A⁻¹（有理数元素时精确）' }),
        button({ label: '平方', small: true, onClick: doSquare, title: 'A²' }),
        button({ label: '单位阵', small: true, onClick: () => setMatrix(IDENTITY, true, ['1', '0', '0', '1']), title: 'I' }),
        button({ iconName: 'shuffle', small: true, id: 'btn-random', onClick: randomMatrix, title: '随机整数矩阵' })),
    ]),
    section('预设', [presetChips.el]),
    section('变换动画', [
      h('div', { class: 'btn-row' }, playBtn),
      tSlider.el,
      modeSeg.el,
      modeNote,
    ]),
    section('显示', [
      h('div', { class: 'toggles two' },
        tg('grid', '变换后网格', C.accent).el,
        tg('original', '原始网格', '#475569').el,
        tg('square', '单位正方形', C.v).el,
        tg('circle', '单位圆 → 椭圆', C.cyan).el,
        tg('eigen', '特征方向', C.eig).el,
        tg('vector', '向量 v', C.cyan).el,
        tg('orbit', '迭代轨道 Aⁿv', '#67e8f9').el),
      orbitSlider.el,
    ]),
    section('性质', [props.el, tagsEl], { aside: '双精度 · 实时' }),
    hpSection,
  );

  // ------------------------------------------------------------------ high-precision values
  const hpCache = new Map();
  /** Entry k at W digits: { v, ok } — ok = false when its source could not be evaluated exactly. */
  function hpEntry(k, W) {
    const key = `${st.src[k]}|${W}`;
    let r = hpCache.get(key);
    if (!r) {
      try { r = { v: B.evaluate(parse(st.src[k], realContext([])), W), ok: true }; } catch { r = { v: B.fromNumber(st.A[k]), ok: false }; }
      if (hpCache.size > 200) hpCache.clear();
      hpCache.set(key, r);
    }
    return r;
  }
  const hpMatrix = (W) => {
    const e = KEYS.map((k) => hpEntry(k, W));
    return { M: { a: e[0].v, b: e[1].v, c: e[2].v, d: e[3].v }, fallback: e.some((x) => !x.ok) };
  };
  /** The four entries as exact rationals, or null. */
  function exactEntries() {
    const { M: E, fallback } = hpMatrix(40);
    return !fallback && KEYS.every((k) => B.isExact(E[k])) ? E : null;
  }
  const srcOf = (x, W) => (B.isExact(x) ? B.ratString(x, { ascii: true }) : B.toDecimal(x, W, { ascii: true }));

  function doInverse() {
    const E = exactEntries();
    if (E || highPrecision()) {
      const W = highPrecision() ? settings.digits + B.GUARD : 40;
      const X = E || hpMatrix(W).M;
      const D = B.sub(B.mul(X.a, X.d, W), B.mul(X.b, X.c, W), W);
      if (B.isZero(D) || (!E && !inverse(st.A))) { toast('矩阵奇异（det = 0），不可逆'); return; }
      const inv = [B.div(X.d, D, W), B.div(B.neg(X.b), D, W), B.div(B.neg(X.c), D, W), B.div(X.a, D, W)];
      setMatrix(mat(...inv.map(B.toNumber)), false, inv.map((x) => srcOf(x, W)));
      return;
    }
    const I = inverse(st.A);
    if (I) setMatrix(I); else toast('矩阵奇异（det = 0），不可逆');
  }

  function doSquare() {
    const E = exactEntries();
    if (E || highPrecision()) {
      const W = highPrecision() ? settings.digits + B.GUARD : 40;
      const { entries } = matPow(E || hpMatrix(W).M, 2, W - B.GUARD);
      setMatrix(mat(...entries.map(B.toNumber)), false, entries.map((x) => srcOf(x, W)));
      return;
    }
    setMatrix(mul(st.A, st.A));
  }

  function randomMatrix() {
    let e;
    do e = Array.from({ length: 4 }, () => Math.floor(Math.random() * 7) - 3);
    while (e[0] * e[3] - e[1] * e[2] === 0);
    setMatrix(mat(...e), true, e.map(String));
  }

  // ------------------------------------------------------------------ high-precision panel
  const expanded = new Set();
  let hpTimer = 0;
  let hpDirty = true;
  let lastHP = null;

  function scheduleHP(delay = 140) {
    hpDirty = true;
    clearTimeout(hpTimer);
    hpTimer = setTimeout(renderHP, delay);
  }

  const copyBtn = (text, what) => {
    const b = h('button', { type: 'button', class: 'mini-btn', title: `复制${what}` }, icon(ICONS.copy));
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); toast(`已复制${what}`); } catch { toast('无法访问剪贴板'); }
    });
    return b;
  };

  /** A long number: clamped to a few lines with “展开” and a copy button. */
  function bigNum(text, key, { copy = text, what = '数值', prefix = null } = {}) {
    const LIMIT = 20000;
    const shown = text.length > LIMIT ? `${text.slice(0, LIMIT)} …（共 ${text.length} 个字符，复制可得完整结果）` : text;
    const long = text.length > 84;
    const body = h('div', { class: `bignum${long && !expanded.has(key) ? ' clamped' : ''}` }, prefix ? h('span', { class: 'pre' }, prefix) : null, shown);
    const tools = h('div', { class: 'bigtools' }, copyBtn(copy, what));
    if (long) {
      const more = h('button', { type: 'button', class: 'mini-btn text' }, expanded.has(key) ? '收起' : '展开');
      more.addEventListener('click', () => {
        if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
        const open = expanded.has(key);
        body.classList.toggle('clamped', !open);
        more.textContent = open ? '收起' : '展开';
      });
      tools.append(more);
    }
    return h('div', { class: 'bigwrap' }, body, tools);
  }

  const P_ = () => settings.digits;
  const decimal = (x) => B.toDecimal(x, P_(), { group: 5 });
  const ascii = (x) => B.toDecimal(x, P_(), { ascii: true });
  /** Exact rational (plus its decimal expansion) or P-digit decimal, as bigNum blocks. */
  function valueBlock(x, key, name = '', pm = false) {
    const lead = (rel) => `${name ? `${name} ` : ''}${rel}${pm ? ' ±' : ''}`;
    if (B.isExact(x)) {
      const fr = B.ratString(x);
      const q = bigNum(fr, `${key}-q`, { prefix: lead('='), copy: B.ratString(x, { ascii: true }), what: '精确值' });
      if (x.d === 1n || fr.length > 60) return q;
      return h('div', null, q, bigNum(decimal(x), key, { prefix: lead('≈'), copy: ascii(x) }));
    }
    return bigNum(decimal(x), key, { prefix: lead('≈'), copy: ascii(x) });
  }

  const row = (labelHtml, ...content) => h('div', { class: 'hp-row' }, h('div', { class: 'hp-label', html: labelHtml }), ...content);
  const formEl = (text) => (text && text.length <= 110 ? h('div', { class: 'hp-form' }, text) : text ? h('div', { class: 'hint' }, '（根式很长，从略）') : null);

  /** Agreement between a double and the high-precision value: correct significant digits. */
  function agreement(f, x) {
    if (!Number.isFinite(f)) return 0;
    const W = 30;
    const diff = B.abs(B.sub(B.fromNumber(f), x, W));
    if (B.isZero(diff)) return Infinity;
    const scaleRef = B.isZero(x) ? B.ONE : B.abs(x);
    const rel = B.toNumber(B.div(diff, scaleRef, W));
    return Math.max(0, -Math.log10(rel));
  }

  function renderHP() {
    clearTimeout(hpTimer);
    hpBody.textContent = '';
    hpPow.style.display = highPrecision() ? '' : 'none';
    if (!highPrecision()) {
      hpStatus.textContent = '未开启';
      hpStatus.className = 'aside';
      hpBody.append(h('div', { class: 'hint', html: '开启后：有理数元素按分数<b>精确</b>运算；特征值、特征向量、奇异值与条件数给出<b>根式</b>；小数展开到所选位数（最高 1000 位）；可精确计算 A<sup>n</sup>；并逐项对比双精度结果还剩几位正确。试试预设里的“近重根”和“病态”。' }));
      lastHP = null;
      hpDirty = false;
      return;
    }
    if (hpSection.classList.contains('collapsed')) { hpDirty = true; return; }
    const t0 = performance.now();
    const P = P_();
    const W = P + B.GUARD;
    const { M: X, fallback } = hpMatrix(W);
    let r;
    try {
      r = analyze(X, P);
    } catch (e) {
      hpBody.append(h('div', { class: 'note' }, `高精度计算失败：${e.message}`));
      return;
    }
    lastHP = r;
    hpStatus.textContent = r.exact ? `精确 · ${P} 位` : `${P} 位近似`;
    hpStatus.className = `aside ${r.exact ? 'exact' : ''}`;

    const list = h('div', { class: 'hp-list' });
    list.append(h('div', { class: `hp-mode ${r.exact ? 'exact' : ''}` },
      r.exact
        ? '四个元素都是有理数：下面的分数与根式是精确值，小数为四舍五入到所选位数的展开。'
        : `元素含无理数（如 √3、π），以下为 ${P} 位有效数字的近似值。`,
      fallback ? h('span', { class: 'warn-text' }, ' 有元素无法高精度求值，按双精度值处理。') : null));

    list.append(row('det <span class="math">A</span>', valueBlock(r.det, 'det')));
    list.append(row('tr <span class="math">A</span>', valueBlock(r.trace, 'tr')));
    if (r.polyForm) list.append(row('特征多项式', formEl(r.polyForm)));

    const e = r.eig;
    const eigRow = row('特征值', formEl(r.eigForm));
    if (e.kind === 'complex') {
      eigRow.append(
        valueBlock(e.re, 'eig-re', 'Re λ'),
        valueBlock(e.im, 'eig-im', 'Im λ', true),
        valueBlock(e.modulus, 'eig-mod', '|λ|'),
        valueBlock(e.angleDeg, 'eig-arg', '辐角（度）'));
    } else if (e.kind === 'repeated') {
      if (!r.eigForm) eigRow.append(valueBlock(e.values[0], 'eig1', 'λ'));
      eigRow.append(h('div', { class: 'hint' }, e.scalar ? 'A = λI：任意非零向量都是特征向量。' : '只有一条特征方向（不可对角化）。'));
    } else {
      eigRow.append(valueBlock(e.values[0], 'eig1', 'λ₁'), valueBlock(e.values[1], 'eig2', 'λ₂'));
    }
    list.append(eigRow);
    if (r.vecForm) list.append(row('特征向量', formEl(r.vecForm)));
    list.append(row('奇异值',
      r.sigmaForm ? formEl(`σ₁ = ${r.sigmaForm[0]}，σ₂ = ${r.sigmaForm[1]}`) : null,
      valueBlock(r.sigma[0], 'sv1', 'σ₁'), valueBlock(r.sigma[1], 'sv2', 'σ₂')));
    list.append(row('条件数 κ = σ₁/σ₂', r.kappa ? [formEl(r.kappaForm ? `κ = ${r.kappaForm}` : null), valueBlock(r.kappa, 'kappa', 'κ')] : h('div', { class: 'hp-form bad' }, '∞（矩阵奇异）')));
    if (r.inverse) {
      // fractions while they stay short, otherwise 20-digit decimals
      const inv = r.inverse.map((x, k) => (r.inverseForm && r.inverseForm[k].length <= 24 ? r.inverseForm[k] : B.toDecimal(x, Math.min(P, 20))));
      list.append(row('逆矩阵', h('div', { class: 'hp-mat' }, inv.map((s) => h('span', null, s)))));
    } else {
      list.append(row('逆矩阵', h('div', { class: 'hp-form bad' }, '不存在（det = 0）')));
    }
    hpBody.append(list);

    // ---- double precision vs high precision
    const fe = eigen(st.A);
    const fs = svd(st.A);
    const cmpRows = [];
    const add = (name, f, x) => {
      const d = agreement(f, x);
      cmpRows.push({ name, f, d });
    };
    add('det A', det(st.A), r.det);
    let kindNote = null;
    const KIND = { real: '两个不同实根', repeated: '二重根', complex: '一对共轭复根' };
    if (fe.kind !== e.kind) {
      kindNote = `双精度把特征值判成了「${KIND[fe.kind]}」，实际是「${KIND[e.kind]}」。`;
    } else if (e.kind === 'real') {
      add('λ₁', fe.values[0], e.values[0]);
      add('λ₂', fe.values[1], e.values[1]);
    } else if (e.kind === 'complex') {
      add('Re λ', fe.re, e.re);
      add('Im λ', fe.im, e.im);
    } else {
      add('λ', fe.values[0], e.values[0]);
    }
    add('σ₁', fs.sigma[0], r.sigma[0]);
    add('σ₂', fs.sigma[1], r.sigma[1]);
    const worst = kindNote ? 0 : Math.min(...cmpRows.map((c) => c.d));
    const cls = (d) => (d >= 12 ? 'good' : d >= 6 ? 'warn' : 'bad');
    const digitsText = (d) => (d === Infinity ? '完全一致' : `${fmt(Math.min(d, 17), 1)} 位`);
    const summary = kindNote
      ? h('div', { class: 'hp-summary bad', id: 'hp-summary' }, kindNote)
      : h('div', { class: `hp-summary ${cls(worst)}`, id: 'hp-summary' },
        worst >= 15 ? '双精度在这里几乎没有损失（约 16 位都正确）。'
          : worst >= 6 ? `双精度结果最少只有 ${digitsText(worst)}正确。`
            : `双精度结果最少只有 ${digitsText(worst)}正确：这个矩阵是病态的，舍入误差被放大了。`);
    const table = h('div', { class: 'hp-cmp', id: 'hp-cmp' },
      h('div', { class: 'th' }, '量'), h('div', { class: 'th' }, '双精度结果'), h('div', { class: 'th' }, '正确位数'),
      cmpRows.flatMap((c) => [
        h('div', null, c.name),
        h('div', { class: 'mono' }, Number.isFinite(c.f) ? c.f.toPrecision(17).replace('-', '−') : '—'),
        h('div', { class: `mono ${cls(c.d)}` }, digitsText(c.d)),
      ]));
    hpBody.append(h('div', { class: 'hp-sub' }, '与双精度对比'), summary, table);

    // ---- exact powers
    renderPow(X);
    hpBody.append(h('div', { class: 'hint hp-time' }, `计算用时 ${fmt(performance.now() - t0, 1)} ms`));
    hpDirty = false;
  }

  function renderPow(X) {
    hpPowOut.textContent = '';
    const n = Number(hpPowN.value.trim());
    if (!Number.isInteger(n) || Math.abs(n) > 1000000) {
      hpPowN.classList.add('invalid');
      hpPowOut.append(h('div', { class: 'hint' }, 'n 需为整数，|n| ≤ 1000000。'));
      return;
    }
    hpPowN.classList.remove('invalid');
    let res;
    const t0 = performance.now();
    try { res = matPow(X, n, P_()); } catch (e) { hpPowOut.append(h('div', { class: 'note' }, e.message)); return; }
    const ms = performance.now() - t0;
    const texts = res.entries.map((x) => (res.exact ? B.ratString(x) : decimal(x)));
    const asciiTexts = res.entries.map((x) => (res.exact ? B.ratString(x, { ascii: true }) : ascii(x)));
    const longest = Math.max(...res.entries.map((x) => (res.exact ? B.ndigits(x.n) : 0)));
    hpPowOut.append(
      h('div', { class: 'hp-pow-grid' }, texts.map((t, k) => bigNum(t, `pow-${k}`, { copy: asciiTexts[k], what: `第 ${k + 1} 个元素` }))),
      h('div', { class: 'hint' },
        res.exact ? `精确结果（整数 / 分数）· 分子最长 ${longest} 位 · ${fmt(ms, 1)} ms` : `${P_()} 位有效数字（元素含无理数或结果过大）· ${fmt(ms, 1)} ms`),
      h('div', { class: 'btn-row' }, (() => {
        const b = button({ label: '复制 Aⁿ（JSON）', iconName: 'copy', small: true });
        b.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(JSON.stringify([[asciiTexts[0], asciiTexts[1]], [asciiTexts[2], asciiTexts[3]]])); toast('已复制'); } catch { toast('无法访问剪贴板'); }
        });
        return b;
      })()));
  }

  // compute when the folded section is opened again
  hpSection.querySelector('.section-toggle')?.addEventListener('click', () => { if (hpDirty) setTimeout(renderHP, 0); });

  // ------------------------------------------------------------------ state changes
  function setMatrix(A, animate = false, src = null) {
    st.A = mat(A.a, A.b, A.c, A.d);
    KEYS.forEach((k, n) => { st.src[k] = src ? String(src[n]) : numSrc(st.A[k]); });
    matrixChanged();
    syncQuery();
    if (animate) { st.t = 0; play(); } else { stopAnim(); st.t = 1; tSlider.set(1); requestRender(); }
  }

  function matrixChanged() {
    const A = st.A;
    KEYS.forEach(paintCell);
    const norm = (s) => s.replace(/\s+/g, '');
    const match = PRESETS.find((p) => p.src.every((s, n) => norm(s) === norm(st.src[KEYS[n]])))
      || PRESETS.find((p) => KEYS.every((k) => p.m[k] === A[k]));
    presetChips.set(match ? match.id : null);
    const D = det(A), T = trace(A);
    props.set('det', fmt(D, 4), D < 0 ? 'warn' : '');
    props.set('tr', fmt(T, 4));
    const r = rank(A);
    props.set('rank', String(r), r < 2 ? 'warn' : '');
    const term = (c, s) => (Math.abs(c) < 1e-12 ? '' : ` ${c < 0 ? '−' : '+'} ${fmt(Math.abs(c), 3) === '1' && s ? '' : fmt(Math.abs(c), 3)}${s}`);
    props.set('char', `λ²${term(-T, 'λ')}${term(D, '')}`);
    const e = eigen(A);
    if (e.kind === 'real') {
      props.set('eig', `λ₁ = ${fmt(e.values[0], 4)}, λ₂ = ${fmt(e.values[1], 4)}`);
      props.set('vec', `${fmtVec(...e.vectors[0], 3)}, ${fmtVec(...e.vectors[1], 3)}`);
    } else if (e.kind === 'repeated') {
      props.set('eig', `λ = ${fmt(e.values[0], 4)}（二重）`);
      props.set('vec', e.scalar ? '任意非零向量' : `${fmtVec(...e.vectors[0], 3)}（仅一条）`);
    } else {
      props.set('eig', `${fmtComplex(e.re, e.im, 4)}, ${fmtComplex(e.re, -e.im, 4)}`);
      props.set('vec', `无实特征向量：|λ| = ${fmt(e.modulus, 4)}，每次转 ${deg(e.angle)}`);
    }
    const s = svd(A);
    props.set('sv', `${fmt(s.sigma[0], 4)}, ${fmt(s.sigma[1], 4)}`);
    props.set('cond', s.sigma[1] > 1e-12 * s.sigma[0] ? fmt(s.sigma[0] / s.sigma[1], 4) : '∞', s.sigma[1] > 1e-12 * s.sigma[0] ? '' : 'bad');
    const I = inverse(A);
    if (I) props.setHTML('inv', `<span class="mini-matrix"><span>${fmt(I.a, 3)}</span><span>${fmt(I.b, 3)}</span><span>${fmt(I.c, 3)}</span><span>${fmt(I.d, 3)}</span></span>`);
    else props.set('inv', '不存在（det = 0）', 'bad');
    tagsEl.textContent = '';
    for (const t of classify(A)) tagsEl.append(h('div', { class: 'tag' }, t));
    paintModeNote();
    scheduleHP();
  }

  function syncQuery() {
    const s = KEYS.map((k) => st.src[k].replace(/\s+/g, ''));
    const mode = st.mode === 'linear' ? null : st.mode;
    if (s.every((x) => PLAIN.test(x))) setQuery({ m: s.join(','), mode });
    else setQuery({ m: KEYS.map((k) => +st.A[k].toPrecision(6)).join(','), x: s.join(';'), mode });
  }

  matrixChanged();
  renderHP();

  // ------------------------------------------------------------------ public API
  return {
    help: {
      tips: [
        '拖动 <b style="color:#4ade80">绿色</b> / <b style="color:#fb7185">红色</b> 箭头端点：直接设定矩阵的两列，即 î 与 ĵ 的像。',
        '黄色平行四边形是单位正方形的像，其<b>有向面积</b>就是 det A；变为橙色表示 det &lt; 0（定向翻转）。',
        '青色椭圆是单位圆的像，两条虚线半轴长度就是奇异值 σ₁ ≥ σ₂。',
        '紫色虚线是特征方向：这条直线上的向量只被拉伸 λ 倍，不改变方向。',
        '打开“迭代轨道”查看 v, Av, A²v, …；A 有实对数时还会画出连接它们的连续曲线 Aᵗv。',
        '变换动画有四种路径：线性、极分解、指数 Aᵗ、SVD 分步（旋转 → 伸缩 → 旋转）。',
        '开启<b>高精度</b>（快捷键 P）后，面板底部给出精确分数、根式、任意位数的小数和 Aⁿ 精确幂，并标出双精度结果还剩几位正确。',
      ],
      keys: [['Space', '播放 / 暂停变换动画'], ['F', '视图复位'], ['Shift + 拖动', '吸附到网格']],
    },
    onKey(e) {
      if (e.key === ' ') { play(); e.preventDefault(); }
      if (e.key === 'f' || e.key === 'F') { vp.fit(-4.2, 4.2, -3, 3, 0); requestRender(); }
    },
    onSettings() {
      renderHP();
      requestRender();
    },
    snapshot: () => layer.canvas,
    // test hooks
    state: () => ({ A: { ...st.A }, M: M(), src: { ...st.src }, t: st.t, v: [...st.v], mode: st.mode, view: vp.state() }),
    hp: () => (lastHP ? {
      exact: lastHP.exact,
      eigKind: lastHP.eig.kind,
      eigForm: lastHP.eigForm ?? null,
      values: lastHP.eig.kind === 'complex' ? [] : lastHP.eig.values.map((x) => B.toDecimal(x, settings.digits, { ascii: true })),
      det: B.toDecimal(lastHP.det, settings.digits, { ascii: true }),
    } : null),
    renderHP,
    setMatrix: (a, b, c, d) => setMatrix(mat(a, b, c, d)),
    worldToClient(x, y) {
      const r = layer.canvas.getBoundingClientRect();
      return [r.left + vp.sx(x), r.top + vp.sy(y)];
    },
    destroy() {
      stopAnim();
      clearTimeout(hpTimer);
      cancelAnimationFrame(raf);
      detach();
      stopResize();
      hpCtl.destroy();
    },
  };
}

function createPhase2D({ stage, panel, toast, query, setQuery, active }) {
  // precision mode (read once: a change of setting re-creates the module)
  const tol = tolerances();
  const eqDigits = tol.hp ? 10 : 4;
  const st = {
    preset: PRESETS_2D[0],
    fSrc: '', gSrc: '',
    fx: null, fy: null,
    p: { a: 1, b: 1, c: 1, d: 1 },
    trajs: [],
    selected: -1,
    eq: [],
    seps: [],
    null: { f: null, g: null },
    show: { field: true, particles: true, nullclines: true, equilibria: true, separatrices: true, series: true, dots: true },
    T: 40,
    speed: 1,
    tAnim: 0,
    hover: null,
  };

  // ------------------------------------------------------------------ DOM
  const root = h('div', { class: 'layer', style: { position: 'absolute', inset: 0 } });
  stage.append(root);
  const base = new Layer(root);
  const fx = new Layer(root, { passive: true });
  const coordCard = h('div', { class: 'overlay-card tl', id: 'phase-coords', style: { minWidth: '200px' } },
    h('div', { class: 'title' }, '光标'), h('div', { class: 'big', style: { color: C.text3 } }, '移到相平面上查看 (x, y) 与 (ẋ, ẏ)'));
  const tip = h('div', { class: 'tooltip', style: { display: 'none' } });
  const strip = h('div', { class: 'bottom-strip', id: 'series-strip' });
  const stripLayer = new Layer(strip, { passive: true });
  root.append(coordCard, tip, strip);
  const hint = h('div', { class: 'stage-hint', style: { bottom: '150px' } }, '单击添加轨线 · 拖动平移 · 滚轮缩放');
  root.append(hint);
  const vp = new Viewport();

  // ------------------------------------------------------------------ field
  const F = (x, y, t = 0) => {
    const { a, b, c, d } = st.p;
    return [st.fx(x, y, t, a, b, c, d), st.fy(x, y, t, a, b, c, d)];
  };
  const sys = (t, Y, dY) => {
    const { a, b, c, d } = st.p;
    dY[0] = st.fx(Y[0], Y[1], t, a, b, c, d);
    dY[1] = st.fy(Y[0], Y[1], t, a, b, c, d);
  };

  function compile(fSrc, gSrc) {
    const f = realFunction(fSrc, VARS);
    const g = realFunction(gSrc, VARS);
    st.fSrc = fSrc; st.gSrc = gSrc;
    st.fx = f; st.fy = g;
  }

  // ------------------------------------------------------------------ trajectories
  function solve(x0, y0, span, box) {
    const stop = (Y) => !(Number.isFinite(Y[0]) && Number.isFinite(Y[1])) || Math.abs(Y[0] - box.cx) > box.r || Math.abs(Y[1] - box.cy) > box.r;
    const opts = { duration: st.T, rtol: tol.odeRtol, atol: tol.odeAtol * span, maxSteps: tol.odeMaxSteps, stop };
    const fw = integrate(sys, [x0, y0], { ...opts, direction: 1 });
    const bw = integrate(sys, [x0, y0], { ...opts, direction: -1 });
    const seg = span / 600;
    const pf = densify(fw, seg), pb = densify(bw, seg);
    // merge into one polyline in increasing time: reversed backward part + forward part
    const n = pb.length / 3 + pf.length / 3 - 1;
    const pts = new Float64Array(3 * n);
    let k = 0;
    for (let i = pb.length - 3; i >= 3; i -= 3) { pts[k++] = pb[i]; pts[k++] = pb[i + 1]; pts[k++] = pb[i + 2]; }
    pts.set(pf, k);
    return { pts, t0: pts[2], t1: pts[pts.length - 1] };
  }

  function viewBox() {
    const b = vp.bounds;
    const span = Math.max(b.xmax - b.xmin, b.ymax - b.ymin);
    return { span, box: { cx: (b.xmin + b.xmax) / 2, cy: (b.ymin + b.ymax) / 2, r: 2.5 * span } };
  }

  let trajVersion = 0;
  function recomputeTrajectories() {
    trajVersion++;
    const { span, box } = viewBox();
    for (const tr of st.trajs) Object.assign(tr, solve(tr.x0, tr.y0, span, box));
  }

  function addTrajectory(x, y, select = true) {
    const { span, box } = viewBox();
    const tr = { x0: x, y0: y, color: TRAJ_COLORS[st.trajs.length % TRAJ_COLORS.length], ...solve(x, y, span, box) };
    st.trajs.push(tr);
    trajVersion++;
    if (select) st.selected = st.trajs.length - 1;
    trajCount.textContent = String(st.trajs.length);
    syncQuery();
    return tr;
  }

  // ------------------------------------------------------------------ equilibria & separatrices
  function recomputeStructure() {
    const b = vp.bounds;
    st.eq = findEquilibria((x, y) => F(x, y), b, { seeds: 12, tol: tol.hp ? 1e-14 : 1e-10 }).slice(0, 40);
    st.seps = [];
    const span = Math.max(b.xmax - b.xmin, b.ymax - b.ymin);
    if (st.show.separatrices) {
      const box = { cx: (b.xmin + b.xmax) / 2, cy: (b.ymin + b.ymax) / 2, r: 2 * span };
      const stop = (Y) => !(Number.isFinite(Y[0]) && Number.isFinite(Y[1])) || Math.abs(Y[0] - box.cx) > box.r || Math.abs(Y[1] - box.cy) > box.r;
      for (const e of st.eq) {
        if (e.type !== 'saddle' || !e.eigen.real) continue;
        e.eigen.real.forEach((lam, k) => {
          const v = e.eigen.vectors[k];
          const dir = lam > 0 ? 1 : -1; // unstable manifold forward, stable manifold backward in time
          for (const s of [1, -1]) {
            const eps = 1e-5 * span;
            const sol = integrate(sys, [e.x + s * eps * v[0], e.y + s * eps * v[1]], { duration: 60, direction: dir, rtol: tol.sepRtol, atol: tol.sepAtol * span, maxSteps: tol.odeMaxSteps, stop });
            st.seps.push({ unstable: lam > 0, pts: densify(sol, span / 600) });
          }
        });
      }
    }
    if (st.show.nullclines) {
      const nx = Math.max(40, Math.round(vp.w / 5)), ny = Math.max(30, Math.round(vp.h / 5));
      const pad = { xmin: b.xmin, xmax: b.xmax, ymin: b.ymin, ymax: b.ymax };
      st.null.f = contourZero((x, y) => F(x, y)[0], pad, nx, ny);
      st.null.g = contourZero((x, y) => F(x, y)[1], pad, nx, ny);
    }
    updateEqList();
  }

  // ------------------------------------------------------------------ drawing (static layer)
  function drawBase() {
    base.reset();
    const ctx = base.ctx;
    const W = vp.w, H = vp.h;
    backdrop(ctx, W, H, '#0f1420', '#090c13', 0.4, base.dpr);
    drawGrid(ctx, vp, { alpha: 0.9 });
    if (st.show.field) drawField(ctx);
    if (st.show.nullclines) {
      drawSegments(ctx, st.null.f, '#fb923c');
      drawSegments(ctx, st.null.g, '#a78bfa');
    }
    if (st.show.separatrices) {
      for (const s of st.seps) {
        drawPolyline(ctx, s.pts, s.unstable ? 'rgba(251, 113, 133, 0.9)' : 'rgba(96, 165, 250, 0.9)', 2);
      }
    }
    st.trajs.forEach((tr, k) => {
      drawPolyline(ctx, tr.pts, tr.color, k === st.selected ? 2.6 : 1.9, 3, k === st.selected);
      arrowsAlong(ctx, tr.pts, tr.color);
      ctx.beginPath();
      ctx.arc(vp.sx(tr.x0), vp.sy(tr.y0), 3.5, 0, 2 * Math.PI);
      ctx.fillStyle = '#0c1018';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = tr.color;
      ctx.stroke();
    });
    if (st.show.equilibria) for (const e of st.eq) drawEquilibrium(ctx, e);
  }

  function drawField(ctx) {
    const sp = 30;
    const cols = Math.ceil(vp.w / sp) + 1, rows = Math.ceil(vp.h / sp) + 1;
    const ox = (vp.w - (cols - 1) * sp) / 2, oy = (vp.h - (rows - 1) * sp) / 2;
    const samples = [];
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const px = ox + i * sp, py = oy + j * sp;
        const [u, v] = F(vp.wx(px), vp.wy(py));
        const m = Math.hypot(u, v);
        if (!Number.isFinite(m)) continue;
        const lm = Math.log(m + 1e-12);
        samples.push([px, py, u, v, lm]);
        if (m > 1e-12) { lo = Math.min(lo, lm); hi = Math.max(hi, lm); }
      }
    }
    const BUCKETS = 12;
    const paths = Array.from({ length: BUCKETS }, () => new Path2D());
    for (const [px, py, u, v, lm] of samples) {
      const m = Math.hypot(u, v);
      if (m < 1e-12) continue;
      const s = hi > lo ? (lm - lo) / (hi - lo) : 0.5;
      const L = sp * (0.32 + 0.22 * s);
      const dx = (u / m) * L, dy = (-v / m) * L;
      const x0 = px - dx / 2, y0 = py - dy / 2, x1 = px + dx / 2, y1 = py + dy / 2;
      const p = paths[Math.min(BUCKETS - 1, Math.floor(s * BUCKETS))];
      p.moveTo(x0, y0);
      p.lineTo(x1, y1);
      const ux = dx / L, uy = dy / L;
      p.moveTo(x1 - ux * 5 - uy * 3, y1 - uy * 5 + ux * 3);
      p.lineTo(x1, y1);
      p.lineTo(x1 - ux * 5 + uy * 3, y1 - uy * 5 - ux * 3);
    }
    ctx.save();
    ctx.lineWidth = 1.25;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    paths.forEach((p, k) => {
      ctx.strokeStyle = rampCss(0.3 + (0.7 * k) / (BUCKETS - 1), 0.5);
      ctx.stroke(p);
    });
    ctx.restore();
  }

  function drawSegments(ctx, segs, color) {
    if (!segs || !segs.length) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([6, 5]);
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    for (let k = 0; k < segs.length; k += 4) {
      ctx.moveTo(vp.sx(segs[k]), vp.sy(segs[k + 1]));
      ctx.lineTo(vp.sx(segs[k + 2]), vp.sy(segs[k + 3]));
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawPolyline(ctx, pts, color, width, stride = 3, halo = false) {
    if (!pts || pts.length < 2 * stride) return;
    ctx.save();
    ctx.beginPath();
    for (let k = 0; k < pts.length; k += stride) {
      const px = vp.sx(pts[k]), py = vp.sy(pts[k + 1]);
      if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    if (halo) {
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = color;
      ctx.lineWidth = width + 5;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
    ctx.restore();
  }

  function arrowsAlong(ctx, pts, color) {
    let acc = 60;
    const placed = []; // closed orbits revisit the same places: keep arrowheads apart
    ctx.save();
    ctx.fillStyle = color;
    for (let k = 3; k < pts.length; k += 3) {
      const x0 = vp.sx(pts[k - 3]), y0 = vp.sy(pts[k - 2]);
      const x1 = vp.sx(pts[k]), y1 = vp.sy(pts[k + 1]);
      const d = Math.hypot(x1 - x0, y1 - y0);
      acc += d;
      if (acc < 150 || d < 1e-6) continue;
      if (x1 < -20 || x1 > vp.w + 20 || y1 < -20 || y1 > vp.h + 20) continue;
      if (placed.some(([px, py]) => (px - x1) ** 2 + (py - y1) ** 2 < 70 * 70)) continue;
      placed.push([x1, y1]);
      acc = 0;
      const ux = (x1 - x0) / d, uy = (y1 - y0) / d;
      ctx.beginPath();
      ctx.moveTo(x1 + ux * 6, y1 + uy * 6);
      ctx.lineTo(x1 - ux * 5 - uy * 4.5, y1 - uy * 5 + ux * 4.5);
      ctx.lineTo(x1 - ux * 2, y1 - uy * 2);
      ctx.lineTo(x1 - ux * 5 + uy * 4.5, y1 - uy * 5 - ux * 4.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  const EQ_STYLE = {
    saddle: { color: '#fbbf24', shape: 'diamond' },
    'stable-node': { color: '#4ade80', shape: 'filled' },
    'stable-focus': { color: '#4ade80', shape: 'filled' },
    'stable-star': { color: '#4ade80', shape: 'filled' },
    'unstable-node': { color: '#fb7185', shape: 'hollow' },
    'unstable-focus': { color: '#fb7185', shape: 'hollow' },
    'unstable-star': { color: '#fb7185', shape: 'hollow' },
    center: { color: '#22d3ee', shape: 'ring' },
    degenerate: { color: '#94a3b8', shape: 'ring' },
  };

  function drawEquilibrium(ctx, e) {
    const { color, shape } = EQ_STYLE[e.type] || EQ_STYLE.degenerate;
    const x = vp.sx(e.x), y = vp.sy(e.y);
    ctx.save();
    glow(ctx, x, y, 22, color, 0.8);
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = color;
    ctx.fillStyle = shape === 'filled' ? color : '#0c1018';
    ctx.beginPath();
    if (shape === 'diamond') {
      ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.arc(x, y, 6.5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.stroke();
      if (shape === 'ring') {
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ particles (dynamic layer)
  const NP = 800, TRAIL = 12;
  const P = { x: new Float64Array(NP), y: new Float64Array(NP), age: new Float32Array(NP), life: new Float32Array(NP), hx: new Float32Array(NP * TRAIL), hy: new Float32Array(NP * TRAIL), head: new Uint8Array(NP), n: new Uint8Array(NP) };
  const work = rk4Work(2);
  const Y = new Float64Array(2);
  function spawn(i) {
    P.x[i] = vp.wx(Math.random() * vp.w);
    P.y[i] = vp.wy(Math.random() * vp.h);
    P.age[i] = 0;
    P.life[i] = 1.5 + Math.random() * 3;
    P.n[i] = 0;
    P.head[i] = 0;
  }
  function resetParticles() { for (let i = 0; i < NP; i++) { spawn(i); P.age[i] = Math.random() * P.life[i]; } }

  /** Time step so the fastest visible flow moves about 6 px per frame. */
  let flowScale = 1;
  function measureFlow() {
    const vals = [];
    for (let k = 0; k < 64; k++) {
      const [u, v] = F(vp.wx(Math.random() * vp.w), vp.wy(Math.random() * vp.h));
      const m = Math.hypot(u, v);
      if (Number.isFinite(m)) vals.push(m);
    }
    vals.sort((p, q) => p - q);
    const typical = vals.length ? vals[Math.floor(vals.length * 0.7)] : 1;
    flowScale = typical > 0 ? 1 / typical : 1;
  }

  function stepParticles(dt) {
    // integration time per frame chosen so typical flow moves ~90 px/s on screen
    const step = (Math.min(0.05, dt) * st.speed * 90 * flowScale) / vp.scale;
    for (let i = 0; i < NP; i++) {
      P.age[i] += dt;
      if (P.age[i] > P.life[i]) { spawn(i); continue; }
      Y[0] = P.x[i]; Y[1] = P.y[i];
      rk4Step(sys, 0, Y, step, work);
      const px = vp.sx(Y[0]), py = vp.sy(Y[1]);
      if (!Number.isFinite(px) || !Number.isFinite(py) || px < -10 || px > vp.w + 10 || py < -10 || py > vp.h + 10 || (Math.abs(px - vp.sx(P.x[i])) < 0.02 && Math.abs(py - vp.sy(P.y[i])) < 0.02 && P.n[i] > 3)) {
        spawn(i);
        continue;
      }
      P.x[i] = Y[0]; P.y[i] = Y[1];
      const hd = (P.head[i] + 1) % TRAIL;
      P.head[i] = hd;
      P.hx[i * TRAIL + hd] = px;
      P.hy[i * TRAIL + hd] = py;
      if (P.n[i] < TRAIL) P.n[i]++;
    }
  }

  function drawParticles(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    for (let seg = 1; seg < TRAIL; seg++) {
      ctx.beginPath();
      for (let i = 0; i < NP; i++) {
        if (P.n[i] <= seg) continue;
        const a = (P.head[i] - seg + 1 + TRAIL) % TRAIL, b = (P.head[i] - seg + TRAIL) % TRAIL;
        ctx.moveTo(P.hx[i * TRAIL + a], P.hy[i * TRAIL + a]);
        ctx.lineTo(P.hx[i * TRAIL + b], P.hy[i * TRAIL + b]);
      }
      ctx.strokeStyle = `rgba(206, 224, 255, ${0.5 * (1 - seg / TRAIL) ** 1.3})`;
      ctx.stroke();
    }
    ctx.restore();
  }

  function pointAt(tr, t) {
    const pts = tr.pts;

    fns: [null, null, null],
    p: { a: 0, b: 0, c: 0, d: 0 },
    count: 3,
    eps: 1e-3,
    speed: 1,
    trail: 4000,
    t: 0,
    autoRotate: true,
    showAxes: true,
    showChart: true,
    cam: { yaw: -0.7, pitch: 0.35, zoom: 1 },
    frame: { cx: 0, cy: 0, cz: 0, s: 1 },
    trajs: [],
    sep: [],
    lyap: null,
  };

  const stripLayer = new Layer(strip, { passive: true });

  // ------------------------------------------------------------------ dynamics
  const sys = (t, Y, dY) => {
    const { a, b, c, d } = st.p;
    dY[0] = st.fns[0](Y[0], Y[1], Y[2], t, a, b, c, d);
    dY[1] = st.fns[1](Y[0], Y[1], Y[2], t, a, b, c, d);
    dY[2] = st.fns[2](Y[0], Y[1], Y[2], t, a, b, c, d);
  };
  const work = rk4Work(3);

  function newTrajectories() {
    // start on the attractor (end of the framing transient) so the structure appears at once
    const [x, y, z] = st.frame.start || st.preset.ic;

      y: Float64Array.of(x + k * st.eps, y, z),
      buf: new Float32Array(3 * 20000),

      n: 0,

    }

        h('dt', null, '时间 t'), h('dd', { id: 'attr-t' }, fmt(st.t, 2)),
        h('dt', null, '轨线间距'), h('dd', null, Number.isFinite(d) ? fmt(d, 3) : '—'),
        h('dt', { html: 'λ<sub>max</sub> 估计' }), h('dd', { id: 'attr-lyap' }, st.lyap == null ? '计算中…' : Number.isFinite(st.lyap) ? fmt(st.lyap, tol.hp ? 4 : 3) : '发散')));

  let dragging = false;

  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('wheel', onWheel, { passive: false });
  cv.addEventListener('dblclick', onDbl);

    stripLayer.resize(r.width, r.height);

  // ------------------------------------------------------------------ panel

  const fields = ['ẋ =', 'ẏ =', 'ż ='].map((prefix, k) => exprField({

  const countSlider = slider({ label: '轨线条数', min: 1, max: 6, step: 1, value: st.count, format: (v) => String(v), onInput: (v) => { st.count = v; restart(false); } });
  const epsSlider = slider({ label: '初值扰动 ε', min: -9, max: -1, step: 1, value: Math.log10(st.eps), format: (v) => `10^${v}`, onInput: (v) => { st.eps = 10 ** v; restart(false); } });

  const panelEl = h('div', null,
    section('系统', [
      presetChips.el,
      ...fields.map((f) => f.el),
      h('div', { class: 'hint', html: '变量 <code>x</code> <code>y</code> <code>z</code> <code>t</code>，参数 <code>a</code>–<code>d</code>。四阶 Runge–Kutta 定步长积分。' }),
      note,
    ]),
    section('参数', [paramBox]),
    section('蝴蝶效应', [

    h('div', { class: 'sep' }),
    diveBtn);
  stage.append(info, progress, banner, tip, inset, transport);

  // ------------------------------------------------------------------ render pipeline
  const pool = createPool([escape, perturb, newton, renderRows], 'renderRows');
  const R = {
    w: 0, h: 0, rs: 1, vals: null, pix: null,
    view: null, // { cx, cy, span } the image shows
    token: 0, cancel: null, maxIter: 0, method: '', bits: 0, skip: 0, refLen: 0,
    vMin: 0, done: false, progress: 0, ms: 0, renders: 0, interior: 0, raised: 0, iterFloor: 0, floorSpan: Infinity,
  };
  let lut = paletteLUT(st.palette);
  let refCache = null;

  function resizeBuffers(w, hh) {
    R.rs = Math.min(layer.dpr, 1.5);
    R.w = Math.max(1, Math.round(w * R.rs));
    R.h = Math.max(1, Math.round(hh * R.rs));
    buf.width = R.w;
    buf.height = R.h;
    R.vals = new Float32Array(R.w * R.h).fill(-2);
    R.pix = new ImageData(R.w, R.h);
  }

  /** Paint values → colours for rows [y0, y1). */
  function paint(y0 = 0, y1 = R.h) {
    const { vals, w } = R;
    const d = R.pix.data;
    const newtonKind = R.view?.kind === 'newton';
    const k1 = 0.85 * st.density;
    for (let p = y0 * w, end = y1 * w; p < end; p++) {
      const v = vals[p];
      const q = 4 * p;
      if (v === -2) { d[q + 3] = 0; continue; }
      d[q + 3] = 255;
      if (v < 0) { d[q] = 6; d[q + 1] = 8; d[q + 2] = 13; continue; }
      if (newtonKind) {
        const root = Math.floor(v / 1000), n = v - 1000 * root;
        const base = NEWTON_HUES[root] || NEWTON_HUES[0];
        const shade = 0.2 + 0.8 * Math.exp(-0.16 * n * st.density);
        const t = (((st.offset + 0.06 * n) % 1) + 1) % 1;
        const li = 3 * ((t * 1024) | 0);
        d[q] = shade * (0.8 * base[0] + 0.2 * lut[li]);
        d[q + 1] = shade * (0.8 * base[1] + 0.2 * lut[li + 1]);
        d[q + 2] = shade * (0.8 * base[2] + 0.2 * lut[li + 2]);
        continue;
      }
      // logarithmic scale: comparable numbers of colour cycles at every depth
      let t = k1 * Math.log(1 + (v - R.vMin) / 6) + st.offset;
      t -= Math.floor(t);
      const li = 3 * ((t * 1024) | 0);
      d[q] = lut[li];
      d[q + 1] = lut[li + 1];
      d[q + 2] = lut[li + 2];
    }
    bufCtx.putImageData(R.pix, 0, 0, 0, y0, w, y1 - y0);
  }

  function currentIterations() {
    const auto = autoIterations(st.span, st.kind);
    return Math.min(MAX_ITER, Math.round(Math.max(auto, R.iterFloor) * st.iterMul));
  }

  /**
   * Render the current view. preview = true: coarse passes only (while dragging or diving).
   */
  function startRender({ preview = false } = {}) {
    R.cancel?.();
    if (!R.w) return;
    const token = ++R.token;
    if (!preview) R.renders++;
    const view = { cx: st.cx, cy: st.cy, span: st.span, kind: st.kind, julia: [...st.julia] };
    const w = R.w, hh = R.h;
    const ps = st.span / w;
    let maxIter = currentIterations();
    const t0 = performance.now();
    const cx = cxN(), cy = cyN();
    // perturbation when doubles cannot resolve the pixels (always available in high precision)
    const usePerturb = hp && DEEP.has(st.kind) && ps < 4e-14 * Math.max(1, Math.hypot(cx, cy));
    let sa = null;
    let shared = { ref: null, refLen: 0 };

    const prepare = () => {
      R.method = usePerturb ? 'perturb' : 'double';
      if (!usePerturb) { pool.broadcast({ ref: null, refLen: 0 }); return; }
      // bits in steps of 64, so a dive into a fixed centre reuses the same reference orbit
      const bits = Math.ceil((-Math.log2(ps) + 64) / 64) * 64;
      const isJulia = st.kind === 'julia';
      const key = `${st.kind}|${B.ratString(st.cx)}|${B.ratString(st.cy)}|${isJulia ? st.julia.join(',') : ''}`;
      let orb;
      if (refCache && refCache.key === key && refCache.bits >= bits && refCache.maxIter >= maxIter) {
        orb = refCache.orb;
      } else {
        const X = toFixed(st.cx, bits), Y = toFixed(st.cy, bits);
        const jx = toFixed(B.fromNumber(st.julia[0]), bits), jy = toFixed(B.fromNumber(st.julia[1]), bits);
        orb = isJulia ? referenceOrbit(X, Y, jx, jy, bits, maxIter) : referenceOrbit(0n, 0n, X, Y, bits, maxIter);
        refCache = { key, bits, maxIter, orb };
      }
      // probes at the corners of the view decide how many iterations the series may skip
      const hw = (w / 2) * ps, hh2 = (hh / 2) * ps;
      sa = seriesApprox(orb.ref, orb.len, isJulia, [[-hw, hh2], [hw, hh2], [-hw, -hh2], [hw, -hh2], [0, hh2], [hw, 0]]);
      shared = { ref: orb.ref, refLen: orb.len };
      pool.broadcast(shared);
      Object.assign(R, { bits, skip: sa.skip, refLen: orb.len });
    };
    prepare();

    const passes = preview ? [8, 3] : [8, 3, 1];
    R.view = view;
    R.done = false;
    R.maxIter = maxIter;
    let passIndex = 0;
    let rowsDone = 0;
    const jobsFor = (step) => {
      const rowsPer = Math.max(step, 8 * step);
      const jobs = [];
      for (let y0 = 0; y0 < hh; y0 += rowsPer) {
        jobs.push({
          kind: st.kind, w, h: hh, y0, y1: Math.min(hh, y0 + rowsPer), step, ps, cx, cy,
          jx: st.julia[0], jy: st.julia[1], maxIter, eps: ps * 1e-3 > 1e-15 ? ps * 1e-3 : 0,
          sa: usePerturb ? sa : null, useRef: usePerturb,
        });
      }
      return jobs;
    };
    const onResult = (job, out) => {
      if (token !== R.token) return;
      const { step, y0, y1 } = job;
      const cols = Math.ceil(w / step);
      let k = 0;
      for (let j = y0; j < y1; j += step) {
        for (let i = 0; i < w; i += step) {
          const v = out[k++];
          // fill the step × step block (finer passes overwrite it later)
          const jEnd = Math.min(hh, j + step), iEnd = Math.min(w, i + step);
          for (let jj = j; jj < jEnd; jj++) R.vals.fill(v, jj * w + i, jj * w + iEnd);
        }
      }
      void cols;
      rowsDone += y1 - y0;
      R.progress = (passIndex + rowsDone / hh) / passes.length;
      paint(y0, y1);
      requestDraw();
    };
    const runPass = () => {
      if (token !== R.token) return;
      if (passIndex >= passes.length) {
        R.done = !preview;
        R.ms = performance.now() - t0;
        R.progress = 1;
        updateReadouts();
        requestDraw();
        return;
      }
      rowsDone = 0;
      R.cancel = pool.run(jobsFor(passes[passIndex]), onResult, () => {
        if (token !== R.token) return;
        if (passIndex === 0) {
          // statistics of the coarse pass: colour scale, and whether the iteration cap is too low
          let vMin = Infinity, inside = 0, nearCap = 0, n = 0;
          for (let p = 0; p < R.vals.length; p += 7) {
            const v = R.vals[p];
            if (v === -2) continue;
            n++;
            if (v < 0) inside++;
            else {
              if (v < vMin) vMin = v;
              if (v > 0.5 * maxIter) nearCap++;
            }
          }
          R.interior = n ? inside / n : 0;
          R.vMin = st.kind === 'newton' || !Number.isFinite(vMin) ? 0 : Math.max(0, vMin - 1);
          // many pixels hit the cap while a fair share of the escaping ones only just made it (or
          // none escaped at all): the cap is probably too low — double it and redo
          const capped = nearCap > 0.02 * n || vMin === Infinity;
          if (!preview && st.kind !== 'newton' && R.interior > 0.25 && capped && R.raised < 4 && maxIter < MAX_ITER && st.iterMul >= 1) {
            R.raised++;
            R.iterFloor = Math.min(MAX_ITER, maxIter * (vMin === Infinity ? 4 : 2));
            R.floorSpan = st.span;
            startRender();
            return;
          }
          paint();
        }
        passIndex++;
        runPass();
      });
    };
    runPass();
    updateReadouts();
    progress.style.opacity = 1;
  }

  let renderTimer = 0;
  function requestRender(delay = 0, opts = {}) {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => startRender(opts), delay);
  }

  /** View changed by the user: preview the old image transformed, re-render soon. */
  function viewChanged({ quick = false } = {}) {
    // forget a raised iteration floor after zooming far back out
    if (st.span > R.floorSpan * 200) { R.iterFloor = 0; R.floorSpan = Infinity; R.raised = 0; }
    if (st.span < R.floorSpan / 1e6) R.raised = 0;
    clampSpan();
    requestDraw();
    const now = performance.now();
    if (now - lastPreviewAt > 60) { lastPreviewAt = now; startRender({ preview: true }); }
    requestRender(quick ? 60 : 220);
    scheduleSync();
  }
  let lastPreviewAt = 0;

  function clampSpan() {
    const lim = minSpan();
    const limited = st.span < lim;
    if (limited) st.span = lim;
    banner.style.display = limited && !hp && DEEP.has(st.kind) ? '' : 'none';
    if (limited && loop.running) setDive(false);
    if (st.span > 50) st.span = 50;
    return limited;
  }

  // ------------------------------------------------------------------ drawing
  let raf = 0;
  const requestDraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };

  function draw() {
    const { ctx } = layer;
    layer.reset();
    ctx.fillStyle = '#06080d';
    ctx.fillRect(0, 0, layer.w, layer.h);
    if (R.view) {
      // where the rendered image sits in the current view (it may be from a previous view)
      const W = layer.w, H = layer.h;
      const k = W / st.span;
      const dx = B.toNumber(B.sub(R.view.cx, st.cx, 40)) * k;
      const dy = B.toNumber(B.sub(R.view.cy, st.cy, 40)) * k;
      const sw = (R.view.span / st.span) * W;
      const sh = sw * (R.h / R.w);
      ctx.imageSmoothingEnabled = Math.abs(sw - W) > 0.5;
      ctx.drawImage(buf, W / 2 + dx - sw / 2, H / 2 - dy - sh / 2, sw, sh);
    }
    drawOverlay();
    progress.firstChild.style.width = `${(R.progress * 100).toFixed(1)}%`;
    progress.style.opacity = R.progress >= 1 ? 0 : 1;
  }

  const toScreen = (x, y) => [layer.w / 2 + ((x - cxN()) / st.span) * layer.w, layer.h / 2 - ((y - cyN()) / st.span) * layer.w];
  const toWorld = (px, py) => [cxN() + ((px - layer.w / 2) / layer.w) * st.span, cyN() - ((py - layer.h / 2) / layer.w) * st.span];

  function drawOverlay() {
    fx.reset();
    const ctx = fx.ctx;
    if (!st.hover || !st.showOrbit || st.span < 1e-9) return;
    const [wx, wy] = toWorld(st.hover.px, st.hover.py);
    let pts;
    if (st.kind === 'mandelbrot') pts = orbit(0, 0, wx, wy, 120);
    else if (st.kind === 'julia') pts = orbit(wx, wy, st.julia[0], st.julia[1], 120);
    else if (st.kind === 'ship') pts = orbit(0, 0, wx, -wy, 120, true).map(([x, y]) => [x, -y]);
    else {
      // Newton: the path of the iterates
      pts = [[wx, wy]];
      let [x, y] = [wx, wy];
      for (let n = 0; n < 40; n++) {
        const x2 = x * x - y * y, y2 = 2 * x * y, x3 = x2 * x - y2 * y, y3 = x2 * y + y2 * x;
        const nr = 2 * x3 + 1, ni = 2 * y3, dr = 3 * x2, di = 3 * y2, den = dr * dr + di * di;
        if (!den) break;
        [x, y] = [(nr * dr + ni * di) / den, (ni * dr - nr * di) / den];
        pts.push([x, y]);
        if (Math.hypot(pts.at(-1)[0] - pts.at(-2)[0], pts.at(-1)[1] - pts.at(-2)[1]) < 1e-9) break;
      }
    }
    ctx.save();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    pts.forEach(([x, y], k) => {
      const [sx, sy] = toScreen(x, y);
      if (k) ctx.lineTo(sx, sy); else ctx.moveTo(sx, sy);
    });
    ctx.stroke();
    pts.forEach(([x, y], k) => {
      const [sx, sy] = toScreen(x, y);
      ctx.beginPath();
      ctx.arc(sx, sy, k === 0 ? 3.5 : 2.2, 0, 2 * Math.PI);
      ctx.fillStyle = k === 0 ? C.v : `rgba(255, 255, 255, ${Math.max(0.25, 0.9 - k * 0.01)})`;
      ctx.fill();
    });
    ctx.restore();
  }

  // ------------------------------------------------------------------ hover: tooltip, Julia inset
  let lastHoverC = null;
  function updateHover() {
    if (!st.hover) { tip.style.display = 'none'; inset.style.display = 'none'; drawOverlay(); return; }
    const { px, py } = st.hover;
    const [wx, wy] = toWorld(px, py);
    lastHoverC = [wx, wy];
    const dg = st.span < 1e-6 ? 12 : 6;
    const zText = `${fmt(wx, dg)} ${wy < 0 ? '−' : '+'} ${fmt(Math.abs(wy), dg)}i`;
    let status = '';
    if (st.kind === 'mandelbrot') {
      const p = attractingPeriod(wx, wy);
      status = p.escaped ? '轨道逃逸：c 不在集合内' : p.period ? `轨道收敛到周期 ${p.period} 的吸引环` : '轨道有界（混沌或收敛很慢）';
    } else if (st.kind === 'julia') {
      const v = escape(wx, wy, st.julia[0], st.julia[1], 2000, false, 0);
      status = v < 0 ? '轨道有界：z₀ 在填充朱利亚集内' : `约 ${fmt(v, 1)} 步后逃逸`;
    } else if (st.kind === 'newton') {
      const v = newton(wx, wy, 100);
      status = v < 0 ? '未收敛' : `收敛到根 ${['1', '−½ + (√3/2)i', '−½ − (√3/2)i'][Math.floor(v / 1000)]}，约 ${Math.round(v % 1000)} 步`;
    } else {
      const v = escape(0, 0, wx, -wy, 2000, true, 0);
      status = v < 0 ? '轨道有界' : `约 ${fmt(v, 1)} 步后逃逸`;
    }
    tip.style.display = '';
    tip.style.left = `${px}px`;
    tip.style.top = `${py}px`;
    tip.textContent = '';
    tip.append(h('div', { class: 't-title' }, `${st.kind === 'mandelbrot' || st.kind === 'ship' ? 'c' : 'z₀'} = ${zText}`), h('div', { class: 't-mono' }, status));
    if (st.kind === 'mandelbrot' && st.showJulia) renderInset(wx, wy);
    else inset.style.display = 'none';
    drawOverlay();
  }

  function renderInset(jx, jy) {
    inset.style.display = '';
    const W = 210, H = 140;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (insetCanvas.width !== W * dpr) { insetCanvas.width = W * dpr; insetCanvas.height = H * dpr; }
    const ctx = insetCanvas.getContext('2d');
    const img = ctx.createImageData(insetCanvas.width, insetCanvas.height);
    const pw = insetCanvas.width, ph = insetCanvas.height;
    const k = 3.4 / pw;
    for (let j = 0; j < ph; j += 2) {
      for (let i = 0; i < pw; i += 2) {
        const v = escape((i - pw / 2) * k, (ph / 2 - j) * k, jx, jy, 160, false, 1e-6);
        let r = 6, g = 8, b = 13;
        if (v >= 0) {
          let t = 0.85 * st.density * Math.log(1 + v / 6) + st.offset;
          t -= Math.floor(t);
          const li = 3 * ((t * 1024) | 0);
          r = lut[li]; g = lut[li + 1]; b = lut[li + 2];
        }
        for (let dj = 0; dj < 2 && j + dj < ph; dj++) {
          for (let di = 0; di < 2 && i + di < pw; di++) {
            const q = 4 * ((j + dj) * pw + i + di);
            img.data[q] = r; img.data[q + 1] = g; img.data[q + 2] = b; img.data[q + 3] = 255;
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    insetLabel.textContent = `朱利亚集 · c = ${fmt(jx, 4)} ${jy < 0 ? '−' : '+'} ${fmt(Math.abs(jy), 4)}i　按 J 打开`;
  }

  // ------------------------------------------------------------------ interaction
  const adapter = {
    get scale() { return layer.w / st.span; },
    wx: (px) => toWorld(px, 0)[0],
    wy: (py) => toWorld(0, py)[1],
    panPx(dx, dy) {
      const k = st.span / layer.w;
      st.cx = B.sub(st.cx, B.fromNumber(dx * k), 0);
      st.cy = B.add(st.cy, B.fromNumber(dy * k), 0);
      tidyCentre();
    },
    zoomAt(px, py, f) {
      // keep the point under the cursor fixed: centre += (p − centre)·(1 − 1/f)
      const k = st.span / layer.w;
      const ox = (px - layer.w / 2) * k, oy = (layer.h / 2 - py) * k;
      const g = 1 - 1 / f;
      st.cx = B.add(st.cx, B.fromNumber(ox * g), 0);
      st.cy = B.add(st.cy, B.fromNumber(oy * g), 0);
      st.span /= f;
      tidyCentre();
    },
  };
  const detach = attachPointer(layer.canvas, adapter, {
    idleCursor: 'crosshair',
    onClick(x, y, e, px, py) {
      adapter.zoomAt(px, py, e.shiftKey ? 1 / 2.5 : 2.5);
      viewChanged({ quick: true });
    },
    onHover(px, py) { st.hover = { px, py }; requestHover(); },
    onLeave() { st.hover = null; updateHover(); },
    onView: () => { st.hover = null; tip.style.display = 'none'; viewChanged(); },
  });
  let hoverRaf = 0;
  const requestHover = () => { if (!hoverRaf) hoverRaf = requestAnimationFrame(() => { hoverRaf = 0; updateHover(); }); };

  function zoomBy(f) {
    adapter.zoomAt(layer.w / 2, layer.h / 2, f);
    viewChanged({ quick: true });
  }

  function goTo(loc, { quiet = false } = {}) {
    setDive(false);
    Object.assign(st, viewOf(loc));
    R.iterFloor = 0; R.floorSpan = Infinity; R.raised = 0;
    if (loc.hp && !hp && !quiet) {
      toast('这个位置要在高精度下渲染：已为你开启高精度');
      syncQuery();
      updateSettings({ precision: 'high' }); // re-creates the module from the URL
      return;
    }
    clampSpan();
    startRender();
    syncQuery();
    paintPresets();
  }

  function setKind(kind) {
    setDive(false);
    st.kind = kind;
    kindSeg.set(kind);
    goTo(LOCATIONS[kind][0], { quiet: true });
    paintKindUI();
  }

  // ------------------------------------------------------------------ dive
  let lastPreview = 0;
  const loop = animationLoop((dt, now) => {
    const f = Math.exp(DIVE_RATE * dt);
    adapter.zoomAt(layer.w / 2, layer.h / 2, f);
    if (clampSpan()) { requestDraw(); return; }
    requestDraw();
    if (now - lastPreview > 280) { lastPreview = now; startRender({ preview: true }); }
    scheduleSync();
  });
  function setDive(on) {
    if (on === loop.running) return;
    if (on) { loop.start(); diveBtn.innerHTML = ''; diveBtn.append(iconEl('pause')); }
    else { loop.stop(); diveBtn.innerHTML = ''; diveBtn.append(iconEl('play')); if (R.w) requestRender(120); }
  }
  const iconEl = (name) => {
    const t = document.createElement('template');
    t.innerHTML = name === 'pause'
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/><rect x="13.5" y="5.5" width="4" height="13" rx="1" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5 v13 l11-6.5 z" fill="currentColor"/></svg>';
    return t.content.firstElementChild;
  };

  // ------------------------------------------------------------------ panel
  const kindSeg = segmented({
    id: 'fractal-kind',
    options: Object.entries(KINDS).map(([value, k]) => ({ value, label: k.label })),
    value: st.kind,
    onChange: (v) => setKind(v),
  });
  const kindNote = h('div', { class: 'hint', id: 'fractal-note' });
  const jre = h('input', { class: 'num-input', type: 'text', id: 'julia-re', 'aria-label': 'Re c', spellcheck: 'false' });
  const jim = h('input', { class: 'num-input', type: 'text', id: 'julia-im', 'aria-label': 'Im c', spellcheck: 'false' });
  const juliaChips = chips({
    id: 'julia-presets',
    items: JULIAS.map((j) => ({ id: j.id, label: j.label })),
    onPick: (id) => setJulia(JULIAS.find((j) => j.id === id).c),
  });
  const juliaBox = h('div', { class: 'field', id: 'julia-box' },
    h('div', { class: 'field-row julia-c' }, h('span', { class: 'label', html: '<span class="math">c</span> =' }), jre, h('span', { class: 'label' }, '+'), jim, h('span', { class: 'label math' }, 'i')),
    juliaChips.el);
  for (const inp of [jre, jim]) {
    inp.addEventListener('input', () => {
      try {
        const v = [evalConstant(jre.value), evalConstant(jim.value)];
        if (!v.every(Number.isFinite)) throw new Error('x');
        jre.classList.remove('invalid'); jim.classList.remove('invalid');
        st.julia = v;
        juliaChips.set(null);
        startRender();
        scheduleSync();
      } catch { inp.classList.add('invalid'); }
    });
    inp.addEventListener('keydown', (e) => e.stopPropagation());
  }
  function setJulia(c) {
    st.julia = [...c];
    jre.value = fmt(c[0], 6);
    jim.value = fmt(c[1], 6);
    const m = JULIAS.find((j) => j.c[0] === c[0] && j.c[1] === c[1]);
    juliaChips.set(m ? m.id : null);
    if (st.kind !== 'julia') setKind('julia');
    else { startRender(); syncQuery(); }
  }

  const presetBox = h('div', { id: 'fractal-presets' });
  let presetChips = null;
  function paintPresets() {
    presetBox.textContent = '';
    presetChips = chips({
      items: LOCATIONS[st.kind].map((l) => ({ id: l.id, label: l.hp ? `${l.label} <span class="chip-badge">高精度</span>` : l.label })),
