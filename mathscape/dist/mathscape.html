.hp-body { display: flex; flex-direction: column; gap: 10px; }
.hp-body:empty { display: none; }
.hp-mode { padding: 9px 11px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); color: var(--text-2); font-size: 12px; line-height: 1.6; }
.hp-mode.exact { border-color: rgba(74, 222, 128, 0.28); background: rgba(74, 222, 128, 0.06); }
.hp-list { display: flex; flex-direction: column; gap: 12px; }
.hp-row { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hp-label { color: var(--text-3); font-size: 12px; }
.hp-label .math, .hp-pow .math { font-family: var(--math); font-style: italic; font-size: 13.5px; color: var(--text-2); }
.hp-form { font-family: var(--math); font-size: 15px; color: var(--text); overflow-wrap: anywhere; line-height: 1.5; }
.hp-form.bad { color: var(--danger); font-family: var(--font); font-size: 13px; }
.bigwrap { position: relative; display: flex; align-items: flex-start; gap: 4px; min-width: 0; }
.bignum {
  flex: 1;
  min-width: 0;
  padding: 5px 8px;
  border-radius: 7px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text);
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.bignum .pre { margin-right: 6px; color: var(--text-3); font-family: var(--font); word-break: normal; }
.bignum.clamped {
  max-height: calc(3 * 1.6em + 10px);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent);
  mask-image: linear-gradient(180deg, #000 60%, transparent);
}
.bigtools { display: flex; flex-direction: column; gap: 3px; flex: none; }
.mini-btn {
  display: grid;
  place-items: center;
  min-width: 24px;
  height: 24px;
  padding: 0 4px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 11px;
  cursor: pointer;
}
.mini-btn:hover { color: var(--text); background: rgba(148, 163, 184, 0.08); border-color: var(--border); }
.mini-btn svg { width: 13px; height: 13px; }
.hp-mat {
  display: inline-grid;
  grid-template-columns: auto auto;
  gap: 2px 16px;
  align-self: flex-start;
  max-width: 100%;
  padding: 3px 10px;
  border-left: 1.5px solid var(--text-3);
  border-right: 1.5px solid var(--text-3);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 12px;
  text-align: right;
  overflow-wrap: anywhere;
}
.hp-sub { margin-top: 6px; color: var(--text-2); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; }
.hp-summary { padding: 8px 11px; border-radius: var(--radius-sm); font-size: 12.5px; line-height: 1.6; border: 1px solid; }
.hp-summary.good { color: #bbf7d0; background: rgba(74, 222, 128, 0.07); border-color: rgba(74, 222, 128, 0.25); }
.hp-summary.warn { color: #fde68a; background: rgba(251, 191, 36, 0.07); border-color: rgba(251, 191, 36, 0.3); }
.hp-summary.bad { color: #fecdd3; background: rgba(255, 107, 129, 0.08); border-color: rgba(255, 107, 129, 0.35); }
.hp-cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12px; align-items: baseline; }
.hp-cmp .th { color: var(--text-3); font-size: 11px; }
.hp-cmp .mono { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.hp-cmp .good { color: var(--ok); }
.hp-cmp .warn { color: var(--warn); }
.hp-cmp .bad { color: var(--danger); }
.hp-pow { display: flex; flex-direction: column; gap: 8px; margin-top: 14px !important; padding-top: 12px; border-top: 1px dashed var(--border-strong); }
.hp-pow .field-row .label { flex: 1; }
.hp-pow .num-input { width: 96px; flex: none; }
.hp-pow .num-input.invalid { border-color: var(--danger); }
.hp-pow-out { display: flex; flex-direction: column; gap: 8px; }
.hp-pow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hp-pow-grid .bignum.clamped { max-height: calc(2 * 1.6em + 10px); }
.hp-time { text-align: right; }

/* ------------------------------------------------------------------ stage overlays */

.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.layer.passive { pointer-events: none; }

.overlay-card {
  position: absolute;
  z-index: 2;
  padding: 12px 14px;
  border-radius: 12px;
  background: rgba(13, 18, 28, 0.72);
  border: 1px solid var(--border-strong);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  font-size: 12.5px;
  pointer-events: none;
}
.overlay-card.interactive { pointer-events: auto; }
.overlay-card .title { font-size: 11.5px; color: var(--text-3); letter-spacing: 0.06em; margin-bottom: 6px; }
.overlay-card .big { font-family: var(--mono); font-size: 13px; }
.overlay-card .phase { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); color: var(--text-2); font-size: 12px; }
.overlay-card .hp-badge { display: inline-block; margin-top: 8px; padding: 1px 8px; border-radius: 999px; background: rgba(167, 139, 250, 0.16); color: #ddd1ff; font-size: 11px; }
.tl { top: 12px; left: 12px; }
.tr { top: 12px; right: 12px; }
.bl { bottom: 12px; left: 12px; }
.br { bottom: 12px; right: 12px; }

.stage-hint {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(13, 18, 28, 0.7);
  border: 1px solid var(--border);
  color: var(--text-3);
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 0.4s;
}

.transport {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px;
  border-radius: 14px;
  background: rgba(13, 18, 28, 0.78);
  border: 1px solid var(--border-strong);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}
.transport .icon-btn { width: 38px; height: 38px; }
.transport .play { background: var(--accent); color: #0a1020; }
.transport .play:hover { background: #95b6ff; color: #0a1020; }
.transport .icon-btn.active { background: var(--accent-soft); color: var(--text); border-color: rgba(122, 162, 255, 0.4); }
.transport .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--border-strong); }
.transport .time { font-family: var(--mono); font-size: 12px; color: var(--text-2); padding: 0 8px; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }

.split { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.pane { position: relative; overflow: hidden; background: var(--bg-2); min-width: 0; min-height: 0; }
.pane-label {
  position: absolute;
  z-index: 2;
  top: 10px;
  left: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(13, 18, 28, 0.72);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
  pointer-events: none;
}
.pane-label .math { font-family: var(--math); font-style: italic; color: var(--text); font-size: 13.5px; }
.pane-tools { position: absolute; z-index: 2; top: 8px; right: 8px; display: flex; gap: 4px; }
.pane-tools .icon-btn { width: 30px; height: 30px; background: rgba(13, 18, 28, 0.6); border-color: var(--border); }

.bottom-strip {
  position: absolute;
  z-index: 2;
  left: 12px;
  right: 12px;
  bottom: 12px;
  height: 128px;
  border-radius: 12px;
  background: rgba(13, 18, 28, 0.78);
  border: 1px solid var(--border-strong);
  backdrop-filter: blur(10px);
  overflow: hidden;
}

.tooltip {
  position: absolute;
  z-index: 5;
  padding: 8px 10px;
  border-radius: 9px;
  background: rgba(10, 14, 22, 0.92);
  border: 1px solid var(--border-strong);
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  transform: translate(14px, 14px);
}
.tooltip .t-title { font-weight: 600; margin-bottom: 3px; }
.tooltip .t-mono { font-family: var(--mono); color: var(--text-2); }

/* progressive rendering, banners and insets on the stage */

.render-progress { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 2px; pointer-events: none; transition: opacity 0.5s; }
.render-progress .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 10px var(--accent-glow); transition: width 0.15s linear; }
.stage-banner {
  position: absolute;
  z-index: 4;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  width: max-content;
  max-width: calc(100% - 24px);
  padding: 9px 10px 9px 14px;
  border-radius: 12px;
  background: rgba(40, 24, 12, 0.88);
  border: 1px solid rgba(251, 191, 36, 0.45);
  color: #fde68a;
  font-size: 12.5px;
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
.stage-banner .btn { flex: none; }
.overlay-card.inset { padding: 6px; pointer-events: none; }
.inset-canvas { display: block; width: 210px; height: 140px; border-radius: 8px; }
.inset-label { margin-top: 5px; color: var(--text-2); font-size: 11px; text-align: center; }
.julia-c { gap: 6px; }
.julia-c .num-input { flex: 1; min-width: 0; }
.julia-c .num-input.invalid { border-color: var(--danger); }
.label.math, .field-row .math { font-family: var(--math); font-style: italic; }

/* canvases inside the panel (cobweb plots, previews) and small tables */

.panel-canvas { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-2); }
#cobweb { aspect-ratio: 1; }
#series { height: 90px; }
.feigen-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.table-scroll { overflow-x: auto; margin: 0 -2px; }
.prime-table td.mono { overflow-wrap: normal; white-space: nowrap; padding-bottom: 5px; }
.prime-table .diffs { display: flex; gap: 12px; font-size: 10.5px; color: var(--text-3); }
.prime-table .diffs .li { color: #67e8f9; }
.prime-table .diffs .r { color: var(--ok); }
.feigen-table th { color: var(--text-3); font-weight: 500; text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--border); }
.feigen-table td { padding: 2px 4px; color: var(--text-2); vertical-align: top; }
.feigen-table td.mono { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.feigen-table b.good, .readout dd b.good { color: var(--ok); font-weight: 600; }

/* elementary cellular automaton rule editor */

.rule-bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.rule-bit { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-2); cursor: pointer; }
.rule-bit:hover { border-color: var(--border-strong); }
.rule-bit .nbhd, .rule-bit .out { display: flex; gap: 1px; }
.rule-bit i { display: block; width: 8px; height: 8px; border-radius: 1.5px; background: var(--surface-3); }
.rule-bit i.on { background: #a5d8ff; }
.rule-bit.on { border-color: rgba(122, 162, 255, 0.45); }
.rule-bit .out i { width: 10px; height: 10px; }

/* colour swatches and legends */

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
.swatch-btn:hover { transform: scale(1.1); }
.swatch-btn.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text-3); font-size: 11.5px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .ln { display: inline-block; width: 18px; height: 0; border-top: 2px solid rgba(122, 162, 255, 0.85); }
.legend .ln.dash { border-top: 2px dashed rgba(244, 114, 182, 0.85); }
.legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }

/* ------------------------------------------------------------------ modal & toast */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: rgba(4, 6, 10, 0.6);
  backdrop-filter: blur(4px);
  animation: fade-in 0.2s var(--ease);
}
.modal {
  width: min(640px, calc(100vw - 32px));
  max-height: calc(100vh - 64px);
  overflow: auto;
  padding: 22px 24px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  animation: pop-in 0.25s var(--ease);
}
.modal h2 { margin: 0 0 4px; font-size: 18px; }
.modal h3 { margin: 18px 0 8px; font-size: 13px; color: var(--text-2); letter-spacing: 0.06em; }
.modal ul { margin: 0; padding-left: 18px; color: var(--text-2); line-height: 1.8; font-size: 13px; }
.modal .shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; color: var(--text-2); }
.modal .close { float: right; }
.modal .prec-controls { margin-top: 4px; }
.prec-effects { margin-top: 12px !important; }
.prec-effects b { color: var(--text); font-weight: 600; }
.prec-effects sup, .home sup { font-size: 0.72em; line-height: 0; }

.prec-controls { display: flex; flex-direction: column; gap: 12px; }
.prec-controls .segmented button { height: 32px; }
.prec-controls .prec-digits { transition: opacity 0.2s; }
.prec-controls:not(.hp) .prec-digits { opacity: 0.55; }
.prec-controls.hp .segmented button.on[data-value="high"] { background: linear-gradient(180deg, rgba(167, 139, 250, 0.32), rgba(122, 162, 255, 0.22)); color: #f1ebff; }

.toasts { position: fixed; z-index: 60; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  padding: 9px 16px;
  border-radius: 10px;
  background: rgba(22, 30, 46, 0.95);
  border: 1px solid var(--border-strong);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  font-size: 13px;
  animation: toast-in 0.25s var(--ease);
}
.toast.out { opacity: 0; transform: translateY(-6px); transition: all 0.3s; }

@keyframes fade-in { from { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } }

.module-enter { animation: module-in 0.35s var(--ease); }
@keyframes module-in { from { opacity: 0; transform: translateY(4px); } }

/* ------------------------------------------------------------------ start page */

.home { display: none; }
.app.at-home { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
.app.at-home .main, .app.at-home .panel { display: none; }
.app.at-home .home {
  display: block;
  min-width: 0;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--surface-3) transparent;
}

.hero {
  position: relative;
  isolation: isolate;
  min-height: min(560px, 76vh);
  margin: 14px 14px 0 18px;
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  background: #070a10;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03);
}
.hero-canvas { position: absolute; inset: 0; z-index: 0; }
.hero-canvas canvas { touch-action: auto; cursor: crosshair; }
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(90deg, rgba(7, 10, 16, 0.94) 0%, rgba(7, 10, 16, 0.8) 32%, rgba(7, 10, 16, 0.18) 64%, rgba(7, 10, 16, 0) 80%),
    linear-gradient(0deg, rgba(7, 10, 16, 0.85) 0%, rgba(7, 10, 16, 0) 32%);
}
.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 640px;
  padding: 72px 56px 56px;
  pointer-events: none;
}
.hero-inner a { pointer-events: auto; }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: rgba(17, 23, 36, 0.7);
  color: var(--text-2);
  font-size: 12px;
  letter-spacing: 0.04em;
  animation: rise 0.6s var(--ease) both;
}
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); animation: pulse 2.2s infinite; }
.hero-title {
  margin: 20px 0 14px;
  font-size: clamp(40px, 5.6vw, 70px);
  font-weight: 750;
  line-height: 1.04;
  letter-spacing: -0.02em;
  animation: rise 0.7s 0.05s var(--ease) both;
}
.grad {
  background: linear-gradient(100deg, #9cbcff 0%, var(--accent) 35%, var(--accent-2) 75%, #f0abfc 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.lead { max-width: 33em; margin: 0; color: var(--text-2); font-size: 16px; line-height: 1.75; animation: rise 0.7s 0.1s var(--ease) both; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; animation: rise 0.7s 0.15s var(--ease) both; }
.btn.big { height: 44px; padding: 0 20px; border-radius: 11px; font-size: 14.5px; text-decoration: none; }
.btn.big svg { width: 16px; height: 16px; transition: transform 0.2s var(--ease); }
.btn.big:hover svg { transform: translateX(3px); }
.btn.ghost.big { background: rgba(17, 23, 36, 0.65); backdrop-filter: blur(6px); color: var(--text); }
a.btn { color: var(--text); text-decoration: none; }
a.btn.primary { color: #0a1020; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 14px 32px; margin-top: 40px; animation: rise 0.7s 0.2s var(--ease) both; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.stat span { color: var(--text-3); font-size: 12px; }
.hero-caption {
  position: absolute;
  z-index: 2;
  right: 16px;
  bottom: 12px;
  color: var(--text-3);
  font-size: 11.5px;
  pointer-events: none;
}

.home-section { margin: 26px 14px 0 18px; }
.home-section-head { display: flex; align-items: baseline; gap: 14px; margin: 0 2px 14px; }
.home-section-head h2 { margin: 0; font-size: 18px; font-weight: 650; }
.muted { color: var(--text-3); font-size: 13px; }
p.muted { margin: 0; line-height: 1.7; }

.module-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1180px) { .module-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .module-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .module-grid { grid-template-columns: 1fr; } }
.mcard {
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
  overflow: hidden;
  transition: transform 0.25s var(--ease), border-color 0.25s, box-shadow 0.25s;
  animation: rise 0.6s var(--ease) both;
}
.mcard:hover { transform: translateY(-3px); border-color: rgba(122, 162, 255, 0.42); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(122, 162, 255, 0.12); }
.mcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mcard-preview { position: relative; aspect-ratio: 16 / 10; background: var(--bg-2); border-bottom: 1px solid var(--border); }
.mcard-body { display: flex; flex: 1; flex-direction: column; padding: 14px 16px 16px; }
.mcard-head { display: flex; align-items: center; gap: 9px; }
.mcard-head h3 { margin: 0; font-size: 15.5px; font-weight: 650; }
.mcard-head kbd { margin-left: auto; }
.mcard-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); flex: none; }
.mcard-icon svg { width: 17px; height: 17px; }
.mcard-body p { margin: 8px 0 10px; color: var(--text-3); font-size: 12.5px; line-height: 1.6; }
.mcard-body ul { margin: 0 0 14px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.mcard-body li { position: relative; padding-left: 14px; color: var(--text-2); font-size: 12.5px; }
.mcard-body li::before { content: ""; position: absolute; left: 2px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.7; }
.mcard-go { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; color: var(--accent); font-size: 13px; font-weight: 600; }

  if (k < 0) throw new RangeError('pow10: negative exponent');
  if (k < 1024) {
    while (P10.length <= k) P10.push(P10[P10.length - 1] * 10n);
    return P10[k];
  }
  return 10n ** BigInt(k);
}

/** Number of decimal digits of |x| (0 for 0). */
const ndigits = (x) => (x === 0n ? 0 : babs(x).toString().length);

/** round(a / b), halves away from zero. */
function rdiv(a, b) {
  if (b < 0n) { a = -a; b = -b; }
  let q = a / b;
  const r = a - q * b;
  if (2n * babs(r) >= b) q += a < 0n ? -1n : 1n;
  return q;
}

/** floor(a / b) for b > 0. */
function fdiv(a, b) {
  const q = a / b;
  return a < 0n && q * b !== a ? q - 1n : q;
}

/** ⌊√n⌋ for n ≥ 0 (Newton from above). */
function isqrt(n) {
  if (n < 0n) throw new DomainError('负数不能开平方');
  if (n < 2n) return n;
  let x = 1n << BigInt((n.toString(16).length * 4 >> 1) + 1);
  for (;;) {
    const y = (x + n / x) >> 1n;
    if (y >= x) return x;
    x = y;
  }
}

/** ⌊n^(1/k)⌋ for n ≥ 0, k ≥ 1. */
function iroot(n, k) {
  if (k === 1) return n;
  if (n < 2n) return n;
  const K = BigInt(k);
  let x = 1n << BigInt(Math.ceil((n.toString(16).length * 4) / k) + 1);
  for (;;) {
    const y = ((K - 1n) * x + n / x ** (K - 1n)) / K;
    if (y >= x) return x;
    x = y;
  }
}

// ---------------------------------------------------------------------------------------------
// Values

/** The exact rational n/d in lowest terms. */
function rat(n, d = 1n) {
  n = BigInt(n);
  d = BigInt(d);
  if (d === 0n) throw new DomainError('除以零');
  if (d < 0n) { n = -n; d = -d; }
  const g = gcd(n, d);
  return g > 1n ? { q: true, n: n / g, d: d / g } : { q: true, n, d };
}

const approx = (m, e) => ({ q: false, m, e });
const ZERO_APPROX = approx(0n, 0);

const ZERO = rat(0n);
const ONE = rat(1n);
const TWO = rat(2n);

const isExact = (x) => x.q;
const isZero = (x) => (x.q ? x.n === 0n : x.m === 0n);
const isInteger = (x) => x.q && x.d === 1n;
function sign(x) {
  const v = x.q ? x.n : x.m;
  return v > 0n ? 1 : v < 0n ? -1 : 0;
}

/** Round m · 10^e to at most W significant digits. */
function round(m, e, W) {
  if (m === 0n) return ZERO_APPROX;
  const k = ndigits(m) - W;
  if (k > 0) {
    m = rdiv(m, pow10(k));
    e += k;
  }
  return approx(m, e);
}

/** x as an approximation with W significant digits. */
function toApprox(x, W) {
  if (!x.q) return round(x.m, x.e, W);
  if (x.n === 0n) return ZERO_APPROX;
  const s = W + 1 + ndigits(x.d) - ndigits(x.n);
  const m = s >= 0 ? rdiv(x.n * pow10(s), x.d) : rdiv(x.n, x.d * pow10(-s));
  return round(m, -s, W);
}

/** Decimal exponent of the leading digit (x ≈ d.ddd × 10^mag); −Infinity for 0. */
function mag(x) {
  if (isZero(x)) return -Infinity;
  const a = toApprox(x, 4);
  return a.e + ndigits(a.m) - 1;
}

/** Exact value of a JavaScript number (every finite double is a dyadic rational). */
function fromNumber(v) {
  if (!Number.isFinite(v)) throw new DomainError('数值不是有限数');
  if (Number.isInteger(v)) return rat(BigInt(v));
  let k = 0;
  while (!Number.isInteger(v)) { v *= 2; k++; }
  return rat(BigInt(v), 1n << BigInt(k));
}

/** Exact value of a decimal literal such as "12", "0.1", ".5", "1.25e-3". */
function fromDecimal(str) {
  const m = /^([+-]?)(\d*)(?:\.(\d*))?(?:[eE]([+-]?\d+))?$/.exec(String(str).trim());
  if (!m || (m[2] === '' && (m[3] ?? '') === '')) throw new DomainError(`无法识别的数字 “${str}”`);
  const frac = m[3] || '';
  let n = BigInt((m[2] || '0') + frac);
  let d = pow10(frac.length);
  const ex = Number(m[4] || 0);
  if (Math.abs(ex) > 100000) throw new DomainError('指数过大');
  if (ex > 0) n *= pow10(ex);
  else if (ex < 0) d *= pow10(-ex);
  return rat(m[1] === '-' ? -n : n, d);
}

/** Nearest double. */
function toNumber(x) {
  if (x.q && ndigits(x.n) < 16 && ndigits(x.d) < 16) return Number(x.n) / Number(x.d);
  return Number(toDecimal(x, 20, { ascii: true, sci: true }));
}

// ---------------------------------------------------------------------------------------------
// Arithmetic

function neg(x) {
  return x.q ? { q: true, n: -x.n, d: x.d } : approx(-x.m, x.e);
}

function abs(x) {
  return sign(x) < 0 ? neg(x) : x;
}

function add(x, y, W) {
  if (x.q && y.q) return rat(x.n * y.d + y.n * x.d, x.d * y.d);
  const a = toApprox(x, W);
  const b = toApprox(y, W);
  if (a.m === 0n) return b;
  if (b.m === 0n) return a;
  const ta = a.e + ndigits(a.m);
  const tb = b.e + ndigits(b.m);
  if (ta - tb > W + 2) return a;
  if (tb - ta > W + 2) return b;
  const e = Math.min(a.e, b.e);
  return round(a.m * pow10(a.e - e) + b.m * pow10(b.e - e), e, W);
}

const sub = (x, y, W) => add(x, neg(y), W);

function mul(x, y, W) {
  if ((x.q && x.n === 0n) || (y.q && y.n === 0n)) return ZERO;
  if (x.q && y.q) return rat(x.n * y.n, x.d * y.d);
  const a = toApprox(x, W);
  const b = toApprox(y, W);
  return round(a.m * b.m, a.e + b.e, W);
}

function div(x, y, W) {
  if (isZero(y)) throw new DomainError('除以零');
  if (x.q && x.n === 0n) return ZERO;
  if (x.q && y.q) return rat(x.n * y.d, x.d * y.n);
  const a = toApprox(x, W);
  const b = toApprox(y, W);
  if (a.m === 0n) return a;
  const s = W + 1 + ndigits(b.m) - ndigits(a.m);
  const m = s >= 0 ? rdiv(a.m * pow10(s), b.m) : rdiv(a.m, b.m * pow10(-s));
  return round(m, a.e - b.e - s, W);
}

const cmp = (x, y, W) => sign(sub(x, y, W));

/** x^k for an integer k (BigInt or number). */
function powInt(x, k, W) {
  k = BigInt(k);
  if (k < 0n) return div(ONE, powInt(x, -k, W), W);
  if (k === 0n) return ONE;
  // exact while the result stays a manageable size (about 200 000 digits)
  if (x.q && Number(k) * (ndigits(x.n) + ndigits(x.d)) <= 200000) return rat(x.n ** k, x.d ** k);
  const Wk = W + 2 + ndigits(k);
  let r = ONE;
  let b = x;
  while (k > 0n) {
    if (k & 1n) r = mul(r, b, Wk);
    k >>= 1n;
    if (k > 0n) b = mul(b, b, Wk);
  }
  return toApprox(r, W);
}

function sqrt(x, W) {
  const s = sign(x);
  if (s < 0) throw new DomainError('负数不能开平方');
  if (s === 0) return x;
  if (x.q) {
    const rn = isqrt(x.n);
    const rd = isqrt(x.d);
    if (rn * rn === x.n && rd * rd === x.d) return rat(rn, rd);
  }
  const a = toApprox(x, W + 2);
  let shift = Math.max(0, 2 * W + 4 - ndigits(a.m));
  if ((a.e - shift) % 2 !== 0) shift++;
  return round(isqrt(a.m * pow10(shift)), (a.e - shift) / 2, W);
}

// ---------------------------------------------------------------------------------------------
// Fixed point and constants

/** round(x · 10^F) for F ≥ 0. */
function fixed(x, F) {
  if (x.q) return rdiv(x.n * pow10(F), x.d);
  const k = x.e + F;
  return k >= 0 ? x.m * pow10(k) : rdiv(x.m, pow10(-k));
}

/** atan(1/k) · 10^F. */
function atanInv(k, F) {
  let x = pow10(F) / k;
  const k2 = k * k;
  let sum = x;
  let n = 1n;
  let minus = true;
  while (x !== 0n) {
    x /= k2;
    n += 2n;
    sum += minus ? -(x / n) : x / n;
    minus = !minus;
  }
  return sum;
}

/** atanh(1/k) · 10^F. */
function atanhInv(k, F) {
  let x = pow10(F) / k;
  const k2 = k * k;
  let sum = x;
  let n = 1n;
  while (x !== 0n) {
    x /= k2;
    n += 2n;
    sum += x / n;
  }
  return sum;
}

const CONSTS = { pi: { F: -1, v: 0n }, ln2: { F: -1, v: 0n }, ln10: { F: -1, v: 0n } };
function constant(name, F, compute) {
  const c = CONSTS[name];
  if (c.F < F) {
    const G = F + 10;
    CONSTS[name] = { F: G, v: compute(G) };
  }
  const { F: G, v } = CONSTS[name];
  return G === F ? v : v / pow10(G - F);
}
const PI = (F) => constant('pi', F, (G) => 4n * (4n * atanInv(5n, G) - atanInv(239n, G))); // Machin
const LN2 = (F) => constant('ln2', F, (G) => 2n * atanhInv(3n, G));
const LN10 = (F) => constant('ln10', F, (G) => 3n * LN2(G) + 2n * atanhInv(9n, G)); // 10 = 2³ · 1.25

const pi = (W) => round(PI(W + 2), -(W + 2), W);

// ---------------------------------------------------------------------------------------------
// Elementary functions

function exp(x, W) {
  if (isZero(x)) return x.q ? ONE : toApprox(ONE, W);
  if (sign(x) < 0) return div(ONE, exp(neg(x), W + 2), W);
  if (cmp(x, rat(100000n), 8) > 0) throw new DomainError('exp 的参数过大');
  const F = W + 12 + Math.max(0, mag(x) + 1);
  const S = pow10(F);
  const X = fixed(x, F);
  const L = LN2(F);
  const k = rdiv(X, L); // x = k·ln 2 + r, |r| ≤ ln 2 / 2
  const r = (X - k * L) / 4096n; // r / 2¹²
  // u = exp(r) − 1 by Taylor, then (1 + u)² − 1 = 2u + u² twelve times
  let u = r;
  let term = r;
  for (let n = 2n; term !== 0n; n++) {
    term = (term * r) / (S * n);
    u += term;
  }
  for (let i = 0; i < 12; i++) u = 2n * u + (u * u) / S;
  return round((S + u) << k, -F, W);
}

function ln(x, W) {
  if (sign(x) <= 0) throw new DomainError('对数的参数必须为正');
  if (x.q && x.n === x.d) return ZERO;
  const xm1 = sub(x, ONE, W + 4);
  if (isZero(xm1)) return ZERO_APPROX;
  const F = W + 12 + Math.max(0, -mag(xm1));
  const S = pow10(F);
  const a = toApprox(x, F);
  const k = ndigits(a.m);
  const E = a.e + k - 1; // x = y · 10^E, 1 ≤ y < 10
  const sh = F - k + 1;
  let Y = sh >= 0 ? babs(a.m) * pow10(sh) : rdiv(babs(a.m), pow10(-sh));
  const y = Number(a.m.toString().slice(0, 16)) / 10 ** (Math.min(16, k) - 1);
  const j = Math.round(Math.log2(y)); // y / 2^j ∈ [0.7, 1.42]
  if (j > 0) Y = rdiv(Y, 1n << BigInt(j));
  const z = rdiv((Y - S) * S, Y + S); // ln Y = 2 atanh((Y − 1)/(Y + 1))
  const z2 = (z * z) / S;
  let term = z;
  let sum = z;
  let n = 1n;
  while (term !== 0n) {
    term = (term * z2) / S;
    n += 2n;
    sum += term / n;
  }
  return round(2n * sum + BigInt(j) * LN2(F) + BigInt(E) * LN10(F), -F, W);
}

/** [sin, cos] of x · 10^-F, both scaled by 10^F. */
function sinCosFixed(X, F) {
  const S = pow10(F);
  const half = PI(F) / 2n;
  const k = rdiv(X, half);
  const R = X - k * half; // |R| ≤ π/4
  const R2 = (R * R) / S;
  let s = R;
  let t = R;
  for (let n = 1n; t !== 0n; n += 2n) {
    t = -(t * R2) / (S * (n + 1n) * (n + 2n));
    s += t;
  }
  let c = S;
  t = S;
  for (let n = 0n; t !== 0n; n += 2n) {
    t = -(t * R2) / (S * (n + 1n) * (n + 2n));
    c += t;
  }
  return [[s, c], [c, -s], [-s, -c], [-c, s]][Number(((k % 4n) + 4n) % 4n)];
}

/**
 * Shared driver for functions whose result can be much smaller than their argument (sin near kπ,
 * cos near π/2 + kπ). An exact argument is retried with more digits until the result has W
 * significant digits; for an approximate argument a result below its own uncertainty is
 * reported as (approximately) zero.
 */
function fixedResult(x, W, F0, compute) {
  let F = F0;
  const xm = isZero(x) ? 0 : mag(x);
  for (let attempt = 0; attempt < 4; attempt++) {
    const v = compute(F);
    if (ndigits(v) >= W + 2) return round(v, -F, W);
    if (!x.q) {
      const noise = F + xm - W + 3;
      if (noise > 0 && babs(v) <= pow10(noise)) return ZERO_APPROX;
      if (noise <= 0) return round(v, -F, W);
    }
    F += W + 4 - ndigits(v);
  }
  return round(compute(F), -F, W);
}

function trig(x, W, which) {
  if (isZero(x)) return which === 0 ? x : x.q ? ONE : toApprox(ONE, W);
  const xm = mag(x);
  if (xm > 60) throw new DomainError('三角函数的参数过大');
  const F0 = W + 12 + Math.abs(xm);
  return fixedResult(x, W, F0, (F) => sinCosFixed(fixed(x, F), F)[which]);
}

const sin = (x, W) => trig(x, W, 0);
const cos = (x, W) => trig(x, W, 1);
const tan = (x, W) => div(sin(x, W + 4), cos(x, W + 4), W);

/** atan(X · 10^-F) · 10^F for |X| ≤ 10^F. */
function atanFixed(X, F) {
  const S = pow10(F);
  let k = 0n;
  while (babs(X) * 10n > S && k < 8n) {
    X = rdiv(X * S, S + isqrt(S * S + X * X)); // atan x = 2 atan(x / (1 + √(1 + x²)))
    k++;
  }
  const X2 = (X * X) / S;
  let t = X;
  let sum = X;
  let minus = true;
  for (let n = 1n; t !== 0n; minus = !minus) {
    t = (t * X2) / S;
    n += 2n;
    sum += minus ? -(t / n) : t / n;
  }
  return sum << k;
}

function atan(x, W) {
  if (isZero(x)) return x;
  const xm = mag(x);
  const F = W + 12 + Math.max(0, -xm);
  if (cmp(abs(x), ONE, W) > 0) {
    const r = PI(F) / 2n - atanFixed(fixed(div(ONE, abs(x), F), F), F);
    return round(sign(x) < 0 ? -r : r, -F, W);
  }
  return round(atanFixed(fixed(x, F), F), -F, W);
}

function atan2(y, x, W) {
  const sx = sign(x);
  const sy = sign(y);
  if (sx === 0) {
    if (sy === 0) return ZERO;
    const h = div(pi(W + 2), TWO, W);
    return sy > 0 ? h : neg(h);
  }
  const base = atan(div(y, x, W + 4), W + 4);
  if (sx > 0) return toApprox(base, W);
  return add(base, sy < 0 ? neg(pi(W + 4)) : pi(W + 4), W);
}

const extraFor = (x) => (isZero(x) ? 0 : Math.max(0, -mag(x)));

function asin(x, W) {
  const c = cmp(abs(x), ONE, W + 4);
  if (c > 0) throw new DomainError('asin 的参数必须在 [−1, 1] 内');
  const W2 = W + 4 + extraFor(sub(ONE, abs(x), W + 4));
  return atan2(x, sqrt(mul(sub(ONE, x, W2), add(ONE, x, W2), W2), W2), W);
}

function acos(x, W) {
  if (cmp(abs(x), ONE, W + 4) > 0) throw new DomainError('acos 的参数必须在 [−1, 1] 内');
  const W2 = W + 4 + extraFor(sub(ONE, abs(x), W + 4));
  return atan2(sqrt(mul(sub(ONE, x, W2), add(ONE, x, W2), W2), W2), x, W);
}

function sinh(x, W) {
  if (isZero(x)) return x;
  const W2 = W + 4 + extraFor(x);
  const ex = exp(x, W2);
  return div(sub(ex, div(ONE, ex, W2), W2), TWO, W);
}

function cosh(x, W) {
  const ex = exp(x, W + 4);
  return div(add(ex, div(ONE, ex, W + 4), W + 4), TWO, W);
}

function tanh(x, W) {
  if (isZero(x)) return x;
  if (cmp(abs(x), rat(1000n), 8) > 0) return toApprox(rat(BigInt(sign(x))), W);
  const W2 = W + 4 + extraFor(x);
  const e2 = exp(mul(TWO, x, W2), W2); // tanh x = (e^{2x} − 1)/(e^{2x} + 1)
  return div(sub(e2, ONE, W2), add(e2, ONE, W2), W);
}

function asinh(x, W) {
  if (isZero(x)) return x;
  const W2 = W + 4 + extraFor(x);
  const ax = abs(x);
  const r = ln(add(ax, sqrt(add(mul(ax, ax, W2), ONE, W2), W2), W2), W);
  return sign(x) < 0 ? neg(r) : r;
}

function acosh(x, W) {
  if (cmp(x, ONE, W + 4) < 0) throw new DomainError('acosh 的参数必须 ≥ 1');
  const W2 = W + 4 + extraFor(sub(x, ONE, W + 4));
  return ln(add(x, sqrt(sub(mul(x, x, W2), ONE, W2), W2), W2), W);
}

function atanh(x, W) {
  if (cmp(abs(x), ONE, W + 4) >= 0) throw new DomainError('atanh 的参数必须在 (−1, 1) 内');
  if (isZero(x)) return x;
  const W2 = W + 4 + extraFor(x) + extraFor(sub(ONE, abs(x), W + 4));
  return div(ln(div(add(ONE, x, W2), sub(ONE, x, W2), W2), W2), TWO, W);
}

/** x^y: exact for rational x and integer y, or when y = p/q and x is a perfect q-th power. */
function pow(x, y, W) {
  if (isInteger(y)) {
    if (isZero(x)) {
      if (y.n < 0n) throw new DomainError('0 不能取负数次幂');
      return y.n === 0n ? ONE : x;
    }
    if (babs(y.n) > 100000n) {
      const r = exp(mul(y, ln(abs(x), W + 8 + ndigits(y.n)), W + 8), W);
      return sign(x) < 0 && (y.n & 1n) ? neg(r) : r;
    }
    return powInt(x, y.n, W);
  }
  const sx = sign(x);
  if (sx === 0) {
    if (sign(y) > 0) return x;
    throw new DomainError('0 不能取非正数次幂');
  }
  if (y.q && y.d <= 64n) {
    const k = Number(y.d);
    // odd roots of negative rationals are real: (−8)^(1/3) = −2
    if (sx < 0 && y.d % 2n === 0n) throw new DomainError('负数不能取分数次幂');
    if (x.q) {
      const an = babs(x.n);
      const rn = iroot(an, k);
      const rd = iroot(x.d, k);
      if (rn ** y.d === an && rd ** y.d === x.d) return powInt(rat(sx < 0 ? -rn : rn, rd), y.n, W);
    }
    if (sx < 0) {
      const r = exp(mul(y, ln(neg(x), W + 8), W + 8), W);
      return y.n % 2n === 0n ? r : neg(r);
    }
  } else if (sx < 0) {
    throw new DomainError('负数不能取非整数次幂');
  }
  return exp(mul(y, ln(x, W + 8 + Math.max(0, mag(y))), W + 8), W);
}

function cbrt(x, W) {
  if (isZero(x)) return x;
  return pow(x, rat(1n, 3n), W);
}

function floor(x) {
  if (x.q) return rat(fdiv(x.n, x.d));
  return rat(fdiv(fixed(x, 6), pow10(6)));
}
const ceil = (x) => neg(floor(neg(x)));
const roundInt = (x) => floor(add(x, rat(1n, 2n), 60));

// ---------------------------------------------------------------------------------------------
// Printing

const SUPERSCRIPT = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };

/**
 * Decimal string with at most P significant digits (trailing zeros dropped).
 *   ascii : '-' and 'e' notation instead of '−' and '×10ⁿ'
 *   sci   : always scientific notation
 *   group : group fraction digits in blocks of this size with thin spaces (display only)
 */
function toDecimal(x, P, { ascii = false, sci = false, group = 0 } = {}) {
  if (isZero(x)) return '0';
  const a = toApprox(x, P);
  let s = babs(a.m).toString().replace(/0+$/, '');
  const e = a.e + (ndigits(a.m) - s.length); // value = s · 10^e
  const E = e + s.length - 1; // exponent of the leading digit
  const minus = a.m < 0n ? (ascii ? '-' : '−') : '';
  const grp = (frac) => (group > 0 ? frac.replace(new RegExp(`(\\d{${group}})(?=\\d)`, 'g'), '$1 ') : frac);
  if (!sci && E >= -7 && E < Math.max(21, P)) {
    let out;
    if (e >= 0) out = s + '0'.repeat(e);
    else {
      const intLen = s.length + e;
      out = intLen > 0 ? `${s.slice(0, intLen)}.${grp(s.slice(intLen))}` : `0.${grp('0'.repeat(-intLen) + s)}`;
    }
    return minus + out;

const REDUCED = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ------------------------------------------------------------------------------------------------
// Hero: damped pendulum x′ = y, y′ = −sin x − γy. Streamlines are drawn once per size into an
// offscreen canvas; a few hundred particles then drift along the field with short trails.

const GAMMA = 0.12;
const pend = (x, y) => [y, -Math.sin(x) - GAMMA * y];
function rk4(x, y, dt) {
  const [a1, b1] = pend(x, y);
  const [a2, b2] = pend(x + 0.5 * dt * a1, y + 0.5 * dt * b1);
  const [a3, b3] = pend(x + 0.5 * dt * a2, y + 0.5 * dt * b2);
  const [a4, b4] = pend(x + dt * a3, y + dt * b3);
  return [x + (dt / 6) * (a1 + 2 * a2 + 2 * a3 + a4), y + (dt / 6) * (b1 + 2 * b2 + 2 * b3 + b4)];
}
const speedColor = (x, y, a) => {
  const [r, g, b] = ramp(0.25 + Math.min(1, Math.hypot(...pend(x, y)) / 3.2) * 0.75);
  return `rgba(${r | 0}, ${g | 0}, ${b | 0}, ${a})`;
};

function createHero(container) {
  const layer = new Layer(container);
  const TRAIL = 16;
  const st = { w: 0, h: 0, scale: 1, x0: 0, y0: 0, bg: null, parts: [] };
  const sx = (x) => (x - st.x0) * st.scale;
  const sy = (y) => st.h / 2 - y * st.scale;

  function spawn(p, x, y) {
    p.x = x ?? st.x0 + Math.random() * (st.w / st.scale);
    p.y = y ?? (Math.random() * 2 - 1) * (st.h / 2 / st.scale);
    p.age = 0;
    p.life = 3 + Math.random() * 6;
    p.n = 0;
    p.trail = p.trail || new Float32Array(2 * TRAIL);
  }

  function resize(w, hh) {
    st.w = w;
    st.h = hh;
    layer.resize(w, hh);
    st.scale = hh / 6.8; // y ∈ [−3.4, 3.4]
    st.x0 = -w / 2 / st.scale + 0.35 * Math.PI; // a centre (focus) sits right of the text column
    // streamlines from a jittered grid of seeds, integrated both ways
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * layer.dpr));
    c.height = Math.max(1, Math.round(hh * layer.dpr));
    const g = c.getContext('2d');
    g.scale(layer.dpr, layer.dpr);
    g.lineWidth = 1;
    const gap = 30;
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    for (let px = gap / 2; px < w; px += gap) {
      for (let py = gap / 2; py < hh; py += gap) {
        const x0 = st.x0 + (px + (rnd() - 0.5) * gap) / st.scale;
        const y0 = (hh / 2 - py - (rnd() - 0.5) * gap) / st.scale;
        for (const dir of [1, -1]) {
          let [x, y] = [x0, y0];
          g.beginPath();
          g.moveTo(sx(x), sy(y));
          for (let k = 0; k < 26; k++) {
            [x, y] = rk4(x, y, 0.045 * dir);
            if (Math.abs(y) > 4.5) break;
            g.lineTo(sx(x), sy(y));
          }
          g.strokeStyle = speedColor(x0, y0, 0.16);
          g.stroke();
        }
      }
    }
    // equilibria: stable foci at 2kπ, saddles at (2k+1)π
    for (let k = Math.floor(st.x0 / Math.PI) - 1; k * Math.PI < st.x0 + w / st.scale + 1; k++) {
      const X = sx(k * Math.PI), Y = sy(0);
      if (k % 2 === 0) {
        glow(g, X, Y, 22, C.accent2, 0.5);
        g.fillStyle = 'rgba(232, 236, 244, 0.85)';
        g.beginPath(); g.arc(X, Y, 2.6, 0, 2 * Math.PI); g.fill();
      } else {
        g.strokeStyle = 'rgba(251, 191, 36, 0.55)';
        g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(X - 5, Y - 5); g.lineTo(X + 5, Y + 5); g.moveTo(X - 5, Y + 5); g.lineTo(X + 5, Y - 5); g.stroke();
      }
    }
    st.bg = c;
    const n = Math.round(Math.min(320, (w * hh) / 2600));
    st.parts = Array.from({ length: n }, () => { const p = {}; spawn(p); p.age = Math.random() * p.life; return p; });
  }

  function frame(dt) {
    const { ctx } = layer;
    layer.reset();
    if (st.bg) ctx.drawImage(st.bg, 0, 0, st.w, st.h);
    const step = Math.min(0.05, dt) * 1.6;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    const xmax = st.x0 + st.w / st.scale;
    for (const p of st.parts) {
      p.age += dt;
      [p.x, p.y] = rk4(p.x, p.y, step);
      if (p.age > p.life || p.x < st.x0 - 0.5 || p.x > xmax + 0.5 || Math.abs(p.y) > 4) { spawn(p); continue; }
      const t = p.trail;
      t.copyWithin(2, 0, 2 * TRAIL - 2);
      t[0] = sx(p.x); t[1] = sy(p.y);
      p.n = Math.min(TRAIL, p.n + 1);
      if (p.n < 2) continue;
      const fade = Math.min(1, p.age * 2, (p.life - p.age) * 2);
      ctx.strokeStyle = speedColor(p.x, p.y, 0.75 * fade);
      ctx.beginPath();
      ctx.moveTo(t[0], t[1]);
      for (let k = 1; k < p.n; k++) ctx.lineTo(t[2 * k], t[2 * k + 1]);
      ctx.stroke();
    }
  }

  // a click on the field releases a burst of particles there
  layer.canvas.addEventListener('pointerdown', (e) => {
    const r = layer.canvas.getBoundingClientRect();
    const x = st.x0 + (e.clientX - r.left) / st.scale;
    const y = (st.h / 2 - (e.clientY - r.top)) / st.scale;
    for (let k = 0; k < 28 && st.parts.length; k++) {
      const p = st.parts[(Math.random() * st.parts.length) | 0];
      spawn(p, x + (Math.random() - 0.5) * 0.5, y + (Math.random() - 0.5) * 0.5);
      p.life = 6 + Math.random() * 4;
    }
  });
  return { resize, frame, canvas: layer.canvas };
}

// ------------------------------------------------------------------------------------------------
// Module previews: { resize(w, h, dpr), frame(t, dt) } on a Layer.

function matrixPreview(layer) {
  const A = mat(1.3, 0.6, 0.25, 0.95);
  let w = 0, hh = 0;
  return {
    resize(W, H) { w = W; hh = H; },
    frame(t) {
      const { ctx } = layer;
      layer.reset();
      const s = REDUCED ? 1 : 0.5 - 0.5 * Math.cos(t * 0.8);
      const M = interpolate(A, s, 'polar');
      const k = hh / 4.6, ox = w / 2, oy = hh / 2;
      const X = (x) => ox + x * k, Y = (y) => oy - y * k;
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = -8; i <= 8; i++) { ctx.moveTo(X(i), 0); ctx.lineTo(X(i), hh); ctx.moveTo(0, Y(i)); ctx.lineTo(w, Y(i)); }
      ctx.stroke();
      const c1 = apply(M, 1, 0), c2 = apply(M, 0, 1);
      ctx.strokeStyle = 'rgba(122, 162, 255, 0.4)';
      ctx.beginPath();
      for (let i = -8; i <= 8; i++) {
        ctx.moveTo(X(i * c1[0] - 9 * c2[0]), Y(i * c1[1] - 9 * c2[1])); ctx.lineTo(X(i * c1[0] + 9 * c2[0]), Y(i * c1[1] + 9 * c2[1]));
        ctx.moveTo(X(i * c2[0] - 9 * c1[0]), Y(i * c2[1] - 9 * c1[1])); ctx.lineTo(X(i * c2[0] + 9 * c1[0]), Y(i * c2[1] + 9 * c1[1]));
      }
      ctx.stroke();
      const e = eigen(M);
      if (e.kind === 'real') {
        ctx.save();
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = alpha(C.eig, 0.7);
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        for (const v of e.vectors) { ctx.moveTo(X(-9 * v[0]), Y(-9 * v[1])); ctx.lineTo(X(9 * v[0]), Y(9 * v[1])); }
        ctx.stroke();
        ctx.restore();
      }
      ctx.beginPath();
      ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(c1[0]), Y(c1[1])); ctx.lineTo(X(c1[0] + c2[0]), Y(c1[1] + c2[1])); ctx.lineTo(X(c2[0]), Y(c2[1]));
      ctx.closePath();
      ctx.fillStyle = alpha(C.v, 0.16);
      ctx.fill();
      ctx.strokeStyle = alpha(C.v, 0.7);
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 64; i++) {
        const th = (i / 64) * 2 * Math.PI;
        const [x, y] = apply(M, Math.cos(th), Math.sin(th));
        if (i) ctx.lineTo(X(x), Y(y)); else ctx.moveTo(X(x), Y(y));
      }
      ctx.strokeStyle = alpha(C.cyan, 0.6);
      ctx.stroke();
      arrow(ctx, X(0), Y(0), X(c1[0]), Y(c1[1]), { color: C.i, width: 2.4, head: 10 });
      arrow(ctx, X(0), Y(0), X(c2[0]), Y(c2[1]), { color: C.j, width: 2.4, head: 10 });
    },
  };
}

function complexPreview(layer) {
  const F = complexFunction('(z^2 - 1)(z - 2 - i)^2/(z^2 + 2 + 2i)');
  const out = new Float64Array(2);
  let img = null;
  return {
    resize(W, H, dpr) {
      const pw = Math.max(1, Math.round(W * dpr)), ph = Math.max(1, Math.round(H * dpr));
      img = new ImageData(pw, ph);
      const k = 6.4 / pw; // x ∈ [−3.2, 3.2]
      for (let j = 0; j < ph; j++) {
        for (let i = 0; i < pw; i++) {
          F.fn((i - pw / 2) * k + 0.3, (ph / 2 - j) * k, 0, 0, out);
          const p = 4 * (j * pw + i);
          const [r, g, b] = phaseColor(out[0], out[1]);
          const L = Math.log2(Math.hypot(out[0], out[1]));
          const ph12 = ((Math.atan2(out[1], out[0]) / (2 * Math.PI)) * 12 + 12) % 1;
          const shade = Number.isFinite(L) ? 0.62 + 0.24 * (L - Math.floor(L)) + 0.14 * ph12 : 1;
          img.data[p] = r * shade; img.data[p + 1] = g * shade; img.data[p + 2] = b * shade; img.data[p + 3] = 255;
        }
      }
    },
    frame() {
      if (!img) return;
      const { ctx } = layer;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.putImageData(img, 0, 0);
    },
    static: true,
  };
}

function lorenzPreview(layer) {
  const N = 7000;
  const pts = new Float32Array(3 * N);
  let [x, y, z] = [1, 1, 1];
  const f = (x_, y_, z_) => [10 * (y_ - x_), x_ * (28 - z_) - y_, x_ * y_ - (8 / 3) * z_];
  const dt = 0.008;
  for (let k = -400; k < N; k++) {
    const k1 = f(x, y, z);
    const k2 = f(x + 0.5 * dt * k1[0], y + 0.5 * dt * k1[1], z + 0.5 * dt * k1[2]);
    const k3 = f(x + 0.5 * dt * k2[0], y + 0.5 * dt * k2[1], z + 0.5 * dt * k2[2]);
    const k4 = f(x + dt * k3[0], y + dt * k3[1], z + dt * k3[2]);
    x += (dt / 6) * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    y += (dt / 6) * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    z += (dt / 6) * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
    if (k >= 0) { pts[3 * k] = x; pts[3 * k + 1] = y; pts[3 * k + 2] = z; }
  }
  let w = 0, hh = 0;
  const BATCH = 7;
  const colors = Array.from({ length: BATCH }, (_, b) => { const [r, g, bl] = ramp(0.3 + 0.7 * (b / (BATCH - 1))); return `rgba(${r | 0}, ${g | 0}, ${bl | 0}, 0.8)`; });
  return {
    resize(W, H) { w = W; hh = H; },
    frame(t) {
      const { ctx } = layer;
      layer.reset();
      const yaw = (REDUCED ? 0.6 : t * 0.25) + 0.6, c = Math.cos(yaw), s = Math.sin(yaw);
      const k = hh / 52, ox = w / 2, oy = hh / 2;
      const P = (i) => [ox + (pts[3 * i] * c - pts[3 * i + 1] * s) * k, oy - (pts[3 * i + 2] - 25) * k];
      ctx.lineWidth = 0.9;
      // colour by height (z): split the polyline into bands
      for (let b = 0; b < BATCH; b++) {
        ctx.strokeStyle = colors[b];
        ctx.beginPath();
        for (let i = 1; i < N; i++) {
          const band = Math.min(BATCH - 1, Math.max(0, Math.floor(((pts[3 * i + 2] - 5) / 42) * BATCH)));
          if (band !== b) continue;
          const [x0, y0] = P(i - 1), [x1, y1] = P(i);
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
        }
        ctx.stroke();
      }
      const head = Math.floor((t * 450) % N);
      const [hx, hy] = P(head);
      glow(ctx, hx, hy, 16, C.v, 0.9);
      ctx.fillStyle = '#fff7e0';
      ctx.beginPath(); ctx.arc(hx, hy, 2.4, 0, 2 * Math.PI); ctx.fill();
    },
  };
}

function threeBodyPreview(layer) {
  const preset = NBODY_PRESETS.find((p) => p.id === 'figure8');
  const sys = new NBody(preset);
  sys.toCenterOfMassFrame();
  const TR = 420;
  const trails = Array.from({ length: sys.n }, () => ({ buf: new Float32Array(2 * TR), head: -1, n: 0 }));
  let w = 0, hh = 0, acc = 0;
  const push = () => {
    for (let i = 0; i < sys.n; i++) {
      const tr = trails[i];
      tr.head = (tr.head + 1) % TR;
      const [px, py] = sys.pos(i);
      tr.buf[2 * tr.head] = px; tr.buf[2 * tr.head + 1] = py;
      tr.n = Math.min(TR, tr.n + 1);
    }
  };
  // pre-roll so the trails are full from the first frame
  for (let k = 0; k < TR; k++) { sys.advance(0.015); push(); }
  return {
    resize(W, H) { w = W; hh = H; },
    frame(t, dt) {
      if (!REDUCED) {
        acc += Math.min(0.05, dt) * 1.1;
        while (acc > 0.015) { sys.advance(0.015); push(); acc -= 0.015; }
      }
      const { ctx } = layer;
      layer.reset();
      const k = Math.min(w / 2.7, hh / 1.25), ox = w / 2, oy = hh / 2;
      for (let i = 0; i < sys.n; i++) {
        const tr = trails[i], col = C.bodies[i];
        ctx.strokeStyle = alpha(col, 0.55);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let j = 0; j < tr.n; j++) {
          const q = (tr.head - j + TR) % TR;
          const X = ox + tr.buf[2 * q] * k, Y = oy - tr.buf[2 * q + 1] * k;
          if (j) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
        }
        ctx.stroke();
        const [px, py] = sys.pos(i);
        glow(ctx, ox + px * k, oy - py * k, 18, col, 0.9);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(ox + px * k, oy - py * k, 4, 0, 2 * Math.PI); ctx.fill();
      }
    },
  };
}

function fractalPreview(layer) {
  let img = null;
  return {
    resize(W, H, dpr) {
      const pw = Math.max(1, Math.round(W * dpr)), ph = Math.max(1, Math.round(H * dpr));
      img = new ImageData(pw, ph);
      const k = 3.1 / pw, cx0 = -0.62, MAX = 160;
      for (let j = 0; j < ph; j++) {
        for (let i = 0; i < pw; i++) {
          const cx = cx0 + (i - pw / 2) * k, cy = (ph / 2 - j) * k;
          const q = (cx - 0.25) ** 2 + cy * cy;
          let n = MAX, x = 0, y = 0;
          if (!(q * (q + (cx - 0.25)) < 0.25 * cy * cy || (cx + 1) ** 2 + cy * cy < 0.0625)) {
            for (n = 0; n < MAX && x * x + y * y < 256; n++) { const t = x * x - y * y + cx; y = 2 * x * y + cy; x = t; }
          }
          const p = 4 * (j * pw + i);
          if (n >= MAX) { img.data[p] = 6; img.data[p + 1] = 8; img.data[p + 2] = 14; }
          else {
            const nu = n + 1 - Math.log2(Math.log2(x * x + y * y) / 2);
            const t = 0.5 + 0.5 * Math.sin(Math.log(nu + 1) * 2.1 - 1.2);
            const [r, g, b] = ramp(t);
            const fade = Math.min(1, nu / 6);
            img.data[p] = r * fade; img.data[p + 1] = g * fade; img.data[p + 2] = b * fade;
          }
          img.data[p + 3] = 255;
        }
      }
    },
    frame() {
      if (!img) return;
      layer.ctx.setTransform(1, 0, 0, 1, 0, 0);
      layer.ctx.putImageData(img, 0, 0);
    },
    static: true,
  };
}

function fourierPreview(layer) {
  const terms = sortTerms(dft(resample(SHAPES.heart.pts(), 256)), 'amp');
  const K = 36;
  let w = 0, hh = 0;
  return {
    resize(W, H) { w = W; hh = H; },
    frame(t) {
      const { ctx } = layer;
      layer.reset();
      const k = hh / 2.5, ox = w / 2, oy = hh / 2;
      const T = REDUCED ? 0.999 : (t * 0.09) % 1;
      // the traced part of the curve
      ctx.strokeStyle = alpha(C.v, 0.9);
      ctx.lineWidth = 2;
      ctx.beginPath();
