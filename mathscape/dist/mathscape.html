    // job: wait until input pauses so interactive frames only pay for the quick pass
    jobHoldUntil = performance.now() + 140;
    scheduleJobs();
  }

  let jobHoldUntil = 0;
  function scheduleJobs() {
    if (jobRaf) return;
    jobRaf = requestAnimationFrame(function step() {
      jobRaf = 0;
      if (performance.now() < jobHoldUntil) { jobRaf = requestAnimationFrame(step); return; }
      let pending = false;
      for (const which of ['z', 'w']) {
        const job = jobs[which];
        if (!job) continue;
        if (job.run(9)) {
          jobs[which] = null;
          off[which]._view = job.view;
          blit(which, job);
        } else pending = true;
      }
      if (pending) jobRaf = requestAnimationFrame(step);
    });
  }

  // ------------------------------------------------------------------ drawing
  function drawZ() {
    fgZ.reset();
    const ctx = fgZ.ctx;
    drawGrid(ctx, vpZ, { minor: false, labels: true, imaginary: true, alpha: st.showColor ? 0.55 : 1 });
    const sx = (x) => vpZ.sx(x), sy = (y) => vpZ.sy(y);
    const [cx, cy] = st.center;
    const R = st.R;
    if (st.showGridZ) {
      for (const c of gridCurves()) {
        ctx.beginPath();
        const N = st.grid === 'polar' && c.fam === 0 ? 128 : 1;
        for (let k = 0; k <= N; k++) {
          const [x, y] = c.P(k / N);
          if (k) ctx.lineTo(sx(x), sy(y)); else ctx.moveTo(sx(x), sy(y));
        }
        ctx.lineWidth = 3.2;
        ctx.strokeStyle = 'rgba(8, 11, 17, 0.45)';
        ctx.stroke();
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = rgb(c.color, 0.95);
        ctx.stroke();
      }
      // region handle (drag to move the grid)
      const gx = sx(cx), gy = sy(cy);
      ctx.save();
      ctx.fillStyle = 'rgba(8, 11, 17, 0.7)';
      ctx.strokeStyle = 'rgba(232, 236, 244, 0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.rect(gx - 5, gy - 5, 10, 10);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      const rx = st.grid === 'cart' ? sx(cx + R) : sx(cx + R);
      const ry = st.grid === 'cart' ? sy(cy + R) : sy(cy);
      handle(ctx, rx, ry, '#e8ecf4', { r: 4.5, active: st.drag === 'gr' });
    }
    if (st.contour.on) {
      const { cx: ox, cy: oy, r } = st.contour;
      ctx.save();
      ctx.beginPath();
      ctx.arc(sx(ox), sy(oy), r * vpZ.scale, 0, 2 * Math.PI);
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(8, 11, 17, 0.45)';
      ctx.stroke();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = '#ffffff';
      ctx.setLineDash([7, 5]);
      ctx.stroke();
      ctx.restore();
      handle(ctx, sx(ox), sy(oy), '#ffffff', { r: 5, active: st.drag === 'cc' });
      handle(ctx, sx(ox + r), sy(oy), '#ffffff', { r: 4.5, active: st.drag === 'cr' });
    }
    if (st.F.usesParam) {
      const px = sx(st.a[0]), py = sy(st.a[1]);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = '#0c1018';
      ctx.strokeStyle = C.v;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.rect(-6.5, -6.5, 13, 13);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      label(ctx, `a = ${fmtComplex(st.a[0], st.a[1], 2)}`, px + 12, py - 14, { color: C.v, font: `600 12px ${FONT}` });
    }
    if (st.probe) {
      const [x, y] = st.probe;
      const px = sx(x), py = sy(y);
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, 16, 0, 2 * Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(px - 24, py); ctx.lineTo(px - 19, py);
      ctx.moveTo(px + 19, py); ctx.lineTo(px + 24, py);
      ctx.moveTo(px, py - 24); ctx.lineTo(px, py - 19);
      ctx.moveTo(px, py + 19); ctx.lineTo(px, py + 24);
      ctx.stroke();
      // a small cross of two directions, mapped on the right to show rotation/scaling
      ctx.lineWidth = 2;
      ctx.strokeStyle = C.i;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + 16, py); ctx.stroke();
      ctx.strokeStyle = C.j;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 16); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px, py, st.pinned ? 4 : 2.5, 0, 2 * Math.PI); ctx.fill();
      ctx.restore();
    }
  }

  function drawW() {
    fgW.reset();
    const ctx = fgW.ctx;
    drawGrid(ctx, vpW, { minor: false, labels: true, imaginary: true, alpha: 0.8 });
    const sx = (x) => vpW.sx(x), sy = (y) => vpW.sy(y);
    ctx.lineJoin = 'round';
    for (const c of st.mapped) {
      ctx.beginPath();
      for (const l of c.lines) {
        ctx.moveTo(sx(l[0]), sy(l[1]));
        for (let k = 2; k < l.length; k += 2) ctx.lineTo(sx(l[k]), sy(l[k + 1]));
      }
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = rgb(c.color, 0.92);
      ctx.stroke();
    }
    if (st.contourImg) {
      ctx.save();
      ctx.beginPath();
      for (const l of st.contourImg) {
        ctx.moveTo(sx(l[0]), sy(l[1]));
        for (let k = 2; k < l.length; k += 2) ctx.lineTo(sx(l[k]), sy(l[k + 1]));
      }
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.stroke();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.restore();
      // origin marker: the winding number is counted around w = 0
      ctx.save();
      ctx.fillStyle = C.danger;
      ctx.beginPath();
      ctx.arc(sx(0), sy(0), 4.5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.restore();
    }
    if (st.probe) {
      const [x, y] = st.probe;
      const o = new Float64Array(2);
      morph(x, y, o);
      if (Number.isFinite(o[0]) && Number.isFinite(o[1])) {
        const px = sx(o[0]), py = sy(o[1]);
        // image of the small circle and the two direction ticks around z
        const rho = 16 / vpZ.scale;
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let k = 0; k <= 64; k++) {
          const th = (2 * Math.PI * k) / 64;
          morph(x + rho * Math.cos(th), y + rho * Math.sin(th), o);
          if (k) ctx.lineTo(sx(o[0]), sy(o[1])); else ctx.moveTo(sx(o[0]), sy(o[1]));
        }
        ctx.stroke();
        const seg = (dx, dy, col) => {
          ctx.strokeStyle = col;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(px, py);
          for (let k = 1; k <= 8; k++) {
            morph(x + (dx * rho * k) / 8, y + (dy * rho * k) / 8, o);
            ctx.lineTo(sx(o[0]), sy(o[1]));
          }
          ctx.stroke();
        };
        seg(1, 0, C.i);
        seg(0, 1, C.j);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, 2 * Math.PI);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function updateProbe() {
    if (!st.probe) { probeCard.style.display = 'none'; probeRead.set('z', '—'); return; }
    const [x, y] = st.probe;
    const [u, v] = f(x, y);
    const hstep = 1e-5 * Math.max(1, Math.hypot(x, y));
    const [u1, v1] = f(x + hstep, y), [u0, v0] = f(x - hstep, y);
    const [u3, v3] = f(x, y + hstep), [u2, v2] = f(x, y - hstep);
    const fx = [(u1 - u0) / (2 * hstep), (v1 - v0) / (2 * hstep)];
    const fy = [(u3 - u2) / (2 * hstep), (v3 - v2) / (2 * hstep)];
    // Wirtinger derivatives: ∂f/∂z = (f_x − i f_y)/2, ∂f/∂z̄ = (f_x + i f_y)/2
    const dz = [(fx[0] + fy[1]) / 2, (fx[1] - fy[0]) / 2];
    const dzb = [(fx[0] - fy[1]) / 2, (fx[1] + fy[0]) / 2];
    const mod = Math.hypot(u, v);
    const dzbAbs = Math.hypot(...dzb);
    const analytic = dzbAbs < 1e-5 * Math.max(1, Math.hypot(...dz));
    const rows = [
      ['z', fmtComplex(x, y, 3)],
      ['f(z)', fmtComplex(u, v, 4)],
      ['|f|, arg f', Number.isFinite(mod) ? `${fmt(mod, 4)}, ${deg(Math.atan2(v, u))}` : '∞'],
      ["f′(z)", Number.isFinite(dz[0]) ? fmtComplex(dz[0], dz[1], 4) : '—'],
    ];
    probeCard.style.display = '';
    probeCard.innerHTML = '';
    probeCard.append(h('div', { class: 'title' }, st.pinned ? '探针（已固定 · 双击取消）' : '探针（单击固定）'),
      h('dl', { class: 'readout' }, rows.flatMap(([k, val]) => [h('dt', { style: { fontFamily: MATH, fontStyle: 'italic' } }, k), h('dd', null, val)])));
    probeRead.set('z', fmtComplex(x, y, 4));
    probeRead.set('w', fmtComplex(u, v, 5));
    probeRead.set('mod', Number.isFinite(mod) ? `${fmt(mod, 5)}  ∠ ${deg(Math.atan2(v, u))}` : '∞');
    probeRead.set('dz', Number.isFinite(dz[0]) ? fmtComplex(dz[0], dz[1], 5) : '—');
    probeRead.set('scale', Number.isFinite(dz[0]) ? `放大 ${fmt(Math.hypot(...dz), 4)} 倍，旋转 ${deg(Math.atan2(dz[1], dz[0]))}` : '—');
    probeRead.set('dzb', Number.isFinite(dzbAbs) ? `${fmt(dzbAbs, 3)}  ${analytic ? '✓ 满足 C–R 方程' : '✗ 非解析'}` : '—', analytic ? 'good' : 'warn');
  }

  function updateWinding() {
    if (!st.contour.on || !st.winding) { windChip.style.display = 'none'; windRead.set('n', '—'); return; }
    const w = st.winding;
    windChip.style.display = '';
    windChip.innerHTML = '';
    const ok = w.reliable && w.minModulus > 1e-9;
    windChip.append(h('div', { class: 'title' }, '幅角原理'),
      h('div', { class: 'big', style: { fontSize: '15px' } }, ok ? `Z − P = ${w.winding}` : '曲线经过零点或极点'));
    windRead.set('n', ok ? String(w.winding) : '无法确定（曲线过零点/极点）', ok ? 'good' : 'warn');
    windRead.set('exact', fmt(w.exact, 6));
  }

  // ------------------------------------------------------------------ invalidation
  // dirty flags: color (z colouring), wcolor (w reference colouring), mapped (grid images),
  // z / w (foreground redraw), probe (readouts)
  const dirty = { color: false, wcolor: false, mapped: false, z: false, w: false, probe: false };
  const GROUPS = {
    fn: ['color', 'mapped', 'z', 'w', 'probe'], // function or parameter changed
    zview: ['color', 'z'], // z viewport moved
    wview: ['wcolor', 'mapped', 'w'], // w viewport moved
    zfg: ['z'],
    overlays: ['z', 'w', 'probe'],
  };
  let raf = 0;
  function invalidate(...what) {
    for (const k of what) for (const d of GROUPS[k] || [k]) dirty[d] = true;
    if (!raf) raf = requestAnimationFrame(flush);
  }
  function flush() {
    raf = 0;
    if (dirty.mapped) { computeMapped(); dirty.w = true; updateWinding(); }
    if (dirty.color) refreshColoring('z');
    if (dirty.wcolor) refreshColoring('w');
    if (dirty.z) drawZ();
    if (dirty.w) drawW();
    if (dirty.probe) updateProbe();
    for (const k in dirty) dirty[k] = false;
  }

  // ------------------------------------------------------------------ interaction
  const hitZ = (px, py) => {
    const near = (x, y, r = 12) => Math.hypot(vpZ.sx(x) - px, vpZ.sy(y) - py) < r;
    if (st.F.usesParam && near(st.a[0], st.a[1], 14)) return 'a';
    if (st.contour.on) {
      if (near(st.contour.cx + st.contour.r, st.contour.cy)) return 'cr';
      if (near(st.contour.cx, st.contour.cy)) return 'cc';
    }
    if (st.showGridZ) {
      const [cx, cy] = st.center;
      if (st.grid === 'cart' ? near(cx + st.R, cy + st.R) : near(cx + st.R, cy)) return 'gr';
      if (near(cx, cy, 9)) return 'gc';
    }
    if (st.pinned && st.probe && near(st.probe[0], st.probe[1], 12)) return 'probe';
    return null;
  };
  const detachZ = attachPointer(fgZ.canvas, vpZ, {
    hitTest: hitZ,
    cursor: (hd) => (hd === 'cr' || hd === 'gr' ? 'ew-resize' : 'grab'),
    onDragStart(hd) { st.drag = hd; },
    onDrag(hd, x, y) {
      if (hd === 'a') { st.a = [x, y]; invalidate('fn'); syncQuery(); paramRead.set('a', fmtComplex(x, y, 4)); }
      else if (hd === 'cc') { st.contour.cx = x; st.contour.cy = y; invalidate('mapped', 'zfg'); }
      else if (hd === 'cr') { st.contour.r = Math.max(0.02, Math.hypot(x - st.contour.cx, y - st.contour.cy)); invalidate('mapped', 'zfg'); }
      else if (hd === 'gc') { st.center = [x, y]; invalidate('mapped', 'zfg'); }
      else if (hd === 'gr') {
        const [cx, cy] = st.center;
        const R = st.grid === 'cart' ? Math.max(Math.abs(x - cx), Math.abs(y - cy)) : Math.hypot(x - cx, y - cy);
        st.R = Math.max(0.05, R);
        rSlider.set(Math.min(+rSlider.input.max, st.R));
        invalidate('mapped', 'zfg');
      } else if (hd === 'probe') { st.probe = [x, y]; invalidate('overlays'); }
    },
    onDragEnd() { st.drag = null; invalidate('zfg'); },
    onClick(x, y) { st.probe = [x, y]; st.pinned = true; invalidate('overlays'); },
    onHover(px, py, x, y) {
      if (st.pinned) return;
      st.probe = [x, y];
      invalidate('overlays');
    },
    onLeave() { if (!st.pinned && st.probe) { st.probe = null; invalidate('overlays'); } },
    onView: () => invalidate('zview'),
  });
  fgZ.canvas.addEventListener('dblclick', () => { st.pinned = false; st.probe = null; invalidate('overlays'); });
  const detachW = attachPointer(fgW.canvas, vpW, { onView: () => invalidate('wview') });

  const sizes = { z: false, w: false };
  const stopZ = observeSize(paneZ, (w, hh) => {
    bgZ.resize(w, hh); fgZ.resize(w, hh); vpZ.setSize(w, hh);
    if (!sizes.z) { sizes.z = true; fitZ(); }
    invalidate('zview', 'mapped');
  });
  const stopW = observeSize(paneW, (w, hh) => {
    bgW.resize(w, hh); fgW.resize(w, hh); vpW.setSize(w, hh);
    if (!sizes.w) { sizes.w = true; fitW(); }
    invalidate('wview');
  });

  // ------------------------------------------------------------------ morph animation
  const anim = { t0: 0 };
  const loop = animationLoop((dt, now) => {
    const s = Math.min(1, (now - anim.t0) / 2200);
    st.t = s < 0.5 ? 4 * s ** 3 : 1 - (-2 * s + 2) ** 3 / 2;
    tSlider.set(st.t);
    invalidate('mapped', 'probe');
    if (s >= 1) { loop.stop(); morphBtn.querySelector('span').textContent = '播放变形'; }
  });
  function playMorph() {
    if (loop.running) { loop.stop(); morphBtn.querySelector('span').textContent = '播放变形'; return; }
    anim.t0 = performance.now();
    morphBtn.querySelector('span').textContent = '停止';
    loop.start();
  }

  // ------------------------------------------------------------------ panel
  let fitTimer = 0;
  const fnField = exprField({
    prefix: 'f(z) =',
    value: st.src,
    id: 'fz-input',
    compile: (src) => complexFunction(src),
    onValid(F, src) {
      st.F = F;
      st.src = src;
      presetChips.set(PRESETS.find((p) => p.f === src)?.id ?? null);
      paramBox.style.display = F.usesParam ? '' : 'none';
      invalidate('fn');
      syncQuery();
      clearTimeout(fitTimer);
      fitTimer = setTimeout(() => { fitW(); invalidate('wview'); }, 450);
    },
  });
  const presetChips = chips({
    items: PRESETS.map((p) => ({ id: p.id, label: p.label, title: p.f })),
    value: PRESETS.find((p) => p.f === st.src)?.id,
    onPick: (id) => applyPreset(PRESETS.find((p) => p.id === id)),
  });
  function applyPreset(p) {
    if (p.a) st.a = [...p.a];
    st.grid = p.grid;
    gridSeg.set(p.grid);
    st.R = p.R;
    rSlider.set(p.R);
    st.center = [0, 0];
    st.src = p.f;
    fnField.set(p.f, false);
    st.F = complexFunction(p.f);
    presetChips.set(p.id);
    paramBox.style.display = st.F.usesParam ? '' : 'none';
    paramRead.set('a', fmtComplex(st.a[0], st.a[1], 4));
    fitZ();
    fitW();
    invalidate('fn', 'zview', 'wview');
    syncQuery();
  }

  const paramRead = readout([['a', '参数 <span class="math">a</span>']]);
  paramRead.set('a', fmtComplex(st.a[0], st.a[1], 4));
  const paramBox = h('div', { style: { display: st.F.usesParam ? '' : 'none' } }, paramRead.el,
    h('div', { class: 'hint' }, '在 z 平面拖动黄色菱形改变复参数 a，着色与网格实时更新。'));

  const styleSeg = segmented({
    options: [{ value: 'enhanced', label: '增强相位图' }, { value: 'phase', label: '纯相位' }, { value: 'checker', label: '棋盘格' }],
    value: st.style,
    id: 'style-seg',
    onChange: (v) => { st.style = v; invalidate('zview'); },
  });
  const gridSeg = segmented({
    options: [{ value: 'cart', label: '直角网格' }, { value: 'polar', label: '极坐标网格' }],
    value: st.grid,
    onChange: (v) => { st.grid = v; invalidate('mapped', 'zfg'); },
  });
  const rSlider = slider({ label: '网格范围 <span class="math">R</span>', min: 0.1, max: 6, step: 0.01, value: st.R, onInput: (v) => { st.R = v; invalidate('mapped', 'zfg'); } });
  const dSlider = slider({ label: '网格密度', min: 2, max: 24, step: 1, value: st.density, format: (v) => `${v}`, onInput: (v) => { st.density = v; invalidate('mapped', 'zfg'); } });
  const tSlider = slider({ label: '变形 <span class="math">w</span> = (1−<span class="math">t</span>)<span class="math">z</span> + <span class="math">t f</span>(<span class="math">z</span>)', min: 0, max: 1, step: 0.001, value: 1, format: (v) => fmt(v, 2), id: 'morph-slider', onInput: (v) => { loop.stop(); st.t = v; invalidate('mapped', 'probe'); } });
  const morphBtn = button({ label: '播放变形', iconName: 'play', variant: 'primary', onClick: playMorph, id: 'morph-play' });

  const probeRead = readout([
    ['z', '<span class="math">z</span>'],
    ['w', '<span class="math">f</span>(<span class="math">z</span>)'],
    ['mod', '模与辐角'],
    ['dz', '<span class="math">f′</span>(<span class="math">z</span>) = ∂<span class="math">f</span>/∂<span class="math">z</span>'],
    ['scale', '局部作用'],
    ['dzb', '|∂<span class="math">f</span>/∂<span class="math">z̄</span>|'],
  ], { id: 'probe-readout' });
  const windRead = readout([['n', '零点数 − 极点数'], ['exact', '总辐角变化 / 2π']], { id: 'winding-readout' });
  const contourToggle = toggle({
    label: '显示围道（幅角原理）', value: st.contour.on, id: 'contour-toggle', swatch: '#ffffff',
    onChange: (v) => { st.contour.on = v; invalidate('mapped', 'zfg'); },
  });

  panel.append(
    section('函数', [
      fnField.el,
      presetChips.el,
      paramBox,
      h('div', { class: 'hint', html: '变量 <code>z</code>（也可用 <code>x</code> = Re z, <code>y</code> = Im z）、常数 <code>i</code> <code>pi</code> <code>e</code>、参数 <code>a</code>；函数 sin cos tan exp log sqrt sinh cosh tanh asin acos atan gamma conj abs arg re im。支持隐式乘法，如 <code>2z(z-i)</code>。' }),
    ]),
    section('定义域着色', [
      styleSeg.el,
      h('div', { class: 'toggles' },
        toggle({ label: 'z 平面着色', value: st.showColor, onChange: (v) => { st.showColor = v; invalidate('zview'); } }).el,
        toggle({ label: 'w 平面参考色轮', value: st.showRef, onChange: (v) => { st.showRef = v; invalidate('wview'); } }).el),
      h('div', { class: 'hint', html: '颜色表示 arg f(z)：<span style="color:#ff7a7a">红</span>→<span style="color:#d6c84a">黄</span>→<span style="color:#4fd18b">绿</span>→<span style="color:#4fb6f0">蓝</span>→<span style="color:#c58cf0">紫</span> 逆时针一圈。所有颜色汇聚的点是零点或极点：绕零点颜色逆时针排列，绕极点顺时针；绕 n 圈即 n 阶。明暗条纹是 |f| 每翻倍一次的等高线。w 平面的参考色轮与之对应：z 处的颜色就是 f(z) 在右图所在处的颜色。' }),
    ]),
    section('网格映射', [
      gridSeg.el,
      rSlider.el,
      dSlider.el,
      h('div', { class: 'toggles' }, toggle({ label: '在 z 平面显示网格', value: st.showGridZ, onChange: (v) => { st.showGridZ = v; invalidate('zfg'); } }).el),
      morphBtn,
      tSlider.el,

  function drawEquilibrium(ctx, e) {
    const { color, shape } = EQ_STYLE[e.type] || EQ_STYLE.degenerate;
    const x = vp.sx(e.x), y = vp.sy(e.y);
    ctx.save();
    glow(ctx, x, y, 22, color, 0.8);
    ctx.lineWidth = 2.4;
    ctx.strokeStyle = color;
    ctx.fillStyle = shape === 'filled' ? color : '#0c1018';
    ctx.beginPath();
    if (shape === 'diamond') {
      ctx.moveTo(x, y - 8); ctx.lineTo(x + 8, y); ctx.lineTo(x, y + 8); ctx.lineTo(x - 8, y); ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.arc(x, y, 6.5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.stroke();
      if (shape === 'ring') {
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, 2 * Math.PI);
        ctx.fillStyle = color;
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------ particles (dynamic layer)
  const NP = 800, TRAIL = 12;
  const P = { x: new Float64Array(NP), y: new Float64Array(NP), age: new Float32Array(NP), life: new Float32Array(NP), hx: new Float32Array(NP * TRAIL), hy: new Float32Array(NP * TRAIL), head: new Uint8Array(NP), n: new Uint8Array(NP) };
  const work = rk4Work(2);
  const Y = new Float64Array(2);
  function spawn(i) {
    P.x[i] = vp.wx(Math.random() * vp.w);
    P.y[i] = vp.wy(Math.random() * vp.h);
    P.age[i] = 0;
    P.life[i] = 1.5 + Math.random() * 3;
    P.n[i] = 0;
    P.head[i] = 0;
  }
  function resetParticles() { for (let i = 0; i < NP; i++) { spawn(i); P.age[i] = Math.random() * P.life[i]; } }

  /** Time step so the fastest visible flow moves about 6 px per frame. */
  let flowScale = 1;
  function measureFlow() {
    const vals = [];
    for (let k = 0; k < 64; k++) {
      const [u, v] = F(vp.wx(Math.random() * vp.w), vp.wy(Math.random() * vp.h));
      const m = Math.hypot(u, v);
      if (Number.isFinite(m)) vals.push(m);
    }
    vals.sort((p, q) => p - q);
    const typical = vals.length ? vals[Math.floor(vals.length * 0.7)] : 1;
    flowScale = typical > 0 ? 1 / typical : 1;
  }

  function stepParticles(dt) {
    // integration time per frame chosen so typical flow moves ~90 px/s on screen
    const step = (Math.min(0.05, dt) * st.speed * 90 * flowScale) / vp.scale;
    for (let i = 0; i < NP; i++) {
      P.age[i] += dt;
      if (P.age[i] > P.life[i]) { spawn(i); continue; }
      Y[0] = P.x[i]; Y[1] = P.y[i];
      rk4Step(sys, 0, Y, step, work);
      const px = vp.sx(Y[0]), py = vp.sy(Y[1]);
      if (!Number.isFinite(px) || !Number.isFinite(py) || px < -10 || px > vp.w + 10 || py < -10 || py > vp.h + 10 || (Math.abs(px - vp.sx(P.x[i])) < 0.02 && Math.abs(py - vp.sy(P.y[i])) < 0.02 && P.n[i] > 3)) {
        spawn(i);
        continue;
      }
      P.x[i] = Y[0]; P.y[i] = Y[1];
      const hd = (P.head[i] + 1) % TRAIL;
      P.head[i] = hd;
      P.hx[i * TRAIL + hd] = px;
      P.hy[i * TRAIL + hd] = py;
      if (P.n[i] < TRAIL) P.n[i]++;
    }
  }

  function drawParticles(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 1.5;
    for (let seg = 1; seg < TRAIL; seg++) {
      ctx.beginPath();
      for (let i = 0; i < NP; i++) {
        if (P.n[i] <= seg) continue;
        const a = (P.head[i] - seg + 1 + TRAIL) % TRAIL, b = (P.head[i] - seg + TRAIL) % TRAIL;
        ctx.moveTo(P.hx[i * TRAIL + a], P.hy[i * TRAIL + a]);
        ctx.lineTo(P.hx[i * TRAIL + b], P.hy[i * TRAIL + b]);
      }
      ctx.strokeStyle = `rgba(206, 224, 255, ${0.5 * (1 - seg / TRAIL) ** 1.3})`;
      ctx.stroke();
    }
    ctx.restore();
  }

  function pointAt(tr, t) {
    const pts = tr.pts;
    let lo = 0, hi = pts.length / 3 - 1;
    if (t <= pts[2]) return [pts[0], pts[1]];
    if (t >= pts[3 * hi + 2]) return [pts[3 * hi], pts[3 * hi + 1]];
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (pts[3 * mid + 2] <= t) lo = mid; else hi = mid;
    }
    const t0 = pts[3 * lo + 2], t1 = pts[3 * hi + 2];
    const s = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
    return [pts[3 * lo] + s * (pts[3 * hi] - pts[3 * lo]), pts[3 * lo + 1] + s * (pts[3 * hi + 1] - pts[3 * lo + 1])];
  }

  function drawFx() {
    fx.reset();
    const ctx = fx.ctx;
    if (st.show.particles) drawParticles(ctx);
    if (st.show.dots) {
      st.trajs.forEach((tr) => {
        // each dot runs over its forward time range, looping
        const span = tr.t1 - 0;
        if (span <= 0) return;
        const t = (st.tAnim % span);
        const [x, y] = pointAt(tr, t);
        const px = vp.sx(x), py = vp.sy(y);
        glow(ctx, px, py, 22, tr.color);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(px, py, 4.5, 0, 2 * Math.PI);
        ctx.fill();
      });
    }
    if (st.hover) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.arc(vp.sx(st.hover.x), vp.sy(st.hover.y), 13, 0, 2 * Math.PI);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ------------------------------------------------------------------ time series strip
  // The plot itself only changes with the trajectory, so it is rendered once into an offscreen
  // canvas; each frame just blits it and draws the moving time cursor.
  const seriesCache = { canvas: document.createElement('canvas'), key: '', X: null };
  function drawSeries() {
    const tr = st.trajs[st.selected];
    const key = `${st.selected}|${st.trajs.length}|${trajVersion}|${stripLayer.canvas.width}x${stripLayer.canvas.height}`;
    if (seriesCache.key !== key) renderSeriesCache();
    seriesCache.key = key;
    stripLayer.reset();
    const ctx = stripLayer.ctx;
    ctx.drawImage(seriesCache.canvas, 0, 0, stripLayer.w, stripLayer.h);
    if (tr && seriesCache.X && st.show.dots && tr.t1 > 0) {
      const x = seriesCache.X(st.tAnim % tr.t1);
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.moveTo(x, 18);
      ctx.lineTo(x, stripLayer.h - 18);
      ctx.stroke();
    }
  }

  function renderSeriesCache() {
    const c = seriesCache.canvas;
    c.width = stripLayer.canvas.width;
    c.height = stripLayer.canvas.height;
    const ctx = c.getContext('2d');
    ctx.setTransform(stripLayer.dpr, 0, 0, stripLayer.dpr, 0, 0);
    const W = stripLayer.w, H = stripLayer.h;
    const tr = st.trajs[st.selected];
    seriesCache.X = null;
    ctx.font = `11px ${FONT}`;
    if (!tr) {
      ctx.fillStyle = C.text3;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('单击相平面添加一条轨线，这里显示它的 x(t)、y(t)', W / 2, H / 2);
      return;
    }
    const pts = tr.pts;
    const n = pts.length / 3;
    // show forward time only (t ≥ 0)
    let k0 = 0;
    while (k0 < n - 1 && pts[3 * k0 + 2] < 0) k0++;
    const tEnd = pts[3 * (n - 1) + 2];
    let lo = Infinity, hi = -Infinity;
    for (let k = k0; k < n; k++) { lo = Math.min(lo, pts[3 * k], pts[3 * k + 1]); hi = Math.max(hi, pts[3 * k], pts[3 * k + 1]); }
    if (!(hi > lo)) { hi = lo + 1; lo -= 1; }
    const padL = 44, padR = 14, padT = 22, padB = 18;
    const X = (t) => padL + ((t - 0) / Math.max(1e-9, tEnd)) * (W - padL - padR);
    seriesCache.X = X;
    const Yv = (v) => H - padB - ((v - lo) / (hi - lo)) * (H - padT - padB);
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const v of [lo, (lo + hi) / 2, hi]) { ctx.moveTo(padL, Yv(v)); ctx.lineTo(W - padR, Yv(v)); }
    if (lo < 0 && hi > 0) { ctx.moveTo(padL, Yv(0)); ctx.lineTo(W - padR, Yv(0)); }
    ctx.stroke();
    ctx.fillStyle = C.text3;
    ctx.font = `10px ${MONO}`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const axisLabel = (v) => (Math.abs(v) < 1e-9 * (hi - lo) ? '0' : fmt(v, 2));
    ctx.fillText(axisLabel(hi), padL - 6, Yv(hi));
    ctx.fillText(axisLabel(lo), padL - 6, Yv(lo));
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`t = ${fmt(tEnd, 1)}`, W - padR - 52, H - padB + 3);
    const plot = (idx, color) => {
      ctx.beginPath();
      for (let k = k0; k < n; k++) {
        const px = X(pts[3 * k + 2]), py = Yv(pts[3 * k + idx]);
        if (k === k0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    };
    plot(0, '#7aa2ff');
    plot(1, '#f472b6');
    ctx.font = `600 11px ${FONT}`;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7aa2ff';
    ctx.fillText('x(t)', padL + 6, 11);
    ctx.fillStyle = '#f472b6';
    ctx.fillText('y(t)', padL + 46, 11);
    ctx.fillStyle = tr.color;
    ctx.fillText(`轨线 #${st.selected + 1}  起点 ${fmtVec(tr.x0, tr.y0)}`, padL + 90, 11);
  }

  // ------------------------------------------------------------------ hover / coordinates
  function updateCoords(x, y) {
    const [u, v] = F(x, y);
    coordCard.innerHTML = '';
    coordCard.append(
      h('div', { class: 'title' }, '光标'),
      h('div', { class: 'big' }, `(x, y) = ${fmtVec(x, y, 3)}`),
      h('div', { class: 'big', style: { color: C.text2, marginTop: '2px' } }, `(ẋ, ẏ) = ${fmtVec(u, v, 3)}`));
  }

  function eqAt(px, py) {
    if (!st.show.equilibria) return null;
    let best = null, bd = 12;
    for (const e of st.eq) {
      const d = Math.hypot(vp.sx(e.x) - px, vp.sy(e.y) - py);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function eigenText(e) {
    return e.eigen.real ? `λ = ${fmt(e.eigen.real[0], 3)}, ${fmt(e.eigen.real[1], 3)}` : `λ = ${fmtComplex(e.eigen.re, e.eigen.im, 3)}, ${fmtComplex(e.eigen.re, -e.eigen.im, 3)}`;
  }

  function showTip(e, px, py) {
    if (!e) { tip.style.display = 'none'; return; }
    tip.style.display = '';
    tip.style.left = `${px}px`;
    tip.style.top = `${py}px`;
    tip.innerHTML = '';
    tip.append(
      h('div', { class: 't-title', style: { color: (EQ_STYLE[e.type] || EQ_STYLE.degenerate).color } }, e.label),
      h('div', { class: 't-mono' }, `(${fmt(e.x, 4)}, ${fmt(e.y, 4)})`),
      h('div', { class: 't-mono' }, eigenText(e)),
      h('div', { class: 't-mono' }, `tr J = ${fmt(e.tr, 3)}, det J = ${fmt(e.det, 3)}`));
  }

  // ------------------------------------------------------------------ scheduling
  let baseDirty = true;
  const markBase = () => { baseDirty = true; };
  // Slider input can fire several times per frame: record what is stale and recompute it once,
  // at the start of the next animation frame (or immediately when asked to).
  const pending = { traj: false, structure: false };
  function invalidateAll({ trajectories = true, structureNow = false } = {}) {
    if (trajectories) pending.traj = true;
    pending.structure = true;
    if (structureNow) flushPending();
    markBase();
  }
  function flushPending() {
    if (pending.traj) { pending.traj = false; recomputeTrajectories(); }
    if (pending.structure) { pending.structure = false; measureFlow(); recomputeStructure(); }
  }

  const loop = animationLoop((dt) => {
    flushPending();
    if (baseDirty) { drawBase(); baseDirty = false; }
    st.tAnim += dt * st.speed * 1.5;
    if (st.show.particles) stepParticles(dt);
    drawFx();
    if (st.show.series) drawSeries();
  });

  // ------------------------------------------------------------------ interaction
  let viewTimer = 0;
  const detach = attachPointer(base.canvas, vp, {
    onClick(x, y) {
      hint.style.opacity = 0;
      addTrajectory(x, y);
      markBase();
    },
    onHover(px, py, x, y) {
      updateCoords(x, y);
      const e = eqAt(px, py);
      st.hover = e ? { x: e.x, y: e.y } : null;
      showTip(e, px, py);
    },
    onLeave() { st.hover = null; tip.style.display = 'none'; },
    onView() {
      hint.style.opacity = 0;
      for (let i = 0; i < NP; i++) P.n[i] = 0;
      markBase();
      clearTimeout(viewTimer);
      viewTimer = setTimeout(() => { invalidateAll(); syncQuery(); }, 120);
    },
  });
  const stopResize = observeSize(root, (w, hh) => {
    const first = vp.w <= 1;
    base.resize(w, hh);
    fx.resize(w, hh);
    vp.setSize(w, hh);
    const r = strip.getBoundingClientRect();
    stripLayer.resize(r.width, r.height);
    if (first) applyView(st.preset.view);
    resetParticles();
    invalidateAll({ structureNow: true });
  });

  function applyView(v) {
    // keep the time-series strip from covering the region of interest
    vp.fit(v[0], v[1], v[2], v[3], 0.04, st.show.series ? { bottom: (strip.offsetHeight || 128) + 20 } : null);
  }

  // ------------------------------------------------------------------ panel
  const presetChips = chips({ items: PRESETS_2D.map((p) => ({ id: p.id, label: p.label })), value: st.preset.id, onPick: (id) => loadPreset(PRESETS_2D.find((p) => p.id === id)), id: 'ode2d-presets' });
  const fField = exprField({ prefix: 'ẋ =', id: 'ode-f', compile: (src) => realFunction(src, VARS), onValid: (fn, src) => { st.fx = fn; st.fSrc = src; presetChips.set(null); invalidateAll(); syncQuery(); } });
  const gField = exprField({ prefix: 'ẏ =', id: 'ode-g', compile: (src) => realFunction(src, VARS), onValid: (fn, src) => { st.fy = fn; st.gSrc = src; presetChips.set(null); invalidateAll(); syncQuery(); } });
  const note = h('div', { class: 'note', id: 'ode-note' });
  const paramBox = h('div', { class: 'field', style: { gap: '10px' } });
  const sliders = {};
  for (const k of ['a', 'b', 'c', 'd']) {
    sliders[k] = slider({
      label: k, min: -2, max: 2, step: 0.001, value: st.p[k], id: `param-${k}`,
      onInput: (v) => { st.p[k] = v; invalidateAll(); syncQueryLater(); },
    });
    paramBox.append(sliders[k].el);
  }
  const trajCount = h('span', null, '0');
  const tg = (key, text, swatch) => toggle({ label: text, value: st.show[key], swatch, id: `ode-show-${key}`, onChange: (v) => {
    st.show[key] = v;
    if (key === 'series') strip.style.display = v ? '' : 'none';
    if (key === 'nullclines' || key === 'separatrices') recomputeStructure();
    if (key === 'particles') resetParticles();
    markBase();
  } });
  const eqList = h('div', { class: 'field', id: 'eq-list', style: { gap: '6px' } });

  const panelEl = h('div', null,
    section('系统', [
      presetChips.el,
      fField.el,
      gField.el,
      h('div', { class: 'hint', html: '变量 <code>x</code> <code>y</code> <code>t</code>，参数 <code>a</code> <code>b</code> <code>c</code> <code>d</code>（下方滑块），函数 sin cos exp log sqrt abs tanh min max mod …' }),
      note,
    ]),
    section('参数', [paramBox], { aside: '拖动实时更新' }),
    section('轨线', [
      h('div', { class: 'hint' }, '在相平面上单击：从该点向前、向后积分（自适应 Dormand–Prince 5(4)，相对误差 10⁻⁸）。'),
      slider({ label: '积分时长 <span class="math">T</span>（双向）', min: 5, max: 200, step: 1, value: st.T, format: (v) => fmt(v, 0), onInput: (v) => { st.T = v; recomputeTrajectories(); markBase(); } }).el,
      slider({ label: '动画速度', min: 0.1, max: 4, step: 0.05, value: st.speed, format: (v) => `${fmt(v, 2)}×`, onInput: (v) => { st.speed = v; } }).el,
      h('div', { class: 'btn-row' },
        button({ label: '撤销', small: true, onClick: () => { st.trajs.pop(); st.selected = st.trajs.length - 1; trajCount.textContent = String(st.trajs.length); markBase(); syncQuery(); } }),
        button({ label: '清除全部', small: true, iconName: 'trash', id: 'clear-trajs', onClick: () => { st.trajs = []; st.selected = -1; trajCount.textContent = '0'; markBase(); syncQuery(); } })),
      h('div', { class: 'hint' }, '当前轨线数：', trajCount),
    ]),
    section('显示', [
      h('div', { class: 'toggles two' },
        tg('field', '方向场', '#a35bd0').el,
        tg('particles', '流动粒子', '#c8dcff').el,
        tg('nullclines', 'ẋ = 0 / ẏ = 0', '#fb923c').el,
        tg('equilibria', '平衡点', '#4ade80').el,
        tg('separatrices', '分界线', '#fb7185').el,
        tg('dots', '运动质点', '#ffffff').el,
        tg('series', '时间序列', '#7aa2ff').el),
      h('div', { class: 'hint', html: '零倾线：<span style="color:#fb923c">橙</span> ẋ = 0，<span style="color:#a78bfa">紫</span> ẏ = 0；分界线：<span style="color:#fb7185">红</span> 不稳定流形，<span style="color:#60a5fa">蓝</span> 稳定流形。平衡点：<span style="color:#4ade80">●</span> 稳定、<span style="color:#fb7185">○</span> 不稳定、<span style="color:#fbbf24">◆</span> 鞍点、<span style="color:#22d3ee">◎</span> 中心。' }),
    ]),
    section('平衡点', [eqList], { aside: '牛顿法 + 雅可比矩阵' }),
  );
  panel.append(panelEl);

  let eqKey = '';
  function updateEqList() {
    // rebuilt only when the (rounded) content changes: DOM churn every frame forces panel layout
    const key = st.eq.slice(0, 8).map((e) => `${e.type}${fmtVec(e.x, e.y, 3)}${eigenText(e)}`).join('|') + st.eq.length;
    if (key === eqKey) return;
    eqKey = key;
    eqList.textContent = '';
    if (!st.eq.length) { eqList.append(h('div', { class: 'hint' }, '视野内没有找到平衡点。')); return; }
    for (const e of st.eq.slice(0, 8)) {
      eqList.append(h('div', { class: 'note', style: { padding: '8px 10px' } },
        h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '8px' } },
          h('b', { style: { color: (EQ_STYLE[e.type] || EQ_STYLE.degenerate).color, fontWeight: 600 } }, e.label),
          h('span', { style: { fontFamily: MONO, fontSize: '12px' } }, fmtVec(e.x, e.y, 3))),
        h('div', { style: { fontFamily: MONO, fontSize: '11.5px', color: C.text3 } }, eigenText(e))));
    }
    if (st.eq.length > 8) eqList.append(h('div', { class: 'hint' }, `…以及另外 ${st.eq.length - 8} 个`));
  }

  function loadPreset(p, { keepTrajs = false, params = null } = {}) {
    st.preset = p;
    presetChips.set(p.id);
    compile(p.f, p.g);
    fField.set(p.f, false);
    gField.set(p.g, false);
    note.textContent = p.note;
    for (const k of ['a', 'b', 'c', 'd']) {
      const spec = p.params[k];
      const s = sliders[k];
      if (spec) {
        s.el.style.display = '';
        s.setRange(spec.min, spec.max, 'any');
        st.p[k] = params?.[k] ?? spec.v;
        s.set(st.p[k]);
        s.setLabel(`<span class="math">${k}</span> · ${spec.label}`);
      } else {
        s.el.style.display = 'none';
        st.p[k] = params?.[k] ?? 0;
      }
    }
    if (vp.w > 1) applyView(p.view);
    if (!keepTrajs) {
      st.trajs = [];
      st.selected = -1;
      for (const [x, y] of p.seeds) addTrajectory(x, y);
    }
    resetParticles();
    invalidateAll({ structureNow: vp.w > 1 });
    syncQuery();
  }

  let qTimer = 0;
  function syncQueryLater() { clearTimeout(qTimer); qTimer = setTimeout(syncQuery, 250); }
  function syncQuery() {
    if (!active()) return;
    const q = { mode: '2d' };
    if (presetChips && st.preset && st.fSrc === st.preset.f && st.gSrc === st.preset.g) q.p = st.preset.id;
    else { q.f = st.fSrc; q.g = st.gSrc; }
    q.k = ['a', 'b', 'c', 'd'].map((k) => +st.p[k].toFixed(4)).join(',');
    q.s = st.trajs.map((tr) => `${+tr.x0.toFixed(3)}_${+tr.y0.toFixed(3)}`).join(';');
    setQuery(q);
  }

  // ------------------------------------------------------------------ initial state from URL
  {
    const p = PRESETS_2D.find((q) => q.id === query.get('p')) || PRESETS_2D[0];
    const k = (query.get('k') || '').split(',').map(Number);
    const params = k.length === 4 && k.every(Number.isFinite) ? { a: k[0], b: k[1], c: k[2], d: k[3] } : null;
    loadPreset(p, { params });
    if (query.get('f') && query.get('g')) {
      try {
        compile(query.get('f'), query.get('g'));
        fField.set(st.fSrc, false);
