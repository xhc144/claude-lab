  const img = document.createElement('canvas');
  const imgCtx = img.getContext('2d');
  let job = null;
  let lambdas = new Float32Array(0);
  function restart() {
    layout();
    const dpr = layer.dpr;
    const cols = Math.max(1, Math.round((G.x1 - G.x0) * dpr));
    const rows = Math.max(1, Math.round((G.y1 - G.y0) * dpr));
    img.width = cols;
    img.height = rows;
    job = { cols, rows, col: 0, counts: new Float32Array(rows), data: imgCtx.createImageData(cols, rows), view: { ...st.view }, map: st.map };
    lambdas = new Float32Array(cols).fill(NaN);
    drawAll();
  }
  function work(budget = 10) {
    if (!job || job.col >= job.cols) return false;
    const t0 = performance.now();
    const { f, df } = MAPS[job.map];
    const { r0, r1, y0, y1 } = job.view;
    const lnS = Math.log(1 + st.samples / 6);
    while (job.col < job.cols && performance.now() - t0 < budget) {
      const c = job.col++;
      const r = r0 + ((c + 0.5) / job.cols) * (r1 - r0);
      job.counts.fill(0);
      bifurcationColumn(f, r, st.x0, 400, st.samples, y0, y1, job.rows, job.counts);
      const d = job.data.data;
      for (let row = 0; row < job.rows; row++) {
        const n = job.counts[row];
        const q = 4 * (row * job.cols + c);
        if (n === 0) { d[q + 3] = 0; continue; }
        const t = Math.min(1, Math.log(1 + n) / lnS);
        const [R, Gc, Bc] = ramp(0.25 + 0.75 * t);
        d[q] = R; d[q + 1] = Gc; d[q + 2] = Bc; d[q + 3] = Math.min(255, 90 + 200 * t);
      }
      if (st.show.lambda) lambdas[c] = lyapunov(f, df, r, st.x0, { transient: 300, n: tol.hp ? 3000 : 800 });
    }
    imgCtx.putImageData(job.data, 0, 0);
    return true;
  }

  // ------------------------------------------------------------------ drawing
  let box = null; // rubber band
  function drawAll() {
    const { ctx } = layer;
    layer.reset();
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(0, 0, G.W, G.H);
    // diagram
    ctx.fillStyle = '#080b11';
    ctx.fillRect(G.x0, G.y0, G.x1 - G.x0, G.y1 - G.y0);
    ctx.imageSmoothingEnabled = false;
    if (job) ctx.drawImage(img, G.x0, G.y0, G.x1 - G.x0, G.y1 - G.y0);
    axes(ctx);
    if (st.show.markers && st.map === 'logistic') drawMarkers(ctx);
    if (st.show.lambda) drawLambda(ctx);
    // r cursor
    const px = rx(st.r);
    if (px >= G.x0 && px <= G.x1) {
      ctx.save();
      ctx.strokeStyle = alpha(C.cyan, 0.85);
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(px, G.y0);
      ctx.lineTo(px, st.show.lambda ? G.ly1 : G.y1);
      ctx.stroke();
      ctx.fillStyle = C.cyan;
      ctx.beginPath();
      ctx.moveTo(px, G.y1);
      ctx.lineTo(px - 6, G.y1 + 9);
      ctx.lineTo(px + 6, G.y1 + 9);
      ctx.fill();
      ctx.restore();
    }
    if (box) {
      ctx.save();
      ctx.strokeStyle = alpha(C.accent, 0.9);
      ctx.fillStyle = alpha(C.accent, 0.1);
      ctx.setLineDash([5, 4]);
      const x = Math.min(box.x0, box.x1), y = Math.min(box.y0, box.y1);
      ctx.fillRect(x, y, Math.abs(box.x1 - box.x0), Math.abs(box.y1 - box.y0));
      ctx.strokeRect(x, y, Math.abs(box.x1 - box.x0), Math.abs(box.y1 - box.y0));
      ctx.restore();
    }
  }

  function ticks(a, b, n = 6) {
    const raw = (b - a) / n;
    const p = 10 ** Math.floor(Math.log10(raw));
    const m = raw / p;
    const step = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
    const out = [];
    for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) out.push(+v.toPrecision(12));
    return { out, step };
  }
  const tickText = (v, step) => {
    const d = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
    return v.toFixed(Math.min(12, d)).replace('-', '−');
  };

  function axes(ctx) {
    ctx.save();
    ctx.font = `10.5px ${MONO}`;
    ctx.fillStyle = C.text3;
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
    ctx.lineWidth = 1;
    const tr = ticks(st.view.r0, st.view.r1, 8);
    ctx.textAlign = 'center';
    for (const v of tr.out) {
      const x = rx(v);
      ctx.beginPath(); ctx.moveTo(x, G.y0); ctx.lineTo(x, G.y1); ctx.stroke();
      ctx.fillText(tickText(v, tr.step), x, (st.show.lambda ? G.ly1 : G.y1) + 16);
    }
    const ty = ticks(st.view.y0, st.view.y1, 5);
    ctx.textAlign = 'right';
    for (const v of ty.out) {
      const y = yy(v);
      ctx.beginPath(); ctx.moveTo(G.x0, y); ctx.lineTo(G.x1, y); ctx.stroke();
      ctx.fillText(tickText(v, ty.step), G.x0 - 6, y + 3.5);
    }
    ctx.fillStyle = C.text2;
    ctx.font = `italic 13px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillText('x', 8, G.y0 + 10);
    ctx.fillText('r', 12, (st.show.lambda ? G.ly1 : G.y1) + 16);
    ctx.restore();
  }

  let markers = [];
  function drawMarkers(ctx) {
    ctx.save();
    ctx.setLineDash([3, 5]);
    ctx.font = `10px ${MONO}`;
    ctx.textAlign = 'center';
    let lastLabel = -Infinity;
    for (const m of markers) {
      const x = rx(m.r);
      if (x < G.x0 || x > G.x1) continue;
      ctx.strokeStyle = alpha(C.v, 0.35);
      ctx.beginPath(); ctx.moveTo(x, G.y0); ctx.lineTo(x, G.y1); ctx.stroke();
      if (x - lastLabel < 18) continue; // the markers crowd towards r∞: label only where there is room
      lastLabel = x;
      ctx.fillStyle = alpha(C.v, 0.85);
      ctx.fillText(m.label, x, G.y0 + 10);
    }
    ctx.restore();
  }

  function drawLambda(ctx) {
    ctx.save();
    ctx.fillStyle = '#080b11';
    ctx.fillRect(G.x0, G.ly0, G.x1 - G.x0, LAMBDA_H);
    const lo = -2.5, hi = 1;
    const ly = (v) => G.ly0 + ((hi - Math.max(lo, Math.min(hi, v))) / (hi - lo)) * LAMBDA_H;
    ctx.strokeStyle = 'rgba(203, 213, 225, 0.35)';
    ctx.beginPath(); ctx.moveTo(G.x0, ly(0)); ctx.lineTo(G.x1, ly(0)); ctx.stroke();
    const n = lambdas.length;
    const wpx = (G.x1 - G.x0) / Math.max(1, n);
    for (let c = 0; c < n; c++) {
      const v = lambdas[c];
      if (!Number.isFinite(v)) continue;
      ctx.fillStyle = v > 0 ? 'rgba(255, 107, 129, 0.75)' : 'rgba(122, 162, 255, 0.55)';
      const y = ly(v), y0 = ly(0);
      ctx.fillRect(G.x0 + c * wpx, Math.min(y, y0), Math.max(1, wpx), Math.abs(y - y0) || 1);
    }
    ctx.font = `10.5px ${FONT}`;
    ctx.fillStyle = C.text3;
    ctx.textAlign = 'right';
    ctx.fillText('λ', G.x0 - 8, G.ly0 + 12);
    ctx.font = `10px ${MONO}`;
    ctx.fillText('0', G.x0 - 6, ly(0) + 3.5);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255, 107, 129, 0.9)';
    ctx.fillText('λ > 0 混沌', G.x0 + 6, G.ly0 + 12);
    ctx.fillStyle = 'rgba(122, 162, 255, 0.9)';
    ctx.fillText('λ < 0 周期', G.x0 + 76, G.ly0 + 12);
    ctx.restore();
  }

  // ------------------------------------------------------------------ interaction
  let press = null;
  const local = (e) => { const r = layer.canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const inPlot = (x, y) => x >= G.x0 && x <= G.x1 && y >= G.y0 && y <= (st.show.lambda ? G.ly1 : G.y1);
  layer.canvas.addEventListener('pointerdown', (e) => {
    const [x, y] = local(e);
    if (!inPlot(x, y)) return;
    layer.canvas.setPointerCapture?.(e.pointerId);
    press = { x, y, moved: false };
    e.preventDefault();
  });
  layer.canvas.addEventListener('pointermove', (e) => {
    const [x, y] = local(e);
    layer.canvas.style.cursor = inPlot(x, y) ? 'crosshair' : 'default';
    if (!press) return;
    if (Math.hypot(x - press.x, y - press.y) > 5) press.moved = true;
    if (press.moved && press.y <= G.y1) {
      box = { x0: press.x, y0: press.y, x1: Math.max(G.x0, Math.min(G.x1, x)), y1: Math.max(G.y0, Math.min(G.y1, y)) };
      drawAll();
    } else if (!press.moved || press.y > G.y1) {
      setR(xr(x), { quiet: true });
    }
  });
  const release = (e) => {
    if (!press) return;
    const [x] = local(e);
    if (box && Math.abs(box.x1 - box.x0) > 8 && Math.abs(box.y1 - box.y0) > 8) {
      const ra = xr(Math.min(box.x0, box.x1)), rb = xr(Math.max(box.x0, box.x1));
      const ya = st.view.y1 - ((Math.max(box.y0, box.y1) - G.y0) / (G.y1 - G.y0)) * (st.view.y1 - st.view.y0);
      const yb = st.view.y1 - ((Math.min(box.y0, box.y1) - G.y0) / (G.y1 - G.y0)) * (st.view.y1 - st.view.y0);
      setView({ r0: ra, r1: rb, y0: ya, y1: yb });
    } else if (!press.moved) {
      setR(xr(x));
    }
    box = null;
    press = null;
    hint.style.opacity = 0;
    drawAll();
    syncQuery();
  };
  layer.canvas.addEventListener('pointerup', release);
  layer.canvas.addEventListener('pointercancel', release);
  layer.canvas.addEventListener('wheel', (e) => {
    const [x, y] = local(e);
    if (!inPlot(x, y) || y > G.y1) return;
    e.preventDefault();
    const f = Math.exp((e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY) * 0.0015);
    const r = xr(x), xv = st.view.y1 - ((y - G.y0) / (G.y1 - G.y0)) * (st.view.y1 - st.view.y0);
    const v = st.view;
    setView({ r0: r - (r - v.r0) * f, r1: r + (v.r1 - r) * f, y0: xv - (xv - v.y0) * f, y1: xv + (v.y1 - xv) * f }, { push: false });
  }, { passive: false });
  layer.canvas.style.touchAction = 'none';

  function setView(v, { push = true } = {}) {
    const m = map();
    const minW = 1e-12;
    if (v.r1 - v.r0 < minW || v.y1 - v.y0 < minW) { toast('已到双精度能分辨的最小范围'); return; }
    if (push) st.history.push({ ...st.view });
    st.view = { r0: Math.max(m.range[0], v.r0), r1: Math.min(m.range[1], v.r1), y0: v.y0, y1: v.y1 };
    restart();
    scheduleSync();
  }
  function back() {
    if (!st.history.length) { setView(defaultView(), { push: false }); return; }
    setView(st.history.pop(), { push: false });
  }

  // ------------------------------------------------------------------ r and the cobweb
  const cobCanvas = h('canvas', { class: 'panel-canvas', id: 'cobweb', width: 300, height: 300 });
  const seriesCanvas = h('canvas', { class: 'panel-canvas', id: 'series', width: 300, height: 90 });
  const rInput = h('input', { class: 'text-input mono', type: 'text', id: 'chaos-r', 'aria-label': 'r', spellcheck: 'false' });
  const read = readout([['state', '长期行为'], ['lambda', '李雅普诺夫指数 λ'], ['cycle', '吸引环']], { id: 'chaos-readout' });

  function setR(r, { quiet = false } = {}) {
    const m = map();
    st.r = Math.max(m.range[0], Math.min(m.range[1], r));
    if (document.activeElement !== rInput) rInput.value = fmt(st.r, 10);
    rSlider.set(st.r);
    rChips.set(R_PRESETS.find((p) => Math.abs(p.r - st.r) < 1e-12)?.id ?? null);
    updateOrbit();
    drawAll();
    if (!quiet) scheduleSync();
  }

  let lastPeriod = 0, lastLambda = 0;
  function updateOrbit() {
    const { f, df } = map();
    const p = detectPeriod(f, st.r, st.x0);
    const lam = lyapunov(f, df, st.r, st.x0, { n: tol.hp ? 20000 : 4000 });
    lastPeriod = p;
    lastLambda = lam;
    read.set('state', p ? `周期 ${p} 的吸引环` : lam > 0 ? '混沌（对初值敏感）' : '周期很长或收敛很慢', p ? 'good' : lam > 0 ? 'bad' : '');
    read.set('lambda', fmt(lam, tol.hp ? 8 : 4), lam > 0 ? 'bad' : 'good');
    if (p && p <= 8) {
      let x = st.x0;
      for (let k = 0; k < 4000; k++) x = f(st.r, x);
      const cyc = [];
      for (let k = 0; k < p; k++) { cyc.push(x); x = f(st.r, x); }
      read.set('cycle', cyc.sort((a, b) => a - b).map((v) => fmt(v, tol.hp ? 10 : 4)).join(', '));
    } else read.set('cycle', p ? `${p} 个点` : '—');
    drawCobweb();
    info.textContent = '';
    info.append(
      h('div', { class: 'title' }, `${map().label}映射　${map().formula}`),
      h('div', { class: 'big' }, `r = ${fmt(st.r, 8)}`),
      h('div', { class: 'big', style: { color: p ? C.ok : lam > 0 ? C.danger : C.text2 } }, p ? `周期 ${p}` : lam > 0 ? `混沌 · λ = ${fmt(lam, 3)}` : `λ = ${fmt(lam, 3)}`));
  }

  function drawCobweb() {
    const { f } = map();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const c of [cobCanvas, seriesCanvas]) {
      const w = c.clientWidth || 300, hh = c === cobCanvas ? w : 90;
      if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(hh * dpr); }
    }
    const ctx = cobCanvas.getContext('2d');
    const S = cobCanvas.width;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(0, 0, S, S);
    const p = 0.08 * S;
    const X = (x) => p + x * (S - 2 * p), Y = (y) => S - p - y * (S - 2 * p);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.lineWidth = dpr;
    ctx.strokeRect(X(0), Y(1), X(1) - X(0), Y(0) - Y(1));
    ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
    ctx.strokeStyle = C.accent;
    ctx.lineWidth = 1.6 * dpr;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) { const x = i / 200; const y = f(st.r, x); i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)); }
    ctx.stroke();
    // cobweb: (x, x) → (x, f(x)) → (f(x), f(x)) …
    let x = st.x0;
    const n = 160;
    ctx.lineWidth = dpr;
    ctx.beginPath();
    ctx.moveTo(X(x), Y(0));
    for (let k = 0; k < n; k++) {
      const y = f(st.r, x);
      ctx.lineTo(X(x), Y(y));
      ctx.lineTo(X(y), Y(y));
      x = y;
    }
    ctx.strokeStyle = alpha(C.v, 0.55);
    ctx.stroke();
    ctx.fillStyle = C.text3;
    ctx.font = `${10 * dpr}px ${MONO}`;
    ctx.fillText('x_{n+1} = f(x_n)', X(0) + 4 * dpr, Y(1) + 12 * dpr);
    // time series
    const sc = seriesCanvas.getContext('2d');
    const W = seriesCanvas.width, H = seriesCanvas.height;
    sc.setTransform(1, 0, 0, 1, 0, 0);
    sc.fillStyle = '#0a0d14';
    sc.fillRect(0, 0, W, H);
    sc.strokeStyle = C.cyan;
    sc.lineWidth = 1.2 * dpr;
    sc.beginPath();
    x = st.x0;
    for (let k = 0; k < 80; k++) {
      const px = (k / 79) * (W - 8 * dpr) + 4 * dpr, py = H - 4 * dpr - x * (H - 8 * dpr);
      k ? sc.lineTo(px, py) : sc.moveTo(px, py);
      x = f(st.r, x);
    }
    sc.stroke();
  }

  // ------------------------------------------------------------------ Feigenbaum table
  const feigenBox = h('div', { class: 'feigen', id: 'feigen' }, h('div', { class: 'hint' }, '计算中…'));
  let feigenRows = null;
  let feigenTimer = 0;
  function computeFeigenbaum() {
    const levels = tol.hp ? 16 : 11;
    const t0 = performance.now();
    // in chunks, so the page stays responsive while double-double works through 2¹⁶-cycles
    feigenTimer = setTimeout(() => {
      feigenRows = feigenbaum(levels, { dd: tol.hp });
      markers = feigenRows.slice(1, 9).map((row) => ({ r: tol.hp ? row.r[0] + row.r[1] : row.r, label: `2${'⁰¹²³⁴⁵⁶⁷⁸'[row.n]}` }));
      markers.push({ r: R_INF, label: 'r∞' });
      renderFeigen(performance.now() - t0);
      drawAll();
    }, 30);
  }
  function digitsMatch(est, truth) {
    const s = fmt(est, 15).replace('−', '-');
    let k = 0;
    while (k < s.length && s[k] === truth[k]) k++;
    return `<b class="good">${s.slice(0, k)}</b>${s.slice(k)}`.replace('-', '−');
  }
  function renderFeigen(ms) {
    const rows = feigenRows;
    const rText = (r) => (tol.hp ? B.toDecimal(B.add(B.fromNumber(r[0]), B.fromNumber(r[1]), 40), 26) : fmt(r, 14));
    const table = h('table', { class: 'feigen-table' },
      h('thead', null, h('tr', null, h('th', null, 'n'), h('th', null, '超稳定 rₙ（周期 2ⁿ）'), h('th', null, 'δₙ'))),
      h('tbody', null, rows.map((row) => h('tr', null,
        h('td', null, String(row.n)),
        h('td', { class: 'mono' }, rText(row.r)),
        h('td', { class: 'mono', html: row.delta ? digitsMatch(row.delta, FEIGENBAUM_DELTA) : '' })))));
    const d = rows.map((r) => r.delta);
    const L = d.length - 1;
    const acc = aitken(d[L - 2], d[L - 1], d[L]);
    const alphaRow = rows.filter((r) => r.alpha != null && r.n <= 10).at(-1);
    feigenBox.textContent = '';
    feigenBox.append(table,
      h('dl', { class: 'readout', style: { marginTop: '10px' } },
        h('dt', null, 'δ 的艾特肯加速'), h('dd', { id: 'feigen-aitken', html: digitsMatch(acc, FEIGENBAUM_DELTA) }),
        h('dt', null, '已知 δ'), h('dd', null, FEIGENBAUM_DELTA),
        h('dt', null, `α 估计（n = ${alphaRow.n}）`), h('dd', { html: digitsMatch(alphaRow.alpha, FEIGENBAUM_ALPHA) }),
        h('dt', null, '算术'), h('dd', null, `${tol.hp ? '双倍双精度（约 32 位）' : '双精度（约 16 位）'} · ${fmt(ms / 1000, 2)} s`)),
      h('div', { class: 'hint', html: tol.hp
        ? '高精度用两个双精度数之和表示一个数（约 32 位有效数字），可算到周期 2¹⁶ = 65536 的超稳定环；绿色是与已知 δ 一致的数字。'
        : '双精度在 n ≈ 10 之后，相邻 rₙ 的差已接近舍入误差，δₙ 开始偏离。按 <kbd>P</kbd> 开启高精度，改用双倍双精度算到 n = 16。' }));
  }

  // ------------------------------------------------------------------ panel
  const mapChips = chips({
    id: 'chaos-maps',
    items: Object.entries(MAPS).map(([id, m]) => ({ id, label: m.label })),
    value: st.map,
    onPick: (id) => { st.map = id; st.history = []; st.view = defaultView(); rSlider.setRange(MAPS[id].range[0], MAPS[id].range[1], 0.0001); setR(st.r); restart(); syncQuery(); },
  });
  const rSlider = slider({ label: '参数 <span class="math">r</span>', min: map().range[0], max: map().range[1], step: 0.0001, value: st.r, id: 'chaos-r-slider', format: (v) => fmt(v, 4), onInput: (v) => setR(v) });
  const rChips = chips({ id: 'chaos-r-presets', items: R_PRESETS.map((p) => ({ id: p.id, label: p.label })), onPick: (id) => setR(R_PRESETS.find((p) => p.id === id).r) });
  rInput.addEventListener('input', () => {
    try { const v = evalConstant(rInput.value); if (!Number.isFinite(v)) throw new Error('x'); rInput.classList.remove('invalid'); setR(v); } catch { rInput.classList.add('invalid'); }
  });
  rInput.addEventListener('keydown', (e) => e.stopPropagation());
  const tg = (key, text, swatch) => toggle({ label: text, value: st.show[key], swatch, onChange: (v) => { st.show[key] = v; restart(); } });

  panel.append(
    section('映射', [mapChips.el, h('div', { class: 'hint', id: 'chaos-formula' })]),
    section('参数', [rSlider.el, h('div', { class: 'expr-field field' }, h('div', { class: 'expr-wrap' }, h('span', { class: 'prefix' }, 'r ='), rInput)), rChips.el, read.el]),
    section('蛛网图与时间序列', [cobCanvas, seriesCanvas, h('div', { class: 'hint' }, '黄线从 x₀ 出发：竖直走到曲线 y = f(x)，再水平走到对角线 y = x，如此反复。收敛到一个点是不动点，绕成方框是周期环，乱成一团就是混沌。')]),
    section('费根鲍姆常数', [feigenBox]),

    const k = Math.max(Math.abs(x), Math.abs(y));
    if (x === k && y === -k) return [x + 1, y]; // last cell of a ring (or the centre): out to the next ring
    if (x === k) return [x, y + 1];
    if (y === k && x > -k) return [x - 1, y];
    if (x === -k && y > -k) return [x, y - 1];
    return [x + 1, y];
  }

  function drawSacks(ctx) {
    const N = (2 * st.K + 1) ** 2;
    ensureSieve(N + 2);
    const euler = eulerSet();
    const sz = Math.max(1.2, Math.min(5, vp.scale * 0.35));
    const groups = [[], [], [], []];
    for (let n = 2; n <= N; n++) {
      const kind = spiralKind(n, euler);
      if (!kind) continue;
      const r = Math.sqrt(n), a = 2 * Math.PI * r;
      groups[kind].push(vp.sx(r * Math.cos(a)), vp.sy(r * Math.sin(a)));
    }
    groups.forEach((pts, kind) => {
      if (!kind) return;
      ctx.fillStyle = ['', '#cbd5e1', '#f472b6', '#fbbf24'][kind];
      ctx.beginPath();
      for (let i = 0; i < pts.length; i += 2) ctx.rect(pts[i] - sz / 2, pts[i + 1] - sz / 2, sz, sz);
      ctx.fill();
    });
    if (st.hover && st.hover.tab === 'ulam') {
      const r = Math.sqrt(st.hover.n), a = 2 * Math.PI * r;
      ctx.strokeStyle = C.accent;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(vp.sx(r * Math.cos(a)), vp.sy(r * Math.sin(a)), sz + 3, 0, 2 * Math.PI);
      ctx.stroke();
    }
  }

  // ------------------------------------------------------------------ Gaussian primes
  const gaussImg = { canvas: document.createElement('canvas'), key: '' };
  function buildGaussImage() {
    const key = String(st.R);
    if (gaussImg.key === key) return;
    const R = st.R, S = 2 * R + 1;
    ensureSieve(2 * R * R + 2);
    const c = gaussImg.canvas;
    c.width = S; c.height = S;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(S, S);
    for (let row = 0; row < S; row++) {
      const b = R - row;
      for (let col = 0; col < S; col++) {
        const a = col - R;
        const q = 4 * (row * S + col);
        let rgb = a === 0 || b === 0 ? [22, 28, 40] : [11, 15, 23];
        if (gaussianPrime(a, b, prime)) {
          const t = Math.sqrt(a * a + b * b) / (R * Math.SQRT2);
          rgb = [120 + 120 * t, 200 - 90 * t, 255 - 20 * t];
        }
        img.data[q] = rgb[0]; img.data[q + 1] = rgb[1]; img.data[q + 2] = rgb[2]; img.data[q + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    gaussImg.key = key;
  }
  function drawGauss(ctx) {
    buildGaussImage();
    const R = st.R, S = 2 * R + 1;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(gaussImg.canvas, gvp.sx(-R - 0.5), gvp.sy(R + 0.5), S * gvp.scale, S * gvp.scale);
    if (gvp.scale >= 14) {
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      const b = gvp.bounds;
      for (let x = Math.max(-R, Math.ceil(b.xmin)); x <= Math.min(R, b.xmax); x++) { ctx.moveTo(gvp.sx(x - 0.5), gvp.sy(R + 0.5)); ctx.lineTo(gvp.sx(x - 0.5), gvp.sy(-R - 0.5)); }
      for (let y = Math.max(-R, Math.ceil(b.ymin)); y <= Math.min(R, b.ymax); y++) { ctx.moveTo(gvp.sx(-R - 0.5), gvp.sy(y - 0.5)); ctx.lineTo(gvp.sx(R + 0.5), gvp.sy(y - 0.5)); }
      ctx.stroke();
    }
    ctx.fillStyle = C.text3;
    ctx.font = `12px ${MONO}`;
    ctx.fillText('Re', gvp.sx(R + 1), gvp.sy(0) + 4);
    ctx.fillText('Im', gvp.sx(0) - 7, gvp.sy(R + 1.2));
    if (st.hover && st.hover.tab === 'gauss') {
      const [a, b] = st.hover.cell;
      const r = Math.max(3, gvp.scale / 2);
      ctx.strokeStyle = C.accent;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(gvp.sx(a) - r, gvp.sy(b) - r, 2 * r, 2 * r);
    }
  }
  function gaussExplain(a, b) {
    const z = `${a}${b < 0 ? ' − ' : ' + '}${Math.abs(b)}i`.replace(/^0 \+ /, '').replace(/^-/, '−');
    const n = a * a + b * b;
    if (n === 0) return [z, '0 不是素数'];
    if (n === 1) return [z, '单位（±1、±i）不算素数'];
    if (gaussianPrime(a, b, prime)) {
      if (a === 0 || b === 0) return [z, `素数：${Math.abs(a + b)} ≡ 3 (mod 4)，在高斯整数里仍不可分解`];
      return [z, `素数：范数 ${a}² + ${b}² = ${n} 是素数`];
    }
    const f = factor(n).map(([p, e]) => (e > 1 ? `${p}^${e}` : String(p))).join(' · ');
    return [z, `合数：范数 ${n} = ${f}`];
  }

  // ------------------------------------------------------------------ counting
  let countSieve = null; // up to 10^7
  const table = { rows: null };
  function ensureCount() {
    if (!countSieve) countSieve = sieve(1e7);
  }
  function buildTable() {
    if (table.rows) return;
    table.rows = [];
    for (let k = 1; k <= 25; k++) {
      const x = 10n ** BigInt(k);
      const p = PI_POW10[k];
      table.rows.push({ k, pi: p, li: roundFixed(liFixed(x, 40), 40) - p, r: roundFixed(riemannRFixed(x, 40), 40) - p });
    }
  }

  function plotFrame(ctx, r, xr, yr, { xlog = false, xlabel = '', ylabel = '', xticks = null, yticks = null } = {}) {
    ctx.fillStyle = '#0a0d14';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
    const X = (v) => r.x + ((xlog ? Math.log10(v) - Math.log10(xr[0]) : v - xr[0]) / (xlog ? Math.log10(xr[1]) - Math.log10(xr[0]) : xr[1] - xr[0])) * r.w;
    const Y = (v) => r.y + r.h - ((v - yr[0]) / (yr[1] - yr[0])) * r.h;
    ctx.font = `10.5px ${MONO}`;
    ctx.fillStyle = C.text3;
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
    ctx.beginPath();
    for (const t of xticks || []) { ctx.moveTo(X(t[0]), r.y); ctx.lineTo(X(t[0]), r.y + r.h); }
    for (const t of yticks || []) { ctx.moveTo(r.x, Y(t[0])); ctx.lineTo(r.x + r.w, Y(t[0])); }
    ctx.stroke();
    ctx.textAlign = 'center';
    for (const t of xticks || []) ctx.fillText(t[1], X(t[0]), r.y + r.h + 13);
    ctx.textAlign = 'right';
    for (const t of yticks || []) ctx.fillText(t[1], r.x - 5, Y(t[0]) + 3);
    ctx.textAlign = 'left';
    ctx.fillStyle = C.text2;
    ctx.font = `12px ${FONT}`;
    if (ylabel) ctx.fillText(ylabel, r.x + 8, r.y + 16);
    if (xlabel) { ctx.textAlign = 'right'; ctx.fillText(xlabel, r.x + r.w - 6, r.y + r.h - 6); ctx.textAlign = 'left'; }
    return { X, Y };
  }
  const niceTicks = (lo, hi, n = 5) => {
    const span = hi - lo, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
    const step = [1, 2, 5, 10].map((m) => m * mag).find((s) => span / s <= n) || 10 * mag;
    const out = [];
    for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9 * step; v += step) out.push([v, fmt(Math.abs(v) >= 1e5 ? v : Math.round(v * 1e6) / 1e6, 3)]);
    return out;
  };
  /** Legend row ending at the right edge x. */
  function legend(ctx, xRight, y, items) {
    ctx.font = `12px ${FONT}`;
    const width = items.reduce((a, [label]) => a + 34 + ctx.measureText(label).width, 0);
    ctx.fillStyle = 'rgba(10, 13, 20, 0.85)';
    ctx.fillRect(xRight - width - 6, y - 10, width + 4, 20);
    let cx = xRight - width;
    for (const [label, col, dash] of items) {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      ctx.setLineDash(dash || []);
      ctx.beginPath();
      ctx.moveTo(cx, y);
      ctx.lineTo(cx + 18, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = C.text2;
      ctx.fillText(label, cx + 23, y + 4);
      cx += 34 + ctx.measureText(label).width;
    }
  }

  function drawCount(ctx) {
    ensureCount();
    const Xmax = Math.round(10 ** st.logX);
    const pad = { l: 64, r: 22 };
    const top = { x: pad.l, y: 24, w: W - pad.l - pad.r, h: (H - 110) * 0.58 };
    const bot = { x: pad.l, y: top.y + top.h + 36, w: top.w, h: H - top.y - top.h - 36 - 30 };
    // samples of π(x), one per pixel column (or every integer when x is small)
    const n = Math.round(top.w * 2);
    const xs = [], ps = [];
    let count = 0, k = 1; // count = π(k)
    for (let i = 0; i <= n; i++) {
      const x = 2 + ((Xmax - 2) * i) / n;
      while (k + 1 <= x && k + 1 < countSieve.length) { k++; count += countSieve[k]; }
      xs.push(x);
      ps.push(count);
    }
    const piX = ps[ps.length - 1];
    const ymax = Math.max(li(Xmax), piX) * 1.05;
    const xt = niceTicks(0, Xmax, 6).map(([v]) => [v, v >= 1e4 ? `${fmt(v / 10 ** Math.floor(Math.log10(v)), 2)}e${Math.floor(Math.log10(v))}` : String(v)]);
    const f = plotFrame(ctx, top, [0, Xmax], [0, ymax], { xticks: xt, yticks: niceTicks(0, ymax, 4), ylabel: '素数个数' });
    const curve = (fn, col, dash, r = top, F = f) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.setLineDash(dash || []);
      ctx.beginPath();
      xs.forEach((x, i) => { const v = fn(x, i); const X = F.X(x), Y = F.Y(v); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke(); ctx.setLineDash([]);
    };
    ctx.save();
    ctx.beginPath(); ctx.rect(top.x, top.y, top.w, top.h); ctx.clip();
    curve((x) => x / Math.log(x), C.warn, [5, 4]);
    curve((x) => li(x) - li(2), C.cyan);
    curve((x) => riemannR(x), C.ok, [2, 3]);
    // π(x) as a staircase
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    xs.forEach((x, i) => { const X = f.X(x), Y = f.Y(ps[i]); if (i) { ctx.lineTo(X, f.Y(ps[i - 1])); ctx.lineTo(X, Y); } else ctx.moveTo(X, Y); });
    ctx.stroke();
    ctx.restore();
    legend(ctx, top.x + top.w - 4, top.y + 16, [['π(x)', '#f8fafc'], ['x / ln x', C.warn, [5, 4]], ['Li(x)', C.cyan], ['R(x)', C.ok, [2, 3]]]);
    // differences from π(x)
    const dPNT = xs.map((x, i) => x / Math.log(x) - ps[i]);
    const dLi = xs.map((x, i) => li(x) - li(2) - ps[i]);
    const dR = xs.map((x, i) => riemannR(x) - ps[i]);
    const m = Math.max(1, ...dLi.map(Math.abs), ...dR.map(Math.abs), ...dPNT.map(Math.abs).slice(Math.floor(xs.length * 0.1)));
    const g = plotFrame(ctx, bot, [0, Xmax], [-m * 1.05, m * 1.05], { xticks: xt, yticks: niceTicks(-m, m, 4), ylabel: '与 π(x) 的差', xlabel: 'x' });
    ctx.save();
    ctx.beginPath(); ctx.rect(bot.x, bot.y, bot.w, bot.h); ctx.clip();
    curve((x, i) => dPNT[i], C.warn, [5, 4], bot, g);
    curve((x, i) => dLi[i], C.cyan, null, bot, g);
    curve((x, i) => dR[i], C.ok, null, bot, g);
    ctx.strokeStyle = 'rgba(248,250,252,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bot.x, g.Y(0)); ctx.lineTo(bot.x + bot.w, g.Y(0)); ctx.stroke();
    ctx.restore();
    setInfo(`x = ${groupDigits(String(Xmax))}`, `π(x) = ${groupDigits(String(piX))}`, `平均间隔 ln x ≈ ${fmt(Math.log(Xmax), 2)}`);
    countRead.set('pi', groupDigits(String(piX)));
    countRead.set('pnt', `${fmt(Xmax / Math.log(Xmax), 6)}（差 ${fmt(Xmax / Math.log(Xmax) - piX, 4)}）`);
    countRead.set('li', `${fmt(li(Xmax) - li(2), 6)}（差 ${fmt(li(Xmax) - li(2) - piX, 4)}）`);
    countRead.set('r', `${fmt(riemannR(Xmax), 6)}（差 ${fmt(riemannR(Xmax) - piX, 4)}）`);
  }

  // ------------------------------------------------------------------ zeros
  let zeros = null, zSieve = null;
  const ensureZeros = () => { if (!zeros) { zeros = zetaZeros(300); zSieve = sieve(1000); } };
  // Z(t) on a fixed grid, filled in lazily (each value costs ~t/2 terms)
  const ZSTEP = 0.04, zGrid = new Float64Array(Math.ceil(600 / ZSTEP)).fill(NaN);
  const zAt = (t) => {
    const i = Math.round(t / ZSTEP);
    if (Number.isNaN(zGrid[i])) zGrid[i] = hardyZ(i * ZSTEP);
    return zGrid[i];
  };
  function drawZeros(ctx) {
    ensureZeros();
    const N = Math.round(st.N);
    const pad = { l: 56, r: 22 };
    const top = { x: pad.l, y: 24, w: W - pad.l - pad.r, h: (H - 110) * 0.36 };
    const bot = { x: pad.l, y: top.y + top.h + 36, w: top.w, h: H - top.y - top.h - 36 - 30 };
    // Z(t)
    const T = Math.max(60, (zeros[Math.max(0, N - 1)] || 0) + 8);
    const samples = Math.min(4000, Math.round(top.w * 2));
    const zs = [];
    let zmax = 1;
    for (let i = 0; i <= samples; i++) {
      const t = 1 + ((T - 1) * i) / samples;
      const z = t < 10 ? NaN : zAt(t);
      zs.push([t, z]);
      if (Number.isFinite(z)) zmax = Math.max(zmax, Math.abs(z));
    }
    zmax = Math.min(zmax, 8);
    const f = plotFrame(ctx, top, [0, T], [-zmax, zmax], { xticks: niceTicks(0, T, 8), yticks: niceTicks(-zmax, zmax, 2), ylabel: 'Z(t) = e^{iθ(t)} ζ(½ + it)', xlabel: 't' });
    ctx.save();
    ctx.beginPath(); ctx.rect(top.x, top.y, top.w, top.h); ctx.clip();
    ctx.strokeStyle = 'rgba(248,250,252,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(top.x, f.Y(0)); ctx.lineTo(top.x + top.w, f.Y(0)); ctx.stroke();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 1.5;
    ctx.beginPath();
    let pen = false;
    for (const [t, z] of zs) { if (!Number.isFinite(z)) { pen = false; continue; } const X = f.X(t), Y = f.Y(Math.max(-zmax, Math.min(zmax, z))); pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); pen = true; }
    ctx.stroke();
    for (let k = 0; k < zeros.length && zeros[k] <= T; k++) {
      ctx.fillStyle = k < N ? C.warn : 'rgba(148,163,184,0.5)';
      ctx.beginPath(); ctx.arc(f.X(zeros[k]), f.Y(0), k < N ? 3.2 : 2.2, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.restore();
    // ψ(x) and the explicit formula
    const X = st.X;
    const steps = Math.round(bot.w * 1.5);
    const exact = [], approx = [];
    let ymax = 0, err = 0;
    for (let i = 0; i <= steps; i++) {
      const x = 1.5 + ((X - 1.5) * i) / steps;
      const e = chebyshevPsi(x, zSieve), a = psiExplicit(x, zeros, N);
      exact.push([x, e]); approx.push([x, a]);
      ymax = Math.max(ymax, e, a);
      if (Math.abs(x - Math.round(x)) > 0.05) err = Math.max(err, Math.abs(a - e));
    }
    const g = plotFrame(ctx, bot, [0, X], [-2, ymax * 1.08], { xticks: niceTicks(0, X, 8), yticks: niceTicks(0, ymax, 4), ylabel: 'ψ(x) = Σ_{pᵏ ≤ x} ln p', xlabel: 'x' });
    ctx.save();
    ctx.beginPath(); ctx.rect(bot.x, bot.y, bot.w, bot.h); ctx.clip();
    ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    exact.forEach(([x, v], i) => { const px = g.X(x), py = g.Y(v); if (i) { ctx.lineTo(px, g.Y(exact[i - 1][1])); ctx.lineTo(px, py); } else ctx.moveTo(px, py); });
    ctx.stroke();
    ctx.strokeStyle = C.warn; ctx.lineWidth = 1.6;
    ctx.beginPath();
    approx.forEach(([x, v], i) => { const px = g.X(x), py = g.Y(v); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
    ctx.restore();
    legend(ctx, bot.x + bot.w - 4, bot.y + 16, [['ψ(x)（精确的台阶）', '#f8fafc'], [`用前 ${N} 对零点的显式公式`, C.warn]]);
    setInfo('黎曼显式公式', `${N} 对零点`, N ? `γ${N} = ${zeros[N - 1].toFixed(6)}` : '只剩主项 x');
    zeroRead.set('n', String(N));
    zeroRead.set('g', N ? zeros[N - 1].toFixed(9) : '—');
    zeroRead.set('err', fmt(err, 3));
  }

  // ------------------------------------------------------------------ drawing
  function setInfo(title, a, b) {
    info.textContent = '';
    info.append(h('div', { class: 'title' }, title), h('div', { class: 'big' }, a), h('div', { class: 'big', style: { color: C.text2 } }, b));
  }
  function draw() {
    if (W < 50 || H < 50) return;
    const { ctx } = layer;
    layer.reset();
    ctx.fillStyle = '#080b11';
    ctx.fillRect(0, 0, W, H);
    if (st.tab === 'ulam') { drawUlam(ctx); paintUlamInfo(); }
    else if (st.tab === 'gauss') { drawGauss(ctx); paintGaussInfo(); }
    else if (st.tab === 'count') drawCount(ctx);
    else drawZeros(ctx);
  }
  function paintUlamInfo() {
    const hv = st.hover && st.hover.tab === 'ulam' ? st.hover : null;
    if (!hv) { setInfo(st.spiral === 'sacks' ? '萨克斯螺旋' : '乌拉姆螺旋', `1 … ${groupDigits(String((2 * st.K + 1) ** 2 + st.start - 1))}`, '把鼠标移到格子上看因数分解'); return; }
    const n = hv.n;
    const f = n > 1 ? factor(n) : [];
    const desc = n < 2 ? '既不是素数也不是合数' : f.length === 1 && f[0][1] === 1 ? (prime(n - 2) || prime(n + 2) ? '素数（孪生素数）' : '素数') : f.map(([p, e]) => (e > 1 ? `${p}^${e}` : String(p))).join(' · ');
    setInfo(st.spiral === 'sacks' ? '萨克斯螺旋' : '乌拉姆螺旋', `n = ${groupDigits(String(n))}`, desc);
  }
  function paintGaussInfo() {
    const hv = st.hover && st.hover.tab === 'gauss' ? st.hover : null;
    if (!hv) { setInfo('高斯素数', `|a|, |b| ≤ ${st.R}`, '把鼠标移到格子上看是否为素数'); return; }
    const [z, why] = gaussExplain(...hv.cell);
    setInfo('高斯素数', z, why);
  }

  // ------------------------------------------------------------------ interaction
  const detachU = attachPointer(layer.canvas, vp, {
    onHover(px, py, wx, wy) {
      if (st.tab === 'ulam') {
        if (st.spiral === 'sacks') st.hover = { tab: 'ulam', n: sacksIndex(wx, wy) };
        else {
          const cell = spiralCellAt(wx, wy);
          if (Math.max(Math.abs(cell[0]), Math.abs(cell[1])) > st.K) st.hover = null;
          else st.hover = { tab: 'ulam', cell, n: st.start - 1 + ulamIndex(...cell) };
        }
      } else if (st.tab === 'gauss') {
        const a = Math.round(gvp.wx(px)), b = Math.round(gvp.wy(py));
        st.hover = Math.max(Math.abs(a), Math.abs(b)) <= st.R ? { tab: 'gauss', cell: [a, b] } : null;
      } else return;
      draw();
    },
    onView: () => draw(),
  });
  // the Gaussian plane has its own viewport: route pan/zoom by swapping which one is live
  const liveVp = () => (st.tab === 'gauss' ? gvp : vp);
  for (const key of ['zoomAt', 'panPx']) {
    const orig = vp[key].bind(vp);
    vp[key] = (...args) => (st.tab === 'gauss' ? gvp[key](...args) : st.tab === 'ulam' ? orig(...args) : undefined);
  }

  function fitView() {
    if (st.tab === 'ulam') {
      const r = st.spiral === 'sacks' ? 2 * st.K + 1.5 : st.K + 0.5;
      vp.fit(-r, r, -r, r, 0.02, { top: 0, bottom: 0, left: 0, right: 0 });
    } else if (st.tab === 'gauss') gvp.fit(-st.R - 0.5, st.R + 0.5, -st.R - 0.5, st.R + 0.5, 0.02);
  }

  // ------------------------------------------------------------------ panel
  const tabSeg = segmented({ id: 'primes-tab', options: Object.entries(TABS).map(([value, t]) => ({ value, label: t.label })), value: st.tab, onChange: (v) => setTab(v) });
  const note = h('div', { class: 'note', id: 'primes-note' });

  const spiralSeg = segmented({ id: 'primes-spiral', options: [{ value: 'ulam', label: '乌拉姆（方形）' }, { value: 'sacks', label: '萨克斯（阿基米德）' }], value: st.spiral, onChange: (v) => { st.spiral = v; st.hover = null; fitView(); draw(); } });
  const startChips = chips({
    id: 'primes-start',
