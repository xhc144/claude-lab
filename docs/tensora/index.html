.tip-b { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.tip-b span { color: var(--tx-2); font-size: 12.5px; }
.tip-s { display: flex; align-items: baseline; justify-content: space-between; }
.tip-s small { color: var(--tx-3); }
.tip-s b { font: 500 20px var(--f-display); letter-spacing: -0.02em; color: var(--good); }
.tip .btn { align-self: stretch; }

/* ---- training wizard --------------------------------------------------------------------------------- */
.wizard { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.stepper { list-style: none; margin: 0; padding: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; border-bottom: 1px solid var(--line); background: rgba(4, 7, 14, 0.3); }
.stepper button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 11px; color: var(--tx-3); font-size: 12.5px; font-weight: 500; transition: 0.2s; min-width: 0; }
.stepper button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper i { width: 24px; height: 24px; flex: none; border-radius: 8px; display: grid; place-items: center; font: 600 11.5px var(--f-mono); font-style: normal; border: 1px solid var(--line-2); transition: 0.3s; }
.stepper button:hover { color: var(--tx-1); background: rgba(255, 255, 255, 0.04); }
.stepper li.on button { color: var(--tx-1); background: rgba(var(--acc-rgb), 0.1); }
.stepper li.on i { color: #04101a; background: linear-gradient(120deg, var(--acc-a), var(--acc-b)); border-color: transparent; box-shadow: 0 0 14px rgba(var(--acc-rgb), 0.5); }
.stepper li.done i { color: var(--good); border-color: rgba(65, 214, 134, 0.4); background: rgba(65, 214, 134, 0.1); }
.wz-body { flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; min-height: 380px; animation: fade 0.4s var(--ease); }
.wz-h { font: 600 18px var(--f-ui); letter-spacing: -0.01em; }
.wz-sub { color: var(--tx-2); margin-top: -10px; }
.wz-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }
.wz-pos { font: 500 12px var(--f-mono); color: var(--tx-3); }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 15px; text-align: left; border: 1px solid var(--line-2); background: rgba(4, 7, 14, 0.35); transition: 0.25s var(--ease); min-width: 0; }
.opt:hover { border-color: var(--line-3); background: rgba(255, 255, 255, 0.03); }
.opt.on { border-color: rgba(var(--acc-rgb), 0.6); background: linear-gradient(140deg, rgba(var(--acc-rgb), 0.12), rgba(var(--acc-rgb), 0.02)); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), 0.07); }
.opt b { font-weight: 600; font-size: 14px; padding-right: 24px; }
.opt-s { color: var(--tx-3); font-size: 12px; }
.opt-t { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.opt-r { position: absolute; top: 16px; right: 16px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-3); transition: 0.25s; }
.opt.on .opt-r { border: 5px solid var(--acc-a); box-shadow: 0 0 10px rgba(var(--acc-rgb), 0.6); }
.opt-list { display: flex; flex-direction: column; gap: 8px; }
.opt.row { flex-direction: row; align-items: center; gap: 14px; padding: 12px 14px; }
.opt-c { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 1.5px solid var(--line-3); display: grid; place-items: center; color: transparent; transition: 0.2s; }
.opt-c .i { width: 14px; height: 14px; stroke-width: 2.4; }
.opt.on .opt-c { background: var(--acc-a); border-color: var(--acc-a); color: #04101a; }
.opt-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-main b { padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q { position: relative; width: 34px; height: 34px; flex: none; }
.q em { position: absolute; inset: 0; display: grid; place-items: center; font: 600 10.5px var(--f-mono); font-style: normal; }
.sw-row { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.review { display: grid; grid-template-columns: 1fr; margin: 0; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; }
.review > div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.review > div:last-child { border-bottom: 0; }
.review dt { color: var(--tx-3); font-size: 12.5px; }
.review dd { margin: 0; font-weight: 500; min-width: 0; }
.estimate { position: sticky; top: calc(var(--deck-h) + 28px); align-self: start; }
.est-hero { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 15px; background: linear-gradient(140deg, rgba(var(--acc-rgb), 0.14), rgba(165, 143, 255, 0.06)); border: 1px solid rgba(var(--acc-rgb), 0.2); }
.est-hero span { color: var(--tx-2); font-size: 12px; }
.est-hero b { font: 500 28px/1.15 var(--f-display); letter-spacing: -0.03em; }
.est-hero small { color: var(--tx-3); font: 500 11.5px var(--f-mono); }
.est-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; margin: 12px 0 0; }
.est-list > div { padding: 9px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.est-list dt { color: var(--tx-3); font-size: 11.5px; }
.est-list dd { margin: 0; font: 600 14px var(--f-mono); }
.est-curve { margin-top: 14px; }
.ec-h { display: flex; justify-content: space-between; font-size: 12px; color: var(--tx-3); margin-bottom: 6px; }
.ec-h b { font: 600 12.5px var(--f-mono); color: var(--tx-1); }
.est-curve .spark { width: 100%; height: 70px; }
.est-checks { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 14px; }
.est-checks .pill { white-space: normal; height: auto; min-height: 22px; padding-top: 2px; padding-bottom: 2px; }
.drop { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 15px; border: 1.5px dashed var(--line-3); background: rgba(4, 7, 14, 0.3); cursor: pointer; transition: 0.25s; margin-bottom: 14px; }
.drop > .i { width: 34px; height: 34px; padding: 7px; border-radius: 11px; color: var(--acc-a); background: rgba(var(--acc-rgb), 0.1); }
.drop > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.drop span { color: var(--tx-3); font-size: 12.5px; }
.drop:hover, .drop.over { border-color: rgba(var(--acc-rgb), 0.6); background: rgba(var(--acc-rgb), 0.05); }
.drop.over { box-shadow: 0 0 0 5px rgba(var(--acc-rgb), 0.08); }
.drop.busy { cursor: default; border-style: solid; }
.drop .up .bar { margin-top: 8px; }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ds { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 15px; border: 1px solid var(--line); background: rgba(4, 7, 14, 0.35); transition: border-color 0.2s; }
.ds:hover { border-color: var(--line-2); }
.ds.fresh { animation: freshrow 2.4s var(--ease); }
.ds-top { display: flex; align-items: center; gap: 12px; }
.ds-top > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ds-top b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-top span { color: var(--tx-3); font-size: 12px; }
.ds-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--plasma); background: rgba(165, 143, 255, 0.12); }
.ds dl { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0; gap: 8px; }
.ds dt { color: var(--tx-3); font-size: 11px; }
.ds dd { margin: 2px 0 0; font: 600 13px var(--f-mono); white-space: nowrap; }
.ds-act { display: flex; align-items: center; gap: 4px; }
.ds-act .tag { margin-right: auto; }

/* ---- jobs ------------------------------------------------------------------------------------------- */
.jobs-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: var(--gap); align-items: start; }
.jl { position: sticky; top: calc(var(--deck-h) + 28px); display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - var(--deck-h) - 48px); }
.jl-f { display: flex; flex-wrap: wrap; gap: 6px; }
.jl-f .chip { height: 28px; padding: 0 10px; font-size: 12px; }
.jl-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; min-height: 0; }
.jli { display: grid; grid-template-columns: 3px 1fr; gap: 12px; padding: 12px 10px; border-radius: 13px; border: 1px solid transparent; transition: 0.2s; }
.jli:hover { background: rgba(255, 255, 255, 0.035); }
.jli.on { background: rgba(var(--acc-rgb), 0.07); border-color: rgba(var(--acc-rgb), 0.22); }
.jli-k { border-radius: 3px; }
.jli-m { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.jli-t { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
.jli-t b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jli-s { color: var(--tx-3); font: 500 11px var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jli-p { display: flex; align-items: center; gap: 8px; }
.jli-p span { font: 600 11px var(--f-mono); color: var(--tx-2); min-width: 32px; text-align: right; }
.jd { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.jd-head { --jc: var(--s1); }
.jd-head::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; background: radial-gradient(600px 220px at 0% 0%, color-mix(in oklab, var(--jc) 20%, transparent), transparent 70%); }
.jh-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.jh-t { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.jh-t h2 { font: 600 22px/1.2 var(--f-ui); letter-spacing: -0.02em; }
.jh-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.jh-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
.jh-prog { display: flex; gap: 26px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.jp-ring { position: relative; width: 92px; height: 92px; flex: none; }
.jp-ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 15px var(--f-mono); }
.jp-stats { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 20px; margin: 0; min-width: 260px; }
.jp-stats dt { color: var(--tx-3); font-size: 11.5px; }
.jp-stats dd { margin: 3px 0 0; font: 600 15px var(--f-mono); white-space: nowrap; }
.jd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.jd-grid .c-wide { grid-column: 1 / -1; }
.gpu-mult { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.gm { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 11px; background: rgba(4, 7, 14, 0.35); border: 1px solid var(--line); min-width: 0; }
.gm-h { display: flex; justify-content: space-between; font: 500 11px var(--f-mono); color: var(--tx-3); }
.gm-h b { color: var(--tx-1); }
.gm .spark { width: 100%; height: 30px; }
.console { height: 300px; overflow-y: auto; padding: 12px 14px; border-radius: 13px; background: rgba(2, 3, 7, 0.75); border: 1px solid var(--line); font: 12px/1.75 var(--f-mono); }
.ln { display: grid; grid-template-columns: 70px 50px 1fr; gap: 10px; }
.lt { color: var(--tx-4); }
.ll { color: var(--good); }
.lm { color: #c4cee2; word-break: break-word; }
.ln.l-WARN .ll { color: var(--warn); } .ln.l-WARN .lm { color: #f3d9a0; }
.ln.l-ERROR .ll { color: var(--crit); } .ln.l-ERROR .lm { color: #ffb3b1; }
.jd-grid .p-head .tabs { border-bottom: 0; }

/* ---- cluster ------------------------------------------------------------------------------------------ */
.c-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 6px 16px 6px 10px; margin-bottom: var(--gap); }
.c-toolbar .tabs { border-bottom: 0; }
.c-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: var(--gap); }
.node {
  position: relative; display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r-lg); min-width: 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008)), var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); isolation: isolate;
}
.node.status-crit { border-color: rgba(252, 88, 85, 0.35); }
.node.status-warn { border-color: rgba(240, 177, 53, 0.32); }
.node.status-drain, .node.status-reboot { border-style: dashed; }
.nd-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nd-name { display: flex; flex-direction: column; gap: 1px; text-align: left; min-width: 0; }
.nd-name b { font-size: 13px; }
.nd-name span { color: var(--tx-3); font-size: 11.5px; white-space: nowrap; }
.nd-name:hover b { color: var(--acc-a); }
.nd-gpus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.gc { --c: #004147; --tc: #e8eefb; position: relative; height: 46px; border-radius: 10px; background: var(--c); color: var(--tc); display: grid; place-items: center; transition: background 0.8s, transform 0.2s var(--spring), box-shadow 0.2s; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 -10px 20px rgba(0, 0, 0, 0.16); }
.gc b { font: 600 13px var(--f-mono); }
.gc-s { position: absolute; top: 3px; left: 6px; font: 500 9px var(--f-mono); opacity: 0.65; }
.gc .i { position: absolute; top: 3px; right: 4px; width: 12px; height: 12px; stroke-width: 2.2; }
.gc:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.7), 0 10px 20px -6px rgba(0, 0, 0, 0.6); z-index: 1; }
.gc.g-crit { background: repeating-linear-gradient(135deg, #2a0d12 0 6px, #1a0a0e 6px 12px); color: #ff8f8d; box-shadow: inset 0 0 0 1.5px rgba(252, 88, 85, 0.6); }
.gc.g-crit b { font-size: 11px; }
.gc.g-warn { box-shadow: inset 0 0 0 2px var(--warn), 0 0 14px rgba(240, 177, 53, 0.4); }
.nd-f { display: flex; justify-content: space-between; gap: 6px; color: var(--tx-3); font-size: 11.5px; }
.nd-f span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.nd-f .i { width: 13px; height: 13px; }
.nd-f b { color: var(--tx-1); font: 600 11.5px var(--f-mono); }
.queue { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.queue li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 13px; background: rgba(4, 7, 14, 0.35); border: 1px solid var(--line); }
.queue li > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.queue li span:not(.qn) { color: var(--tx-3); font-size: 12px; }
.qn { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font: 600 12px var(--f-mono); background: rgba(255, 255, 255, 0.05); }
.nd-two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.nvl-wrap { display: grid; place-items: center; }
.nvl { width: 100%; max-width: 230px; }
.nvl line { stroke: rgba(var(--acc-rgb), 0.35); stroke-width: 1.5; stroke-dasharray: 3 3; animation: flow 1.2s linear infinite; }
.nvl line.down { stroke: rgba(252, 88, 85, 0.5); animation: none; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.nvl .sw { fill: rgba(13, 18, 31, 0.95); stroke: rgba(var(--acc-rgb), 0.6); }
.nvl > text { fill: var(--tx-2); font: 600 8.5px var(--f-mono); }
.nvl .gn circle { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.5; }
.nvl .gn.warn circle { stroke: var(--warn); stroke-width: 2; }
.nvl .gn.crit circle { stroke: var(--crit); stroke-width: 2; }
.nvl .gn text { fill: #fff; font: 600 11px var(--f-mono); }

/* ---- billing -------------------------------------------------------------------------------------------- */
.bh-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.bill-hero .hn b { font-size: clamp(38px, 4.6vw, 56px); }
.bh-fc { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bh-fc span { color: var(--tx-3); font-size: 12px; }
.bh-fc b { font: 500 24px var(--f-display); letter-spacing: -0.03em; }
.budget { display: flex; flex-direction: column; gap: 14px; }
.bg-ring { position: relative; width: 168px; margin: 0 auto; }
.bg-ring .ring { display: block; }
.bg-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.bg-c b { font: 500 30px var(--f-display); letter-spacing: -0.04em; }
.bg-c span { color: var(--tx-3); font-size: 11.5px; }
.bg-c small { color: var(--tx-2); font: 500 11px var(--f-mono); margin-top: 2px; }
.bg-list { margin: 0; display: flex; flex-direction: column; }
.bg-list div { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.bg-list dt { color: var(--tx-3); font-size: 12.5px; }
.bg-list dd { margin: 0; font: 600 13px var(--f-mono); }
.bg-alerts { display: flex; gap: 16px; flex-wrap: wrap; }
.bg-a { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--tx-2); cursor: pointer; }
.mix-l.one { grid-template-columns: 1fr; }
.tbl.teams .tb { display: flex; align-items: center; gap: 10px; min-width: 200px; }
.tbl.teams .tb span { font: 500 11.5px var(--f-mono); color: var(--tx-3); white-space: nowrap; }
.bal { display: flex; flex-direction: column; gap: 4px; padding: 18px; border-radius: 15px; background: linear-gradient(140deg, rgba(var(--acc-rgb), 0.14), rgba(165, 143, 255, 0.06)); border: 1px solid rgba(var(--acc-rgb), 0.2); margin-bottom: 12px; }
.bal span { color: var(--tx-2); font-size: 12px; }
.bal b { font: 500 32px/1.2 var(--f-display); letter-spacing: -0.04em; }
.bal small { color: var(--tx-3); font-size: 12px; }
.pay { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 13px; border: 1px solid var(--line); margin-bottom: 12px; }
.pay > div { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pay span:not(.pay-ic):not(.pill) { color: var(--tx-3); font-size: 12px; }
.pay-ic { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: rgba(255, 255, 255, 0.05); color: var(--tx-2); flex: none; }
#b-bal .bg-a { margin-bottom: 14px; }
.amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.amt { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; border-radius: 13px; border: 1px solid var(--line-2); background: rgba(4, 7, 14, 0.4); transition: 0.2s; }
.amt b { font: 500 16px var(--f-display); letter-spacing: -0.02em; }
.amt small { color: var(--good); font-size: 11px; }
.amt:hover { border-color: var(--line-3); }
.amt.on { border-color: rgba(var(--acc-rgb), 0.6); background: rgba(var(--acc-rgb), 0.1); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), 0.07); }
.tp-sum { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 16px; border-radius: 13px; background: rgba(4, 7, 14, 0.45); border: 1px solid var(--line); }
.tp-sum span { color: var(--tx-2); }
.tp-sum b { font: 500 22px var(--f-display); letter-spacing: -0.03em; }

/* ---- settings -------------------------------------------------------------------------------------------- */
.settings > .tabs { margin-bottom: 16px; }
.s-pane { display: flex; flex-direction: column; gap: var(--gap); max-width: 980px; }
.accents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.accent { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 15px; border: 1px solid var(--line-2); background: rgba(4, 7, 14, 0.35); transition: 0.25s var(--ease); }
.accent:hover { border-color: var(--line-3); transform: translateY(-2px); }
.accent.on { border-color: rgba(var(--acc-rgb), 0.65); box-shadow: 0 0 0 4px rgba(var(--acc-rgb), 0.08); }
.accent .sw { width: 100%; height: 64px; border-radius: 11px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.ac-prev { display: flex; gap: 4px; }
.ac-prev i { width: 14px; height: 14px; border-radius: 4px; }
.s-rows { display: flex; flex-direction: column; }
.s-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.s-row:last-child { border-bottom: 0; }
.s-row > div:first-child { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.s-row span { color: var(--tx-3); font-size: 12.5px; }
.form-act { display: flex; justify-content: flex-end; }
.mem { display: flex; align-items: center; gap: 12px; }
.mem > div { display: flex; flex-direction: column; }
.mav { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-weight: 600; color: #fff; background: linear-gradient(135deg, hsl(var(--h) 70% 50%), hsl(calc(var(--h) + 50) 70% 35%)); flex: none; }
.audit, .sess { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.audit li, .se { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.audit li:last-child, .se:last-child { border-bottom: 0; }
.audit li > div, .se > div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.audit span, .se span { color: var(--tx-3); font-size: 12.5px; }
.audit time { font: 500 11px var(--f-mono); color: var(--tx-3); white-space: nowrap; }
.au-ic, .se-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--tx-2); }
.au-ic .i, .se-ic .i { width: 16px; height: 16px; }

/* ---- responsive --------------------------------------------------------------------------------- */
@media (max-width: 1360px) {
  .c-3 { grid-column: span 6; }
  .c-4:not(.keep) { grid-column: span 6; }
  .c-8:not(.keep), .c-7, .c-5:not(.keep) { grid-column: span 12; }
  .c-4.core { grid-column: span 12; }
  .core { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr auto; column-gap: 28px; align-items: center; }
  .core .p-head { grid-column: 1 / -1; }
  .core .core-wrap { grid-row: 2 / 4; width: 260px; margin: 0; }
  .core .core-stats { align-self: end; }
  .core .core-key { justify-content: flex-start; align-self: start; }
  .grid { grid-auto-flow: row dense; }
  .grid > .t-6 { grid-column: span 6; }

/** Hourly request counts for the last `days` days with a daily rhythm and weekday dip. */
function trafficHistory(hours, seed = 5) {
  const r = rng(seed);
  const out = [];
  const start = NOW - hours * HOUR;
  for (let i = 0; i < hours; i++) {
    const t = start + i * HOUR;
    const h = new Date(t).getHours();
    const dow = new Date(t).getDay();
    const daily = 0.62 + 0.38 * Math.sin(((h - 9) / 24) * Math.PI * 2); // peaks mid-afternoon, low before dawn
    const wk = dow === 0 || dow === 6 ? 0.78 : 1;
    const growth = 1 + (i / hours) * 0.12;
    const base = 0.98e6 * daily * wk * growth;
    out.push({ t, v: Math.round(base * (1 + r.gauss() * 0.04)) });
  }
  return out;
}

})();

  const r = tipEl.getBoundingClientRect();
  const vw = innerWidth, vh = innerHeight;
  let left = x + 16, top = y - r.height - 12;
  if (left + r.width > vw - 8) left = x - r.width - 16;
  if (top < 8) top = y + 18;
  if (top + r.height > vh - 8) top = vh - r.height - 8;
  tipEl.style.transform = `translate(${Math.max(8, left)}px, ${top}px)`;
}
function hideTip() { tipEl?.classList.remove('on'); }

const tipRow = (color, name, value, extra = '') =>
  `<div class="tr"><span class="key" style="background:${color}"></span><span class="n">${esc(name)}</span><b>${value}</b>${extra}</div>`;

// ---- scales -------------------------------------------------------------------------------------

function niceTicks(min, max, count = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(+v.toFixed(10));
  return { lo, hi, step, ticks };
}

/** Monotone cubic (Fritsch–Carlson) path through points; never overshoots the data. */
function smoothPath(pts) {
  const n = pts.length;
  if (n === 0) return '';
  if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
  if (n === 2) return `M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}`;
  const dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx.push(pts[i + 1][0] - pts[i][0]); dy.push(pts[i + 1][1] - pts[i][1]); m.push(dy[i] / (dx[i] || 1)); }
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) t.push(m[i - 1] * m[i] <= 0 ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]));
  t.push(m[n - 2]);
  let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(2)},${(pts[i][1] + h * t[i]).toFixed(2)} ${(pts[i + 1][0] - h).toFixed(2)},${(pts[i + 1][1] - h * t[i + 1]).toFixed(2)} ${pts[i + 1][0].toFixed(2)},${pts[i + 1][1].toFixed(2)}`;
  }
  return d;
}

const linePath = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(2)},${p[1].toFixed(2)}`).join('');

/** Split [x,y|null] into contiguous runs so gaps in data stay gaps. */
function runs(xs, ys, sx, sy) {
  const out = [];
  let cur = [];
  ys.forEach((v, i) => {
    if (v == null || Number.isNaN(v)) { if (cur.length) out.push(cur); cur = []; return; }
    cur.push([sx(xs[i]), sy(v)]);
  });
  if (cur.length) out.push(cur);
  return out;
}

function observe(host, fn) {
  let w = host.clientWidth;
  const ro = new ResizeObserver(() => {
    const nw = host.clientWidth;
    if (Math.abs(nw - w) > 1) { w = nw; fn(); }
  });
  ro.observe(host);
  return () => ro.disconnect();
}

// ---- line / area chart ------------------------------------------------------------------------

/**
 * lineChart(host, {
 *   x: number[], series: [{ name, color, values, area?, dash?, width? }],
 *   height, xFmt, yFmt, tipX, yMin, yMax, yTicks, xTicks, area, smooth, glow, stream, endDot, refLines: [{ y, label }]
 * })
 */
function lineChart(host, opts) {
  const id = uid('lc');
  let o = { height: 220, yTicks: 4, xTicks: 5, area: true, smooth: true, endDot: true, glow: true, yMin: 0, ...opts };
  let hover = -1;
  let smoothMax = null;
  host.classList.add('viz');
  host.tabIndex = 0;
  host.setAttribute('role', 'img');
  if (o.label) host.setAttribute('aria-label', o.label);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'viz-svg');
  host.appendChild(svg);
  let geo = null;

  function render(shifted = false) {
    const W = Math.max(120, host.clientWidth);
    const H = o.height;
    const xs = o.x;
    const all = o.series.flatMap((s) => s.values.filter((v) => v != null));
    let lo = o.yMin != null ? Math.min(o.yMin, ...all) : Math.min(...all);
    let hi = o.yMax != null ? o.yMax : Math.max(...all, ...(o.refLines || []).map((r) => r.y));
    if (o.yMin == null) lo -= (hi - lo) * 0.08;
    if (o.stream) {
      // ease the y-range so a live chart breathes instead of jumping on every spike
      smoothMax = smoothMax == null ? hi : hi > smoothMax ? hi : smoothMax + (hi - smoothMax) * 0.08;
      hi = smoothMax;
    }
    const { ticks, lo: tlo, hi: thi } = niceTicks(lo, hi * 1.04, o.yTicks);
    const yf = (v) => String((o.yFmt || String)(v));
    const padL = Math.max(...ticks.map((t) => yf(t).length)) * 6.4 + 14;
    const pad = { l: o.hideY ? 6 : padL, r: o.endLabel ? 64 : 14, t: 12, b: o.hideX ? 8 : 26 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const x0 = xs[0], x1 = xs[xs.length - 1];
    const sx = (v) => pad.l + ((v - x0) / (x1 - x0 || 1)) * pw;
    const sy = (v) => pad.t + ph - ((v - tlo) / (thi - tlo || 1)) * ph;
    geo = { W, H, pad, pw, ph, sx, sy, xs };

    let s = `<defs><clipPath id="${id}-c"><rect x="${pad.l}" y="0" width="${pw}" height="${H}"/></clipPath>`;
    o.series.forEach((se, i) => {
      s += `<linearGradient id="${id}-g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity="${se.areaOpacity ?? 0.2}"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient>`;
    });
    s += '</defs>';
    // grid + y labels
    s += '<g class="grid">';
    for (const t of ticks) {
      const y = sy(t).toFixed(1);
      s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/>`;
      if (!o.hideY) s += `<text class="ax" x="${pad.l - 8}" y="${y}" dy="3.5" text-anchor="end">${esc(yf(t))}</text>`;
    }
    s += '</g>';
    // x labels
    if (!o.hideX) {
      const labelW = Math.max(...[xs[0], xs[xs.length - 1]].map((v) => String((o.xFmt || String)(v)).length)) * 6.6 + 18;
      const n = Math.max(2, Math.min(o.xTicks, xs.length, Math.floor(pw / labelW)));
      s += '<g>';
      for (let k = 0; k < n; k++) {
        const idx = Math.round((k / Math.max(1, n - 1)) * (xs.length - 1));
        const anchor = k === 0 ? 'start' : k === n - 1 ? 'end' : 'middle';
        s += `<text class="ax" x="${sx(xs[idx]).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${esc((o.xFmt || String)(xs[idx]))}</text>`;
      }
      s += '</g>';
    }
    for (const r of o.refLines || []) {
      const y = sy(r.y).toFixed(1);
      s += `<g class="ref"><line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l + 8}" y="${y}" dy="-7">${esc(r.label)}</text></g>`;
    }
    s += `<g clip-path="url(#${id}-c)"><g class="plot">`;
    const base = sy(Math.max(tlo, 0));
    o.series.forEach((se, i) => {
      const segs = runs(xs, se.values, sx, sy);
      const pathOf = o.smooth ? smoothPath : linePath;
      for (const seg of segs) {
        const d = pathOf(seg);
        if ((se.area ?? o.area) && seg.length > 1) {
          s += `<path class="area" d="${d}L${seg[seg.length - 1][0].toFixed(2)},${base}L${seg[0][0].toFixed(2)},${base}Z" fill="url(#${id}-g${i})"/>`;
        }
        s += `<path class="line${se.dash ? ' dash' : ''}" d="${d}" style="stroke:${se.color};stroke-width:${se.width || 2}px${o.glow && !se.dash ? `;filter:drop-shadow(0 0 6px ${se.color}66)` : ''}"/>`;
      }
    });
    s += '</g></g>';
    // end dots / labels (not clipped)
    o.series.forEach((se) => {
      let li = se.values.length - 1;
      while (li >= 0 && se.values[li] == null) li--;
      if (li < 0) return;
      const ex = sx(xs[li]), ey = sy(se.values[li]);
      if (o.endDot && !se.dash) {
        if (o.stream) s += `<circle class="pulse" cx="${ex}" cy="${ey}" r="4" style="fill:${se.color}"/>`;
        s += `<circle cx="${ex}" cy="${ey}" r="4" fill="${se.color}" stroke="${SURFACE}" stroke-width="2"/>`;
      }
      if (o.endLabel) s += `<text class="end" x="${ex + 9}" y="${ey}" dy="3.5">${esc((o.endFmt || yf)(se.values[li]))}</text>`;
    });
    s += `<g class="cross" visibility="hidden"><line class="cx" y1="${pad.t}" y2="${pad.t + ph}"/>${o.series.map((se) => `<circle r="4.5" fill="${se.color}" stroke="${SURFACE}" stroke-width="2"/>`).join('')}</g>`;
    s += `<rect class="hit" x="${pad.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = s;

    if (shifted && !reducedMotion() && xs.length > 1) {
      const step = sx(xs[xs.length - 1]) - sx(xs[xs.length - 2]);
      const plot = svg.querySelector('.plot');
      plot.style.transform = `translateX(${step}px)`;
      plot.getBoundingClientRect();
      plot.style.transition = 'transform 1s linear';
      plot.style.transform = 'translateX(0)';
    }
    if (hover >= 0) drawCross(Math.min(hover, xs.length - 1), false);
  }

  function nearest(px) {
    const { sx, xs } = geo;
    let best = 0, bd = Infinity;
    for (let i = 0; i < xs.length; i++) { const d = Math.abs(sx(xs[i]) - px); if (d < bd) { bd = d; best = i; } }
    return best;
  }

  function drawCross(i, withTip = true, clientX, clientY) {
    hover = i;
    const g = svg.querySelector('.cross');
    if (!g || !geo) return;
    const { sx, sy, xs } = geo;
    const x = sx(xs[i]);
    g.setAttribute('visibility', 'visible');
    g.querySelector('line').setAttribute('x1', x);
    g.querySelector('line').setAttribute('x2', x);
    [...g.querySelectorAll('circle')].forEach((c, k) => {
      const v = o.series[k].values[i];
      c.setAttribute('visibility', v == null ? 'hidden' : 'visible');
      if (v != null) { c.setAttribute('cx', x); c.setAttribute('cy', sy(v)); }
    });
    if (!withTip) return;
    const fmtV = o.tipFmt || o.yFmt || String;
    const rows = o.series.filter((se) => se.values[i] != null).map((se) => tipRow(se.color, se.name, esc(fmtV(se.values[i], se))));
    const head = esc((o.tipX || o.xFmt || String)(xs[i]));
    const rect = svg.getBoundingClientRect();
    const cx = clientX ?? rect.left + (x / geo.W) * rect.width;
    const cy = clientY ?? rect.top + rect.height / 3;
    showTip(`<div class="th">${head}</div>${rows.join('')}${o.tipExtra ? o.tipExtra(i) : ''}`, cx, cy);
  }

  function clear() {
    hover = -1;
    svg.querySelector('.cross')?.setAttribute('visibility', 'hidden');
    hideTip();
  }

  const onMove = (e) => {
    if (!geo) return;
    const rect = svg.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * geo.W;
    drawCross(nearest(px), true, e.clientX, e.clientY);
  };
  svg.addEventListener('pointermove', onMove);
  svg.addEventListener('pointerdown', onMove);
  svg.addEventListener('pointerleave', clear);
  host.addEventListener('blur', clear);
  host.addEventListener('keydown', (e) => {
    if (!geo) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      const n = geo.xs.length;
      const i = hover < 0 ? n - 1 : clamp(hover + (e.key === 'ArrowRight' ? 1 : -1), 0, n - 1);
      drawCross(i, true);
    } else if (e.key === 'Escape') clear();
  });

  render();
  const stop = observe(host, () => render());
  return {
    update(next, { shifted = false } = {}) { o = { ...o, ...next }; render(shifted); },
    destroy() { stop(); clear(); svg.remove(); },
  };
}

// ---- column chart (stacked or grouped) ---------------------------------------------------------

/**
 * barChart(host, { labels, series: [{ name, color, values }], stacked, height, yFmt, xFmt, tipX, refLines, highlight, every, onPick })
 */
function barChart(host, opts) {
  let o = { height: 220, yTicks: 4, stacked: true, ...opts };
  host.classList.add('viz');
  host.tabIndex = 0;
  if (o.label) host.setAttribute('aria-label', o.label);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'viz-svg');
  host.appendChild(svg);
  let geo = null, hover = -1;

  const roundTop = (x, y, w, h, r) => {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };

  function render() {
    const W = Math.max(120, host.clientWidth), H = o.height;
    const n = o.labels.length;
    const totals = o.labels.map((_, i) => o.stacked ? o.series.reduce((a, s) => a + (s.values[i] || 0), 0) : Math.max(...o.series.map((s) => s.values[i] || 0)));
    const { ticks, hi } = niceTicks(0, Math.max(...totals, ...(o.refLines || []).map((r) => r.y)) * 1.05, o.yTicks);
    const yf = (v) => String((o.yFmt || String)(v));
    const padL = Math.max(...ticks.map((t) => yf(t).length)) * 6.4 + 14;
    const pad = { l: padL, r: 12, t: 14, b: 26 };
    const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
    const band = pw / n;
    const sy = (v) => pad.t + ph - (v / hi) * ph;
    geo = { W, pad, band, n };
    let s = '<g class="grid">';
    for (const t of ticks) {
      const y = sy(t).toFixed(1);
      s += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text class="ax" x="${pad.l - 8}" y="${y}" dy="3.5" text-anchor="end">${esc(yf(t))}</text>`;
    }
    s += '</g>';
    const every = o.every || Math.ceil(n / Math.max(2, Math.floor(pw / 56)));
    s += `<rect class="band-hl" y="${pad.t}" height="${ph}" width="${band}" x="-999"/>`;
    for (let i = 0; i < n; i++) {
      const cx = pad.l + band * i + band / 2;
      if (i % every === 0 || i === n - 1) {
        if (!(i === n - 1 && i % every !== 0 && i % every < every / 2)) s += `<text class="ax" x="${cx}" y="${H - 6}" text-anchor="middle">${esc((o.xFmt || String)(o.labels[i]))}</text>`;
      }
      const dim = o.highlight != null && o.highlight(i) === false ? ' dim' : '';
      if (o.stacked) {
        const bw = Math.min(24, band * 0.64);
        let acc = 0;
        const topIdx = o.series.map((se, k) => (se.values[i] > 0 ? k : -1)).filter((k) => k >= 0).pop();
        o.series.forEach((se, k) => {
          const v = se.values[i] || 0;
          if (v <= 0) return;
          const y0 = sy(acc), y1 = sy(acc + v);
          acc += v;
          const gap = k === 0 ? 0 : 2; // surface gap between stacked segments
          const h = Math.max(0, y0 - y1 - gap);
          const x = cx - bw / 2;
          s += k === topIdx
            ? `<path class="vb${dim}" d="${roundTop(x, y1, bw, h, 4)}" fill="${se.color}"/>`
            : `<rect class="vb${dim}" x="${x}" y="${y1}" width="${bw}" height="${h}" fill="${se.color}"/>`;
        });
      } else {
        const k = o.series.length;
        const bw = Math.min(14, (band * 0.7 - (k - 1) * 2) / k);
        const groupW = bw * k + (k - 1) * 2;
        o.series.forEach((se, j) => {
          const v = se.values[i] || 0;
          const x = cx - groupW / 2 + j * (bw + 2);
          s += `<path class="vb${dim}" d="${roundTop(x, sy(v), bw, sy(0) - sy(v), 4)}" fill="${se.color}"/>`;
        });
      }
    }
    for (const r of o.refLines || []) {
      const y = sy(r.y).toFixed(1);
      s += `<g class="ref"><line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}"/><text x="${pad.l + 8}" y="${y}" dy="-7">${esc(r.label)}</text></g>`;
    }
    s += `<line class="base" x1="${pad.l}" x2="${W - pad.r}" y1="${sy(0)}" y2="${sy(0)}"/>`;
    s += `<rect class="hit" x="${pad.l}" y="0" width="${pw}" height="${H}" fill="transparent"/>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    svg.innerHTML = s;
    if (hover >= 0) pick(hover, false);
  }

  function pick(i, tip = true, ex, ey) {
    hover = i;
    const hl = svg.querySelector('.band-hl');
    hl.setAttribute('x', geo.pad.l + geo.band * i);
    hl.setAttribute('width', geo.band);
    if (!tip) return;
    const f = o.tipFmt || o.yFmt || String;
    const rows = o.series.map((se) => tipRow(se.color, se.name, esc(f(se.values[i] || 0)))).reverse();
    const total = o.series.reduce((a, se) => a + (se.values[i] || 0), 0);
    const foot = o.stacked && o.series.length > 1 ? `<div class="tf"><span>合计</span><b>${esc(f(total))}</b></div>` : '';
    const rect = svg.getBoundingClientRect();
    showTip(`<div class="th">${esc((o.tipX || o.xFmt || String)(o.labels[i]))}</div>${rows.join('')}${foot}`,
      ex ?? rect.left + ((geo.pad.l + geo.band * (i + 0.5)) / geo.W) * rect.width, ey ?? rect.top + 30);
  }
  const clear = () => { hover = -1; svg.querySelector('.band-hl')?.setAttribute('x', -999); hideTip(); };
  const idxAt = (e) => {
    const rect = svg.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * geo.W;
    return clamp(Math.floor((px - geo.pad.l) / geo.band), 0, geo.n - 1);
  };
  svg.addEventListener('pointermove', (e) => geo && pick(idxAt(e), true, e.clientX, e.clientY));
  svg.addEventListener('pointerleave', clear);
  svg.addEventListener('click', (e) => geo && o.onPick && o.onPick(idxAt(e)));
  host.addEventListener('blur', clear);
  host.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    pick(hover < 0 ? geo.n - 1 : clamp(hover + (e.key === 'ArrowRight' ? 1 : -1), 0, geo.n - 1));
  });
  render();
  const stop = observe(host, render);
  return { update(next) { o = { ...o, ...next }; render(); }, destroy() { stop(); clear(); svg.remove(); } };
}

// ---- donut ----------------------------------------------------------------------------------------

/** donut(host, { segments: [{ name, value, color }], size, thickness, fmt, centerLabel, centerValue }) */
function donut(host, opts) {
  let o = { size: 188, thickness: 16, ...opts };
  host.classList.add('viz', 'donut');
  const wrap = document.createElement('div');
  wrap.className = 'donut-wrap';
  host.appendChild(wrap);
  let active = -1;

  function arc(cx, cy, r, a0, a1) {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}`;
  }

  function render() {
    const S = o.size, r = S / 2 - o.thickness / 2 - 4;
    const total = o.segments.reduce((a, s) => a + s.value, 0) || 1;
    const gap = 2.6 / r; // 2px surface gap between segments, as an angle
    let a = 0;
    let paths = '';
    o.segments.forEach((sg, i) => {
      const span = (sg.value / total) * Math.PI * 2;
      const a0 = a + gap / 2, a1 = a + span - gap / 2;
      if (a1 > a0) paths += `<path class="seg${active === i ? ' on' : ''}${active >= 0 && active !== i ? ' dim' : ''}" data-i="${i}" d="${arc(S / 2, S / 2, r, a0, a1)}" style="stroke:${sg.color};stroke-width:${o.thickness}px"/>`;
      a += span;
    });
    const cur = active >= 0 ? o.segments[active] : null;
    const f = o.fmt || String;
    wrap.innerHTML = `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" class="viz-svg"><circle cx="${S / 2}" cy="${S / 2}" r="${r}" class="track" style="stroke-width:${o.thickness}px"/>${paths}</svg>
      <div class="donut-c"><span class="dl">${esc(cur ? cur.name : o.centerLabel || '合计')}</span><b class="dv">${esc(cur ? f(cur.value) : o.centerValue ?? f(total))}</b><span class="dp">${cur ? ((cur.value / total) * 100).toFixed(1) + '%' : esc(o.centerSub || '')}</span></div>`;
  }
  wrap.addEventListener('pointerover', (e) => {
    const i = e.target.closest('.seg')?.dataset.i;
    if (i != null && +i !== active) { active = +i; render(); o.onHover?.(active); }
  });
  wrap.addEventListener('pointerleave', () => { active = -1; render(); o.onHover?.(-1); });
  render();
  return {
    update(next) { o = { ...o, ...next }; render(); },
    focus(i) { active = i; render(); },
    destroy() { wrap.remove(); },
  };
}

// ---- small static pieces (strings) ----------------------------------------------------------------

/** Inline sparkline as an SVG string. Uses non-scaling strokes so it can stretch to its box. */
function sparkline(values, { w = 120, h = 34, color = SERIES[0], area = true, dot = true, min } = {}) {
  const vs = values.filter((v) => v != null);
  if (vs.length < 2) return '';

function openPlayground(m) {
  let timer = 0;
  const firstPrompt = m.cat === 'code' ? '写一个最小的 MoE 层 PyTorch 实现' : m.cat === 'vision' ? '分析这张机房巡检照片里的异常' : m.cat === 'image' ? '极光下的数据中心，电影感，4K' : m.cat === 'audio' ? '欢迎使用星枢智能客服。' : m.cat === 'embed' ? '星枢网关支持统一计费 / AI 基础设施' : '用三句话解释 MoE 架构';
  openLayer({
    kind: 'modal', wide: true, title: `${esc(m.name)} · Playground`, eyebrow: '模型试用 · 演示响应', cls: 'pg',
    body: `<div class="pg-grid">
      <aside class="pg-side">
        <div class="field"><label class="field-l" for="pg-sys">系统提示词</label><textarea id="pg-sys" class="textarea" rows="4">你是星枢平台的技术顾问，回答简洁、准确。</textarea></div>
        <div class="field"><label class="field-l" for="pg-temp">Temperature <small id="pg-temp-v">0.7</small></label><input id="pg-temp" type="range" min="0" max="2" step="0.1" value="0.7" style="--p:35%"></div>
        <div class="field"><label class="field-l" for="pg-max">最大输出 Tokens <small id="pg-max-v">1024</small></label><input id="pg-max" type="range" min="64" max="8192" step="64" value="1024" style="--p:12%"></div>
        <div class="pg-meta"><div><span>首字延迟</span><b id="pg-ttft">—</b></div><div><span>输出 Tokens</span><b id="pg-tok">0</b></div><div><span>预估费用</span><b id="pg-cost">¥0.0000</b></div></div>
      </aside>
      <section class="pg-chat">
        <div class="pg-log" id="pg-log"><div class="pg-hint">${sigil(m, 40)}<b>${esc(m.name)}</b><span>发送一条消息试试。这里的回复是预置的演示内容，不消耗真实额度。</span></div></div>
        <form class="pg-in" id="pg-form"><textarea id="pg-q" class="textarea" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行">${esc(firstPrompt)}</textarea><button class="btn primary" id="pg-send" type="submit">${icon('send')}发送</button></form>
      </section>
    </div>`,
    onMount(panel) {
      const log = $('#pg-log', panel), q = $('#pg-q', panel), send = $('#pg-send', panel);
      const ranges = [['pg-temp', (v) => v], ['pg-max', (v) => v]];
      for (const [id] of ranges) {
        const el = $(`#${id}`, panel);
        const sync = () => { el.style.setProperty('--p', `${((el.value - el.min) / (el.max - el.min)) * 100}%`); $(`#${id}-v`, panel).textContent = el.value; };
        el.addEventListener('input', sync);
        sync();
      }
      let streaming = false;
      const stop = () => { clearInterval(timer); streaming = false; send.innerHTML = `${icon('send')}发送`; send.classList.remove('danger'); send.classList.add('primary'); };
      const md = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => `<pre class="pg-code">${c}</pre>`);
      $('#pg-form', panel).addEventListener('submit', (e) => {
        e.preventDefault();
        if (streaming) { stop(); toast({ kind: 'info', title: '已停止生成', timeout: 1600 }); return; }
        const text = q.value.trim();
        if (!text) { q.focus(); return; }
        log.querySelector('.pg-hint')?.remove();
        log.insertAdjacentHTML('beforeend', `<div class="msg me"><p>${esc(text)}</p></div><div class="msg ai"><span class="ai-av">${sigil(m, 26)}</span><div class="ai-b"><p class="typing"><i></i><i></i><i></i></p></div></div>`);
        q.value = '';
        log.scrollTop = log.scrollHeight;
        const reply = REPLIES[m.cat] || REPLIES.chat;
        const body = log.lastElementChild.querySelector('.ai-b');
        const ttft = Math.round(m.ttft * (0.8 + Math.random() * 0.4));
        streaming = true;
        send.innerHTML = `${icon('stop')}停止`;
        send.classList.remove('primary');
        send.classList.add('danger');
        setTimeout(() => {
          if (!streaming) { body.innerHTML = '<p class="muted">（已停止）</p>'; return; }
          $('#pg-ttft', panel).textContent = fmt.ms(ttft);
          let i = 0;
          timer = setInterval(() => {
            i = Math.min(reply.length, i + 3 + Math.floor(Math.random() * 4));
            body.innerHTML = `<div class="ai-t">${md(reply.slice(0, i)).replace(/\n/g, '<br>')}<span class="caret"></span></div>`;
            const toks = Math.round(i / 1.6);
            $('#pg-tok', panel).textContent = toks;
            $('#pg-cost', panel).textContent = `¥${((toks * (m.pout || 2) + text.length * (m.pin || 1)) / 1e6).toFixed(4)}`;
            log.scrollTop = log.scrollHeight;
            if (i >= reply.length) { body.querySelector('.caret')?.remove(); stop(); }
          }, 28);
        }, Math.min(ttft, 1600));
      });
      q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#pg-form', panel).requestSubmit(); } });
      return () => clearInterval(timer);
    },
  });
}

        if (id === 'perf' && !chart) {
          chart = lineChart($('#md-chart', panel), {
            x: hours, series: [{ name: '首字延迟 P50', color: SERIES[0], values: p50 }, { name: '首字延迟 P95', color: SERIES[1], values: p95, area: false }],
            height: 210, xFmt: (t) => fmt.time(t, false), tipX: (t) => fmt.time(t, false), yFmt: (v) => fmt.ms(v), glow: false, xTicks: 6,

      const calcIds = ['calc-in', 'calc-out', 'calc-cache'];
      const calc = () => {
        const [i, o, c] = calcIds.map((id) => $(`#${id}`, panel));
        if (!i) return;
        for (const el of [i, o, c]) el.style.setProperty('--p', `${((el.value - el.min) / (el.max - el.min)) * 100}%`);
        $('#calc-in-v', panel).textContent = `${fmt.compact(i.value * 1e6)}`;
        $('#calc-out-v', panel).textContent = `${fmt.compact(o.value * 1e6)}`;
        $('#calc-cache-v', panel).textContent = `${c.value}%`;
        const cr = c.value / 100;
        const total = i.value * (m.pin * (1 - cr) + (m.pin / 10) * cr) + o.value * m.pout;
        const saved = i.value * m.pin * cr * 0.9;
        $('#calc-total', panel).textContent = fmt.cny(total, 0);
        $('#calc-note', panel).textContent = saved > 1 ? `缓存为你节省约 ${fmt.cny(saved)}` : '开启提示词缓存可显著降低输入成本';
      };
      calcIds.forEach((id) => $(`#${id}`, panel)?.addEventListener('input', calc));
      calc();
      $('#md-try', panel).addEventListener('click', () => openPlayground(m));
      $('#md-fav', panel).addEventListener('click', (e) => {

        e.currentTarget.querySelector('span').textContent = on ? '已收藏' : '收藏';

      });
      $('#md-fav', panel).classList.toggle('on', fav());
      return () => chart?.destroy();
    },
    onClose: () => { if (location.hash.startsWith(`#/models/${m.id}`)) ctx.replace('models'); detailLayer = null; },
  });
  return layer;
}

const jobColor = (j) => SERIES[(j.color - 1) % 8];
const elapsed = (j) => (j.started ? ((j.finished || Date.now()) - j.started) / 1000 : 0);

function lrSchedule(j, n = 60) {
  const warm = Math.round(n * 0.06);
  return Array.from({ length: n }, (_, i) => (i < warm ? (j.lr * (i + 1)) / warm : j.lr * 0.5 * (1 + Math.cos((Math.PI * (i - warm)) / (n - warm)))));
}

function logLine(j, t, r) {
  const step = Math.round(j.progress * j.steps);
  const loss = j.loss.length ? j.loss[j.loss.length - 1] : 0;
  const pick = r();
  if (pick < 0.08) return { lvl: 'WARN', msg: `rank ${Math.floor(r() * j.gpus)}: NCCL all-reduce 耗时 ${(180 + r() * 90).toFixed(0)} ms，高于基线` };
  if (pick < 0.2) return { lvl: 'INFO', msg: `eval @ step ${step}: val_loss=${(loss * 1.05 + 0.04).toFixed(4)} accuracy=${(0.82 + r() * 0.1).toFixed(3)}` };
  if (pick < 0.26) return { lvl: 'INFO', msg: `checkpoint 已保存 → s3://tensora-ckpt/${j.id}/step-${step} (${(j.gpus * 1.9).toFixed(1)} GB)` };
  return { lvl: 'INFO', msg: `step ${step}/${j.steps} loss=${loss.toFixed(4)} lr=${j.lr.toExponential(1)} grad_norm=${(0.4 + r() * 0.5).toFixed(3)} tok/s=${fmt.int(j.gpus * (2600 + r() * 400))}` };
}
