# Builds 音乐粒子宇宙 for Windows on a real Windows runner, runs the built-in end-to-end smoke
# test (demo track → analysis → all scenes → MP4 export) and publishes the portable zip.
name: particle-universe · Windows build

on:
  push:
    paths:
      - 'particle-universe/**'
      - '.github/workflows/particle-universe-windows.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the portable zip'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: particle-universe-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: particle-universe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: particle-universe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package (electron-builder dir + icon/version stamping + portable zip)
        run: node scripts/dist-win.mjs

      - name: End-to-end smoke test of the packaged exe
        shell: pwsh
        env:
          PU_SMOKE_OUT: ${{ runner.temp }}\smoke.json
          PU_SMOKE_TIMEOUT: '1500000'
          PU_SMOKE_DIR: ${{ runner.temp }}
        run: |
          $exe = Resolve-Path release/win-unpacked/ParticleUniverse.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $env:PU_SMOKE_OUT) { Get-Content $env:PU_SMOKE_OUT } else { Write-Host 'no smoke result written' }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ParticleUniverse-win-x64-portable
          path: particle-universe/release/*-portable.zip
          compression-level: 0
          retention-days: 30

      - name: Upload smoke-test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            ${{ runner.temp }}\smoke.json
            ${{ runner.temp }}\particle-universe-smoke.*
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: particle-universe-v1.0.0
          name: 音乐粒子宇宙 v1.0.0（Windows 便携版）
          body: |
            音乐粒子宇宙 · GPU 百万粒子音乐可视化。下载 zip，解压后运行 `ParticleUniverse.exe`。
            源码与说明：https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/particle-universe
          files: particle-universe/release/*-portable.zip
          prerelease: false
