# Builds 音乐粒子宇宙 for Windows on a real Windows runner and runs the built-in end-to-end smoke
# test (demo track → analysis → all scenes → MP4 export), then installs the installer silently.
# The program, the installer and the portable zip's program are signed with the WIN_CSC_LINK /
# WIN_CSC_KEY_PASSWORD secrets.
#
# Called by ship.yml (自动合并与发布), which releases the uploaded build only when every step here
# passed. Run it by hand to get a test build without releasing.
name: particle-universe · Windows build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      require-signing:
        type: boolean
        default: false
    outputs:
      signed:
        value: ${{ jobs.build.outputs.signed }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: particle-universe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: particle-universe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Package (electron-builder nsis + icon/version stamping + portable zip)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/dist-win.mjs

      - name: Check signature, update files and the update signature check
        id: check
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          ../scripts/windows-release/check-build.ps1 -Release release -Setup 'ParticleUniverse-Setup-*.exe' -Exe 'win-unpacked\ParticleUniverse.exe' -RequireSigning:$${{ inputs.require-signing || false }}
          $zip = Get-ChildItem release/*-portable.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          if ($entries -match 'app-update\.yml') { throw 'the portable zip must not carry an update feed' }

      - name: End-to-end smoke test of the packaged exe
        shell: pwsh
        env:
          PU_SMOKE_OUT: ${{ runner.temp }}\smoke.json
          PU_SMOKE_TIMEOUT: '1500000'
          PU_SMOKE_DIR: ${{ runner.temp }}
        run: |
          $exe = Resolve-Path release/win-unpacked/ParticleUniverse.exe
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $env:PU_SMOKE_OUT) { Get-Content $env:PU_SMOKE_OUT } else { Write-Host 'no smoke result written' }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install silently and check the installed copy
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/ParticleUniverse-Setup-*.exe | Select-Object -First 1
          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit code: $($i.ExitCode)"
          $dir = "$env:LOCALAPPDATA\Programs\ParticleUniverse"
          foreach ($f in 'ParticleUniverse.exe', 'resources\app-update.yml', 'Uninstall ParticleUniverse.exe') {
            if (-not (Test-Path "$dir\$f")) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Select-Object FullName; throw "$f not installed" }
          }
          Start-Process -FilePath "$dir\Uninstall ParticleUniverse.exe" -ArgumentList '/S' -Wait
          Write-Host 'installed and uninstalled'

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: particle-universe-windows
          path: |
            particle-universe/release/*-portable.zip
            particle-universe/release/ParticleUniverse-Setup-*.exe
            particle-universe/release/ParticleUniverse-Setup-*.exe.blockmap
            particle-universe/release/latest.yml
            particle-universe/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload smoke-test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            ${{ runner.temp }}\smoke.json
            ${{ runner.temp }}\particle-universe-smoke.*
          if-no-files-found: ignore
