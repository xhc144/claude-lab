# Builds the 声准 Phonica Windows installer on a real Windows runner, runs the
# unit tests, then installs the app silently and runs its built-in end-to-end
# self-test (model loading, assessment, TTS, MP3/ZIP export, UI screenshots)
# against both the unpacked build and the installed copy. With the WIN_CSC_LINK /
# WIN_CSC_KEY_PASSWORD secrets set (scripts/windows-release/new-signing-cert.ps1), the
# app and installer are signed; a release also refreshes the auto-update feed in the
# phonica-latest release.
name: phonica · Windows build

on:
  push:
    paths:
      - 'phonica/**'
      - '!phonica/tools/**'
      - '.github/workflows/phonica-windows.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the installer'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: phonica-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: phonica
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phonica/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore models
        uses: actions/cache@v4
        with:
          path: phonica/models
          key: phonica-models-${{ hashFiles('phonica/scripts/fetch-models.mjs') }}

      - name: Download and verify models
        run: node scripts/fetch-models.mjs

      - name: Type check
        run: npm run typecheck

      - name: Unit and engine tests
        run: npm test

      - name: Build
        run: node scripts/build.mjs

      - name: Package installer (NSIS)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check signature and update files
        shell: pwsh
        env:
          SIGNING: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          Get-ChildItem release -File | Format-Table Name, Length
          foreach ($f in 'release/latest.yml', 'release/win-unpacked/resources/app-update.yml') {
            if (-not (Test-Path $f)) { throw "$f missing: auto-update would not work" }
            Write-Host "--- $f"; Get-Content $f
          }
          $setup = Get-ChildItem release/Phonica-Setup-*.exe | Select-Object -First 1
          foreach ($exe in $setup.FullName, (Resolve-Path release/win-unpacked/Phonica.exe).Path) {
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            Write-Host "$([IO.Path]::GetFileName($exe)): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($env:SIGNING -eq 'true' -and $sig.Status -eq 'NotSigned') { throw "$exe is not signed although WIN_CSC_LINK is set" }
          }
          if ($env:SIGNING -ne 'true') { Write-Host '::warning::WIN_CSC_LINK not set: this build is unsigned (see scripts/windows-release/README.md)' }

      - name: Self-test the unpacked app
        shell: pwsh
        env:
          PHONICA_SHOTS_DIR: ${{ runner.temp }}\shots-unpacked
        run: |
          New-Item -ItemType Directory -Force -Path $env:PHONICA_SHOTS_DIR | Out-Null
          $out = "$env:RUNNER_TEMP\selftest-unpacked.json"
          $p = Start-Process -FilePath (Resolve-Path release/win-unpacked/Phonica.exe) -ArgumentList '--self-test', $out -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no self-test result written' }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install silently and self-test the installed app
        shell: pwsh
        env:
          PHONICA_SHOTS_DIR: ${{ runner.temp }}\shots-installed
        run: |
          New-Item -ItemType Directory -Force -Path $env:PHONICA_SHOTS_DIR | Out-Null
          $setup = Get-ChildItem release/Phonica-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit code: $($i.ExitCode)"
          $exe = "$env:LOCALAPPDATA\Programs\Phonica\Phonica.exe"
          if (-not (Test-Path $exe)) { Write-Host 'installed exe not found'; Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Select-Object FullName; exit 1 }
          $out = "$env:RUNNER_TEMP\selftest-installed.json"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', $out -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no self-test result written' }
          if ($p.ExitCode -ne 0) { exit 1 }
          $u = "$env:LOCALAPPDATA\Programs\Phonica\Uninstall Phonica.exe"
          if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/S' -Wait; Write-Host 'uninstalled' }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/Phonica-Setup-*.exe, release/latest.yml | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Tee-Object -FilePath release/SHA256SUMS.txt

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Phonica-Setup-win-x64
          path: |
            phonica/release/Phonica-Setup-*.exe
            phonica/release/Phonica-Setup-*.exe.blockmap
            phonica/release/latest.yml
            phonica/release/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30

      - name: Upload self-test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonica-selftest
          path: |
            ${{ runner.temp }}\selftest-*.json
            ${{ runner.temp }}\shots-*\*.png
          if-no-files-found: ignore

      - name: Publish release
        if: (github.event_name == 'workflow_dispatch' && inputs.release) || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="phonica-v$VERSION"
          NOTES=$(cat <<EOF
          **声准 Phonica $VERSION** — Windows 英语口语训练与发音评测软件（64 位安装包）。

          下载下方的 \`Phonica-Setup-$VERSION-x64.exe\` 并运行即可安装（无需管理员权限，可自选安装目录）。首次运行会在“文档\\Phonica”中保存录音与评测数据。从 1.1.0 起，装好后软件会自己检查并安装新版本（设置 → 软件更新）。

          - 本地音素级发音评测：准确度、完整度、流利度、语速、停顿、重音与语调，单词与音素级纠错并标注时间位置
          - 波形、音高曲线、语谱图、元音共振峰图；英音 / 美音标准发音与变速播放
          - 历史记录、进步趋势、两次录音对比，自动整理薄弱音素与单词并生成专项练习
          - 可选 AI 深度分析（OpenAI / Claude / DeepSeek / Gemini / 兼容接口），以及不依赖 AI 的一键导出（高压缩 MP3 + 报告 + 结构化 JSON + 提示词 ZIP）

          所有模型随安装包离线提供；评分在 speechocean762 数据集上校准。源码与说明：https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/phonica

          SHA-256：
          \`\`\`
          $(cat release/SHA256SUMS.txt)
          \`\`\`
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "声准 Phonica $VERSION（Windows 安装包）" --notes "$NOTES"
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "声准 Phonica $VERSION（Windows 安装包）" --notes "$NOTES"
          fi
          gh release upload "$TAG" release/Phonica-Setup-*.exe release/Phonica-Setup-*.exe.blockmap release/SHA256SUMS.txt --clobber

          # The installed app reads releases/download/phonica-latest/latest.yml; it points at the files above.
          node ../scripts/windows-release/update-feed.mjs release "${{ github.repository }}" "$TAG" feed/latest.yml
          FEED=phonica-latest
          if ! gh release view "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED" --prerelease --target "${{ github.sha }}" --title "声准 Phonica · 自动更新信息" \
              --notes "已安装的声准 Phonica 从这里读取最新版本信息（latest.yml），安装包在对应的 phonica-v* 发布里。请不要删除这个发布。"
          fi
          gh release upload "$FEED" feed/latest.yml --clobber
