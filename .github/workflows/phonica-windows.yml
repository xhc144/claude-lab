# Builds the 声准 Phonica Windows installer on a real Windows runner, runs the
# unit tests, then installs the app silently and runs its built-in end-to-end
# self-test (model loading, assessment, TTS, MP3/ZIP export, UI screenshots)
# against both the unpacked build and the installed copy. The app and installer
# are signed with the WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets.
#
# Called by ship.yml (自动合并与发布), which releases the uploaded build only when
# every step here passed. Run it by hand to get a test build without releasing.
name: phonica · Windows build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true
      require-signing:
        type: boolean
        default: false
    outputs:
      signed:
        value: ${{ jobs.build.outputs.signed }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.check.outputs.signed }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: phonica
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phonica/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore models
        uses: actions/cache@v4
        with:
          path: phonica/models
          key: phonica-models-${{ hashFiles('phonica/scripts/fetch-models.mjs') }}

      # The repository is private, so release assets need the job token; fetch-models.mjs then
      # only verifies the checksums (and fetches the public Kokoro model).
      - name: Download models from the model release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download phonica-models-v1 --repo "${{ github.repository }}" --dir models --skip-existing \
            --pattern 'en_w2v2_fc_10ms.json' --pattern 'w2v2_lv60_espeak_cv_ft.json' \
            --pattern 'en_w2v2_fc_10ms.int8.onnx' --pattern 'w2v2_lv60_espeak_cv_ft.int8.onnx'
          ls -la models

      - name: Download and verify models
        run: node scripts/fetch-models.mjs

      - name: Type check
        run: npm run typecheck

      - name: Unit and engine tests
        run: npm test

      - name: Build
        run: node scripts/build.mjs

      - name: Package installer (NSIS)
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Check signature, update files and the update signature check
        id: check
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: ../scripts/windows-release/check-build.ps1 -Release release -Setup 'Phonica-Setup-*.exe' -Exe 'win-unpacked\Phonica.exe' -RequireSigning:$${{ inputs.require-signing || false }}

      - name: Self-test the unpacked app
        shell: pwsh
        env:
          PHONICA_SHOTS_DIR: ${{ runner.temp }}\shots-unpacked
        run: |
          New-Item -ItemType Directory -Force -Path $env:PHONICA_SHOTS_DIR | Out-Null
          $out = "$env:RUNNER_TEMP\selftest-unpacked.json"
          $p = Start-Process -FilePath (Resolve-Path release/win-unpacked/Phonica.exe) -ArgumentList '--self-test', $out -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no self-test result written' }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Install silently and self-test the installed app
        shell: pwsh
        env:
          PHONICA_SHOTS_DIR: ${{ runner.temp }}\shots-installed
        run: |
          New-Item -ItemType Directory -Force -Path $env:PHONICA_SHOTS_DIR | Out-Null
          $setup = Get-ChildItem release/Phonica-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          $i = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "installer exit code: $($i.ExitCode)"
          $exe = "$env:LOCALAPPDATA\Programs\Phonica\Phonica.exe"
          if (-not (Test-Path $exe)) { Write-Host 'installed exe not found'; Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 1 | Select-Object FullName; exit 1 }
          $out = "$env:RUNNER_TEMP\selftest-installed.json"
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test', $out -PassThru -Wait -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'no self-test result written' }
          if ($p.ExitCode -ne 0) { exit 1 }
          $u = "$env:LOCALAPPDATA\Programs\Phonica\Uninstall Phonica.exe"
          if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/S' -Wait; Write-Host 'uninstalled' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: phonica-windows
          path: |
            phonica/release/Phonica-Setup-*.exe
            phonica/release/Phonica-Setup-*.exe.blockmap
            phonica/release/latest.yml
            phonica/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload self-test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonica-selftest
          path: |
            ${{ runner.temp }}\selftest-*.json
            ${{ runner.temp }}\shots-*\*.png
          if-no-files-found: ignore
