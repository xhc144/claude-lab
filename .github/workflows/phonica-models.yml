# Exports the acoustic models used by 声准 Phonica from Hugging Face to ONNX
# (fp32 + dynamic INT8), verifies each graph against PyTorch, and publishes
# them as assets of the `phonica-models-v1` pre-release so builds can fetch
# them without Python.
name: phonica · export models

on:
  push:
    paths:
      - 'phonica/tools/models/**'
      - '.github/workflows/phonica-models.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phonica-models
  cancel-in-progress: false

env:
  TAG: phonica-models-v1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the model pre-release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --target "${{ github.sha }}" --title "声准 Phonica · acoustic models" \
            --notes "ONNX exports (fp32 / dynamic INT8) of the speech models used by Phonica. Generated by .github/workflows/phonica-models.yml; see each <name>.json for source model, revision, vocab and SHA-256."

  export:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: charsiu/en_w2v2_fc_10ms
            short: en_w2v2_fc_10ms
            flags: '--vocab-repo=charsiu/tokenizer_en_cmu'
          - id: charsiu/en_w2v2_ctc_libris_and_cv
            short: en_w2v2_ctc_libris_and_cv
            flags: '--vocab-repo=charsiu/tokenizer_en_cmu'
          - id: facebook/wav2vec2-lv-60-espeak-cv-ft
            short: w2v2_lv60_espeak_cv_ft
            flags: ''
          - id: facebook/wav2vec2-xlsr-53-espeak-cv-ft
            short: w2v2_xlsr53_espeak_cv_ft
            flags: '--no-fp32'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install export toolchain
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install transformers==4.46.3 onnx==1.17.0 onnxruntime==1.20.1 numpy==1.26.4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Export ${{ matrix.id }}
        run: python phonica/tools/models/export_models.py "${{ matrix.id }}" "${{ matrix.short }}" out ${{ matrix.flags }}
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release upload "$TAG" out/${{ matrix.short }}.* --clobber
