# Builds and smoke-tests the Motif installer and portable zip on Windows. With the WIN_CSC_LINK /
# WIN_CSC_KEY_PASSWORD secrets set (scripts/windows-release/new-signing-cert.ps1) the app and
# installer are signed. A manual run with "release" publishes motif-v<version> and refreshes the
# auto-update feed in the motif-latest release.
name: Motif · Windows build

on:
  push:
    branches: [main, 'claude/**']
    paths: ['motif/**', '.github/workflows/motif-windows.yml']
  pull_request:
    paths: ['motif/**', '.github/workflows/motif-windows.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release and update the auto-update feed'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: motif-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: motif
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motif/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: |
          node scripts/build.mjs
          npm test

      - name: Build installer + portable zip
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: node scripts/dist-win.mjs

      - name: Check signature and update files
        env:
          SIGNING: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          Get-ChildItem release -File | Format-Table Name, Length
          foreach ($f in 'release/latest.yml', 'release/win-unpacked/resources/app-update.yml') {
            if (-not (Test-Path $f)) { throw "$f missing: auto-update would not work" }
            Write-Host "--- $f"; Get-Content $f
          }
          $setup = Get-ChildItem release/Motif-Setup-*.exe | Select-Object -First 1
          foreach ($exe in $setup.FullName, (Resolve-Path release/win-unpacked/Motif.exe).Path) {
            $sig = Get-AuthenticodeSignature -LiteralPath $exe
            Write-Host "$([IO.Path]::GetFileName($exe)): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($env:SIGNING -eq 'true' -and $sig.Status -eq 'NotSigned') { throw "$exe is not signed although WIN_CSC_LINK is set" }
          }
          if ($env:SIGNING -ne 'true') { Write-Host '::warning::WIN_CSC_LINK not set: this build is unsigned (see scripts/windows-release/README.md)' }

      - name: Smoke test the packaged app (CLI + render worker + import + export)
        env:
          MOTIF_HOME: ${{ runner.temp }}\motif-library
          MOTIF_USER_DATA: ${{ runner.temp }}\motif-userdata
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $cli = Resolve-Path 'release\win-unpacked\bin\motif.cmd'
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\smoke"
          & $cli doctor
          & $cli new "CI 冒烟测试" --template launch --agent ci --json
          & $cli lint "CI 冒烟测试"
          & $cli still "CI 冒烟测试" --scene 1 --out "$out\cover.png"
          & $cli preview "CI 冒烟测试" --out "$out\sheet.jpg" --scale 0.3
          & $cli auto "examples\inputs\annual-review.pptx" --title "导入测试" --agent ci --json
          & $cli export "导入测试" --format mp4 --quality small --width 960 --out "$out\import.mp4"
          & $cli export "CI 冒烟测试" --format html --out "$out\launch.html"
          & $cli new "Skill 示例" --from "skill\motif\examples\03-math-lesson.json" --json
          & $cli export "Skill 示例" --format pdf --out "$out\math.pdf"
          # MCP session exactly as MCP clients launch it: Motif.exe + cli.mjs with stdio pipes, no .cmd
          # (PowerShell itself won't connect stdin to a GUI-subsystem exe, so a Node client drives it)
          node tests/e2e/mcp-stdio.mjs 'release\win-unpacked\Motif.exe' 'release\win-unpacked\resources\app.asar.unpacked\dist\cli.mjs'
          Get-ChildItem $out | Format-Table Name, Length

      - name: Install silently and run the installed CLI from PATH
        env:
          MOTIF_HOME: ${{ runner.temp }}\motif-library
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = Get-ChildItem release\Motif-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter Motif.exe | Select-Object -First 1
          if (-not $exe) { throw 'Motif.exe was not installed' }
          $dir = $exe.DirectoryName
          Write-Host "installed to $dir"
          # Only bin\ goes on PATH: with the install folder there, `motif` would resolve to Motif.exe
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $entries = $userPath -split ';'
          if ($entries -notcontains "$dir\bin") { throw "bin dir missing from user PATH: $userPath" }
          if ($entries -contains $dir) { throw "install dir itself is on PATH (motif would start the GUI): $userPath" }
          if (-not (Test-Path "$dir\resources\ffmpeg\ffmpeg.exe")) { throw 'bundled ffmpeg missing' }
          if (-not (Test-Path "$dir\resources\skill\motif\SKILL.md")) { throw 'bundled Skill missing' }
          $env:Path = "$userPath;$env:Path"
          $resolved = (Get-Command motif).Source
          Write-Host "motif → $resolved"
          if ($resolved -notlike '*\bin\motif.cmd') { throw "motif resolves to $resolved" }
          $doctor = motif doctor | Out-String
          Write-Host $doctor
          if ($doctor -notmatch 'FFmpeg') { throw 'motif doctor printed no report' }
          motif still "CI 冒烟测试" --scene 2 --out "$env:RUNNER_TEMP\smoke\installed-still.png"
          if (-not (Test-Path "$env:RUNNER_TEMP\smoke\installed-still.png")) { throw 'installed motif still wrote nothing' }
          # The bundled Skill's launcher, as an AI agent would call it
          $viaSkill = node "$dir\resources\skill\motif\scripts\motif.mjs" templates --json | Out-String
          if ($viaSkill -notmatch '"launch"') { throw "Skill launcher failed: $viaSkill" }

      - name: Editor end-to-end (GUI + in-app AI assistant against a mock model)
        timeout-minutes: 20
        run: |
          node tests/e2e/gui.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/e2e/ai-mock.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: Motif-windows-x64
          path: |
            motif/release/*.exe
            motif/release/*.exe.blockmap
            motif/release/*.zip
            motif/release/latest.yml
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-outputs
          path: |
            ${{ runner.temp }}/smoke
            motif/out/e2e
          if-no-files-found: ignore

      - name: Publish release and update feed
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="motif-v$VERSION"
          NOTES="**Motif 律影 $VERSION**（Windows 64 位）。下载 \`Motif-Setup-$VERSION.exe\` 安装；装好后 Motif 会自己检查并安装新版本（设置 → 关于）。\`Motif-$VERSION-x64-win.zip\` 是便携版，解压即用，但不会自动更新。源码：https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/motif"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Motif 律影 $VERSION（Windows）" --notes "$NOTES"
          else
            gh release create "$TAG" --target "${{ github.sha }}" --title "Motif 律影 $VERSION（Windows）" --notes "$NOTES"
          fi
          gh release upload "$TAG" release/Motif-Setup-*.exe release/Motif-Setup-*.exe.blockmap release/*.zip --clobber

          node ../scripts/windows-release/update-feed.mjs release "${{ github.repository }}" "$TAG" feed/latest.yml
          FEED=motif-latest
          if ! gh release view "$FEED" >/dev/null 2>&1; then
            gh release create "$FEED" --prerelease --target "${{ github.sha }}" --title "Motif · 自动更新信息" \
              --notes "已安装的 Motif 从这里读取最新版本信息（latest.yml），安装包在对应的 motif-v* 发布里。请不要删除这个发布。"
          fi
          gh release upload "$FEED" feed/latest.yml --clobber
